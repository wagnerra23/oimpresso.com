services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: oimpresso
      POSTGRES_PASSWORD: oimpresso
      POSTGRES_DB: oimpresso
    ports:
      - "5432:5432"
    volumes:
      - oimpresso_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oimpresso"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  oimpresso_pg:
