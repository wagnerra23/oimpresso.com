gaps:
  - dim: "Speed-to-task"
    best_of_class: "Linear command menu: setas + Enter no resultado, Esc fecha — sem tirar a mão do teclado"
    fix: "Busca de produto como combobox (Command/listbox) com ArrowUp/Down/Enter/Esc; Enter abre o LancarItem já focado na quantidade"
    esforco: medio
  - dim: "A11y WCAG"
    best_of_class: "GOV.UK Design System: todo campo com <label> visível ou aria-label; resultados anunciados (aria-live)"
    fix: "Label/aria-label na busca (CreateV3.tsx:472), role=listbox/option nos achados + aria-activedescendant; subir textos 10,5-11,5px de conteúdo para ≥12px"
    esforco: baixo
  - dim: "Mobile fit"
    best_of_class: "Shopify POS: alvos de toque ≥44px e linha de item em cartão no estreito"
    fix: "Célula editável e botões de ação com min-h-11 no breakpoint < sm; linha de item vira cartão abaixo de sm em vez de scroll horizontal"
    esforco: medio
  - dim: "Internal-consistency"
    best_of_class: "Shopify Polaris: 1 header canon (Page) e 1 tabela de recurso em toda tela"
    fix: "Usar PageHeader canon no lugar do h1 hand-roll (CreateV3.tsx:1088) e avaliar DataTable/Input do DS nas células — decisão de [L] (tela é dele; cópia local foi deliberada)"
    esforco: medio
  - dim: "Pre-Flight-conformance"
    best_of_class: "Stripe: contrato de tela fechado antes do porte (API/UX spec aprovada)"
    fix: "[L] decidir o conflito 'Não calcula' × cálculo no preview e [W] preencher Anti-hooks + Contrato visual; promover charter draft→live só depois"
    esforco: baixo
  - dim: "Error recovery"
    best_of_class: "Gmail: toast de desfazer com auto-dismiss e Esc"
    fix: "Toast de undo (CreateV3.tsx:1176) fechar sozinho após ~6s e por Esc"
    esforco: baixo

