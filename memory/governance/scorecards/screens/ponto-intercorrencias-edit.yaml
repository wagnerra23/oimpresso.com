# Avaliação MANUAL pelo método SCREEN-GRADE (memory/requisitos/_DesignSystem/SCREEN-GRADE-METODO.md).
# NÃO veio do screen-grade-seed.mjs: o seed só materializa YAML a partir do baseline agregado
# screen-grades-baseline-2026-05-30.json e o docblock dele diz que NÃO recomputa a nota. Esta tela
# nasceu em 2026-08-28 (PR #6412, última Blade viva do módulo) e não existe naquele baseline.
# A nota 16-dim é LLM-as-judge (agente screen-qa) — NÃO editar à mão.
#
# Ponderação: coluna Kamila de framework-15-dimensoes.md (persona dona do Ponto por
# personas-por-modulo.yml: kamila-martinho, admin RH). O campo `persona` abaixo mantém o
# vocabulário dos 20 irmãos do módulo (`tecnico`), que é o que o corpus usa.
# Denominador = 30 (soma real da coluna Kamila) + 2 da dim 16 = 32. O total "29" impresso
# naquele doc não bate com a própria coluna dele; usar 29 inflaria a nota, então usei 30.
screen: Ponto/Intercorrencias/Edit
path: resources/js/Pages/Ponto/Intercorrencias/Edit.tsx
archetype: form
persona: tecnico
nota: 81
nivel: "Advanced"
baseline_anterior: null   # 1ª nota da tela — não há grade anterior. A catraca real compara vs origin/main, não este campo.
peso_real: 1.0
source: screen-grade-2026-09-05
graded_at: "2026-09-05"
resumo: "Migração da última Blade do módulo. Superfície DS limpa (zero ds/*, zero paleta crua, Checkbox canon — corrige o input nativo do irmão Create) e microcopy forte: o aviso 'só rascunho é editável' aparece ANTES de digitar. Perde em a11y (zero amarração ARIA, medido) e error recovery (sem guarda de saída, e o charter declara que não há autosave); charter ainda draft, sem E2E e sem contrato visreg."
dimensoes: { density: 84, discoverability: 84, speed_to_task: 80, error_recovery: 70, cognitive_load: 86, aesthetic_usability: 78, affordance: 84, brand_confidence: 80, mobile_fit: 84, a11y_wcag: 66, i18n_ptbr: 92, performance_perceived: 84, information_hierarchy: 86, microcopy: 90, internal_consistency: 76, preflight_conformance: 72 }
gaps:
  - dim: "A11y-WCAG"
    best_of_class: "Stripe/Linear amarram erro e contador ao campo (aria-describedby + aria-invalid) e anunciam a falha por role=alert, então o leitor de tela ouve o motivo sem sair do campo"
    fix: "Zero amarração ARIA no arquivo (medido: 0 ocorrências de aria-describedby|aria-invalid|aria-required|role=alert). O conserto já existe no DS e está sem uso — Components/ui/field-state.tsx traz FieldError (role=alert) e RequiredMark. Hoje o erro é um <p> solto com classe de cor e o obrigatório é pseudo-elemento CSS (after:content), que leitor de tela não anuncia. O contador '/2000' também segue solto — é o mesmo gap já catalogado no irmão Create."
    esforco: baixo
    origin: medicao-2026-09-05 + gap A11y de ponto-intercorrencias-create (screen-grades-baseline-2026-05-30)
  - dim: "Error-recovery"
    best_of_class: "Notion/Linear interceptam a saída com alteração pendente (ou salvam sozinhos); Stripe foca o primeiro campo inválido e resume os erros no topo do form"
    fix: "O charter declara como anti-hook que a tela não faz autosave — então sair da página descarta o digitado em silêncio, numa tela cujo propósito declarado é corrigir UM campo. Falta guarda de navegação (onBefore do router Inertia) e foco no primeiro erro depois do 422."
    esforco: medio
    origin: charter Anti-hooks + medicao-2026-09-05
  - dim: "Pre-Flight-conformance"
    best_of_class: "USWDS/VA.gov só contam a tela como madura quando o contrato está fechado e existe teste rodando contra ela — contrato aberto não pontua"
    fix: "Charter em status draft com 3 pendências abertas (a dim 16 pede charter live), incluindo dois Non-Goals marcados como inferência à espera de [W] e a decisão sobre o campo anexo. screen:files reporta e2e, visual-comparison e proto-baseline ausentes, e os 3 UC do casos.md estão 🧪 sem veredito. Positivos medidos que sustentam o 72: zero ds/*, zero paleta crua, só @/Components/ui, e não repetiu o anti-padrão do irmão."
    esforco: medio
    origin: Edit.charter.md (Pendências) + Edit.casos.md + screen-coverage-map --screen
  - dim: "Aesthetic-usability"
    best_of_class: "Linear/Shopify Admin têm um header de página com estilo real; aqui a classe do header não resolve para regra nenhuma no contexto do módulo"
    fix: "os-page-h só tem definição escopada sob .fin-cowork (bundle Financeiro) e .fj-page (Forja) no CSS da app — a definição não-escopada vive apenas no espelho do protótipo, que não é servido. No Ponto a classe é INERTE e o header renderiza sem estilo. Dívida SISTEMÁTICA: 22 telas do módulo usam a classe, então o conserto é do módulo e não desta tela — código novo não deve engrossá-la. Esta tela já fez a parte dela usando token no subtítulo em vez da paleta crua das irmãs."
    esforco: alto
    origin: medicao-2026-09-05 + gap Pre-Flight de ponto-intercorrencias-create + comentário no próprio Edit.tsx
  - dim: "Internal-consistency"
    best_of_class: "Um Field canônico único no DS impede que duas telas irmãs drifem; Shopify Polaris não deixa a tela redeclarar o wrapper de campo"
    fix: "O helper Field é cópia local em 7 arquivos de Pages (medido) enquanto Components/ui/field-state.tsx é o canon. A paridade visual com o Create hoje é mantida por cópia — os dois vão drifar no primeiro ajuste de um só lado."
    esforco: baixo
    origin: medicao-2026-09-05
  - dim: "Speed-to-task"
    best_of_class: "Linear salva com Cmd+Enter e Notion persiste sozinho; nenhum dos dois exige levar o mouse até o botão para gravar uma correção de um campo"
    fix: "Salvar exige clique no botão — não há atalho de teclado no submit. Barato de resolver e casa com o propósito da tela (corrigir um campo e sair)."
    esforco: baixo
    origin: medicao-2026-09-05
  - dim: "Contrato (fora das 16 dims — NÃO entra na nota)"
    best_of_class: "n/a — este item é comportamento, não UX; as 16 dimensões medem UX e o método manda PLUGAR, não FUNDIR (SCREEN-GRADE-METODO §3-bis)"
    fix: "HIPÓTESE, não achado: o guard de estado parece existir só no caminho de LEITURA. IntercorrenciaController@edit tem abort_unless(estado === RASCUNHO, 403), e @update não tem guard equivalente; a varredura das camadas que poderiam supri-lo voltou vazia (IntercorrenciaRequest::authorize só checa usuário autenticado; nenhuma Policy; nenhum Observer; rota é Route::resource sem middleware de estado). Se confirmado, um PUT direto alcançaria intercorrência já submetida, contra CU-PONTO-05 e contra o texto do próprio charter ('o backend responde 403'). Falta o teste vermelho que prova — UC-INTEDT-01 exercita apenas o GET ('quando tento ABRIR a edição'), então o caminho de escrita está descoberto. Não classificar como achado antes do teste (proibicoes §5 2026-07-15)."
    esforco: baixo
    origin: Edit.casos.md UC-INTEDT-01 + CU-PONTO-05 (SDD §6.2) + varredura-2026-09-05
