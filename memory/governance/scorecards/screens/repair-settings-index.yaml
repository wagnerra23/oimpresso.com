resumo: "Form de configuracao maduro no eixo de contrato — e o unico do modulo com o trio completo (charter + casos.md com 8 UC + RepairSettingsContratoTest) mais RUNBOOK e `related_prototype` declarado com razao (recusa ancorar no repair-page.jsx, que e porte REVERSO do Blade que esta tela substitui). Tecnicamente limpo: 100% dos controles vem de @/Components/ui, zero cor crua ou hex, AppShellV2 + PageHeader + primitivas Grid/Inline, e usa SafeSelectItem (a defesa da lapide §5 2026-06-29, Radix com value vazio). Honra o contrato dos DOIS endpoints disjuntos com dois useForm separados e rotulos de botao distintos. O que segura a nota: nenhuma exibicao de erro de validacao (o `errors` do useForm nao e renderizado em lugar nenhum), nenhum retorno de sucesso apos salvar (`recentlySuccessful` nao usado), vocabulario responsivo limitado a `md:col-span-` num form de 4 cards e ~30 campos, e o bloco das 17 chaves `show_*` que cobra atencao sem agrupamento nem busca."
