cross_tenant_intencional: true
cross_tenant_justificativa: |
  Admin é o ÚNICO módulo autorizado a ler dados cross-business (sem global
  scope business_id). Wagner é dono, vê tudo. Middleware `is-wagner` substitui
  o global scope. Tests `CrossTenantAdminTest` + `MultiTenantPermissionTest`
  validam que demais módulos NÃO conseguem cross-tenant sem `is-wagner`.

auth_stack:
  - "tailscale-only (CIDR Tailscale, zero cost IP)"
  - "auth (Laravel)"
  - "is-wagner (3 ANDs — user_id + business_id + role superadmin)"

ownership:
