<meta name="claude:viewport-fit-sides" content="cover">
<script>
/* O DS lê o tema de html.cockpit[data-theme]. Sem escolha explícita do visualizador,
   segue o sistema (prefers-color-scheme). */
(function () {
  var d = document.documentElement;
  d.classList.add('cockpit');
  d.lang = 'pt-BR';
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  var auto = !d.hasAttribute('data-theme');
  var proprio = false;
  function aplicar() {
    if (!auto) return;
    proprio = true;
    d.setAttribute('data-theme', mq && mq.matches ? 'dark' : 'light');
  }
  aplicar();
  if (mq && mq.addEventListener) mq.addEventListener('change', aplicar);
  new MutationObserver(function () {
    if (proprio) { proprio = false; return; }
    if (!d.hasAttribute('data-theme')) { auto = true; aplicar(); } else { auto = false; }
    window.dispatchEvent(new Event('cv3-tema'));
  }).observe(d, { attributes: true, attributeFilter: ['data-theme'] });
  window.__cv3Tema = function (t) { auto = false; d.setAttribute('data-theme', t); };
})();
</script>
