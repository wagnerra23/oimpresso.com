; ============================================================================
; php-staging.ini — overlay do STAGING sobre o php.ini da imagem `oimpresso/mcp`
; ============================================================================
;
; POR QUE EXISTE (medido 2026-09-18). O staging reusa `image: oimpresso/mcp:latest`
; (docker-compose.yml:18), e o Dockerfile dela copia `docker/oimpresso-mcp/php.ini`
; para `conf.d/zz-mcp-overrides.ini`. Aquele arquivo diz, com todas as letras:
;
;     ; Em prod: NUNCA revalida (Octane recarrega no max-requests recycle).
;     opcache.validate_timestamps = 0
;
; Está CERTO para o runtime MCP/Octane, e ERRADO herdado pelo staging — cuja
; razão de existir é refletir o código sob teste.
;
; O QUE ISSO CAUSAVA, e é sutil porque só quebra METADE do ambiente:
;
;   opcache.enable           => On    (web usa opcache)
;   opcache.enable_cli       => Off   (CLI NÃO usa)
;   opcache.validate_timestamps => Off
;
; Logo o Pest (CLI) lê o disco a cada execução e reflete a árvore, enquanto o
; SERVIDOR WEB serve o bytecode congelado de quando o container subiu. Medido no
; dia: o container estava de pé com HEAD de 2026-09-08 — smoke pela UI media
; código de 10 dias antes e passava VERDE, sem avisar.
;
; Como foi pego, e o que isso ensina: os dois smokes de UI de uma sessão passaram
; e batiam com o esperado. Só o CONTROLE NEGATIVO — o caso que TINHA de falhar —
; revelou, porque era o único cujo desfecho diferia entre o código novo e o velho.
; Cerca de hash (`git hash-object` antes/depois) NÃO pega isto: ela prova o DISCO,
; e o web não lê o disco.
;
; Consequência de governança: enquanto isto valia, um recibo de smoke com
; `host: staging-ct100` (ADR 0390) não podia ser confiado para tela — o CLI e o
; web mediam árvores diferentes. Este arquivo fecha essa divergência.
;
; POR QUE NÃO MEXER NO php.ini DO MCP: aquele governa o runtime de produção do
; CT 100, onde `validate_timestamps = 0` é a escolha certa e deliberada. Overlay
; separado mantém o raio mínimo — staging muda, produção não.
;
; ORDEM DE CARGA: `conf.d` é lido em ordem alfabética, e o da imagem é
; `zz-mcp-overrides.ini`. Por isso este é montado como `zzz-staging.ini` — `zzz`
; ordena depois de `zz`, então esta diretiva vence. Trocar o nome para algo que
; ordene antes silenciosamente desfaz o conserto.
;
; CUSTO: um `stat()` por arquivo incluído, por request. Irrelevante num ambiente
; de teste, e é exatamente o preço de o web refletir o disco.

[opcache]
opcache.validate_timestamps = 1
; 0 = confere o mtime a CADA request. Em staging o código muda a toda hora (deploy,
; checkout de branch, sessão medindo), e qualquer janela de cache reintroduz o
; mesmo defeito de forma intermitente — que é pior que o permanente, porque some
; quando se vai investigar.
opcache.revalidate_freq = 0
