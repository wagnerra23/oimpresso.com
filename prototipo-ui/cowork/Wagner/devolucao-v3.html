<script>
/* Mesmo contrato do DS usado em sells/create-v3: tema em html.cockpit[data-theme],
   seguindo o sistema até o visualizador escolher. */
(function () {
  var d = document.documentElement;
  d.classList.add('cockpit');
  d.lang = 'pt-BR';
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  var auto = !d.hasAttribute('data-theme');
  var proprio = false;
  function aplicar() {
    if (!auto) return;
    proprio = true;
    d.setAttribute('data-theme', mq && mq.matches ? 'dark' : 'light');
  }
  aplicar();
  if (mq && mq.addEventListener) mq.addEventListener('change', aplicar);
  new MutationObserver(function () {
    if (proprio) { proprio = false; return; }
    if (!d.hasAttribute('data-theme')) { auto = true; aplicar(); } else { auto = false; }
    window.dispatchEvent(new Event('dv-tema'));
  }).observe(d, { attributes: true, attributeFilter: ['data-theme'] });
  window.__dvTema = function (t) { auto = false; d.setAttribute('data-theme', t); };
})();
</script>

/* =============================================================================
   Office Impresso / Ponto WR2 — DESIGN SYSTEM v6 — design tokens
   -----------------------------------------------------------------------------
   "DS v6" = the git source-of-truth design system (ADR 0239 DS git SSOT,
   ADR 0249 DS v6 naming, ADR 0300 token errata). Tokens are authored as
   DTCG JSON (resources/css/tokens/*.tokens.json in the source repo) and compiled
   by Style Dictionary into CSS. The values below are copied verbatim from that
   generated output — do not invent values.

   THREE token layers, mirrored from the repo:
     1. @theme  (inertia)     — Tailwind v4 color/radius/motion utilities
     2. foundations :root      — the Type RAMP (--fs-1..9), shadows, motion, atmo
     3. .cockpit scope         — the operational shell's own palette
                                 (--bg / --surface / --text / --accent / …),
                                 IBM Plex Sans/Mono, plus dozens of domain hues

   KEY FACTS
     · PRIMARY IS PURPLE — `oklch(0.55 0.15 295)` (ADR 0190 "roxo médio
       universal", ADR 0235). It is NOT the shadcn blue. Accent hue 295 is the
       canon default; the cockpit Tweaks panel lets users re-hue it live.
     · Operational shell font is **IBM Plex Sans** (mono: **IBM Plex Mono**).
       The marketing/Tailwind layer falls back to the system sans stack.
     · Color space is OKLCH throughout. Status semantics: success(green 162) /
       warning(amber 70-75) / destructive(red 18-25) / info(blue 244), each with
       a `-soft` (tinted bg) and `-fg` (readable text) companion.
     · Everything has a dark counterpart, keyed by BOTH `.dark` and
       `[data-theme="dark"]` (the cockpit sets data-theme on the shell root).
     ============================================================================ */

/* =============================================================================
   LAYER 3 — .cockpit scope  [_generated-cockpit-light.css]
   The operational shell's own palette. Telas pintam com estes tokens (--bg,
   --surface, --text, --accent, …) + IBM Plex. Reproduced here so a standalone
   page wrapped in <div class="cockpit"> renders exactly like the real app.
   ============================================================================ */
.cockpit {
  --font-sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --bg: oklch(0.985 0.003 90);
  --bg-2: oklch(0.965 0.004 90);
  --surface: #ffffff;
  --border: oklch(0.90 0.004 90);
  --border-2: oklch(0.93 0.004 90);
  --text: oklch(0.22 0.01 80);
  --text-dim: oklch(0.50 0.01 80);
  --text-mute: oklch(0.555 0.01 80);

  --accent: oklch(0.55 0.15 295);
  --accent-2: oklch(0.62 0.15 295);
  --accent-soft: oklch(0.95 0.04 295);
  --accent-fg: #ffffff;

  --pos: oklch(0.50 0.12 150);
  --pos-soft: oklch(0.95 0.075 150);
  --neg: oklch(0.55 0.18 25);
  --neg-soft: oklch(0.955 0.055 25);
  --warn: oklch(0.56 0.12 70);
  --warn-soft: oklch(0.955 0.072 75);

  --radius: 8px;
  --radius-sm: 6px;
  --radius-lg: 12px;
  --row-h: 30px;  /* @kind spacing */
  --shadow-pop: 0 6px 24px -8px rgba(0,0,0,.18), 0 2px 6px -2px rgba(0,0,0,.10);
  --shadow-soft: 0 1px 2px rgba(0,0,0,.04);

  /* Sidebar is DARK-FIXED in the real cockpit (Wagner: "menu fundo black").
     Light-mode sidebar tokens shown; dark shell keeps a near-identical dark sidebar. */
  --sb-bg: oklch(0.18 0.006 240);
  --sb-bg-2: oklch(0.16 0.006 240);
  --sb-border: oklch(0.28 0.008 240);
  --sb-text: oklch(0.78 0.005 90);

  --sb-text-hi: oklch(0.96 0.005 90);

  --sb-active: oklch(0.32 0.008 240);

     _generated-cockpit-light.css; the four most common kept here. */

/* =============================================================================
   SEMANTIC ELEMENT STYLES
   Mirrors the look of pages built with AppShellV2 + the Type RAMP. Marketing
   pages use the system sans; operational pages get IBM Plex via .cockpit.
   ============================================================================ */
html {
  font-family: var(--font-sans);
  color: var(--color-foreground);
  background: var(--color-background);
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
body {
  margin: 0;
  font-size: var(--fs-4);
  line-height: 1.45;
  color: var(--color-foreground);
  background: var(--color-background);
}

/* Display — marketing hero only. */
.display, h1.display {
  font-size: clamp(2.25rem, 5vw, 3.75rem);
  line-height: 1.05;
  letter-spacing: -0.025em;
  font-weight: 700;
}

h1 { font-size: var(--fs-7); line-height: 1.2; letter-spacing: -0.02em; font-weight: 600; color: var(--fg-1); margin: 0; }
h2 { font-size: var(--fs-6); line-height: 1.2; font-weight: 600; color: var(--fg-1); margin: 0; }
h3 { font-size: var(--fs-5); line-height: 1.2; font-weight: 600; color: var(--fg-1); margin: 0; }
h4, h5, h6 { font-size: var(--fs-4); font-weight: 600; color: var(--fg-1); margin: 0; }

p { margin: 0 0 0.75em 0; color: var(--fg-1); font-size: var(--fs-4); line-height: 1.45; }
p.muted, .text-muted { color: var(--fg-2); }

/* eyebrow / KPI label — uppercase tracked, fs-1 */
.eyebrow, .kpi-label {
  font-size: var(--fs-1);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--fg-2);
}

/* tabular numerics for time/money — REP-P timestamps, KPI values, espelho */
.tabular, .num, time, .kpi-value {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum";
}

a { color: var(--color-primary); text-decoration: none; transition: color var(--duration-base) var(--ease-standard); }
a:hover { text-decoration: underline; text-underline-offset: 4px; }

code, kbd, samp, pre, .mono { font-family: var(--font-mono); font-size: 0.92em; }
code:not(pre code) {
  background: var(--color-muted);
  padding: 0.1em 0.35em;
  border-radius: var(--radius-sm);
  color: var(--fg-1);
}

hr { border: 0; border-top: 1px solid var(--color-border); margin: 1.5rem 0; }
::selection { background: var(--color-primary); color: var(--color-primary-foreground); }

/* =============================================================================
   UNIVERSAL KEYBOARD FOCUS (ADR canon: "Focus ring is universal").
   The pure inline-styled components don't draw their own keyboard ring (only
   form fields do), so this fulfils the documented contract for every focusable
   control. Low specificity via :where() so consumers can override.
   Form fields opt out — they paint their own accent halo on focus.
   ============================================================================ */
:where(button, a[href], [role="button"], [tabindex]:not([tabindex="-1"])):focus-visible {
  outline: 2px solid var(--color-primary);
  outline-offset: 2px;
}
.cockpit :where(button, a[href], [role="button"], [tabindex]:not([tabindex="-1"])):focus-visible {
  outline-color: var(--accent);
}

<style id="devolucao-v3">
/* Layout: mesma grade de sells/create-v3 — trabalho à esquerda (nota → regime → itens → texto),
   fechamento fiscal à direita com o finalizador sempre visível. Nenhuma cor nova:
   tudo vem dos tokens .cockpit do DS v6. Cores de tributo usam os matizes de domínio. */
:root {
  --dv-icms: var(--origin-CRM-fg);
  --dv-st: var(--origin-OS-fg);
  --dv-ipi: var(--origin-MFG-fg);
  --dv-pis: var(--origin-FIN-fg);
  --dv-difal: var(--origin-PNT-fg);
}
html, body { height: auto; }
body { background-color: var(--bg); color: var(--text); overflow-x: hidden; font-family: var(--font-sans); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 70; background: var(--surface); }
button, input, select, textarea { font-family: inherit; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* Barra do protótipo (copiada da moldura do create-v3) */
.dv-bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 60;
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px;
  min-height: 44px; padding-block: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--border);
  font: 400 12.5px/1.3 var(--font-sans); color: var(--text-dim);
}
.dv-id { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 320px; }
.dv-pill { flex: none; padding: 3px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--text); font: 600 11px/1 var(--font-sans); letter-spacing: .04em; text-transform: uppercase; }
.dv-rota { font: 500 12.5px/1 var(--font-mono); color: var(--text); white-space: nowrap; }
.dv-nota { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border); flex-wrap: wrap; }
.seg button { appearance: none; border: 0; background: transparent; cursor: pointer; padding: 6px 10px; border-radius: 6px; font: 500 12px/1 var(--font-sans); color: var(--text-dim); }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--border); }

.palco {
  padding-block: 24px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1480px; margin: 0 auto;
}
@media (min-width: 900px) {
  .palco { padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }
}

/* Cabeçalho da página */
.pg-h { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; margin-bottom: 16px; }
.pg-h h1 { font: 600 22px/1.2 var(--font-sans); letter-spacing: -.02em; color: var(--text); margin: 0; text-wrap: balance; }
.pg-h p { margin: 4px 0 0; font: 12.5px/1.45 var(--font-sans); color: var(--text-dim); max-width: 70ch; }
.trilha { display: flex; gap: 6px; margin-bottom: 6px; font: 12px/1.3 var(--font-sans); color: var(--text-dim); }
.trilha span + span::before { content: "/"; margin-right: 6px; color: var(--text-mute); }
.busca { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
.busca .fld { flex: 1 1 320px; min-width: 0; }
.busca .ou { font: 12px/32px var(--font-sans); color: var(--text-dim); }
.pg-h .dir { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.grid { display: grid; grid-template-columns: minmax(0, 1fr) 336px; gap: 16px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
aside.col { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); }

/* Seção (mesmo desenho do Sec do create-v3) */
.sec { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-soft); overflow: hidden; min-width: 0; }
.sec > header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: color-mix(in oklch, var(--hue, var(--accent)) 5%, var(--surface)); flex-wrap: wrap; }
.sec > header .ico { width: 30px; height: 30px; flex: none; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; background: color-mix(in oklch, var(--hue, var(--accent)) 14%, transparent); color: color-mix(in oklch, var(--hue, var(--accent)) 62%, var(--text)); }
.sec > header h3 { margin: 0; font: 600 15px/1.3 var(--font-sans); color: var(--text); }
.sec > header p { margin: 2px 0 0; font: 11.5px/1.35 var(--font-sans); color: var(--text-dim); }
.sec > header .dir { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sec > .bd { padding: 16px; }
.passo { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 999px; margin-right: 8px; background: var(--accent); color: var(--accent-fg); font: 600 11.5px/1 var(--font-mono); vertical-align: 1px; }

.lbl { display: block; font: 600 10.5px/1.5 var(--font-sans); letter-spacing: .04em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 4px; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); gap: 12px; }
.fld input[type="text"], .fld select, .fld textarea, .inp {
  font: 13px/1.4 var(--font-sans); color: var(--text); width: 100%; box-sizing: border-box;
  padding: 7px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.fld select { padding-right: 28px; }
.fld input:focus, .fld select:focus, .fld textarea:focus, .inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.fld .help { display: block; margin-top: 4px; font: 11.5px/1.35 var(--font-sans); color: var(--text-dim); }
.chk { display: flex; align-items: flex-start; gap: 8px; font: 12.5px/1.4 var(--font-sans); color: var(--text); cursor: pointer; }
.chk input { margin: 2px 0 0; width: 15px; height: 15px; accent-color: var(--accent); flex: none; }
.chk small { display: block; color: var(--text-dim); font-size: 11.5px; }
.chk[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }

.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: 600 12.5px/1 var(--font-sans); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--bg-2); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.pri:hover { background: var(--accent-2); }
.btn.lg { height: 42px; font-size: 13.5px; width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--text-dim); }
.btn.ghost:hover { color: var(--text); background: var(--bg-2); }
.btn svg, .ico svg { width: 15px; height: 15px; }

.pill { display: inline-flex; align-items: center; gap: 6px; height: 20px; color: color-mix(in oklch, var(--c, var(--text-dim)) 62%, var(--text)); font: 600 10.5px/1 var(--font-sans); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 999px; background: var(--c, var(--text-mute)); flex: none; }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 5px; font: 600 10.5px/1 var(--font-mono); white-space: nowrap; background: color-mix(in oklch, var(--c, var(--text-dim)) 12%, var(--surface)); color: color-mix(in oklch, var(--c, var(--text-dim)) 62%, var(--text)); border: 1px solid color-mix(in oklch, var(--c, var(--text-dim)) 26%, transparent); }
a.tag { text-decoration: none; }
a.tag:hover { text-decoration: none; background: color-mix(in oklch, var(--c, var(--text-dim)) 20%, var(--surface)); }

/* Nota de origem: cartões de dado */
.dados { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 1px; background: var(--border-2); border: 1px solid var(--border-2); border-radius: 8px; overflow: hidden; }
.dados > div { background: var(--surface); padding: 10px 12px; min-width: 0; }
.dados b { display: block; font: 600 13px/1.35 var(--font-sans); color: var(--text); overflow-wrap: anywhere; }

.dados span.sub { display: block; font: 11.5px/1.35 var(--font-sans); color: var(--text-dim); margin-top: 2px; }

.fluxo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-radius: 8px; background: var(--bg-2); border: 1px solid var(--border); font: 12.5px/1.4 var(--font-sans); }
.fluxo .ator { display: flex; flex-direction: column; min-width: 0; }
.fluxo .ator b { font-weight: 600; color: var(--text); }
.fluxo .ator span { color: var(--text-dim); font-size: 11.5px; }
.fluxo .seta { color: var(--text-mute); flex: none; }

.import { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px; border: 1px dashed var(--border); border-radius: 8px; background: var(--bg-2); }
.import p { margin: 0; font: 12px/1.4 var(--font-sans); color: var(--text-dim); flex: 1 1 220px; }
.modos { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 8px; }

  if (compra && reg.sn && T.vICMS > 0) A.push({ c: 'var(--color-info)', i: 'info', t: 'Destaque de ICMS por optante do Simples.', d: 'O ICMS de ' + brl(T.vICMS) + ' em CSOSN 900 serve para o fornecedor estornar o débito. O texto complementar já traz a declaração.', uc: 'UC-01' });

  if (T.ucs['UC-12']) A.push({ c: 'var(--warn)', i: 'alert', t: 'DIFAL pago na entrada não volta pela nota.', d: 'A recuperação de ' + brl(T.difal) + ' é feita na apuração ou por restituição, conforme o RICMS de ' + partes().emit.uf + '.', uc: 'UC-12' });

  if (compra && reg.real && !S.ctx.estorno && S.itens.some(function (it) { return it.pis && it.pis.v; })) A.push({ c: 'var(--color-info)', i: 'info', t: 'Estorno de PIS/COFINS fora do documento.', d: 'Com a opção desligada, a nota sai com CST 49 sem valor e o ajuste do crédito fica na EFD-Contribuições.', uc: 'UC-04' });
  var cri = S.itens.some(function (it) { return it.ibscbs; });
  if (cri && !reg.sn) A.push({ c: 'var(--color-info)', i: 'info', t: 'IBS/CBS proporcionais à nota original.', d: 'Em homologação é exigido para o Regime Normal desde 01/07/2026; em produção a regra está como implementação futura (NT 2025.002 v1.51).' });

  if (S.origem === 'xml' && compra) A.push({ c: 'var(--color-info)', i: 'info', t: 'Confira a finalidade da compra.', d: 'O CFOP de devolução vem da entrada escriturada. A sugestão saiu do CFOP de venda do XML.' });
  if (podeCancelar()) A.unshift({ c: 'var(--warn)', i: 'alert', t: 'Cancele a NF-e em vez de devolver.', d: 'A nota ' + S.nf.nNF + ' foi emitida há ' + Math.max(1, Math.round(horasDesde(S.nf.dhEmi))) + ' h e a mercadoria não saiu. Dentro do prazo, o cancelamento desfaz a venda sem nota de devolução.' });
  if (S.tipo === 'venda') {
    var sel2 = S.itens.filter(function (it) { return it.sel && it.qDev > 0; });
    if (sel2.some(function (it) { return it.motivo === 'personalizado'; })) A.push({ c: 'var(--color-info)', i: 'info', t: 'Item personalizado vai para Perdas.', d: 'A entrada existe para o estoque fechar com a nota; em seguida o item é baixado por perda.' });
    if (sel2.some(function (it) { return it.motivo === 'fornecedor'; })) A.push({ c: 'var(--color-info)', i: 'info', t: 'Defeito do material do fornecedor.', d: 'Depois de concluir, abra a devolução de compra do insumo para recuperar o custo.' });

function tituloAtual() { return TITULOS[S.cen] || { sit: 'aberto', caixa: 'aberto', det: 'Situação não encontrada', p: [[HOJE, 0]] }; }

function efeitoFin(valor) {
  var t = tituloAtual(), compra = S.tipo === 'compra', quem = compra ? 'fornecedor' : 'cliente';

/* ---------- resolução mista por item (venda com NF-e) ----------
   Cada item escolhe a sua resolução: volta (NF-e de devolução), é refeito (OS de retrabalho)
   ou fica com o cliente com abatimento (Nota de Crédito). A conferência mostra os três documentos juntos. */
var RS = [
  ['', 'Não entra', ''],
  ['devolver', 'Devolver', 'Volta ao estoque · NF-e de devolução'],

function setRs(it, v) {
  var s = saldoIt(it);
  it.rs = v || null;
  it.sel = v === 'devolver';
  if (v === 'devolver' && !(it.qDev > 0)) it.qDev = s;
  if (v !== 'devolver') it.qDev = 0;
  if (v === 'refazer' && !(it.qRef > 0)) it.qRef = Math.min(1, s) || s;
  if (v === 'abater' && !(it.pAb > 0)) it.pAb = 10;
}
function somaRef() {
  var T = { n: 0, un: 0, v: 0, L: [] };
  S.itens.forEach(function (it) { if (it.rs === 'refazer' && it.qRef > 0) { T.n++; T.un = r2(T.un + it.qRef); T.v = r2(T.v + it.qRef * it.vUn); T.L.push(it); } });
  return T;
}
function somaAbater() {
  var T = { orig: 0, ab: 0, n: 0, L: [] };
  S.itens.forEach(function (it) { if (it.rs !== 'abater') return; var v = vAb(it); T.orig = r2(T.orig + baseAb(it)); if (v > 0) { T.ab = r2(T.ab + v); T.n++; T.L.push(it); } });
  return T;
}

    it.pis = lpc('PIS', 'pPIS', 'vPIS'); it.cofins = lpc('COFINS', 'pCOFINS', 'vCOFINS');
    var uf = g(im, 'ICMSUFDest');
    if (uf) it.ufdest = { vBCUFDest: nm(uf, 'vBCUFDest') || 0, pFCPUFDest: nm(uf, 'pFCPUFDest') || 0, pICMSUFDest: nm(uf, 'pICMSUFDest') || 0, pICMSInter: nm(uf, 'pICMSInter') || 0, vFCPUFDest: nm(uf, 'vFCPUFDest') || 0, vICMSUFDest: nm(uf, 'vICMSUFDest') || 0 };
    var ib = g(im, 'IBSCBS');
    if (ib) it.ibscbs = { cst: tx(ib, 'CST'), cClassTrib: tx(ib, 'cClassTrib'), vBC: nm(ib, 'vBC') || 0, pIBSUF: nm(ib, 'pIBSUF') || 0, vIBSUF: nm(ib, 'vIBSUF') || 0, pIBSMun: nm(ib, 'pIBSMun') || 0, vIBSMun: nm(ib, 'vIBSMun') || 0, pCBS: nm(ib, 'pCBS') || 0, vCBS: nm(ib, 'vCBS') || 0 };
    itens.push(it);
  }
  if (!itens.length) throw new Error('O XML não tem itens (det).');
  var nosso = OIMP.cnpj.replace(/\D/g, '');
  S.tipo = nf.emit.cnpj.replace(/\D/g, '') === nosso ? 'venda' : 'compra';
  S.modo = S.tipo; S.venda = null; S.ctx.reg = S.ctx.reg || EMPRESA_REG;
  S.origem = 'xml'; S.cen = null; S.nf = nf; S.busca = nf.chave; S.itens = itens; S.abertos = {}; S.erros = {};
  var suf = String(itens[0].cfop).slice(1);
  S.ctx.fin = ['401', '403', '405', '102', '108'].indexOf(suf) >= 0 ? 'comercializacao' : 'industrializacao';
  renderAll();
  toast('XML lido: ' + itens.length + (itens.length === 1 ? ' item' : ' itens') + '. Marque o que volta e informe a quantidade.');
}

/* ---------- interação ---------- */
var tT = null;
function toast(m) { var t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(tT); tT = setTimeout(function () { t.hidden = true; }, 2600); }
function copiar(txt, msg) {
  function fallback() { var ta = $('infCpl'); if (ta) { ta.removeAttribute('readonly'); ta.select(); ta.setAttribute('readonly', ''); } toast('Selecionei o texto: use Ctrl+C para copiar.'); }
  try { navigator.clipboard.writeText(txt).then(function () { toast(msg); }, fallback); } catch (e) { fallback(); }
}

document.addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.modo) { if (b.dataset.modo === S.modo) return; S.modo = b.dataset.modo; S.tipo = S.modo === 'venda' ? 'venda' : 'compra'; limpaOrigem(); return renderAll(); }
  if (b.dataset.area) { if (b.dataset.area === S.area) return; S.area = b.dataset.area; S.filtroEst = 'todos'; S.busca2 = ''; if (S.view === 'create') return irParaCreate(); return renderPagina(); }
  if (b.id === 'bNovaDev') return irParaCreate();
  if (b.id === 'bVoltaLista') { S.view = 'lista'; return renderPagina(); }
  if (b.dataset.fest) { S.filtroEst = b.dataset.fest; return renderLista(); }
  if (b.dataset.nota) return carregarNota(b.dataset.nota);
  if (b.dataset.snota) return carregarSn(b.dataset.snota);
  if (b.dataset.acons) return carregarAc(b.dataset.acons);
  if (b.id === 'bAcTudoVolta') { S.cItens.forEach(function (c) { c.qVen = 0; c.qVol = emPoder(c.ref); }); S.erros = {}; return renderAcerto(); }
  if (b.id === 'bAcTudoVen') { S.cItens.forEach(function (c) { c.qVen = emPoder(c.ref); c.qVol = 0; }); S.erros = {}; return renderAcerto(); }
  if (b.id === 'bFechaAc') return fecharAc();
  if (b.dataset.fnota) { S.fNota = b.dataset.fnota; S.filtro = ''; return renderAll(); }
  if (b.id === 'bTudoSn') { S.snItens.forEach(function (c) { c.qDev = snSaldo(c.ref); }); S.erros = {}; return renderSnItens(); }
  if (b.id === 'bLimpaSn') { S.snItens.forEach(function (c) { c.qDev = 0; }); S.erros = {}; return renderSnItens(); }
  if (b.id === 'bEstornaSn') return estornarSn();
  if (b.dataset.desvio) { S.desvio = b.dataset.desvio; return renderAll(); }
  if (b.id === 'bVoltaDev') { S.desvio = null; return renderAll(); }
  if (b.dataset.res) { if (b.dataset.res === S.res) return; S.res = b.dataset.res; S.fin = null; return renderAll(); }
  if (b.dataset.reftipo) { S.refTipo = b.dataset.reftipo; return recalc(); }
  if (b.dataset.rsall != null) { S.itens.forEach(function (it) { if (saldoIt(it) > 0) setRs(it, b.dataset.rsall); }); S.erros = {}; return recalc(); }
  if (b.id === 'bConclui') return concluirOcorrencia();
  if (b.dataset.ret) return toast('O processo "' + RETORNOS[+b.dataset.ret][2] + '" abre em outra tela.');
  if (b.id === 'bAbreGar') return toast('O processo Garantia está planejado (SPEC Garantia) e ainda não existe no ERP.');
  if (b.id === 'bCriaOs') return toast('OS de retrabalho criada e vinculada a ' + (S.venda || 'esta venda') + '.');
  if (b.id === 'bEmiteCred') return toast('Nota de Crédito enviada para autorização da SEFAZ.');
  if (b.id === 'bCancNf') return toast('Pedido de cancelamento da NF-e ' + S.nf.nNF + ' enviado à SEFAZ.');
  if (b.dataset.cons) return carregarCons(b.dataset.cons);
  if (b.id === 'bTroca') { limpaOrigem(); return renderAll(); }
  if (b.id === 'bTudoE') { S.cItens.forEach(function (c) { c.qDev = emPoder(c.ref); }); S.erros = {}; return recalc(); }
  if (b.id === 'bLimpaE') { S.cItens.forEach(function (c) { c.qDev = 0; }); S.erros = {}; return recalc(); }
  if (b.id === 'bEstorna') return estornar();
  if (b.dataset.abre) { var i = +b.dataset.abre; S.abertos[i] = !S.abertos[i]; return recalc(); }
  if (b.id === 'bTudo') { S.itens.forEach(function (it) { var s = r2(it.q - it.jaDev); it.qDev = s; it.sel = s > 0; }); S.erros = {}; return recalc(); }
  if (b.id === 'bLimpa') { S.itens.forEach(function (it) { it.qDev = 0; it.sel = false; }); S.erros = {}; return recalc(); }
  if (b.id === 'bCopia') return copiar($('infCpl').value, 'Texto complementar copiado.');
  if (b.id === 'bXml') return abrePrevia(false);
  if (b.id === 'bEmite') return abrePrevia(true);
  if (b.id === 'bRasc') {
    try { localStorage.setItem('oimpresso.devolucao.v3.rascunho', JSON.stringify({ nf: S.nf.chave, itens: S.itens.map(function (it) { return it.qDev; }), ctx: S.ctx })); } catch (er) {}
    return toast('Rascunho salvo.');
  }
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.dataset.sel != null) { var it = S.itens[+t.dataset.sel], s = r2(it.q - it.jaDev); it.sel = t.checked; it.qDev = t.checked ? (it.qDev > 0 ? it.qDev : s) : 0; S.erros[t.dataset.sel] = false; return recalc(); }
  if (t.dataset.q != null) {
    var k = +t.dataset.q, x = S.itens[k], sd = r2(x.q - x.jaDev), v = parseBR(t.value);
    S.erros[k] = v > sd; v = Math.max(0, Math.min(v, sd)); x.qDev = v; x.sel = v > 0;
    return recalc();
  }
  if (t.dataset.eq != null) {
    var j = +t.dataset.eq, cc = S.cItens[j], pp = emPoder(cc.ref), vv = parseBR(t.value);
    S.erros['e' + j] = vv > pp; cc.qDev = Math.max(0, Math.min(vv, pp));
    return recalc();
  }
  if (t.id === 'fDep') { S.dep = t.value; return S.cons && S.modo === 'venda' ? renderAcerto() : recalc(); }
  if (t.dataset.snq != null) { var js = +t.dataset.snq, cs = S.snItens[js], ps = snSaldo(cs.ref), vs2 = parseBR(t.value); S.erros['sn' + js] = vs2 > ps; cs.qDev = Math.max(0, Math.min(vs2, ps)); return renderSnItens(); }
  if (t.dataset.mot != null) { S.itens[+t.dataset.mot].motivo = t.value; return recalc(); }
  if (t.name === 'fin') { S.fin = t.value; return recalc(); }
  if (t.id === 'fVencPd') { S.finVenc = t.value || S.finVenc; return recalc(); }
  if (t.id === 'fFormaPd') { S.finForma = t.value; return recalc(); }
  if (t.name === 'acforma') { S.acForma = t.value; return renderAcerto(); }
  if (t.id === 'fAcVenc') { S.acVenc = t.value || S.acVenc; return renderAcerto(); }
  if (t.id === 'fAcNfe') { S.acNfe = t.checked; return renderAcerto(); }
  if (t.dataset.acv != null) { var ia = +t.dataset.acv, ca = S.cItens[ia], pa = emPoder(ca.ref), va = parseBR(t.value); S.erros['av' + ia] = va > pa; ca.qVen = Math.max(0, Math.min(va, pa)); if (!ca.mexeuVol || ca.qVen + ca.qVol > pa) ca.qVol = r2(pa - ca.qVen); return renderAcerto(); }
  if (t.dataset.acr != null) { var ir2 = +t.dataset.acr, cr = S.cItens[ir2], lim = r2(emPoder(cr.ref) - cr.qVen), vr = parseBR(t.value); S.erros['ar' + ir2] = vr > lim; cr.qVol = Math.max(0, Math.min(vr, lim)); cr.mexeuVol = true; return renderAcerto(); }
  if (t.id === 'fRefMot') { S.refMot = t.value; return recalc(); }
  if (t.dataset.rq != null) { var kr = +t.dataset.rq, ir = S.itens[kr], sr = saldoIt(ir), vq = parseBR(t.value); S.erros['r' + kr] = vq > sr; ir.qRef = Math.max(0, Math.min(vq, sr)); return recalc(); }
  if (t.dataset.rs != null) { setRs(S.itens[+t.dataset.rs], t.value); S.erros = {}; return recalc(); }
  if (t.dataset.ab != null) { S.itens[+t.dataset.ab].pAb = Math.max(0, Math.min(parseBR(t.value), 100)); return recalc(); }
  if (t.id === 'fReg') { S.ctx.reg = t.value; return renderAll(); }
  if (t.id === 'fFin') { S.ctx.fin = t.value; return renderAll(); }
  if (t.id === 'fSt') { S.ctx.stModo = t.value; return renderAll(); }
  if (t.id === 'fIPI') { S.ctx.contribIPI = t.checked; return renderAll(); }
  if (t.id === 'fEst') { S.ctx.estorno = t.checked; return renderAll(); }
  if (t.id === 'fAce') { S.ctx.acess = t.checked; return renderAll(); }
  if (t.id === 'xmlIn' && t.files && t.files[0]) {
    var rd = new FileReader();
    rd.onload = function () { try { importarXml(String(rd.result)); } catch (er) { toast(er.message); } };
    rd.readAsText(t.files[0]);
  }
});
document.addEventListener('click', function (e) {
  var tr = e.target.closest('tr[data-reg]'); if (!tr) return;
  toast('O detalhe de ' + tr.dataset.reg + ' abre na gaveta lateral, com a trilha de etapas.');
});
document.addEventListener('submit', function (e) {
  if (e.target.id === 'fBusca') { e.preventDefault(); S.busca = $('fChave').value; buscarNota(S.busca); }
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'fMot') { S.motivo = e.target.value; renderInfo(ULTIMO); }
  if (e.target.id === 'fMotE') { S.motE = e.target.value; }
  if (e.target.id === 'fBusca2') { S.busca2 = e.target.value; renderLista(); var bi = $('fBusca2'); bi.focus(); bi.setSelectionRange(bi.value.length, bi.value.length); }
  if (e.target.id === 'fVenda') {
    S.filtro = e.target.value; var f = S.filtro.toLowerCase().trim(), vis = 0;
    Array.prototype.forEach.call(document.querySelectorAll('tr[data-txt]'), function (tr) { var ok = !f || tr.dataset.txt.indexOf(f) >= 0; tr.hidden = !ok; if (ok) vis++; });
    $('vVazio').hidden = vis > 0;
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && !$('ovl').hidden) $('ovl').hidden = true;
  if (e.key === 'Enter' && e.target.dataset && (e.target.dataset.q != null || e.target.dataset.eq != null || e.target.dataset.snq != null || e.target.dataset.acv != null || e.target.dataset.acr != null || e.target.dataset.rq != null || e.target.dataset.ab != null)) e.target.blur();
});
$('ovl').addEventListener('click', function (e) { if (e.target === this) this.hidden = true; });


S.modo = 'venda'; S.tipo = 'venda';
renderPagina();
})();
