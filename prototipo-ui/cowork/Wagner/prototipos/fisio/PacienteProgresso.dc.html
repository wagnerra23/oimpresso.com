<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Paciente · Progresso</title>
<script src="../../../../design-system/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:oklch(0.45 0.15 295)}a:hover{color:oklch(0.22 0.01 80)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: oklch(0.985 0.003 90); color: oklch(0.22 0.01 80); font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif; font-size: 16px; line-height: 1.45; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1; padding: 24px 20px 12px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
    <header style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: oklch(0.50 0.01 80); font-weight: 600">6 semanas de tratamento</span>
      <h1 style="margin: 0; font-family: 'IBM Plex Sans', sans-serif; font-size: 30px; line-height: 1.1">27 de 30 sessões cumpridas</h1>
    </header>

    <section aria-labelledby="dorg" style="background: #FFFFFF; border: 1px solid oklch(0.90 0.004 90); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span id="dorg" style="font-weight: 600">Dias cumpridos por semana</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: oklch(0.50 0.01 80)">meta 5</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; height: 132px">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="7">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: oklch(0.38 0.01 80)">{{b.v}}</span>
            <div style="width: 100%; height: {{b.h}}; border-radius: 6px 6px 0 0; background: {{b.bg}}"></div>
            <span style="font-size: 11px; color: oklch(0.50 0.01 80)">{{b.l}}</span>
          </div>
        </sc-for>
      </div>
    </section>

    <section aria-label="Números do tratamento" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="background: #FFFFFF; border: 1px solid oklch(0.90 0.004 90); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 26px">27</span>
        <span style="font-size: 13px; color: oklch(0.50 0.01 80)">sessões em casa</span>
      </div>
      <div style="background: #FFFFFF; border: 1px solid oklch(0.90 0.004 90); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 26px">6h 20</span>
        <span style="font-size: 13px; color: oklch(0.50 0.01 80)">de exercício</span>
      </div>
    </section>

    <section aria-labelledby="conq" style="display: flex; flex-direction: column; gap: 8px">
      <span id="conq" style="font-weight: 600">Conquistas</span>
      <sc-for list="{{wins}}" as="w" hint-placeholder-count="3">
        <div style="display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 14px; background: {{w.bg}}; border: {{w.border}}">
          <span style="width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: {{w.iconBg}}; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{w.iconFg}}" stroke-width="2.5" aria-hidden="true"><path d="{{w.icon}}"/></svg></span>
          <span style="display: flex; flex-direction: column"><span style="font-weight: 600; color: {{w.fg}}">{{w.title}}</span><span style="font-size: 13px; color: oklch(0.50 0.01 80)">{{w.sub}}</span></span>
        </div>
      </sc-for>
    </section>
  </div>

  <nav aria-label="Navegação" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid oklch(0.90 0.004 90); padding: 8px 8px 22px">
    <a href="PacienteHoje.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 48px; justify-content: center; text-decoration: none; color: oklch(0.50 0.01 80); font-size: 12px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>Hoje</a>
    <a href="PacienteProgresso.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 48px; justify-content: center; text-decoration: none; color: {{accent}}; font-size: 12px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Progresso</a>
    <a href="PacienteJornada.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 48px; justify-content: center; text-decoration: none; color: oklch(0.50 0.01 80); font-size: 12px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 15a6 6 0 100-12 6 6 0 000 12zM8.5 13.5L7 22l5-3 5 3-1.5-8.5"/></svg>Jornada</a>
    <a href="PacienteConsultas.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 48px; justify-content: center; text-decoration: none; color: oklch(0.50 0.01 80); font-size: 12px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Consultas</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? 'oklch(0.55 0.15 295)';
    const vals = [3, 4, 4, 5, 5, 4, 5];
    const bars = vals.map((v, i) => ({ v: String(v), l: 'S' + (i + 1), h: Math.round(v / 5 * 104) + 'px', bg: v >= 5 ? accent : 'oklch(0.85 0.004 90)' }));
    const win = (title, sub, icon, done) => ({ title, sub, icon, bg: done ? '#FFFFFF' : 'transparent', border: done ? '1px solid oklch(0.90 0.004 90)' : '1px dashed oklch(0.85 0.004 90)', iconBg: done ? accent : 'oklch(0.965 0.004 90)', iconFg: done ? '#FFFFFF' : 'oklch(0.60 0.01 80)', fg: done ? 'oklch(0.22 0.01 80)' : 'oklch(0.50 0.01 80)' });
    return {
      accent,
      bars,
      wins: [
        win('8 horas sentada sem dor', 'Sua meta principal · alcançada em 16/10', 'M5 12l5 5 9-10', true),
        win('12 dias seguidos', 'Maior sequência até agora', 'M12 3c2 4 6 5 6 10a6 6 0 01-12 0c0-3 2-4 2-6 1 1 2 2 4 2 0-2-1-4 0-6z', true),
        win('Caminhar 5 km', 'Próxima meta · liberada na fase 3', 'M13 4a1.5 1.5 0 100 .1M10 21l2-6 3 3v4M9 12l3-4 3 3 3 1', false)
      ]
    };
  }
}
</script>
</body>
</html>
