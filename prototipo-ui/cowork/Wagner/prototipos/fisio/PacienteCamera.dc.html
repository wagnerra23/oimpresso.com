<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Paciente · Câmera</title>
<script src="../../../../design-system/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:oklch(0.82 0.08 295)}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: oklch(0.16 0.006 240); color: #FFFFFF; font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif; font-size: 16px; line-height: 1.45; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 24px 20px 12px; display: flex; justify-content: space-between; align-items: center">
    <a href="PacienteHoje.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; border-radius: 50%; background: oklch(0.24 0.008 240); display: grid; place-items: center; color: #FFFFFF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div style="display: flex; flex-direction: column; align-items: center">
      <span style="font-family: 'IBM Plex Sans', sans-serif; font-size: 19px">Perdigueiro</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: oklch(0.72 0.005 90)">série 2 de 3</span>
    </div>
    <button type="button" aria-label="Som ligado" style="width: 44px; height: 44px; border-radius: 50%; background: oklch(0.24 0.008 240); border: 0; display: grid; place-items: center; color: #FFFFFF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 010 6M18.5 6.5a7.5 7.5 0 010 11"/></svg></button>
  </header>

  <div aria-label="Progresso da série" style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; padding: 0 20px 12px">
    <sc-for list="{{reps}}" as="r" hint-placeholder-count="8">
      <span style="height: 5px; border-radius: 3px; background: {{r.bg}}"></span>
    </sc-for>
  </div>
  <section aria-label="Visão da câmera contando repetições" style="position: relative; margin: 0 12px; height: 420px; border-radius: 22px; background: oklch(0.22 0.01 80); overflow: hidden">
    <span style="position: absolute; left: 14px; top: 12px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: oklch(0.72 0.005 90)"><span style="width: 8px; height: 8px; border-radius: 50%; background: oklch(0.76 0.18 150)"></span>A 2 m, na diagonal · enquadrado</span>
    <svg viewBox="0 0 366 440" role="img" aria-label="Esqueleto detectado em quatro apoios, braço e perna opostos estendidos" style="position: absolute; inset: 0; width: 100%; height: 100%">
      <line x1="10" y1="372" x2="356" y2="372" stroke="oklch(0.32 0.008 240)" stroke-width="2"/>
      <g opacity=".5">
        <polyline points="138,224 230,224 350,224" fill="none" stroke="oklch(0.82 0.08 295)" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round"/>
        <polyline points="138,224 34,214" fill="none" stroke="oklch(0.82 0.08 295)" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round"/>
      </g>
      <text x="40" y="244" font-size="12" fill="oklch(0.82 0.08 295)" font-family="IBM Plex Sans, sans-serif">como no vídeo</text>
      <polyline points="138,230 230,232" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
      <polyline points="140,232 140,370" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
      <polyline points="230,232 232,370 300,370" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="138,228 40,190" fill="none" stroke="{{accent}}" stroke-width="6" stroke-linecap="round"/>
      <polyline points="232,232 350,214" fill="none" stroke="{{accent}}" stroke-width="6" stroke-linecap="round"/>
      <circle cx="112" cy="214" r="18" fill="none" stroke="#FFFFFF" stroke-width="4"/>
      <sc-for list="{{joints}}" as="j" hint-placeholder-count="8">
        <circle cx="{{j.x}}" cy="{{j.y}}" r="7" fill="oklch(0.16 0.006 240)" stroke="{{j.c}}" stroke-width="3"/>
      </sc-for>
      <rect x="226" y="150" width="128" height="34" rx="17" fill="oklch(0.45 0.15 295)"/>
      <text x="290" y="173" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF" font-family="IBM Plex Mono, monospace">5 · ritmo ok</text>
    </svg>
    <div style="position: absolute; right: 14px; top: 12px; width: 64px; height: 64px; border-radius: 50%; background: oklch(0.16 0.006 240); display: grid; place-items: center">
      <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true" style="position: absolute; inset: 0"><circle cx="32" cy="32" r="27" fill="none" stroke="oklch(0.32 0.008 240)" stroke-width="5"/><circle cx="32" cy="32" r="27" fill="none" stroke="{{accent}}" stroke-width="5" stroke-dasharray="102 170" stroke-linecap="round" transform="rotate(-90 32 32)"/></svg>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; position: relative">3s</span>
    </div>
  </section>

  <div style="padding: 16px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <div role="status" style="display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 14px; background: oklch(0.27 0.06 295); color: oklch(0.90 0.04 295)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="flex: none"><path d="M4 5h16v11H9l-5 4z"/></svg>
      <span><span style="font-weight: 600">Dica da sua fisio:</span> quadril parado, como se tivesse um copo d'água nas costas. Segure 5 segundos.</span>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: oklch(0.72 0.005 90); font-weight: 600">Repetição</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 48px; line-height: 1">5<span style="font-size: 24px; color: oklch(0.58 0.005 90)">/8</span></span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end">
        <span style="font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: oklch(0.72 0.005 90); font-weight: 600">Nota parcial · combo</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 28px; line-height: 1.1; color: oklch(0.76 0.18 150)">88 <span style="font-size: 16px; color: oklch(0.86 0.13 85)">×1,5</span></span>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button type="button" style="height: 52px; border-radius: 14px; border: 1px solid oklch(0.40 0.008 240); background: transparent; color: #FFFFFF; font: inherit; font-weight: 600">Pausar</button>
      <a href="PacienteSerieConfirmar.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 14px; background: #FFFFFF; color: oklch(0.22 0.01 80); text-decoration: none; font-weight: 600">Encerrar série</a>
    </div>
    <span style="font-size: 12px; color: oklch(0.72 0.005 90); text-align: center">Saiu do quadro? A contagem pausa. No fim, você confirma o número.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? 'oklch(0.70 0.15 295)';
    const reps = [1, 1, 2, 1, 3, 0, 0, 0].map(v => ({ bg: v === 1 ? 'oklch(0.76 0.18 150)' : v === 2 ? 'oklch(0.82 0.16 75)' : v === 3 ? accent : 'oklch(0.32 0.008 240)' }));
    return {
      accent,
      reps,
      joints: [
        { x: 40, y: 190, c: accent }, { x: 138, y: 230, c: '#FFFFFF' }, { x: 140, y: 370, c: '#FFFFFF' },
        { x: 230, y: 232, c: 'oklch(0.82 0.16 75)' }, { x: 232, y: 370, c: '#FFFFFF' }, { x: 300, y: 370, c: '#FFFFFF' },
        { x: 350, y: 214, c: accent }, { x: 290, y: 223, c: 'oklch(0.82 0.08 295)' }
      ]
    };
  }
}
</script>
</body>
</html>
