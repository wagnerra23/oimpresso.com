<script>
/* Mesmo contrato do DS usado em sells/create-v3: tema em html.cockpit[data-theme],
   seguindo o sistema até o visualizador escolher. */
(function () {
  var d = document.documentElement;
  d.classList.add('cockpit');
  d.lang = 'pt-BR';
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  var auto = !d.hasAttribute('data-theme');
  var proprio = false;
  function aplicar() {
    if (!auto) return;
    proprio = true;
    d.setAttribute('data-theme', mq && mq.matches ? 'dark' : 'light');
  }
  aplicar();
  if (mq && mq.addEventListener) mq.addEventListener('change', aplicar);
  new MutationObserver(function () {
    if (proprio) { proprio = false; return; }
    if (!d.hasAttribute('data-theme')) { auto = true; aplicar(); } else { auto = false; }
    window.dispatchEvent(new Event('dv-tema'));
  }).observe(d, { attributes: true, attributeFilter: ['data-theme'] });
  window.__dvTema = function (t) { auto = false; d.setAttribute('data-theme', t); };
})();
</script>

/* =============================================================================
   Office Impresso / Ponto WR2 — DESIGN SYSTEM v6 — design tokens
   -----------------------------------------------------------------------------
   "DS v6" = the git source-of-truth design system (ADR 0239 DS git SSOT,
   ADR 0249 DS v6 naming, ADR 0300 token errata). Tokens are authored as
   DTCG JSON (resources/css/tokens/*.tokens.json in the source repo) and compiled
   by Style Dictionary into CSS. The values below are copied verbatim from that
   generated output — do not invent values.

   THREE token layers, mirrored from the repo:
     1. @theme  (inertia)     — Tailwind v4 color/radius/motion utilities
     2. foundations :root      — the Type RAMP (--fs-1..9), shadows, motion, atmo
     3. .cockpit scope         — the operational shell's own palette
                                 (--bg / --surface / --text / --accent / …),
                                 IBM Plex Sans/Mono, plus dozens of domain hues

   KEY FACTS
     · PRIMARY IS PURPLE — `oklch(0.55 0.15 295)` (ADR 0190 "roxo médio
       universal", ADR 0235). It is NOT the shadcn blue. Accent hue 295 is the
       canon default; the cockpit Tweaks panel lets users re-hue it live.
     · Operational shell font is **IBM Plex Sans** (mono: **IBM Plex Mono**).
       The marketing/Tailwind layer falls back to the system sans stack.
     · Color space is OKLCH throughout. Status semantics: success(green 162) /
       warning(amber 70-75) / destructive(red 18-25) / info(blue 244), each with
       a `-soft` (tinted bg) and `-fg` (readable text) companion.
     · Everything has a dark counterpart, keyed by BOTH `.dark` and
       `[data-theme="dark"]` (the cockpit sets data-theme on the shell root).
     ============================================================================ */

/* =============================================================================
   LAYER 3 — .cockpit scope  [_generated-cockpit-light.css]
   The operational shell's own palette. Telas pintam com estes tokens (--bg,
   --surface, --text, --accent, …) + IBM Plex. Reproduced here so a standalone
   page wrapped in <div class="cockpit"> renders exactly like the real app.
   ============================================================================ */
.cockpit {
  --font-sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --bg: oklch(0.985 0.003 90);
  --bg-2: oklch(0.965 0.004 90);
  --surface: #ffffff;
  --border: oklch(0.90 0.004 90);
  --border-2: oklch(0.93 0.004 90);
  --text: oklch(0.22 0.01 80);
  --text-dim: oklch(0.50 0.01 80);
  --text-mute: oklch(0.555 0.01 80);

  --accent: oklch(0.55 0.15 295);
  --accent-2: oklch(0.62 0.15 295);
  --accent-soft: oklch(0.95 0.04 295);
  --accent-fg: #ffffff;

  --pos: oklch(0.50 0.12 150);
  --pos-soft: oklch(0.95 0.075 150);
  --neg: oklch(0.55 0.18 25);
  --neg-soft: oklch(0.955 0.055 25);
  --warn: oklch(0.56 0.12 70);
  --warn-soft: oklch(0.955 0.072 75);

  --radius: 8px;
  --radius-sm: 6px;
  --radius-lg: 12px;
  --row-h: 30px;  /* @kind spacing */
  --shadow-pop: 0 6px 24px -8px rgba(0,0,0,.18), 0 2px 6px -2px rgba(0,0,0,.10);
  --shadow-soft: 0 1px 2px rgba(0,0,0,.04);

  /* Sidebar is DARK-FIXED in the real cockpit (Wagner: "menu fundo black").
     Light-mode sidebar tokens shown; dark shell keeps a near-identical dark sidebar. */
  --sb-bg: oklch(0.18 0.006 240);
  --sb-bg-2: oklch(0.16 0.006 240);
  --sb-border: oklch(0.28 0.008 240);
  --sb-text: oklch(0.78 0.005 90);

  --sb-text-hi: oklch(0.96 0.005 90);
  --sb-hover: oklch(0.27 0.008 240);
  --sb-active: oklch(0.32 0.008 240);

  /* Domain hues (origin chips / SLA / kind / canal) — full set lives in
     _generated-cockpit-light.css; the four most common kept here. */

  --kind-supplier: oklch(0.42 0.12 60);

}

/* =============================================================================
   SEMANTIC ELEMENT STYLES
   Mirrors the look of pages built with AppShellV2 + the Type RAMP. Marketing
   pages use the system sans; operational pages get IBM Plex via .cockpit.
   ============================================================================ */
html {
  font-family: var(--font-sans);
  color: var(--color-foreground);
  background: var(--color-background);
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
body {
  margin: 0;
  font-size: var(--fs-4);
  line-height: 1.45;
  color: var(--color-foreground);
  background: var(--color-background);
}

/* Display — marketing hero only. */
.display, h1.display {
  font-size: clamp(2.25rem, 5vw, 3.75rem);
  line-height: 1.05;
  letter-spacing: -0.025em;
  font-weight: 700;
}

p { margin: 0 0 0.75em 0; color: var(--fg-1); font-size: var(--fs-4); line-height: 1.45; }

/* eyebrow / KPI label — uppercase tracked, fs-1 */
.eyebrow, .kpi-label {

/* tabular numerics for time/money — REP-P timestamps, KPI values, espelho */

a { color: var(--color-primary); text-decoration: none; transition: color var(--duration-base) var(--ease-standard); }

::selection { background: var(--color-primary); color: var(--color-primary-foreground); }

/* =============================================================================
   UNIVERSAL KEYBOARD FOCUS (ADR canon: "Focus ring is universal").
   The pure inline-styled components don't draw their own keyboard ring (only
   form fields do), so this fulfils the documented contract for every focusable
   control. Low specificity via :where() so consumers can override.
   Form fields opt out — they paint their own accent halo on focus.
   ============================================================================ */
:where(button, a[href], [role="button"], [tabindex]:not([tabindex="-1"])):focus-visible {
  outline: 2px solid var(--color-primary);
  outline-offset: 2px;
}
.cockpit :where(button, a[href], [role="button"], [tabindex]:not([tabindex="-1"])):focus-visible {
  outline-color: var(--accent);
}

<style id="devolucao-v3">
/* Layout: mesma grade de sells/create-v3 — trabalho à esquerda (nota → regime → itens → texto),

  --dv-icms: var(--origin-CRM-fg);
  --dv-st: var(--origin-OS-fg);
  --dv-ipi: var(--origin-MFG-fg);
  --dv-pis: var(--origin-FIN-fg);
  --dv-difal: var(--origin-PNT-fg);

html, body { height: auto; }
body { background-color: var(--bg); color: var(--text); overflow-x: hidden; font-family: var(--font-sans); }

button, input, select, textarea { font-family: inherit; }

  display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px;
  min-height: 44px; padding-block: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));

.dv-rota { font: 500 12.5px/1 var(--font-mono); color: var(--text); white-space: nowrap; }
.dv-nota { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border); flex-wrap: wrap; }
.seg button { appearance: none; border: 0; background: transparent; cursor: pointer; padding: 6px 10px; border-radius: 6px; font: 500 12px/1 var(--font-sans); color: var(--text-dim); }

}

.pg-h { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; margin-bottom: 16px; }

      '<p class="pe">Valores da nota (vProd, vBC, vICMS e totais) não são guardados: a natureza só leva códigos e a origem das alíquotas.</p>';
  }
  return '<div class="drop" id="drop"><p><b>Arraste o XML de uma NF-e ou NFC-e já emitida</b> com a mesma operação. O sistema lê natOp, finalidade, CFOP e os grupos ICMS, IPI, PIS, COFINS e IBSCBS do primeiro item.</p>' +
    '<div class="acts"><label class="btn pri" for="fXml">' + ICO.file + 'Escolher arquivo XML</label><input type="file" id="fXml" accept=".xml,text/xml,application/xml"><button class="btn" data-act="exemplo">Usar XML de exemplo</button></div>' +
    (I && I.erro ? '<p style="color:color-mix(in oklch, var(--neg) 62%, var(--text))"><b style="color:inherit">' + esc(I.erro) + '</b></p>' : '') + '</div>';
}
function renderEditor() {
  var N = S.ed, A = validar(N), st = STEPS[S.step], i = S.step;
  S.visto[st.k] = true;
  $('pgH').innerHTML = '<div style="min-width:0"><button class="voltar" data-act="voltar">' + ICO.back + (S.dirty ? 'Voltar sem salvar' : 'Naturezas de operação') + '</button>' +
    '<h1 id="edTit">' + esc(N.nome || 'Nova natureza') + '</h1><p id="edSub">' + subTitulo() + '</p></div>' +
    '<div class="dir">' + (S.edNovo ? '' : pill(situacao(N).t, situacao(N).c)) + '</div>';
  var sub = {
    nat: S.edNovo ? 'Nome, tipo e finalidade. Depois escolha começar em branco ou importar uma nota de referência.' : 'Nome, tipo e finalidade da natureza.',
    cfop: 'O lançamento escolhe o CFOP pela UF do ' + (N.tipo === 'E' ? 'remetente' : 'cliente') + '.',
    icms: (ehSN() ? 'CSOSN' : 'CST') + ', base, origem da alíquota, ST e DIFAL.',
    ipi: 'Só para quem destaca IPI.',
    pc: 'CST e alíquota do PIS e da COFINS.',
    ibs: 'Grupos da reforma tributária (ano de teste em 2026).',
    rev: 'Confira o que a natureza preenche no lançamento e salve.'
  }[st.k];
  var corpo = '';
  if (st.k === 'nat') corpo = passoNat();
  else if (st.k === 'cfop') {
    var e = N.tipo === 'E', pfx = e ? ['1', '2', '3'] : ['5', '6', '7'];
    corpo = '<div class="fgrid">' + DESTS.map(function (d, j) {
      var c = N.cfop[d[0]];
      return fTxt('ed', 'cfop.' + d[0], d[1], 'Ex.: ' + pfx[j] + (N.cfop.in ? N.cfop.in.slice(1) : '102'), c ? (nomeCfop(c) ? esc(nomeCfop(c)) : 'Fora da lista comum; confira na tabela.') : (d[0] === 'ext' ? 'Opcional.' : 'Começa com ' + pfx[j] + '.'), N, ' inputmode="numeric" maxlength="4"');
    }).join('') + '</div>';
  } else if (st.k === 'rev') {
    corpo = '<div class="lanc-h"><div class="fld"><span class="lbl">Cliente</span>' + segDest() + '</div></div>' + lancHtml(N, 'lanc') +
      '<div class="grupo"><span class="lbl">Conferência</span>' + (alertasHtml(A, true) || alertasHtml([{ c: 'pos', st: '', t: '<b>Natureza consistente.</b> Pode ser usada no lançamento.' }], false)) + '</div>';
  } else corpo = painel(st.k);
  var doPasso = st.k === 'rev' ? '' : alertasHtml(A.filter(function (a) { return a.st === st.k; }), false);
  var prox = STEPS[i + 1], ant = STEPS[i - 1];
  var podeProx = prox && !(st.k === 'nat' && travado()) && !(st.k === 'nat' && S.modo === 'import' && !(S.imp && S.imp.ok));
  var nav = '<div class="navp">' + (ant ? '<button class="btn" data-act="ant">' + ICO.back + ant.l + '</button>' : '') +
    '<div class="dir">' + (prox ? '<button class="btn pri" data-act="prox"' + (podeProx ? '' : ' disabled') + '>' + (st.k === 'nat' && S.modo === 'import' ? 'Revisar passo a passo' : 'Próximo: ' + prox.l) + ICO.next + '</button>' : '<button class="btn pri" data-act="salvar"' + (A.some(function (a) { return a.c === 'neg'; }) ? ' disabled' : '') + '>' + (S.edNovo ? 'Criar natureza' : 'Salvar natureza') + '</button>') + '</div></div>';
  $('secPasso').style.setProperty('--hue', st.c || 'var(--accent)');
  $('secPasso').innerHTML = stepsHtml(A) + secHead(st.ico, st.l, sub, '', i + 1) + '<div class="bd" id="corpo">' + corpo + (doPasso ? '<div class="grupo">' + doPasso + '</div>' : '') + '</div>' + nav;
  renderAside(A);
}
function subTitulo() { return 'Passo ' + (S.step + 1) + ' de ' + STEPS.length + ' · ' + STEPS[S.step].l + ' · ' + (S.edNovo ? 'natureza nova, ainda não salva' : S.dirty ? 'alterações não salvas' : 'sem alterações') + ' · ' + regNome(); }
function renderAside(A) {
  var N = S.ed, bloq = A.some(function (a) { return a.c === 'neg'; }), nE = A.filter(function (a) { return a.c === 'neg'; }).length;
  $('aside').innerHTML = '<section class="sec"><header><span class="ico">' + ICO.cursor + '</span><div style="min-width:0"><h3>No lançamento</h3><p>O que esta natureza preenche nos itens.</p></div></header>' +
    '<div class="bd" style="display:flex;flex-direction:column;gap:12px"><div class="fld"><span class="lbl">Cliente</span>' + segDest() + '</div>' + lancHtml(N, 'lanc-a') +
    '<div class="aviso-v">Sem valores: base, imposto e totais são calculados no lançamento, com os produtos e preços da nota.</div></div></section>' +
    '<div class="fin"><button class="btn pri lg acao" data-act="salvar"' + (bloq || travado() ? ' disabled' : '') + '>' + (S.edNovo ? 'Criar natureza' : 'Salvar natureza') + '</button>' +
    '<div class="duas"><button class="btn" data-act="duplicar"' + (S.edNovo ? ' disabled' : '') + '>' + ICO.copy + 'Duplicar</button><button class="btn" data-act="voltar">Cancelar</button></div>' +
    '<div class="msg' + (bloq ? ' neg' : '') + '">' + (travado() ? 'Escolha começar em branco ou importar uma nota.' : bloq ? nE + (nE > 1 ? ' pendências' : ' pendência') + ' nos passos marcados em vermelho.' : 'Vale para as próximas notas lançadas com esta natureza.') + '</div></div>';
}
function renderLive() {
  var N = S.ed, A = validar(N);
  var t = $('edTit'); if (t) t.textContent = N.nome || 'Nova natureza';
  var sb = $('edSub'); if (sb) sb.textContent = subTitulo();
  var sp = $('steps'); if (sp) sp.outerHTML = stepsHtml(A);
  var vb = document.querySelector('.voltar'); if (vb && S.dirty) vb.innerHTML = ICO.back + 'Voltar sem salvar';
  renderAside(A);
}

/* ---------- navegação ---------- */
function abrirEditor(N, novo) {
  S.ed = clone(N); S.edNovo = !!novo; S.dirty = false; S.step = 0; S.modo = novo ? null : 'editar'; S.imp = null;
  S.visto = {}; if (!novo) STEPS.forEach(function (s) { S.visto[s.k] = true; });
  S.view = 'ed'; location.hash = novo ? 'nova' : 'natureza-' + N.id; render(); window.scrollTo(0, 0);
}
function irPasso(i) { if (i < 0 || i >= STEPS.length) return; S.step = i; renderEditor(); var c = $('secPasso'); if (c && c.getBoundingClientRect().top < 0) c.scrollIntoView({ block: 'start' }); var b = document.querySelector('#steps [aria-current="step"]'); if (b) b.focus(); }
function voltar() { S.view = 'lista'; S.ed = null; location.hash = 'lista'; render(); window.scrollTo(0, 0); }
function render() { var ed = S.view === 'ed' && S.ed; renderReg(); $('vLista').hidden = !!ed; $('vEd').hidden = !ed; if (ed) renderEditor(); else renderLista(); }
function toast(msg) { var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 2800); }
function rotear() {
  var h = location.hash.replace('#', ''), m1 = /^natureza-(\d+)$/.exec(h);
  if (m1) { var N = NATS.filter(function (x) { return x.id === +m1[1]; })[0]; if (N) { if (!S.ed || S.ed.id !== N.id) { S.ed = clone(N); S.edNovo = false; S.dirty = false; S.step = 0; S.modo = 'editar'; S.imp = null; S.visto = {}; STEPS.forEach(function (s) { S.visto[s.k] = true; }); } S.view = 'ed'; return render(); } }
  if (h === 'nova' && S.ed) { S.view = 'ed'; return render(); }
  S.view = 'lista'; S.ed = null; render();
}
function refoca(fn) { var a = document.activeElement, id = a && a.id; fn(); if (id && $(id)) $(id).focus(); }
function importar(txt, nome) {
  var N = S.ed, finEscolhida = N.fin, tipoEscolhido = N.tipo, R = lerXml(txt, N);
  if (R.erro) { S.imp = { erro: R.erro }; } else { R.arquivo = nome; S.imp = R; S.dirty = true; toast('XML lido: ' + R.rep.filter(function (r) { return r.sit !== 'nao'; }).length + ' campos preenchidos. Revise os passos.'); }
  if (R.erro) { N.fin = finEscolhida; N.tipo = tipoEscolhido; }
  renderEditor();
}

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act],[data-area],[data-step],[data-dest],[data-reg],tr[data-id]');
  if (!el) return;
  if (el.hasAttribute('data-reg')) { EMPRESA.reg = el.getAttribute('data-reg'); render(); toast('Regime: ' + regNome() + (ehSN() ? ' · campos de CSOSN' : ' · campos de CST')); return; }
  if (el.hasAttribute('data-area')) { S.area = el.getAttribute('data-area'); renderLista(); return; }
  if (el.hasAttribute('data-dest')) { S.dest = el.getAttribute('data-dest'); if (S.view === 'ed' && S.ed) renderEditor(); else renderLista(); var b = document.querySelector('[data-dest="' + S.dest + '"]'); if (b) b.focus(); return; }
  if (el.hasAttribute('data-step')) { irPasso(+el.getAttribute('data-step')); return; }
  if (el.matches('tr[data-id]')) { abrirEditor(NATS.filter(function (x) { return x.id === +el.getAttribute('data-id'); })[0]); return; }
  var a = el.getAttribute('data-act');
  if (a === 'nova') { var N = vazia(); N.id = proxId; abrirEditor(N, true); }
  else if (a === 'branco') { S.modo = 'branco'; irPasso(1); }
  else if (a === 'importar') { S.modo = 'import'; renderEditor(); }
  else if (a === 'exemplo') importar(XML_EXEMPLO, 'NFe 4821 · exemplo.xml');
  else if (a === 'outro-xml') { S.imp = null; renderEditor(); }
  else if (a === 'prox') irPasso(S.step + 1);
  else if (a === 'ant') irPasso(S.step - 1);
  else if (a === 'voltar') voltar();
  else if (a === 'salvar') {
    var R = clone(S.ed);
    if (S.edNovo) { NATS.push(R); proxId++; } else NATS = NATS.map(function (x) { return x.id === R.id ? R : x; });
    toast((S.edNovo ? 'Natureza criada: ' : 'Natureza salva: ') + R.nome); voltar();
  }
  else if (a === 'duplicar') { var D = clone(S.ed); D.id = proxId; D.nome = D.nome + ' (cópia)'; abrirEditor(D, true); S.modo = 'branco'; renderEditor(); toast('Cópia criada. Ajuste o nome e revise os passos.'); }
});
function lerValor(el) { var t = el.getAttribute('data-t'); return t === 'bool' ? el.checked : t === 'num' ? parseBR(el.value) : el.value; }
document.addEventListener('input', function (e) {
  var el = e.target, s = el.getAttribute('data-s'); if (!s) return;
  if (s === 'busca') { S.busca = el.value; refoca(renderLista); var b = $('fBusca'); if (b) { var n = b.value.length; b.setSelectionRange(n, n); } return; }
  if (el.tagName === 'SELECT' || el.type === 'checkbox' || s !== 'ed') return;
  var k = el.getAttribute('data-k'), v = lerValor(el);
  if (k.indexOf('cfop.') === 0 || k === 'ibs.cClass' || k === 'ipi.cEnq') v = String(v).trim();
  setK(S.ed, k, v); S.dirty = true; renderLive();
  if (k.indexOf('cfop.') === 0) { var hp = el.closest('.fld').querySelector('.help'); if (hp) hp.textContent = v ? (nomeCfop(v) || 'Fora da lista comum; confira na tabela.') : ''; }
});
document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.id === 'fXml' && el.files && el.files[0]) { var f = el.files[0], r = new FileReader(); r.onload = function () { importar(String(r.result), f.name); }; r.onerror = function () { S.imp = { erro: 'Não foi possível abrir o arquivo.' }; renderEditor(); }; r.readAsText(f); return; }
  var s = el.getAttribute('data-s'); if (!s || s === 'busca') return;
  if (el.tagName !== 'SELECT' && el.type !== 'checkbox') return;
  var k = el.getAttribute('data-k'), v = lerValor(el);
  if (s === 'prev') { S.prev = +v; refoca(renderLista); return; }
  if (s === 'ed') {
    setK(S.ed, k, v); S.dirty = true;
    if (k === 'tipo') { var N = S.ed; if (v === 'E') { N.ipi.cst = '49'; N.pis.cst = N.pis.cstSN = N.cofins.cst = N.cofins.cstSN = '98'; } else { N.ipi.cst = '53'; N.pis.cst = N.cofins.cst = '01'; N.pis.cstSN = N.cofins.cstSN = '49'; } }
    if (k === 'fin' && v === '4') S.ed.ref = true;
    refoca(renderEditor);
  }
});
['dragover', 'dragenter'].forEach(function (t) { document.addEventListener(t, function (e) { var d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('sobre'); } }); });
document.addEventListener('dragleave', function (e) { var d = e.target.closest && e.target.closest('#drop'); if (d) d.classList.remove('sobre'); });
document.addEventListener('drop', function (e) {
  var d = e.target.closest && e.target.closest('#drop'); if (!d) return; e.preventDefault(); d.classList.remove('sobre');
  var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (!f) return;
  var r = new FileReader(); r.onload = function () { importar(String(r.result), f.name); }; r.readAsText(f);
});
window.addEventListener('hashchange', rotear);
rotear();
})();
