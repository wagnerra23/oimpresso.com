     toque >=44px, densidade num interruptor. Tudo em :where() → especificidade 0, nenhum
     módulo é repintado (telas ouro Clientes/Inbox intactas, FRESCOR 🔵). -->
<link rel="stylesheet" href="otimiza-ondas.css?v=on1"/>

<!-- ONDA 12 · as ~60 folhas de módulo entram como media="print" (baixam sem bloquear a pintura)
     e viram media="all" no onload. Aqui a folha da rota que o usuário vai ver é promovida NA HORA,
     antes de qualquer pintura — quem volta pro Financeiro não vê módulo cru por um frame. -->
<script>
(function () {
  var r = "chat";
  try {r = localStorage.getItem("oimpresso.route") || "chat"; } catch (e) {}
  var k = r.split("-")[0];
  document.querySelectorAll('link[media="print"][onload]').forEach(function (l) {
    var n = (l.getAttribute("href") || "").split("?")[0];
    if (n.indexOf(k) === 0 || (k.length > 2 && n.indexOf(k) > -1)) l.media = "all";
  });
})();
</script>

<!-- QA: probe de conformância DS (gated ?qa=1 · invisível pro cliente) — camada 2 da matriz anti-regressão -->
<!-- Carga diferida dos módulos: o shell (sidebar + rota inicial) pinta primeiro; os ~130
     arquivos de módulo entram em segundo plano, na mesma ordem, sem mudar 1 arquivo = 1 tela. -->
<script>
window.__oiLazyDone = false;
(function () {
  // Carga própria (não delegada ao Babel.transformScriptTags): baixa em paralelo, compila e
  // executa em ordem, e só então marca a fila como fechada — o sinal de "done" precisa ser exato,
  // senão o boundary desiste antes do módulo chegar.
  function start() {
    var inertes = [].slice.call(document.querySelectorAll('script[type="text/oi-lazy"]'));
    if (!inertes.length) {window.__oiLazyDone = true;return;}
    var fontes = inertes.map(function (s) {return s.getAttribute("data-src");});
    // ONDA 10 · a rota que o usuário está vendo baixa PRIMEIRO. Antes a fila era linear: quem
    // abria Financeiro esperava Oficina, Ponto e Patrimônio no caminho. Partição ESTÁVEL — a
    // família da rota (+ os compartilhados que qualquer módulo pede) vai pra frente mantendo a
    // ordem relativa original, então nenhuma dependência interna se inverte.
    var rota = "chat";
    try {rota = localStorage.getItem("oimpresso.route") || "chat";} catch (e) {}
    var FAMILIAS = {
      chat: /jana|chat/, os: /os-page|fsm-stepper|data-os/, clientes: /cliente/, cli: /cliente/,
      financeiro: /financeiro|fin-/, fin: /financeiro|fin-/, boletos: /boleto/, cobranca: /cobranca/,
      "payment": /^pg-/, sells: /^pg-/, vendas: /venda/, venda: /venda/, orcamentos: /orc-/,
      produtos: /produt/, prod: /produt/, manufacturing: /manufacturing/, mfg: /manufacturing/,
      fila: /producao/, acabamento: /producao/, expedicao: /producao/, compras: /compras/, cmp: /compras/,
      estoque: /estoque/, est: /estoque/, oficina: /oficina/, repair: /repair/, rep: /repair/,
      fiscal: /fiscal/, ponto: /ponto/, hrm: /hrm/, inbox: /inbox/, crm: /crm-/, forja: /forja/,
      relatorios: /relatorios/, assets: /patrimonio/, pat: /patrimonio/, essenciais: /essenciais/,
      cfg: /configuracoes/, configuracoes: /configuracoes/, governance: /governance/, kb: /kb-/,
      site: /cms-/, cms: /cms-/, connector: /connector/, conn: /connector/, superadmin: /superadmin/,
      sa: /superadmin/, modulos: /modulos-/, tarefas: /tasks/, equipe: /equipe/, planilhas: /planilhas/,
      arquivos: /arquivos-/, arq: /arquivos-/, cv: /comunicacao-visual/, voz: /voz-do-cliente/, suporte: /suporte-/, vestuario: /vestuario-/,
      vest: /vestuario-/, "catalogo": /catalogo-qr/
    };
    var alvo = FAMILIAS[rota] || FAMILIAS[rota.split("-")[0]];
    if (alvo) {
      // produto-blade entra no comum: ele publica window.PBUI (Widget/Fld/Sel/Modal/Kebab), que
      // venda-blade e crm-blade consomem. Sem isso, abrir /venda-* ou /crm-* direto joga a família
      // da rota pra frente e o módulo renderiza antes do PBUI existir.
      var COMUM = /^(data|catchup-shared|fsm-stepper|pg-shared|viewers|linked-apps|produto-blade\.jsx)/;
      var frente = [], resto = [];
      fontes.forEach(function (s) {(alvo.test(s) || COMUM.test(s) ? frente : resto).push(s);});
      fontes = frente.concat(resto);
    }
    inertes.forEach(function (s) {s.parentNode.removeChild(s);});
    // ONDA 9 · carga em partes de verdade. Antes: `fontes.map(fetch)` disparava ~150 requisições
    // no primeiro frame — a compilação estava fatiada, o download não, e o shell competia por
    // banda/conexões com módulo que só seria usado 10 minutos depois. Agora a fila baixa numa
    // JANELA deslizante à frente do compilador: a ORDEM de execução é idêntica (dependência
    // entre arquivos preservada), só o download deixa de ser rebanho.
    var JANELA = 8;
    var baixados = new Array(fontes.length);
    function garantir(k) {
      if (k >= fontes.length || baixados[k]) return;
      baixados[k] = fetch(fontes[k]).then(function (r) {return r.text();}).catch(function () {return null;});
    }
    var i = 0;
    for (var p = 0; p < JANELA; p++) garantir(p);
    function proximo() {
      if (i >= baixados.length) {
        window.__oiLazyDone = true;
        document.dispatchEvent(new Event("oi:lazy-done"));
        return;
      }
      var src = fontes[i];
      garantir(i + JANELA);
      baixados[i++].then(function (code) {
        if (code) {
          try {
            var js = window.Babel.transform(code, { presets: ["react"], filename: src }).code;
            // Cada arquivo roda no PRÓPRIO escopo — é o que o Babel faz com script[type=text/babel].
            // Sem isso, 176 nomes de topo repetidos entre módulos colidem no escopo global.
            var el = document.createElement("script");
            el.textContent = "(function(){\n" + js + "\n})();\n//# sourceURL=" + src;
            document.body.appendChild(el);
          } catch (e) {console.error("Falha ao carregar " + src, e);}
        }
        // Devolve a thread a cada 6 módulos: o shell segue respondendo sem pagar
        // um macrotask por arquivo (137 macrotasks custavam mais que a compilação).
        // O dispatch fica isolado: erro de listener (render de rota, por ex.) NÃO pode
        // interromper a fila — antes, um throw aqui congelava os ~80 módulos seguintes.
        if (i % 6 === 0) {
          try {document.dispatchEvent(new Event("oi:lazy-tick"));} catch (e) {console.error("listener do tick falhou", e);}
          setTimeout(proximo, 0);
        } else setTimeout(proximo, 0);
      }).catch(function (e) {
        console.error("Fila do carregador tropeçou em " + src, e);
        setTimeout(proximo, 0);
      });
    }
    proximo();
  }
  var t0 = Date.now();
  (function espera() {
    if (window.Babel && document.querySelector("#app > *") || Date.now() - t0 > 30000) return setTimeout(start, 60);
    setTimeout(espera, 100);
  })();
})();
</script>
