<title>Fila de arte · Enviar nova prova</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  Protótipo gerado (ADR 0438) para a fila de aprovação de arte do Painel da Produção.
  Âncora: `Painel` de prototipo-ui/cowork/Wagner/producao-cv-page.jsx (linhas 129-134), que já desenha
  "Enviar nova prova" (ajuste pedido) e "Reenviar link" (aguardando cliente) por linha da fila.
  Acréscimo deste protótipo: o campo do arquivo da nova prova, que o botão do Cowork não pede e o
  backend exige; e a linha de resultado (saiu pelo WhatsApp / copie o link). Liberado por [W] 2026-10-27.
-->
<style>
  /* Utilitário: um cartão do Painel, a fila como lista com ação à direita de cada linha. */
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --border: #e3e6ec; --text: #1c2230; --text-mute: #5d6678;
    --accent: #5b3fd1; --accent-fg: #ffffff; --warn-bg: #fff4dc; --warn-fg: #8a5a00;
    --danger-bg: #fde8e8; --danger-fg: #a11d1d; --ok-bg: #e5f6ec; --ok-fg: #17653a;
    --font-ui: "Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #12151c; --surface: #1a1e27; --border: #2c3240; --text: #e6e9f0; --text-mute: #9aa3b5;
    --accent: #9b85ff; --accent-fg: #12151c; --warn-bg: #3a2e12; --warn-fg: #f3c568;
    --danger-bg: #3d1a1d; --danger-fg: #f2a3a3; --ok-bg: #12301f; --ok-fg: #8fdcae; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #12151c; --surface: #1a1e27; --border: #2c3240; --text: #e6e9f0; --text-mute: #9aa3b5;
    --accent: #9b85ff; --accent-fg: #12151c; --warn-bg: #3a2e12; --warn-fg: #f3c568;
    --danger-bg: #3d1a1d; --danger-fg: #f2a3a3; --ok-bg: #12301f; --ok-fg: #8fdcae; color-scheme: dark }
  body { background: var(--bg); color: var(--text); font-family: var(--font-ui);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px; }
  .wrap { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .nota { font-size: 13px; color: var(--text-mute); max-width: 68ch; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
  .card h2 { font-size: 15px; margin: 0; }
  .card header { padding: 14px; display: flex; flex-direction: column; gap: 2px; }
  .card header p { margin: 0; font-size: 13px; color: var(--text-mute); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--border); font-size: 13px; }
  li > .txt { flex: 1 1 260px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  small { font-size: 12px; color: var(--text-mute); }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .warn { background: var(--warn-bg); color: var(--warn-fg); }
  .danger { background: var(--danger-bg); color: var(--danger-fg); }
  button { font: inherit; font-size: 13px; min-height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
  button.prim { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  button:disabled { opacity: .55; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ghost { border-color: transparent; background: transparent; color: var(--text-mute); }
  .form { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 8px; align-items: end; padding-left: 2px; }
  .form label { display: flex; flex-direction: column; gap: 4px; flex: 1 1 320px; font-size: 12px; color: var(--text-mute); }
  input { font: inherit; font-size: 13px; min-height: 32px; padding: 0 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); min-width: 0; }
  .res { flex-basis: 100%; font-size: 12px; padding: 8px 10px; border-radius: 6px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .res.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .res.man { background: var(--warn-bg); color: var(--warn-fg); }
  .res code { font-family: var(--font-mono); word-break: break-all; }
</style>

<div class="wrap">
  <p class="nota">Protótipo da fila de arte do Painel da Produção com o botão por linha. Os dados são exemplos. Clique nos botões para ver o resultado de cada caminho.</p>
  <section class="card" aria-labelledby="t">
    <header><h2 id="t">Fila de aprovação de arte</h2><p>O cliente aprova pelo link da prova, sem login.</p></header>
    <ul id="fila"></ul>
  </section>
</div>

<script>
  const fila = [
    { os: 'OS-2619', cliente: 'Padaria Trigo Bom', estado: 'ajuste', nota: 'pediu ajuste em 27/10 08:47 — "aumentar o logo e trocar o telefone"', whatsapp: true },
    { os: 'OS-2614', cliente: 'Clínica Sorriso', estado: 'aguardando', nota: 'link enviado em 26/10 17:30 · vale até 02/11 17:30', whatsapp: true },
    { os: 'OS-2622', cliente: 'Auto Peças Rota', estado: 'aguardando', nota: 'link enviado em 27/10 09:05 · vale até 03/11 09:05', whatsapp: false },
  ];
  const ul = document.getElementById('fila');
  const link = (os) => 'https://oimpresso.com/arte/' + os.toLowerCase().replace('-', '') + 'X7qL2mPz';

  function resultado(li, f) {
    const div = document.createElement('div');
    if (f.whatsapp) {
      div.className = 'res ok';
      div.textContent = 'Link novo enviado ao cliente pelo WhatsApp. O link anterior deixou de valer.';
    } else {
      div.className = 'res man';
      div.innerHTML = 'Cliente sem WhatsApp cadastrado. Mande este link você mesmo: <code></code> <button type="button">Copiar link</button>';
      div.querySelector('code').textContent = link(f.os);
      div.querySelector('button').addEventListener('click', (e) => {
        navigator.clipboard?.writeText(link(f.os)).then(() => { e.target.textContent = 'Copiado'; }).catch(() => {});
      });
    }
    li.appendChild(div);
  }

  fila.forEach((f, i) => {
    const li = document.createElement('li');
    const ajuste = f.estado === 'ajuste';
    li.innerHTML = `<div class="txt"><span><b class="mono">${f.os}</b> · ${f.cliente}</span><small>${f.nota}</small></div>
      <span class="badge ${ajuste ? 'danger' : 'warn'}">${ajuste ? 'Ajuste pedido' : 'Aguardando cliente'}</span>
      <button type="button" class="acao">${ajuste ? 'Enviar nova prova' : 'Reenviar link'}</button>
      <button type="button" class="ghost">Ver no quadro</button>`;
    const btn = li.querySelector('.acao');
    btn.addEventListener('click', () => {
      if (!ajuste) { btn.disabled = true; btn.textContent = 'Reenviado agora'; resultado(li, f); return; }
      if (li.querySelector('.form')) return;
      const form = document.createElement('form');
      form.className = 'form';
      form.innerHTML = `<label for="arq-${i}">Arquivo da nova prova (link)<input id="arq-${i}" type="url" required placeholder="https://drive.exemplo.com/prova-v2.pdf"></label>
        <button type="submit" class="prim">Enviar ao cliente</button><button type="button" class="ghost">Cancelar</button>`;
      form.querySelector('.ghost').addEventListener('click', () => form.remove());
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        form.remove(); btn.disabled = true; btn.textContent = 'Nova prova enviada'; resultado(li, f);
      });
      li.appendChild(form);
      form.querySelector('input').focus();
    });
    ul.appendChild(li);
  });
</script>
