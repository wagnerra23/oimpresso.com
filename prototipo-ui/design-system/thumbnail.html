<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0;padding:0}
  .tile{width:1280px;height:854px;display:flex;overflow:hidden}
  .main{flex:1;background:var(--color-primary);display:flex;align-items:center;justify-content:center;padding:0 90px}
  .name{font-family:var(--font-plex);color:var(--color-primary-foreground);font-weight:700;font-size:150px;line-height:0.95;letter-spacing:-0.03em;text-align:center}
  .strip{width:300px;display:flex;flex-direction:column}
  .strip>div{flex:1}
</style>
</head>
<body>
<div class="tile">
  <div class="main"><div class="name">Office<br>Impresso</div></div>
  <div class="strip">
    <div style="background:var(--color-warning)"></div>
    <div style="background:var(--color-success)"></div>
    <div style="background:var(--color-info)"></div>
    <div style="background:var(--color-destructive)"></div>
  </div>
</div>
</body>
</html>
