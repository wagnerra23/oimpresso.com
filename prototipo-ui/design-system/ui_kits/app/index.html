<!doctype html>
<!-- @dsCard group="UI Kit — App" name="UI Kit — App Shell (Ponto)" subtitle="Sidebar · Page header · KPIs · Presence · Activity · Table" viewport="1280x1100" -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Ponto WR2 — Visão geral · oimpresso</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="app.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Icon.jsx"></script>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="Primitives.jsx"></script>
<script type="text/babel" src="PontoWidgets.jsx"></script>
<script type="text/babel">
function App() {
  return (
    <div className="shell" data-screen-label="App — Ponto Visão geral">
      <Sidebar/>
      <div className="main">
        <div className="breadcrumb">
          <a href="#">Início</a>
          <Icon name="chevron-right" size={12}/>
          <a href="#">Ponto WR2</a>
          <Icon name="chevron-right" size={12}/>
          <span className="current">Visão geral</span>
        </div>
        <div className="content">
          <PageHeader
            icon="calendar-clock"
            title="Visão geral · Ponto"
            description="Acompanhe presença, atrasos e intercorrências em tempo real."
            action={
              <div style={{display:'flex', gap: 8}}>
                <button className="btn btn--outline"><Icon name="search" size={14}/>Buscar colaborador</button>
                <button className="btn btn--primary"><Icon name="plus" size={14}/>Nova intercorrência</button>
              </div>
            }
          />
          <div className="kpi-grid">
            <KpiCard tone="success" icon="users" label="Presentes" value="42" delta={3} deltaLabel="vs ontem" description="de 48 colaboradores"/>
            <KpiCard tone="warning" icon="clock" label="Atrasados" value="3" delta={2} deltaLabel="passou do horário"/>
            <KpiCard tone="danger" icon="inbox" label="Aprovações pendentes" value="12" description="5 com prioridade alta"/>
            <KpiCard tone="info" icon="bar-chart-3" label="Banco horas" value="+12:30" description="média da equipe esta semana"/>
          </div>
          <div className="row-2">
            <PresenceStrip/>
            <ActivityFeed/>
          </div>
          <div className="card">
            <div className="card__head">
              <div>
                <h3>Intercorrências recentes</h3>
                <p className="muted">Últimas 7 solicitações enviadas pelo time.</p>
              </div>
              <a href="#" className="btn btn--outline">Ver todas</a>
            </div>
            <table style={{width:'100%', borderCollapse:'collapse', fontSize: 13}}>
              <thead style={{textAlign:'left', color:'var(--fg-2)', fontSize: 11, textTransform:'uppercase', letterSpacing:'.05em'}}>
                <tr>
                  <th style={{padding:'8px 8px', fontWeight:500}}>Colaborador</th>
                  <th style={{padding:'8px 8px', fontWeight:500}}>Tipo</th>
                  <th style={{padding:'8px 8px', fontWeight:500}}>Quando</th>
                  <th style={{padding:'8px 8px', fontWeight:500}}>Prioridade</th>
                  <th style={{padding:'8px 8px', fontWeight:500}}>Status</th>
                </tr>
              </thead>
              <tbody>
                {[
                  ['Ana Carolina','Esquecimento de saída','15/04 17:30','alta','pendente'],
                  ['Bruno Lima','Ajuste de intervalo','14/04 12:15','normal','aprovada'],
                  ['Carla Mendes','Falta justificada','14/04 —','urgente','pendente'],
                  ['Diego Souza','Hora extra autorizada','13/04 19:00','normal','aplicada'],
                  ['Eliane Reis','Esquecimento entrada','13/04 06:00','baixa','aprovada'],
                  ['Felipe Tavares','Atestado médico','12/04 —','alta','aprovada'],
                  ['Gabriela Nunes','Compensação','11/04 —','normal','rejeitada'],
                ].map((r, i) => (
                  <tr key={i} style={{borderTop:'1px solid var(--border)'}}>
                    <td style={{padding:'10px 8px', fontWeight: 500}}>{r[0]}</td>
                    <td style={{padding:'10px 8px', color:'var(--fg-2)'}}>{r[1]}</td>
                    <td style={{padding:'10px 8px', color:'var(--fg-2)', fontFamily:'var(--font-mono)', fontSize: 12}}>{r[2]}</td>
                    <td style={{padding:'10px 8px'}}><StatusBadge kind="prioridade" value={r[3]}/></td>
                    <td style={{padding:'10px 8px'}}><StatusBadge kind="intercorrencia" value={r[4]}/></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
