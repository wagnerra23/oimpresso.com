<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Clientes — CRM (nível Norte)" description="Índice de Clientes premium dark: sidebar agrupada com contadores, faixa de KPI-filtros, busca /+⌘K, frescor, tags e ações por linha. Fusão do Norte com o sistema (componentes compilados + glyph print-craft)." -->
<helmet>
<script src="./ds-base.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  .nav-i:hover { background: color-mix(in oklch, var(--text) 7%, transparent) !important; }
  .nav-i { transition: background .12s; }
  .grp { display:flex; align-items:center; gap:8px; padding:14px 9px 6px; font:600 9.5px/1 var(--font-sans); letter-spacing:.08em; text-transform:uppercase; color:var(--text-mute); }
  .grp .n { margin-left:auto; font:600 10px/1 var(--font-mono); color:var(--text-mute); opacity:.8; }
  .rowbtn:hover { color:var(--text) !important; background:color-mix(in oklch, var(--text) 8%, transparent) !important; }
</style>
</helmet>
<div class="cockpit" ref="{{ cockpitRef }}" style="display:flex; min-height:100vh; background:radial-gradient(1100px 620px at 84% -10%, oklch(0.30 0.07 295 / .20), transparent 60%), radial-gradient(900px 520px at 6% 110%, oklch(0.26 0.05 250 / .16), transparent 62%), var(--bg); color:var(--text); font-family:var(--font-sans); font-size:13px; line-height:1.4; -webkit-font-smoothing:antialiased;">

  <!-- ░░ SIDEBAR ░░ -->
  <x-import component-from-global-scope="OfficeImpressoPontoWR2DesignSystem_019dd0.AppSidebar" active="clientes" hint-size="222px,100%"></x-import>

  <!-- ░░ MAIN ░░ -->
  <main style="flex:1; min-width:0; display:flex; flex-direction:column;">

    <x-import component-from-global-scope="OfficeImpressoPontoWR2DesignSystem_019dd0.PageHeader" title="Clientes" subtitle="{{ subtitleNode }}" actions="{{ headerActions }}" hint-size="100%,72px"></x-import>
    <x-import component-from-global-scope="OfficeImpressoPontoWR2DesignSystem_019dd0.TabBar" inset="26px" tabs="{{ tabs }}" active="{{ activeTab }}" onChange="{{ setTab }}" hint-size="100%,44px"></x-import>

    <div class="nxc" style="flex:1; overflow:auto; padding:16px 26px 24px;">

      <!-- KPI-filtros -->
      <div style="display:grid; grid-template-columns:repeat(6, 1fr); gap:9px;">
        <x-import component-from-global-scope="OfficeImpressoPontoWR2DesignSystem_019dd0.KpiFilterCard" label="Clientes ativos" value="13" sub="com OS aberta" tone="primary" icon="{{ icAtivos }}" selected="{{ kAtivos }}" onClick="{{ kClickAtivos }}" hint-size="100%,62px"></x-import>
        <x-import component-from-global-scope="OfficeImpressoPontoWR2DesignSystem_019dd0.KpiFilterCard" label="VIPs" value="5" sub="prioridade total" tone="amber" icon="{{ icVip }}" selected="{{ kVip }}" onClick="{{ kClickVip }}" hint-size="100%,62px"></x-import>
        <x-import component-from-global-scope="OfficeImpressoPontoWR2DesignSystem_019dd0.KpiFilterCard" label="Com saldo" value="3" sub="R$ 387,20 inadimpl." tone="rose" icon="{{ icSaldo }}" selected="{{ kSaldo }}" onClick="{{ kClickSaldo }}" hint-size="100%,62px"></x-import>
        <x-import component-from-global-scope="OfficeImpressoPontoWR2DesignSystem_019dd0.KpiFilterCard" label="Sem compra 90d" value="2" sub="risco churn" tone="violet" icon="{{ icChurn }}" selected="{{ kChurn }}" onClick="{{ kClickChurn }}" hint-size="100%,62px"></x-import>
        <x-import component-from-global-scope="OfficeImpressoPontoWR2DesignSystem_019dd0.KpiFilterCard" label="Novos este mês" value="2" sub="desde dia 1" tone="emerald" icon="{{ icNovos }}" selected="{{ kNovos }}" onClick="{{ kClickNovos }}" hint-size="100%,62px"></x-import>
        <x-import component-from-global-scope="OfficeImpressoPontoWR2DesignSystem_019dd0.KpiFilterCard" label="Faturamento" value="R$ 23,2k" sub="hoje · +12% vs ontem" tone="primary" icon="{{ icFat }}" selected="{{ kFat }}" onClick="{{ kClickFat }}" hint-size="100%,62px"></x-import>
      </div>

      <!-- busca -->
      <div style="margin-top:16px; display:flex; align-items:center; gap:8px;">
        <label style="flex:1; display:flex; align-items:center; gap:9px; height:38px; padding:0 13px; background:var(--surface); border:1px solid var(--border); border-radius:10px; color:var(--text-mute);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
          <input placeholder="Buscar nome, CNPJ/CPF, contato, telefone, cidade…" style="flex:1; border:0; outline:0; background:transparent; font:inherit; font-size:13px; color:var(--text);">
          <span style="display:flex; align-items:center; gap:8px; font-size:11px; color:var(--text-mute);"><span><kbd style="font:600 10px/1 var(--font-mono); background:var(--bg-2); border:1px solid var(--border); border-radius:4px; padding:2px 5px;">/</kbd> pra focar</span><span style="opacity:.4;">·</span><span><kbd style="font:600 10px/1 var(--font-mono); background:var(--bg-2); border:1px solid var(--border); border-radius:4px; padding:2px 5px;">⌘K</kbd> global</span></span>
        </label>
      </div>

      <!-- filtros + grade -->
      <div style="margin-top:12px; border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--surface); box-shadow:0 1px 2px rgba(0,0,0,.18);">
        <x-import component-from-global-scope="OfficeImpressoPontoWR2DesignSystem_019dd0.Toolbar" dense="{{ yes }}" tone="muted" left="{{ tbLeft }}" right="{{ tbRight }}" hint-size="100%,44px"></x-import>
        <x-import component-from-global-scope="OfficeImpressoPontoWR2DesignSystem_019dd0.DataGrid" columns="{{ columns }}" rows="{{ rows }}" onRowClick="{{ onRowClick }}" selectable="{{ yes }}" pageSize="{{ pageSize }}" maxHeight="{{ tableH }}" totalLabel="clientes" hint-size="100%,440px"></x-import>
      </div>
    </div>
  </main>

  <!-- Drawer de cliente (PT-02) -->
  <x-import component-from-global-scope="OfficeImpressoPontoWR2DesignSystem_019dd0.Drawer" open="{{ drawerOpen }}" onClose="{{ closeDrawer }}" title="{{ drawerNome }}" subtitle="{{ drawerDoc }}" badge="{{ drawerBadge }}" footer="{{ drawerFooter }}" width="{{ drawerWidth }}" hint-size="420px,100%">
    <x-import component-from-global-scope="OfficeImpressoPontoWR2DesignSystem_019dd0.DrawerSection" title="Contato" hint-size="100%,auto">
      <div style="display:flex; flex-direction:column; gap:7px;">
        <div style="display:flex; justify-content:space-between; align-items:center;"><span style="color:var(--text-dim);">Telefone</span><span style="font-family:var(--font-mono); font-size:12.5px;">{{ drawerFone }}</span></div>
        <div style="display:flex; justify-content:space-between; align-items:center;"><span style="color:var(--text-dim);">Cidade</span><span>{{ drawerCidade }}</span></div>
      </div>
    </x-import>
    <x-import component-from-global-scope="OfficeImpressoPontoWR2DesignSystem_019dd0.DrawerSection" title="Financeiro" hint-size="100%,auto">
      <div style="display:flex; flex-direction:column; gap:7px;">
        <div style="display:flex; justify-content:space-between; align-items:baseline;"><span style="color:var(--text-dim);">Saldo em aberto</span>{{ drawerSaldoNode }}</div>
        <div style="display:flex; justify-content:space-between; align-items:center;"><span style="color:var(--text-dim);">OS abertas</span><span style="font-family:var(--font-mono);">{{ drawerOs }}</span></div>
        <div style="display:flex; justify-content:space-between; align-items:center;"><span style="color:var(--text-dim);">Última OS</span><span style="font-family:var(--font-mono); color:var(--accent);">{{ drawerUlt }}</span></div>
      </div>
    </x-import>
  </x-import>

  <x-import component-from-global-scope="OfficeImpressoPontoWR2DesignSystem_019dd0.Command" open="{{ cmdOpen }}" onClose="{{ closeCmd }}" groups="{{ cmdGroups }}" hint-size="0,0"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: &quot;100%&quot;, &quot;height&quot;: 820}, &quot;theme&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;dark&quot;, &quot;light&quot;], &quot;default&quot;: &quot;dark&quot;, &quot;tsType&quot;: &quot;'dark' | 'light'&quot;}, &quot;accentHue&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 295, &quot;min&quot;: 0, &quot;max&quot;: 360, &quot;step&quot;: 5, &quot;tsType&quot;: &quot;number&quot;}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { activeTab: 'clientes', kpi: null, drawerId: null, cmdOpen: false, q: '', frescor: 'todos' };
    this._poll = null;
  }
  componentDidMount() {
    if (!window.OfficeImpressoPontoWR2DesignSystem_019dd0) {
      this._poll = setInterval(() => {
        if (window.OfficeImpressoPontoWR2DesignSystem_019dd0) { clearInterval(this._poll); this._poll = null; this.forceUpdate(); }
      }, 60);
    }
    this.applyTheme();
  }
  componentDidUpdate() { this.applyTheme(); }
  componentWillUnmount() { if (this._poll) clearInterval(this._poll); if (this._kd) document.removeEventListener('keydown', this._kd); }

  applyTheme() {
    const el = this._cockpit; if (!el) return;
    const dark = (this.props.theme || 'dark') !== 'light';
    if (dark) { el.setAttribute('data-theme', 'dark'); el.classList.add('dark'); }
    else { el.removeAttribute('data-theme'); el.classList.remove('dark'); }
    const hue = this.props.accentHue != null ? this.props.accentHue : 295;
    el.style.setProperty('--accent', 'oklch(' + (dark ? '0.72' : '0.55') + ' 0.15 ' + hue + ')');
    el.style.setProperty('--accent-2', 'oklch(' + (dark ? '0.78' : '0.62') + ' 0.15 ' + hue + ')');
    el.style.setProperty('--accent-soft', 'oklch(' + (dark ? '0.32 0.07' : '0.95 0.04') + ' ' + hue + ')');
    el.style.setProperty('--color-primary', 'oklch(' + (dark ? '0.72' : '0.55') + ' 0.15 ' + hue + ')');
  }

  setTab = (k) => this.setState({ activeTab: k });
  toggleKpi = (k) => this.setState(s => ({ kpi: s.kpi === k ? null : k }));
  onRowClick = (row) => this.setState({ drawerId: row.id });
  closeDrawer = () => this.setState({ drawerId: null });
  closeCmd = () => this.setState({ cmdOpen: false });

  data() {
    return [
      { id: '1', nome: 'Acme Comércio Ltda', fone: '+55 11 98712-3344', tipo: 'pj', doc: '12.345.678/0001-90', cid: 'São Paulo', uf: 'SP', fre: 'recente', rel: 'há 1sem', saldo: 'R$ 145,20', neg: true, os: '2', tags: ['Boleto'], ult: '#4821' },
      { id: '2', nome: 'TechPro Equipamentos', fone: '+55 11 99812-4400', tipo: 'pj', doc: '23.456.789/0001-01', cid: 'São Paulo', uf: 'SP', fre: 'recente', rel: 'há 1sem', saldo: 'R$ 162,80', neg: true, os: '1', tags: [], ult: '#4820' },
      { id: '3', nome: 'Padaria Estrela', fone: '+55 11 98712-3344', tipo: 'pj', doc: '34.567.890/0001-12', cid: 'São Paulo', uf: 'SP', fre: 'recente', rel: 'há 2sem', saldo: '—', neg: false, os: '2', tags: ['VIP'], ult: '#4819' },
      { id: '4', nome: 'Posto BR Centro', fone: '+55 11 97654-2200', tipo: 'pj', doc: '45.678.901/0001-23', cid: 'Osasco', uf: 'SP', fre: 'fresc', rel: 'há 4sem', saldo: '—', neg: false, os: '1', tags: [], ult: '#4818' },
      { id: '5', nome: 'Clínica Vida', fone: '+55 11 95544-1010', tipo: 'pj', doc: '56.789.012/0001-34', cid: 'São Paulo', uf: 'SP', fre: 'recente', rel: 'há 2sem', saldo: '—', neg: false, os: '2', tags: ['VIP'], ult: '#4817' },
      { id: '6', nome: 'Mercado União', fone: '+55 11 99812-7700', tipo: 'pj', doc: '67.890.123/0001-45', cid: 'Guarulhos', uf: 'SP', fre: 'recente', rel: 'há 2sem', saldo: '—', neg: false, os: '2', tags: ['VIP'], ult: '#4816' },
      { id: '7', nome: 'Escola Aurora', fone: '+55 11 91234-5566', tipo: 'pj', doc: '78.901.234/0001-56', cid: 'São Paulo', uf: 'SP', fre: 'frio', rel: 'há 7m', saldo: '—', neg: false, os: '1', tags: [], ult: '#4815' },
      { id: '8', nome: 'Auto Posto Vale', fone: '+55 11 92345-6677', tipo: 'pj', doc: '89.012.345/0001-67', cid: 'São Bernardo', uf: 'SP', fre: 'distante', rel: 'há 2m', saldo: '—', neg: false, os: '1', tags: ['Boleto'], ult: '#4814' },
      { id: '9', nome: 'Restaurante Tomate', fone: '+55 11 93456-7788', tipo: 'pf', doc: '901.234.567-78', cid: 'São Paulo', uf: 'SP', fre: 'fresc', rel: 'há 3sem', saldo: '—', neg: false, os: '1', tags: ['Premium'], ult: '#4812' },
      { id: '10', nome: 'Pet Shop Amigo', fone: '+55 11 91234-5678', tipo: 'pj', doc: '01.234.567/0001-89', cid: 'Diadema', uf: 'SP', fre: 'recente', rel: 'há 2sem', saldo: '—', neg: false, os: '1', tags: ['VIP'], ult: '#4810' },
    ];
  }

  icon(name) {
    const h = React.createElement;
    const svg = (kids, fill) => h('svg', { width: 17, height: 17, viewBox: '0 0 24 24', fill: fill || 'none', stroke: fill ? 'none' : 'currentColor', strokeWidth: 1.7, strokeLinecap: 'round', strokeLinejoin: 'round' }, kids);
    if (name === 'ativos') return svg([h('circle', { key: 'a', cx: 12, cy: 8, r: 4 }), h('path', { key: 'b', d: 'M5 20a7 7 0 0 1 14 0' })]);
    if (name === 'vip') return svg(h('path', { d: 'M12 3l7 9-7 9-7-9z' }), 'currentColor');
    if (name === 'saldo') return svg([h('rect', { key: 'a', x: 4, y: 10, width: 3.5, height: 10, rx: 1 }), h('rect', { key: 'b', x: 10.25, y: 5, width: 3.5, height: 15, rx: 1 }), h('rect', { key: 'c', x: 16.5, y: 13, width: 3.5, height: 7, rx: 1 })], 'currentColor');
    if (name === 'churn') return svg([h('circle', { key: 'a', cx: 12, cy: 12, r: 8 }), h('path', { key: 'b', d: 'M12 8v4l3 2' })]);
    if (name === 'novos') return svg(h('path', { d: 'M12 5v14M5 12h14' }));
    return svg(h('path', { d: 'M5 19L19 5M19 5h-9M19 5v9' }));
  }

  renderVals() {
    const NS = window.OfficeImpressoPontoWR2DesignSystem_019dd0;
    const cockpitRef = (el) => { this._cockpit = el; if (el) this.applyTheme(); };
    if (!this._kd) { this._kd = (e) => { if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); this.setState(s => ({ cmdOpen: !s.cmdOpen })); } }; document.addEventListener('keydown', this._kd); }
    const k = this.state.kpi;
    const base = {
      cockpitRef,
      activeTab: this.state.activeTab, setTab: this.setTab,
      onRowClick: this.onRowClick, closeDrawer: this.closeDrawer, drawerOpen: false, drawerWidth: 410, tableH: 460,
      cmdOpen: this.state.cmdOpen, closeCmd: this.closeCmd,
      cmdGroups: [
        { label: 'Navegar', items: [
          { id: 'g1', label: 'Clientes', hint: 'CRM' }, { id: 'g2', label: 'Ordens de serviço', hint: 'Produção' },
          { id: 'g3', label: 'Financeiro', hint: 'Títulos' }, { id: 'g4', label: 'Oficina Auto', hint: 'Serviço' }, { id: 'g5', label: 'Atendimento', hint: 'Inbox' },
        ] },
        { label: 'Ações', items: [
          { id: 'a1', label: 'Novo cliente', kbd: '⌘N' }, { id: 'a2', label: 'Importar clientes' }, { id: 'a3', label: 'Exportar relatório' },
        ] },
      ],
      tabs: [
        { key: 'todos', label: 'Todos', count: 32 },
        { key: 'clientes', label: 'Clientes', count: 15 },
        { key: 'fornecedores', label: 'Fornecedores', count: 7 },
        { key: 'funcionarios', label: 'Funcionários', count: 7 },
        { key: 'representantes', label: 'Representantes', count: 3 },
      ],
      kAtivos: k === 'ativos', kVip: k === 'vip', kSaldo: k === 'saldo', kChurn: k === 'churn', kNovos: k === 'novos', kFat: k === 'fat',
      kClickAtivos: () => this.toggleKpi('ativos'), kClickVip: () => this.toggleKpi('vip'),
      kClickSaldo: () => this.toggleKpi('saldo'), kClickChurn: () => this.toggleKpi('churn'),
      kClickNovos: () => this.toggleKpi('novos'), kClickFat: () => this.toggleKpi('fat'),
      icAtivos: this.icon('ativos'), icVip: this.icon('vip'), icSaldo: this.icon('saldo'),
      icChurn: this.icon('churn'), icNovos: this.icon('novos'), icFat: this.icon('fat'),
    };
    if (!NS) return base;
    const h = React.createElement;

    base.subtitleNode = h('span', null, h('strong', { style: { color: 'var(--text)', fontWeight: 600 } }, '15'), ' cadastrados');
    base.headerActions = h(React.Fragment, null,
      h(NS.Button, { variant: 'ghost', size: 'sm' }, 'Importar'),
      h(NS.Button, { variant: 'primary', size: 'sm' }, 'Novo cliente'),
    );

    const columns = [
      { key: 'cli', label: 'Cliente' },
      { key: 'tipo', label: 'Tipo', width: '50px' },
      { key: 'doc', label: 'Documento', width: '128px' },
      { key: 'cid', label: 'Cidade/UF', width: '94px' },
      { key: 'fre', label: 'Frescor', width: '138px' },
      { key: 'saldo', label: 'Saldo', align: 'right', width: '88px' },
      { key: 'os', label: 'OS', align: 'right', width: '40px', mono: true },
      { key: 'tags', label: 'Tags', width: '92px' },
      { key: 'ult', label: 'Última OS', align: 'right', width: '82px' },
      { key: 'act', label: '', width: '58px' },
    ];

    const iconBtn = (glyph) => h('button', {
      className: 'rowbtn',
      onClick: (e) => e.stopPropagation(),
      style: { display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: 24, height: 24, border: 0, borderRadius: 6, background: 'transparent', color: 'var(--text-mute)', cursor: 'pointer', fontSize: 14, lineHeight: 1 },
    }, glyph);

    const rows = this.data().map(r => ({
      id: r.id,
      cells: {
        cli: h('div', { style: { display: 'flex', alignItems: 'center', gap: 10 } },
          h(NS.Avatar, { name: r.nome, size: 'sm' }),
          h('div', { style: { minWidth: 0, overflow: 'hidden' } },
            h('div', { style: { fontWeight: 600, fontSize: 13, letterSpacing: '-0.005em', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' } }, r.nome),
            h('div', { style: { fontSize: 11, color: 'var(--text-mute)', fontFamily: 'var(--font-mono)', marginTop: 1, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' } }, r.fone))),
        tipo: h(NS.StatusBadge, { kind: 'tipo', value: r.tipo }),
        doc: h('span', { style: { fontFamily: 'var(--font-mono)', fontSize: 11.5, color: 'var(--text-dim)' } }, r.doc),
        cid: { primary: r.cid, sub: r.uf },
        fre: h(NS.StatusBadge, { kind: 'frescor', value: r.fre, rel: r.rel }),
        saldo: h('span', { style: { fontFamily: 'var(--font-mono)', fontSize: 12.5, fontWeight: r.neg ? 600 : 400, color: r.neg ? 'var(--neg)' : 'var(--text-mute)' } }, r.saldo),
        os: r.os,
        tags: h('div', { style: { display: 'flex', gap: 4, flexWrap: 'wrap' } }, r.tags.map((t, i) => h(NS.TagChip, { key: i, label: t }))),
        ult: h('span', { style: { fontFamily: 'var(--font-mono)', fontSize: 12, color: 'var(--accent)' } }, r.ult),
        act: h('div', { style: { display: 'flex', gap: 2, justifyContent: 'flex-end', alignItems: 'center' } }, iconBtn('☆'),
          h(NS.Kebab, { size: 'sm', items: [
            { id: 'abrir', label: 'Abrir cadastro', kbd: '↵' },
            { id: 'os', label: 'Nova OS' },
            { id: 'cob', label: 'Enviar cobrança' },
            { separator: true },
            { id: 'arq', label: 'Arquivar', tone: 'danger' },
          ] })),
      },
    }));

    const sel = this.state.drawerId ? this.data().find(r => r.id === this.state.drawerId) : null;
    const drawer = sel ? {
      drawerOpen: true,
      drawerNome: sel.nome, drawerDoc: sel.doc, drawerFone: sel.fone,
      drawerCidade: sel.cid + ' · ' + sel.uf, drawerOs: sel.os, drawerUlt: sel.ult,
      drawerSaldoNode: h('span', { style: { font: '600 16px/1 var(--font-mono)', letterSpacing: '-0.01em', color: sel.neg ? 'var(--neg)' : 'var(--text)' } }, sel.saldo),
      drawerBadge: h(NS.StatusBadge, { kind: 'frescor', value: sel.fre, rel: sel.rel }),
      drawerFooter: h(React.Fragment, null,
        h(NS.Button, { variant: 'ghost', size: 'sm', onClick: this.closeDrawer }, 'Fechar'),
        h(NS.Button, { variant: 'primary', size: 'sm' }, 'Abrir cadastro')),
    } : { drawerOpen: false, drawerFone: '', drawerCidade: '', drawerSaldoNode: '', drawerOs: '', drawerUlt: '' };
    const filtro = (label) => h(NS.ToolbarButton, { key: label, icon: h('span', { style: { fontSize: 10, opacity: .6 } }, '⌄') }, label);
    const tbLeft = h(React.Fragment, null,
      h(NS.ToolbarSearch, { value: this.state.q || '', onChange: (v) => this.setState({ q: v }), placeholder: 'Buscar nome, CNPJ/CPF, cidade…', width: 280, kbd: '/' }),
      h(NS.ToolbarDivider),
      ['Status', 'Tipo', 'UF', 'Tags', 'Saldo'].map(filtro),
    );
    const tbRight = h(React.Fragment, null,
      h(NS.Segmented, { size: 'sm', value: this.state.frescor || 'todos', onChange: (v) => this.setState({ frescor: v }),
        options: [{ value: 'todos', label: 'Todos' }, { value: 'quentes', label: 'Recentes' }, { value: 'frios', label: 'Frios' }] }),
      h(NS.ToolbarDivider),
      h(NS.Kebab, { items: [
        { id: 'exp', label: 'Exportar CSV', kbd: '⌘E' },
        { id: 'col', label: 'Colunas…' },
        { separator: true },
        { id: 'seg', label: 'Salvar segmento' },
      ] }),
    );
    return Object.assign(base, { columns, rows, tbLeft, tbRight, yes: true, pageSize: 10 }, drawer);
  }
}
</script>
</body>
</html>
