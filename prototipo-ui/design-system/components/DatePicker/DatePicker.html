<!doctype html>
<!-- @dsCard group="Components" name="DatePicker" subtitle="Campo de data + calendário PT-BR (dd/mm/aaaa)" viewport="380x460" -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>DatePicker</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style> body { margin: 0; } </style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div class="cockpit dark" data-theme="dark" style="height:460px; background:var(--bg); padding:24px;">
  <div id="root" style="max-width:280px;"></div>
</div>
<script type="text/javascript">
  const { DatePicker } = window.OfficeImpressoPontoWR2DesignSystem_019dd0;
  const h = React.createElement;
  function Demo() {
    const [d, setD] = React.useState(new Date(2026, 5, 18));
    return h(DatePicker, { value: d, onChange: setD, label: 'Vencimento' });
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
  setTimeout(() => { const b = document.querySelector('#root button'); if (b) b.click(); }, 100);
</script>
</body>
</html>
