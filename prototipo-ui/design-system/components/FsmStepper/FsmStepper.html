<!doctype html>
<!-- @dsCard group="Components" name="FsmStepper" subtitle="Pipeline indicator — inline dots & full numbered" viewport="720x260" -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>FsmStepper</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body { padding: 18px; }
  .row { display:flex; gap: 14px; align-items: center; margin-bottom: 14px; }
  .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-2); width: 90px; }
  .full { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); margin-top: 6px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/javascript">
  const { FsmStepper } = window.OfficeImpressoPontoWR2DesignSystem_019dd0;
  const h = React.createElement;
  const phases = (cur) => ['orçam','aprov','produ','acab','exped','entreg'].map((label, i) => ({
    label, state: i < cur ? 'done' : i === cur ? 'current' : 'todo'
  }));
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(React.Fragment, null,
      h('div', { className: 'row' }, h('span', { className: 'lbl' }, 'Inline · OS'),
        h(FsmStepper, { variant: 'inline', steps: phases(1) })),
      h('div', { className: 'row' }, h('span', { className: 'lbl' }, 'Inline · roxo'),
        h(FsmStepper, { variant: 'inline', hue: 295, steps: phases(3) })),
      h('div', { className: 'row' }, h('span', { className: 'lbl' }, 'Inline · final'),
        h(FsmStepper, { variant: 'inline', steps: phases(4) })),
      h('div', { className: 'lbl', style: { marginTop: 8 } }, 'Full (drawer/detail)'),
      h('div', { className: 'full' }, h(FsmStepper, { variant: 'full', hue: 295, steps: phases(3) })),
    )
  );
</script>
</body>
</html>
