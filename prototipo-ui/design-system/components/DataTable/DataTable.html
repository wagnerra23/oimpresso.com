<!doctype html>
<!-- @dsCard group="Components" name="DataTable" subtitle="Dense table — composes Avatar + FsmStepper, row states" viewport="820x300" -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>DataTable</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body { padding: 18px; }
  .wrap { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/javascript">
  const { DataTable, Avatar, FsmStepper } = window.OfficeImpressoPontoWR2DesignSystem_019dd0;
  const h = React.createElement;
  const phases = (cur, lbl) => ['orçam','aprov','produ','acab','exped','entreg'].map((label, i) => ({
    label, state: i < cur ? 'done' : i === cur ? 'current' : 'todo'
  }));
  const columns = [
    { key: 'os', label: 'OS', mono: true, width: '80px' },
    { key: 'cli', label: 'Cliente' },
    { key: 'pipe', label: 'Pipeline' },
    { key: 'resp', label: 'Resp.', width: '60px' },
    { key: 'valor', label: 'Valor', align: 'right', mono: true },
  ];
  const rows = [
    { id: 1, state: 'urgent', cells: {
      os: '#4821', cli: { primary: 'Acme Comércio Ltda', sub: 'Banner Lona 3×2m' },
      pipe: h(FsmStepper, { variant: 'inline', steps: phases(1) }),
      resp: h(Avatar, { name: 'João Lima' }), valor: 'R$ 1.240' } },
    { id: 2, cells: {
      os: '#4820', cli: { primary: 'TechPro', sub: 'Adesivos 8×8cm — 200un' },
      pipe: h(FsmStepper, { variant: 'inline', steps: phases(3) }),
      resp: h(Avatar, { name: 'Fernanda Alves' }), valor: 'R$ 680' } },
    { id: 3, state: 'selected', cells: {
      os: '#4819', cli: { primary: 'Padaria Estrela', sub: 'Cardápios A4 — 50un' },
      pipe: h(FsmStepper, { variant: 'inline', steps: phases(4) }),
      resp: h(Avatar, { name: 'Marina Prado' }), valor: 'R$ 320' } },
    { id: 4, state: 'archived', cells: {
      os: '#4815', cli: { primary: 'Escola Aurora', sub: 'Faixa 4×1m' },
      pipe: h(FsmStepper, { variant: 'inline', steps: phases(6) }),
      resp: h(Avatar, { name: 'Carlos Souza' }), valor: 'R$ 540' } },
  ];
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'wrap' }, h(DataTable, { columns, rows, onRowClick: () => {} }))
  );
</script>
</body>
</html>
