<!doctype html>
<!-- @dsCard group="Components" name="Chart" subtitle="Data-viz compacto — área / linha / barra + tooltip" viewport="420x440" -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Chart</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style> body { margin: 0; } </style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div class="cockpit dark" data-theme="dark" style="padding:20px; background:var(--bg); display:flex; flex-direction:column; gap:14px;">
  <div style="background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px;"><div style="font:600 9.5px/1 var(--font-sans); letter-spacing:.08em; text-transform:uppercase; color:var(--text-mute); margin-bottom:10px;">Área</div><div id="a"></div></div>
  <div style="background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px;"><div style="font:600 9.5px/1 var(--font-sans); letter-spacing:.08em; text-transform:uppercase; color:var(--text-mute); margin-bottom:10px;">Barra</div><div id="b"></div></div>
</div>
<script type="text/javascript">
  document.querySelector('.cockpit').classList.add('dark');
  const { Chart } = window.OfficeImpressoPontoWR2DesignSystem_019dd0;
  const h = React.createElement;
  const series = [86, 102, 94, 118, 110, 132, 124, 143].map((v, i) => ({ label: 's' + (i + 1), value: v }));
  const fmt = (v) => 'R$ ' + v + 'k';
  ReactDOM.createRoot(document.getElementById('a')).render(h(Chart, { type: 'area', data: series, height: 120, formatValue: fmt }));
  ReactDOM.createRoot(document.getElementById('b')).render(h(Chart, { type: 'bar', data: series, height: 120, highlightLast: true, formatValue: fmt }));
</script>
</body>
</html>
