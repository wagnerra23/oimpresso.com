<!doctype html>
<!-- @dsCard group="Components" name="Drawer" subtitle="Right-side detail panel (PT-02) — header, sections, footer" viewport="760x460" -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Drawer</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style> body { padding: 18px; min-height: 420px; } </style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/javascript">
  const NS = window.OfficeImpressoPontoWR2DesignSystem_019dd0;
  const { Drawer, DrawerSection, Button, StatusBadge, Avatar, Input } = NS;
  const h = React.createElement;
  function App() {
    const [open, setOpen] = React.useState(true);
    return h(React.Fragment, null,
      h(Button, { variant: 'primary', onClick: () => setOpen(true) }, 'Abrir detalhe'),
      h(Drawer, {
        open, onClose: () => setOpen(false), width: 440,
        title: 'Acme Comércio Ltda',
        subtitle: 'PJ · 12.345.678/0001-90 · São Paulo/SP',
        badge: h(StatusBadge, { kind: 'frescor', value: 'recente', rel: 'há 1sem' }),
        footer: h(React.Fragment, null,
          h(Button, { variant: 'ghost', onClick: () => setOpen(false) }, 'Fechar'),
          h(Button, { variant: 'primary' }, 'Editar')),
      },
        h(DrawerSection, { title: 'Contato' },
          h('div', { style: { display: 'flex', alignItems: 'center', gap: 10 } },
            h(Avatar, { name: 'Camila Diniz', size: 'md' }),
            h('div', null, h('div', { style: { fontWeight: 600 } }, 'Camila Diniz'),
              h('div', { style: { color: 'var(--text-dim)', fontSize: 12 } }, '+55 11 98712-3344 · camila@acme.com')))),
        h(DrawerSection, { title: 'Comercial' },
          h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 } },
            h(Input, { label: 'Limite de crédito', defaultValue: 'R$ 20.000' }),
            h(Input, { label: 'Tabela', defaultValue: 'Comunicação visual' }))),
        h(DrawerSection, { title: 'Tags' },
          h('div', { style: { display: 'flex', gap: 6 } },
            h(NS.TagChip, { label: 'corporativo' }), h(NS.TagChip, { label: 'vip' }))),
      )
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
