<!doctype html>
<!-- @dsCard group="Components" name="PeriodBar" subtitle="Presets Dia/Semana/Mês + De/Até — usar em consultas que filtram por data" viewport="620x300" -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>PeriodBar</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style> body { margin: 0; } </style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div class="cockpit dark" data-theme="dark" style="min-height:300px; background:var(--bg); padding:28px;">
  <div id="root" style="max-width:560px;"></div>
</div>
<script type="text/javascript">
  const { PeriodBar } = window.OfficeImpressoPontoWR2DesignSystem_019dd0;
  const h = React.createElement;
  const fmt = (d) => d ? String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear() : '—';
  function Demo() {
    const [p, setP] = React.useState(() => {
      const t = new Date(); t.setHours(0,0,0,0);
      const from = new Date(t.getTime() - 6*86400000);
      return { from, to: t, preset: 'semana' };
    });
    return h(PeriodBar, { value: p, onChange: setP });
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
