<!doctype html>
<!-- @dsCard group="Components" name="StatusBadge" subtitle="Pill por domínio — documento, fiscal, OS, pagamento, SLA" viewport="720x400" -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>StatusBadge</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body { padding: 18px; }
  @keyframes sb-pulse { 50% { opacity: .55; } }
  .row { display:flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-2); width: 110px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/javascript">
  const { StatusBadge } = window.OfficeImpressoPontoWR2DesignSystem_019dd0;
  const h = React.createElement;
  function Row(label, kind, values) {
    return h('div', { className: 'row' },
      h('span', { className: 'lbl' }, label),
      ...values.map((v) => h(StatusBadge, { key: v, kind, value: v })));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(React.Fragment, null,
      Row('Documento', 'documento', ['rascunho','pendente','aprovado','rejeitado','aplicado','cancelado']),
      Row('Fiscal (NF-e)', 'fiscal', ['rascunho','emitida','autorizada','cancelada','denegada']),
      Row('Ordem de serviço', 'os', ['aberta','orcamento','aprovada','em_servico','em_producao','concluida','entregue','atrasada']),
      Row('Prioridade', 'prioridade', ['baixa','normal','alta','urgente']),
      Row('Pagamento', 'payment', ['pending','partial','paid','overdue']),
      Row('SLA (atendimento)', 'sla', ['fresh','aging','late','expired']),
      Row('Canal (atendimento)', 'atendimento', ['whatsapp','email','instagram','facebook','mercadolivre']),
      h('div', { className: 'row' },
        h('span', { className: 'lbl' }, 'Frescor (CRM)'),
        h(StatusBadge, { kind: 'frescor', value: 'recente', rel: 'há 1sem' }),
        h(StatusBadge, { kind: 'frescor', value: 'fresc', rel: 'há 4sem' }),
        h(StatusBadge, { kind: 'frescor', value: 'frio', rel: 'há 7m' }),
        h(StatusBadge, { kind: 'frescor', value: 'distante', rel: 'há 2m' }),
      ),
      h('div', { className: 'row' },
        h('span', { className: 'lbl' }, 'Tipo (CRM)'),
        h(StatusBadge, { kind: 'tipo', value: 'pj' }),
        h(StatusBadge, { kind: 'tipo', value: 'pf' }),
      ),
      h('div', { className: 'row', style: { marginTop: 4, paddingTop: 8, borderTop: '1px solid var(--border)' } },
        h('span', { className: 'lbl' }, 'Módulo Ponto'),
        h(StatusBadge, { kind: 'intercorrencia', value: 'aprovada' }),
        h(StatusBadge, { kind: 'rep', value: 'rep_p' }),
        h(StatusBadge, { kind: 'rep', value: 'rep_c' }),
      ),
    )
  );
</script>
</body>
</html>
