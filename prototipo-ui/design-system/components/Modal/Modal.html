<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Modal</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style> body { padding: 18px; min-height: 320px; } </style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/javascript">
  const { Modal, Button } = window.OfficeImpressoPontoWR2DesignSystem_019dd0;
  const h = React.createElement;
  function App() {
    const [open, setOpen] = React.useState(true);
    return h(React.Fragment, null,
      h(Button, { variant: 'danger', onClick: () => setOpen(true) }, 'Cancelar OS #4821'),
      h(Modal, {
        open, onClose: () => setOpen(false), title: 'Cancelar OS #4821?',
        footer: h(React.Fragment, null,
          h(Button, { variant: 'ghost', onClick: () => setOpen(false) }, 'Voltar'),
          h(Button, { variant: 'danger', onClick: () => setOpen(false) }, 'Cancelar OS')),
      }, 'Essa ação é irreversível. O cliente será notificado e a arte volta pro arquivo.')
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
