<div id="root"></div>

  function App() {
    const [p, setP] = React.useState(4);
    const [ps, setPs] = React.useState(20);

      h(Pagination, { page: p, pageCount: 12, onChange: setP, total: 234, pageSize: ps, onPageSize: setPs }),

  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
