<!doctype html>

<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Avatar</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body { padding: 18px; }
  .row { display:flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-2); width: 70px; }
  .cli { display:flex; align-items:center; gap: 10px; font-size: 13.5px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/javascript">
  const { Avatar } = window.OfficeImpressoPontoWR2DesignSystem_019dd0;
  const h = React.createElement;
  const names = ['Acme Comércio','TechPro Equipamentos','Padaria Estrela','Clínica Vida','Mercado União','Escola Aurora','Auto Posto Vale','Pet Shop Amigo'];
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(React.Fragment, null,
      h('div', { className: 'row' }, h('span', { className: 'lbl' }, 'Paleta'),
        names.map((n) => h(Avatar, { key: n, name: n }))),
      h('div', { className: 'row' }, h('span', { className: 'lbl' }, 'Tamanhos'),
        h(Avatar, { name: 'Ana Lima', size: 'sm' }),
        h(Avatar, { name: 'Ana Lima', size: 'md' }),
        h(Avatar, { name: 'Ana Lima', size: 'lg' })),
      h('div', { className: 'row' }, h('span', { className: 'lbl' }, 'Em linha'),
        h('span', { className: 'cli' }, h(Avatar, { name: 'Acme Comércio Ltda', size: 'md' }), 'Acme Comércio Ltda')),
    )
  );
</script>
</body>
</html>
