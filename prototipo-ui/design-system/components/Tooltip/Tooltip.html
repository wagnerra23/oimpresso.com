<!doctype html>
<!-- @dsCard group="Components" name="Tooltip" subtitle="Dica contextual — hover + foco, com seta e atalho" viewport="600x260" -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Tooltip</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style> body { margin: 0; } </style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div class="cockpit dark" data-theme="dark" style="height:260px; background:var(--bg); display:grid; place-items:center;">
  <div id="root"></div>
</div>
<script type="text/javascript">
  const { Tooltip } = window.OfficeImpressoPontoWR2DesignSystem_019dd0;
  const h = React.createElement;
  const btn = (label) => h('button', { style: { height: 36, padding: '0 16px', borderRadius: 8, border: '1px solid var(--border)', background: 'var(--surface)', color: 'var(--text)', font: '500 13px var(--font-sans)', cursor: 'pointer' } }, label);
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { style: { display: 'flex', gap: 16 } },
      h(Tooltip, { content: 'Exportar planilha', side: 'top', kbd: '⌘E', id: 'tt-demo' }, btn('Exportar')),
      h(Tooltip, { content: 'Marcação registrada às 08:42', side: 'bottom' }, btn('Ponto')),
      h(Tooltip, { content: 'Requer permissão de gestor', side: 'right' }, btn('Aprovar'))));
  setTimeout(() => { const b = document.querySelectorAll('button')[0]; if (b) b.dispatchEvent(new MouseEvent('mouseover', { bubbles: true })); }, 120);
</script>
</body>
</html>
