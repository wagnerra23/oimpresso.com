<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<body>
<div id="root"></div>
<script type="text/javascript">
  const { Checkbox } = window.OfficeImpressoPontoWR2DesignSystem_019dd0;
  const h = React.createElement;
  function App() {
    const [a, setA] = React.useState(true);
    const [b, setB] = React.useState(false);
    return h(React.Fragment, null,
      h(Checkbox, { checked: a, onChange: setA, label: 'Aplicar a múltiplos colaboradores' }),
      h(Checkbox, { checked: b, onChange: setB, label: 'Enviar cópia por e-mail' }),
      h(Checkbox, { checked: true, disabled: true, label: 'Obrigatório (não editável)' }),
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
