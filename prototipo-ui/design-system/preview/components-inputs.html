<!doctype html>
<!-- @dsCard group="Components" name="Components — Form Inputs" subtitle="Input, error, disabled, checkbox, switch" viewport="700x280" -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 18px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; }
  .field label { display:block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--fg); }
  .help { font-size: 11px; color: var(--fg-2); margin-top: 5px; }
  .err { font-size: 11px; color: var(--destructive); margin-top: 5px; }
  .input { width: 100%; height: 36px; border-radius: var(--radius-md); border: 1px solid var(--input); padding: 0 12px; background: white; font-size: 14px; box-shadow: 0 1px 2px rgb(0 0 0 / .05); box-sizing: border-box; }
  .input:focus { outline: none; border-color: var(--ring); box-shadow: 0 0 0 3px hsl(222.2 84% 4.9% / .12); }
  .input.error { border-color: var(--destructive); box-shadow: 0 0 0 3px hsl(0 84% 60% / .15); }
  .input.disabled { opacity: .5; pointer-events: none; }
  .checkbox { display:inline-flex; align-items:center; gap:8px; font-size:13px; }
  .check { width:16px; height:16px; border-radius:4px; border:1.5px solid var(--border); display:inline-flex; align-items:center; justify-content:center; }
  .check.on { background: var(--primary); border-color: var(--primary); color: white; }
  .switch { width: 32px; height: 18px; border-radius: 999px; background: var(--primary); position: relative; }
  .switch::after { content:""; position:absolute; right: 2px; top: 2px; width: 14px; height: 14px; border-radius: 999px; background: white; }
</style>
</head>
<body>
  <div class="grid">
    <div class="field">
      <label>Matrícula</label>
      <input class="input" value="00128" />
      <p class="help">Identificador interno do colaborador.</p>
    </div>
    <div class="field">
      <label>CPF</label>
      <input class="input error" value="123.456.789" />
      <p class="err">CPF inválido.</p>
    </div>
    <div class="field">
      <label>Pacote</label>
      <input class="input" placeholder="Selecionar plano…" />
    </div>
    <div class="field">
      <label>Inativo</label>
      <input class="input disabled" value="—" />
    </div>
    <div class="field" style="grid-column: span 2; display:flex; gap: 24px; align-items:center; padding-top: 4px;">
      <span class="checkbox"><span class="check on">✓</span> Notificar gestor por e-mail</span>
      <span class="checkbox"><span class="check"></span> Aplicar a múltiplos colaboradores</span>
      <span class="checkbox"><span class="switch"></span> Modo escuro</span>
    </div>
  </div>
</body>
</html>
