<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing — Radius scale" subtitle="4 / 6 / 8 / 12 / 16 / 24 / full" viewport="700x160" -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Radius</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 18px; }
  .row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .cell { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .box { width: 64px; height: 64px; background: oklch(0.55 0.15 295 / 0.10); border: 1.5px solid var(--primary); }
  .lbl { font-size: 11px; font-weight: 600; color: var(--fg); }
  .meta { font-size: 10px; font-family: var(--font-mono); color: var(--fg-2); text-align:center; line-height: 1.3; }
</style>
</head>
<body>
  <div class="row">
    <div class="cell"><div class="box" style="border-radius: 4px;"></div><span class="lbl">sm · 4px</span><span class="meta">inline code</span></div>
    <div class="cell"><div class="box" style="border-radius: 6px;"></div><span class="lbl">md · 6px</span><span class="meta">Button, Input</span></div>
    <div class="cell"><div class="box" style="border-radius: 8px;"></div><span class="lbl">lg · 8px</span><span class="meta">inner KPI</span></div>
    <div class="cell"><div class="box" style="border-radius: 12px;"></div><span class="lbl">xl · 12px</span><span class="meta">Card (canonical)</span></div>
    <div class="cell"><div class="box" style="border-radius: 16px;"></div><span class="lbl">2xl · 16px</span><span class="meta">Pricing tier</span></div>
    <div class="cell"><div class="box" style="border-radius: 24px;"></div><span class="lbl">3xl · 24px</span><span class="meta">hero glow</span></div>
    <div class="cell"><div class="box" style="border-radius: 9999px;"></div><span class="lbl">full</span><span class="meta">badge / avatar</span></div>
  </div>
</body>
</html>
