# Composite action — setup canônico pra rodar Pest contra MySQL REAL.
# Extraída de financeiro-pest.yml (FV-F2, plano SDD 2026-06-12) pra reuso
# pelas lanes de burn-down por módulo (FV B1/B2/...) sem copy-paste.
#
# ⚠️ LIMITAÇÃO GitHub Actions: composite action NÃO pode declarar `services:`
# (service containers são job-level). O JOB CONSUMIDOR DEVE declarar o service
# mysql:8.0 com MYSQL_ROOT_PASSWORD/MYSQL_DATABASE compatíveis com os inputs
# (ver .github/workflows/financeiro-pest.yml — bloco `services.mysql`).
# Esta action cobre o resto: PHP + deps + .env + migrate + seed multi-tenant.
#
# Usa o SCHEMA BASELINE (database/schema/mysql-schema.sql, gerado via schema:dump
# da prod 2026-06-04 com as 820 migrations registradas). `migrate` carrega o
# schema final num passo só + roda só as migrations novas → sem o problema de
# fresh-install (FK ordering / type-mismatch) que as migrations legacy têm.

name: 'Pest MySQL Setup'
description: >-
  PHP 8.4 + Composer + .env MySQL + migrate (schema baseline) + seed mínimo
  multi-tenant: biz=1 (fixture completa) E biz=2 (Tier 0 cross-tenant).
  Requer service container MySQL declarado no job consumidor.

inputs:
  php-version:
    description: 'Versão do PHP'
    required: false
    default: '8.4'
  db-host:
    description: 'Host do MySQL (service container)'
    required: false
    default: '127.0.0.1'
  db-port:
    description: 'Porta do MySQL'
    required: false
    default: '3306'
  db-database:
    description: 'Database de teste'
    required: false
    default: 'oimpresso_test'
  db-username:
    description: 'Usuário do MySQL'
    required: false
    default: 'root'
  db-password:
    description: 'Senha do MySQL (a do service container CI, não-secreta)'
    required: false
    default: 'root'

runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: bcmath, ctype, dom, fileinfo, intl, json, mbstring, openssl, pdo, pdo_mysql, tokenizer, xml, zip, gd, opentelemetry
        tools: composer:v2
        coverage: none

    - name: Cache Composer
      uses: actions/cache@v4
      with:
        path: ~/.composer/cache
        key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
        restore-keys: composer-${{ runner.os }}-

    - name: Prepare dirs
      shell: bash
      run: mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache

    - name: Install PHP deps
      shell: bash
      run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

    - name: Wait for MySQL
      shell: bash
      run: |
        for i in $(seq 1 30); do
          if mysqladmin ping -h${{ inputs.db-host }} -u${{ inputs.db-username }} -p${{ inputs.db-password }} --silent; then echo "MySQL up"; break; fi
          echo "waiting mysql ($i)"; sleep 2
        done

    - name: Create .env (MySQL)
      shell: bash
      run: |
        # ${{ inputs.* }} é substituído pelo runner ANTES do bash — heredoc quoted ok.
        cat > .env <<'EOF'
        APP_NAME=oimpresso-fin
        APP_ENV=testing
        APP_KEY=
        APP_DEBUG=true
        APP_URL=http://localhost
        LOG_CHANNEL=stderr
        DB_CONNECTION=mysql
        DB_HOST=${{ inputs.db-host }}
        DB_PORT=${{ inputs.db-port }}
        DB_DATABASE=${{ inputs.db-database }}
        DB_USERNAME=${{ inputs.db-username }}
        DB_PASSWORD=${{ inputs.db-password }}
        CACHE_DRIVER=array
        QUEUE_CONNECTION=sync
        SESSION_DRIVER=array
        MAIL_MAILER=array
        BCRYPT_ROUNDS=4
        TELESCOPE_ENABLED=false
        SCOUT_DRIVER=null
        MCP_TOOLS_EXPOSED=false
        EOF
        php artisan key:generate --force
        php artisan package:discover --ansi

    - name: Strip prod DEFINER do schema baseline (triggers funcionam no MySQL do CI)
      # O dump database/schema/mysql-schema.sql carrega objetos (triggers de
      # imutabilidade append-only de mcp_audit_log / ponto_marcacoes / etc)
      # carimbados com DEFINER=`u906587222_oimpresso`@`localhost` — o usuário da
      # PROD Hostinger. Esse usuário NÃO existe no container MySQL do CI; quando um
      # trigger BEFORE UPDATE/DELETE dispara, o MySQL falha a resolução do security
      # context do definer e estoura SQLSTATE 'HY000' ANTES de chegar no corpo
      # (SIGNAL '45000'). Resultado: na prod o trigger enforça (definer existe), mas
      # no CI ele falha com o erro ERRADO — mascarando se o append-only morde.
      # Sem DEFINER, o objeto é criado sob CURRENT_USER (root do CI) e o SIGNAL
      # '45000' aflora corretamente. Exposto pela lane jana-pest (furo #1 SDD Leva
      # 1): ImmutabilityTriggersTest mcp_audit_log UPDATE/DELETE.
      shell: bash
      run: |
        sed -i -E 's/DEFINER=`[^`]+`@`[^`]+`//g' database/schema/mysql-schema.sql

    - name: Migrate (carrega schema baseline + migrations novas)
      # Com database/schema/mysql-schema.sql presente, o Laravel carrega o
      # schema final + a tabela migrations (820 linhas) num passo, depois roda
      # só as migrations posteriores ao dump. Sem replay fresh-install.
      shell: bash
      run: php artisan migrate --force

    - name: Seed mínimo (biz=1 fixture completa + biz=2 Tier 0 cross-tenant)
      # DummyBusinessSeeder é stale (insere colunas removidas do schema real, ex
      # contacts.first_name). Em vez dele, semeamos o MÍNIMO que os testes precisam
      # (Business::first() + um user + uma conta), com as colunas NOT NULL atuais do
      # schema baseline, resolvendo o FK circular business.owner_id ↔ users.business_id.
      #
      # biz=2 (FV-F2 — Tier 0 cross-tenant): segundo tenant MÍNIMO (business + user,
      # SEM conta/location/contact) pros testes de isolamento multi-tenant terem um
      # segundo business real. Business::first() continua devolvendo biz=1.
      shell: bash
      run: |
        php artisan db:seed --class="Database\\Seeders\\CurrenciesTableSeeder" --force || true
        php artisan db:seed --class="Database\\Seeders\\PermissionsTableSeeder" --force || true
        php artisan tinker --execute="
          use Illuminate\\Support\\Facades\\DB;
          \$curId = optional(DB::table('currencies')->first())->id ?? 1;
          if (! DB::table('business')->where('id', 1)->exists()) {
            \$uid = DB::table('users')->insertGetId(['first_name'=>'CI','username'=>'ci_admin','password'=>bcrypt('ci'),'created_at'=>now(),'updated_at'=>now()]);
            \$bid = DB::table('business')->insertGetId(['name'=>'CI Biz','currency_id'=>\$curId,'owner_id'=>\$uid,'stop_selling_before'=>0,'weighing_scale_setting'=>'','certificado'=>'','officeimpresso_numerodemaquinas'=>0,'created_at'=>now(),'updated_at'=>now()]);
            DB::table('users')->where('id', \$uid)->update(['business_id'=>\$bid]);
            echo 'seed biz='.\$bid.' user='.\$uid.PHP_EOL;
          }
          // biz=98 — TENANT CANÔNICO DE TESTE (decisão [W] 2026-07-28). Empresa FICTÍCIA,
          // não-operadora. Substitui o biz=1 nesse papel porque o 1 é a WR2 Sistemas, empresa
          // REAL em operação — e no CT 100 a base é clone de prod que NÃO se limpa entre runs,
          // então teste rodando em biz=1 semeia dado dentro do espelho da empresa de verdade.
          // NÃO usar 99 aqui: 99 é o SUPPORT_CLIENT_TENANT_ID (empresa-CLIENTE do Modo
          // Suporte). Agente e cliente no mesmo id fariam o cross-tenant ficar verde sem
          // provar isolamento. Os dois papéis exigem ids DISTINTOS.
          if (! DB::table('business')->where('id', 98)->exists()) {
            \$uid98 = DB::table('users')->insertGetId(['first_name'=>'CI Tenant98','username'=>'ci_admin_t98','password'=>bcrypt('ci'),'created_at'=>now(),'updated_at'=>now()]);
            DB::table('business')->insert(['id'=>98,'name'=>'CI Tenant 98 (ficticio)','currency_id'=>\$curId,'owner_id'=>\$uid98,'stop_selling_before'=>0,'weighing_scale_setting'=>'','certificado'=>'','officeimpresso_numerodemaquinas'=>0,'created_at'=>now(),'updated_at'=>now()]);
            DB::table('users')->where('id', \$uid98)->update(['business_id'=>98]);
            echo 'seed biz98=98 user='.\$uid98.PHP_EOL;
          }
          if (! DB::table('business')->where('id', 2)->exists()) {
            \$uid2 = DB::table('users')->insertGetId(['first_name'=>'CI Biz2','username'=>'ci_admin_b2','password'=>bcrypt('ci'),'created_at'=>now(),'updated_at'=>now()]);
            DB::table('business')->insert(['id'=>2,'name'=>'CI Biz 2','currency_id'=>\$curId,'owner_id'=>\$uid2,'stop_selling_before'=>0,'weighing_scale_setting'=>'','certificado'=>'','officeimpresso_numerodemaquinas'=>0,'created_at'=>now(),'updated_at'=>now()]);
            DB::table('users')->where('id', \$uid2)->update(['business_id'=>2]);
            echo 'seed biz2=2 user='.\$uid2.PHP_EOL;
          }
          // ponto_colaborador_config pro tenant 1 (2026-08-24). Sem esta linha, os testes
          // do Ponto que precisam de um colaborador chamam markTestSkipped — e skip sai
          // com exit 0. Medido no run 32675937702 da ponto-pest: 2 casos de imutabilidade
          // append-only (Portaria 671/2021) SKIPAVAM em CI enquanto passavam no CT100, que
          // tem a linha. Guard Tier 0 que nao roda e protecao anunciada, nao exercida.
          //
          // Guardado por hasTable: a tabela so existe depois das migrations do Modules/Ponto.
          // As 3 colunas obrigatorias (NOT NULL sem default) sao business_id, user_id e
          // admissao — verificadas contra o schema real antes de escrever isto, porque um
          // insert malformado aqui quebraria as 16 lanes que compartilham este seed.
          // Aditivo: nenhum teste do repo assume esta tabela vazia (varredura contada).
          if (Illuminate\\Support\\Facades\\Schema::hasTable('ponto_colaborador_config')
              && ! DB::table('ponto_colaborador_config')->where('business_id', 1)->exists()) {
            \$u1 = optional(DB::table('users')->where('business_id', 1)->first())->id;
            if (\$u1) {
              DB::table('ponto_colaborador_config')->insert(['business_id'=>1,'user_id'=>\$u1,'admissao'=>now()->toDateString(),'created_at'=>now(),'updated_at'=>now()]);
              echo 'seed ponto_colaborador_config biz=1 user='.\$u1.PHP_EOL;
            }
          }
          // Pré-requisitos de business_locations pros tenants 1 e 2 (2026-08-27).
          //
          // A tabela tem TRÊS FKs — contadas no schema, não supostas: business_id,
          // invoice_scheme_id e invoice_layout_id. As duas últimas são NOT NULL e apontam
          // pra tabelas que nasciam VAZIAS, então qualquer teste que insira uma location
          // com a FK LIGADA morre com SQLSTATE 23000. Os inserts de location deste seed
          // escapam só porque rodam depois do FOREIGN_KEY_CHECKS=0 abaixo — o teste, que
          // roda com a FK ligada, não escapa.
          //
          // Medido: o guard Tier 0 'não vaza locations de outro business'
          // (HomeIndexInertiaTest, US-DASH-001) morria nesse insert. Sem estas linhas ele
          // vira SKIP, e skip sai exit 0 — o mesmo 'proteção anunciada, não exercida' que
          // o bloco do ponto_colaborador_config descreve logo acima.
          //
          // As duas tabelas entram JUNTAS de propósito: satisfazer uma FK e deixar a irmã
          // só troca a mensagem de erro (run 98703624044 morreu na invoice_scheme_id;
          // 98705... morreu na invoice_layout_id, com o mesmo teste). Colunas obrigatórias
          // conferidas no database/schema/mysql-schema.sql — invoice_schemes exige
          // business_id/name/scheme_type, invoice_layouts exige business_id/name — porque
          // insert malformado aqui quebraria as 16 lanes que compartilham este seed.
          // Aditivo e idempotente: guardado por hasTable + not exists.
          foreach ([1, 2] as \$isBiz) {
            if (! DB::table('business')->where('id', \$isBiz)->exists()) { continue; }
            if (Illuminate\\Support\\Facades\\Schema::hasTable('invoice_schemes')
                && ! DB::table('invoice_schemes')->where('business_id', \$isBiz)->exists()) {
              DB::table('invoice_schemes')->insert(['business_id'=>\$isBiz,'name'=>'CI Default','scheme_type'=>'blank','number_type'=>'sequential','is_default'=>1,'created_at'=>now(),'updated_at'=>now()]);
              echo 'invoice_scheme criado biz='.\$isBiz.PHP_EOL;
            }
            if (Illuminate\\Support\\Facades\\Schema::hasTable('invoice_layouts')
                && ! DB::table('invoice_layouts')->where('business_id', \$isBiz)->exists()) {
              DB::table('invoice_layouts')->insert(['business_id'=>\$isBiz,'name'=>'CI Layout','created_at'=>now(),'updated_at'=>now()]);
              echo 'invoice_layout criado biz='.\$isBiz.PHP_EOL;
            }
          }
          // AVISO PRA QUEM EDITAR ESTE STEP: tudo aqui vive dentro de um
          // tinker --execute=... , que e uma string de shell entre ASPAS DUPLAS.
          // Crase vira SUBSTITUICAO DE COMANDO e aspa dupla FECHA o --execute —
          // inclusive dentro de comentario PHP, que o shell nao sabe que e comentario.
          // Aprendido na marra: o run 33552930110 morreu com
          // -syntax error near unexpected token- por uma crase de markdown num
          // comentario. Nao use crase nem aspa dupla aqui, em nenhuma linha.
          //
          // Permissions Spatie mínimas (2026-09-01). O baseline schema NÃO carrega
          // nenhuma linha em permissions (medido: 0 INSERT INTO permissions em
          // database/schema/mysql-schema.sql) e o PermissionsTableSeeder do UltimatePOS
          // cria ~60 permissions mas NEM superadmin NEM as fiscal.* (medido: 0
          // ocorrências de 'superadmin' nos dois seeders homônimos). Resultado: todo
          // teste que chama givePermissionTo('superadmin') morre com
          // Spatie\Permission\Exceptions\PermissionDoesNotExist ANTES de exercer o gate
          // que ele existe pra provar — guard Tier 0 anunciado, não exercido.
          // Não é hipótese: o bloco da allowlist DESTA lane já registra o efeito
          // (run 31412629508, 2026-08-10) — 4 arquivos do Fiscal ficaram de fora
          // classificados como PermissionDoesNotExist, 'o seed da lane não cria as
          // permissions que o teste exige'. Este bloco fecha essa ponta.
          //
          // As 7 fiscal.* são a MESMA lista canônica do
          // Modules/Fiscal/Console/Commands/HabilitarBusinessCommand (6 atribuídas ao
          // role + fiscal.sped.export provisionada e NÃO atribuída — GAP-FISCAL-003),
          // conferida nome a nome: o HabilitarBusinessCommandTest APAGA as fiscal.% e
          // depois exige EXATAMENTE 7, então um nome a mais aqui quebraria aquele assert.
          //
          // Aditivo e idempotente (findOrCreate). Seguro pras 16 lanes que compartilham
          // este seed: os 2 únicos testes do repo que contam permissions medem DELTA
          // relativo (RolePermissionCatalogTest — toBe(\$antes)), nunca valor absoluto.
          if (\Illuminate\Support\Facades\Schema::hasTable('permissions')) {
            foreach ([
              'superadmin',
              'fiscal.access', 'fiscal.nfe.view', 'fiscal.nfe.acoes', 'fiscal.nfse.view',
              'fiscal.dfe.manage', 'fiscal.config.edit', 'fiscal.sped.export',
            ] as \$permName) {
              \Spatie\Permission\Models\Permission::findOrCreate(\$permName, 'web');
            }
            echo 'permissions seed: superadmin + 7 fiscal.* garantidas'.PHP_EOL;
          }
          DB::statement('SET FOREIGN_KEY_CHECKS=0'); // conta usa account_id fake (sem row em accounts)
          \$bizId = optional(DB::table('business')->where('id', 98)->first())->id ?: optional(DB::table('business')->first())->id;
          if (\$bizId && ! \Modules\Financeiro\Models\ContaBancaria::query()->where('business_id',\$bizId)->exists()) {
            \Modules\Financeiro\Models\ContaBancaria::create([
              'business_id'=>\$bizId,'account_id'=>999001,'agencia'=>'0001','carteira'=>'0',
              'beneficiario_documento'=>'00000000000000','beneficiario_razao_social'=>'CI Test','saldo_cached'=>0,
            ]);
            echo 'conta criada biz='.\$bizId.PHP_EOL;
          }
          // Onda Q2 — RetencaoLoopE2ETest (UC-F01..03) exige location + contact (type != lead).
          if (\$bizId && ! DB::table('business_locations')->where('business_id',\$bizId)->exists()) {
            DB::table('business_locations')->insert(['business_id'=>\$bizId,'name'=>'Matriz CI','country'=>'BR','state'=>'SP','city'=>'SP','zip_code'=>'0','created_at'=>now(),'updated_at'=>now()]);
            echo 'location criada'.PHP_EOL;
          }
          if (\$bizId && ! DB::table('contacts')->where('business_id',\$bizId)->where('type','!=','lead')->exists()) {
            DB::table('contacts')->insert(['business_id'=>\$bizId,'type'=>'customer','name'=>'Cliente CI','contact_id'=>'CO0001','created_by'=>1,'is_default'=>1,'created_at'=>now(),'updated_at'=>now()]);
            echo 'contact criado'.PHP_EOL;
          }
          // system.repair_version (2026-09-05) — destrava UC-RSET-07/08, pendencia 4 do
          // charter de Pages/Repair/Settings. Sem a linha, ModuleUtil::isModuleInstalled
          // devolve false, o tipo device fica fora dos category_types e
          // ModuleUtil::getTaxonomyData chama exit dentro de index() — exit nao e exception:
          // mata o processo e derruba a suite sem uma linha de output. O guard do teste
          // troca essa morte muda por skip visivel; esta linha troca o skip por execucao.
          //
          // POR QUE AQUI E NAO NO TESTE: lapide 2026-08-24 do §5 — teste nao planta a
          // propria pre-condicao de ambiente; quem responde o que existe neste ambiente e
          // o seed. O docblock do RepairSettingsContratoTest cita a mesma lapide.
          //
          // POR QUE A MIGRATION NAO RESOLVE: 2019_03_29_110241_add_repair_version_column_to_system_table
          // faz o INSERT, mas o baseline database/schema/mysql-schema.sql ja a registra como
          // aplicada (id 258, batch 2), entao o Laravel nunca a roda. Medido: o baseline tem
          // 820 INSERT INTO, TODOS na tabela migrations e ZERO em system — logo nenhuma
          // migration cujo efeito seja dado chega ao CI. Isso vale para as 12 chaves
          // *_version do repo, nao so a do Repair; semeio SO a do Repair porque as outras 11
          // mudariam o ramo instalado de 79 sites de producao nas 16 lanes, e isso e decisao
          // [W], nao efeito colateral deste PR.
          //
          // Aditivo e idempotente. Varredura contada antes de escrever: dos 13 arquivos de
          // teste que usam isModuleInstalled, 1 menciona Repair (o proprio contrato); em
          // producao sao 4 sites, todos em app/Http/Controllers/BrandController.php; e
          // nenhum teste assume a tabela system vazia (6 acessos, todos por chave nomeada).
          if (\Illuminate\Support\Facades\Schema::hasTable('system')
              && ! DB::table('system')->where('key', 'repair_version')->exists()) {
            DB::table('system')->insert(['key'=>'repair_version','value'=>(string) config('repair.module_version', '2.0')]);
            echo 'seed system.repair_version'.PHP_EOL;
          }
        "
