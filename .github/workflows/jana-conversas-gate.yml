name: Jana Conversas Gate — histórico do chat (filtro real + J/K + ⌘⇧H + aria-live)

# Fatia C da fusão da Jana (pacote JANA-FUSAO-2026-08-06; fonte
# prototipo-ui/cowork/jana-merge.jsx §JmConversa). A lógica de filtro e teclado
# vive no ConvSidePanel de resources/js/Pages/Jana/Chat.tsx, exportado como named
# export justamente pra ser montável em jsdom sem AppShellV2/Inertia/assistant-ui.
#
# POR QUE ESTA LANE EXISTE: NENHUMA lane roda `vitest run` sem argumento — cada
# spec que morde tem workflow próprio apontando pro arquivo (medido de novo em
# 2026-08-07: os 10 workflows que citam vitest listam o spec um a um). Sem esta
# lane, tests/jana-chat-conversas.test.tsx nunca executaria em CI e seria
# verde-por-não-execução (LC-13) — pior que teste ausente, porque parece
# cobertura. O Pest do módulo não alcança tecla nenhuma.
#
# O que ele trava:
#   - o filtro FILTRA (aba "Todas" esconde arquivada; "Arquivadas" mostra só ela).
#     Antes eram 4 abas decorativas com empty state "Em breve"; o caso
#     'nenhuma aba mostra "Em breve"' impede a fachada de voltar.
#   - só existem 2 abas. "Minhas" era tautológica (a query já é where user_id) e
#     "Compartilhadas" seria sempre vazia (403 de posse em 4 pontos do
#     ChatController). Reintroduzir sem backend fica vermelho aqui.
#   - J/K anda entre CONVERSAS, não entre mensagens (Chat.charter.md v3 §Histórico).
#   - o guard de digitação: apertar "j" com foco no campo de busca não pode
#     trocar de conversa.
#   - ⌘⇧H e Ctrl+⇧H recolhem, e o rail recolhido mantém o atalho — a lista não
#     pode voltar a ficar inalcançável (o `display:none` ≤1023px que fazia isso
#     foi removido do cockpit.css).
#
# Mordida provada antes do merge (2 mutações, restore = 15/15 verde):
#   `return` no topo do handler de teclado  → 5 failed (J/K + ⌘⇧H)
#   `keep` do filtro forçado a `true`       → 3 failed (as 2 abas + J/K sob filtro)
#
# ESCOPO AMPLIADO EM 2026-08-26 — esta lane passou a ser o HOME dos specs jsdom da
# Jana, não só o do histórico. Entrou `tests/jana-pro-voltar.test.tsx` (UC-PRO-07 do
# `resources/js/Pages/Jana/Pro.casos.md`), que não rodava em lane NENHUMA: medido com
# `rg --hidden` no repo inteiro, o nome do spec só aparecia no próprio `.casos.md` e num
# doc de `memory/` — zero ocorrência em `.github/`. Nenhuma lane roda `vitest run` sem
# argumento, então spec fora de workflow é verde-por-não-execução (LC-13).
#
# AMPLIADO DE NOVO EM 2026-09-03 — entrou `tests/jana-memoria-linha.test.tsx`
# (UC-MEM-09/10 do `resources/js/Pages/Jana/Memoria.casos.md`), da onda 4 da paridade
# da Memória. Mesmo motivo estrutural das duas anteriores: nenhuma lane roda `vitest run`
# sem argumento, então spec fora de workflow é verde-por-não-execução (LC-13). Re-medido
# com `rg --hidden` no repo inteiro ANTES de escrever esta linha: segue zero.
#   UC-MEM-09 — as ações da linha do fato são TEXTO ("Editar"/"Apagar"), não ícone mudo.
#   UC-MEM-10 — a linha abre pelo FATO; a meta que o qualifica vem depois.
# Mordida provada por mutação antes do merge (restore = 4/4 verde, arquivo byte-idêntico):
#   os 2 botões viram ícone mudo com `title`  → 2 failed (UC-MEM-09)
#   a meta sobe pra antes do `<p>` do fato    → 1 failed (UC-MEM-10)
# O assert do 09 é de `textContent`, não de nome acessível, de propósito: botão-ícone com
# `title` TEM nome acessível e passaria por `getByRole` sem rótulo nenhum na tela.
#
# Os `name:` do workflow e do job seguem falando só de "conversas" DE PROPÓSITO: o job
# `name:` é o context do check, e renomeá-lo derruba o check nos PRs já abertos (§5
# 2026-08-08). O escopo real de quem roda está no `name:` do step e no comando.
#
# Path-scoped (faz npm ci): roda quando a Page, o tipo do payload, o spec ou este
# workflow mudam. Comando local:
#   npx vitest run tests/jana-chat-conversas.test.tsx tests/jana-pro-voltar.test.tsx tests/jana-memoria-linha.test.tsx
#
# Advisory (ADR 0271/0314 — atalho e filtro de tela é qualidade/higiene, não
# Tier-0). Promoção a required, se um dia fizer sentido, é flip [W] com mordida
# real coletada (ADR 0336 DR-2) — não se auto-promove.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, ready_for_review]
    paths:
      - 'resources/js/Pages/Jana/Chat.tsx'
      - 'resources/js/Components/cockpit/shared.ts'
      - 'tests/jana-chat-conversas.test.tsx'
      # Pro (2026-08-26): a tela SOB TESTE entra no gatilho junto com o spec, senão
      # mexer no `Pro.tsx` não acorda o teste que o defende — foi metade do bug de
      # 2026-08-17 no PainelContratoTest (§5 2026-08-02: "inclua o arquivo SOB TESTE").
      - 'resources/js/Pages/Jana/Pro.tsx'
      - 'tests/jana-pro-voltar.test.tsx'
      # Memória (2026-09-03): a Page entra junto com o spec, senão mexer no
      # `Memoria.tsx` não acorda o teste que o defende (§5 2026-08-02).
      - 'resources/js/Pages/Jana/Memoria.tsx'
      - 'tests/jana-memoria-linha.test.tsx'
      - '.github/workflows/jana-conversas-gate.yml'
  push:
    branches: [main]
    paths:
      - 'resources/js/Pages/Jana/Chat.tsx'
      - 'resources/js/Components/cockpit/shared.ts'
      - 'tests/jana-chat-conversas.test.tsx'
      - 'resources/js/Pages/Jana/Pro.tsx'
      - 'tests/jana-pro-voltar.test.tsx'
      - 'resources/js/Pages/Jana/Memoria.tsx'
      - 'tests/jana-memoria-linha.test.tsx'

concurrency:
  group: jana-conversas-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jana-conversas:
    name: Jana · histórico de conversas (filtro real · J/K · ⌘⇧H · aria-live)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install deps
        run: npm ci
      # JUnit + artifact adicionados em 2026-08-24. A lane rodava e o veredito dela NAO
      # chegava ao manifesto por-UC (G-7): sem `--reporter=junit` + upload-artifact, os UCs
      # provados aqui valiam ZERO no painel. O sintoma apareceu quando os ids de UC deste
      # casos.md sairam do formato invalido e ficaram VISIVEIS: 5 UCs do Chat + 1 do Painel
      # cairam em `status:unverified` — declaravam ✅ com teste real, sem prova capturada.
      # Mesma correcao que a sells-v3-dominio-gate ja tinha; o `junit-lanes` deriva sozinho
      # (nao ha lista a manter), entao o proximo `casos-results-publish` carimba o ✅.
      # UMA invocação, DOIS specs, UM XML — de propósito. Rodar o Pro num step próprio
      # com artifact próprio custaria uma 2ª entrada em `junit-lanes.mjs` e um 2º
      # download no publisher pra medir a mesma coisa; e um step separado sob o
      # `success()` implícito nem rodaria quando o spec de cima ficasse vermelho.
      # O coletor por-UC varre TODOS os `<testcase>` do XML, então os dois vereditos
      # chegam ao G-7 pelo transporte que já existe.
      - name: specs jsdom da Jana — conversas + Pro + linha da Memória (vitest/jsdom)
        run: |
          npx vitest run \
            tests/jana-chat-conversas.test.tsx \
            tests/jana-pro-voltar.test.tsx \
            tests/jana-memoria-linha.test.tsx \
            --reporter=default \
            --reporter=junit \
            --outputFile=test-results/vitest-jana-conversas-junit.xml

      # `!cancelled()` e nao `success()`: veredito VERMELHO e exatamente o que o G-7
      # precisa registrar — `Status: ✅` com teste vermelho e a mentira que ele pega.
      - name: Upload JUnit (veredito por-UC — casos:results)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-jana-conversas-junit
          path: test-results/vitest-jana-conversas-junit.xml
          retention-days: 14
          if-no-files-found: error
