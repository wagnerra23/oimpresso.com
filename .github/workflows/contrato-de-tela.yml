name: Contrato de Tela (fidelidade visual · always-run — ADR 0261)

# A perna de fidelidade visual do trio-de-tela (charter/casos/Pest já mecanizados).
# Doc: memory/requisitos/_DesignSystem/RUNBOOK-contrato-de-tela.md
#
# REGRA ANTI-TEATRO (veredito dos adversários, sessão 2026-06-18):
#  - SEM `continue-on-error`, SEM mascarar o vermelho. O job mostra vermelho de verdade.
#  - O check bloqueia o merge quando (e só quando) for `required` no branch protection —
#    decisão Tier 0 do [W] (ADR 0261 · "Autoridade: branch protection é admin-only").
#
# ── PROMOÇÃO A ENFORCING (2026-07-13) — always-run + skip-as-pass (ADR 0261 Alavanca 2) ──
# Convertido de path-scoped (workflow-level `paths:`) → ALWAYS-RUN + detecção in-job.
# Motivo (causa-raiz ADR 0261): um required-check path-scoped que NÃO roda (path não bateu)
# nunca reporta status e trava o PR não-relacionado eternamente em "Expected — waiting".
# Agora o check SEMPRE reporta: o step `detect` reusa EXATAMENTE o filtro de path antigo —
# roda os verificadores de verdade quando um arquivo relevante muda; passa instantâneo (verde)
# quando não muda nada relevante (não há o que verificar → verde é correto, não mascarado).
# Mesma cobertura de antes, reportando sempre → seguro pra virar `required` sem deadlock.
# Isto NÃO é o "skip-as-pass mal-calibrado" que o v1 baniu (paths-filter que engole divergência):
# o filtro in-job é idêntico ao filtro de workflow que já existia; nada de novo passa despercebido.
#
# Enforcement da INTENÇÃO do Financeiro (rota legada `/financeiro/unificado/novo`): o step
# "Intenção de fluxo" roda auditar + adversário `--strict` com exit-code real → job VERMELHO se a
# rota legada reaparecer. Bloqueio de merge = quando [W] adicionar este check aos required
# status checks (`Contratos de tela (fidelidade + intenção)` — o step mora nesse job desde
# 2026-09-30) sob enforce_admins (já ligado). Ver PR + RUNBOOK §5.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: contrato-de-tela-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Integridade do próprio gate — HARD (se o gate não morde, nada disto vale).
  # Always-run: node puro, ~segundos; sempre reporta status → requerível sem deadlock.
  selftest:
    name: Self-test — o gate morde e libera certo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: node scripts/contrato-de-tela.test.mjs
        run: node scripts/contrato-de-tela.test.mjs
      # O detect decide se os contratos rodam; se ele ficar cego, o gate sai verde sem medir.
      # Sandbox git real + mutante com o filtro antigo (tela de módulo tem de virar false nele).
      - name: node scripts/contrato-de-tela-relevante.test.mjs
        run: node scripts/contrato-de-tela-relevante.test.mjs

  # Preflight de base + contratos de tela ativos + intenção de fluxo. Exit code real (sem mascarar).
  # Os CONTRATOS de tela: copy + ordem + âncoras de cada *.contract.json, mapa protótipo→prod,
  # anti-tautologia e intenção de fluxo. Separado em 2026-09-30 do Preflight/Omissão (caminho B
  # da _saida-07 do Ponto, [W]) para que promover os contratos NÃO arraste a Omissão, que é
  # advisory por decisão registrada no step dela. O dono de "qual check é required" é
  # governance/required-checks-baseline.json, não este comentário (LC-10).
  contratos-de-tela:
    name: Contratos de tela (fidelidade + intenção)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # preflight/omissão precisam de origin/main + o diff de detecção
      # Filtro + base do diff vivem em UM arquivo, chamado pelos dois jobs deste workflow.
      - name: Detecta arquivos relevantes (skip-as-pass · ADR 0261)
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/contrato-de-tela-detect.sh

      - name: Setup Node
        if: steps.detect.outputs.relevant == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Contratos de tela ativos (ignora EXEMPLO/template)
        if: steps.detect.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          mapfile -t contratos < <(git ls-files '*.contract.json' | grep -v EXEMPLO || true)
          if [ "${#contratos[@]}" -eq 0 ]; then
            echo "Nenhum contrato de tela ativo ainda (fase de adoção — ver RUNBOOK §5)."
            exit 0
          fi
          rc=0
          for c in "${contratos[@]}"; do
            echo "== $c =="
            node scripts/contrato-de-tela.mjs --contract "$c" || rc=1
          done
          exit $rc

      - name: Mapa protótipo→prod (gerado) + --map --check (fonte existe + âncoras)
        if: steps.detect.outputs.relevant == 'true'
        run: |
          echo "::group::Mapa protótipo → produção (derivado · régua 5)"
          node scripts/contrato-de-tela.mjs --map || true
          echo "::endgroup::"
          node scripts/contrato-de-tela.mjs --map --check

      # O contrato tem de derivar da ÂNCORA (protótipo), nunca da TELA. Contrato extraído
      # do .tsx nasce VERDE POR CONSTRUÇÃO — compara a tela com ela mesma e nunca acusa a
      # divergência que é a razão dele existir. Bloqueia só o caso sem ambiguidade
      # (`fonte` apontando pra `resources/js/Pages/**`, FP zero por construção, 4 legados
      # grandfathered no script); copy-só-no-alvo AVISA, porque o FP medido é 15/31.
      - name: Anti-tautologia (contrato deriva da âncora, não da tela)
        if: steps.detect.outputs.relevant == 'true'
        run: node scripts/contrato-de-tela.mjs --anti-tautologia

      - name: Intenção de fluxo (bloqueante — rota legada = vermelho)
        if: steps.detect.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          mapfile -t contratos < <(git ls-files 'governance/design/contracts/*.intent.json' || true)
          if [ "${#contratos[@]}" -eq 0 ]; then
            echo "Nenhum contrato de intenção ativo ainda."
            exit 0
          fi
          for c in "${contratos[@]}"; do
            echo "== $c =="
            node scripts/auditar-intencao-fluxo.mjs --contract "$c"
            node scripts/adversario-intencao-fluxo.mjs --contract "$c" --strict
          done
          # O mapa de intenção é derivado pelo mesmo contrato-de-tela.mjs; não há mapa paralelo.
          node scripts/contrato-de-tela.mjs --map --check

      - name: Diagnóstico em caso de falha
        if: failure()
        run: |
          echo ""
          echo "❌ Contrato de Tela divergente."
          echo "   - 'caminho proibido' → uma ação voltou pra rota legada (ex: /financeiro/unificado/novo). Use o fluxo atual."
          echo "   - 'sem âncora' → instrumente a tela com <... data-contract=\"<id>\">."
          echo "   - 'copy ausente' → a string literal do contrato sumiu/mudou no .tsx."
          echo "   - 'ordem divergente' → a sequência das seções no fonte != contrato."
          echo "   - 'frontend NÃO menciona' → backend e frontend usam vocabulários de 'state' diferentes (ex: paired≠connected). Ver ADR 0286 §5."
          echo "   - 'backend não emite' → 'valores' do acordo declara um state morto (drift de contrato)."
          echo "   Desvio INTENCIONAL do protótipo? declare no corpo do PR:"
          echo "     <!-- design-deviation: <o quê> → <por quê> (ADR/charter) -->"
          echo "   Doc: memory/requisitos/_DesignSystem/RUNBOOK-contrato-de-tela.md"

  # Higiene de base + Omissão. NÃO é o gate de contrato de tela: a Omissão é advisory por
  # decisão registrada no step, e o Preflight falha por base, não por tela.
  preflight-omissao:
    name: Preflight de base + omissão (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # preflight/omissão precisam de origin/main + o diff de detecção
      # Filtro + base do diff vivem em UM arquivo, chamado pelos dois jobs deste workflow.
      - name: Detecta arquivos relevantes (skip-as-pass · ADR 0261)
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/contrato-de-tela-detect.sh

      - name: Setup Node
        if: steps.detect.outputs.relevant == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Em `pull_request` o checkout@v4 usa o MERGE REF (o HEAD ja contem a base), enquanto o
      # fetch do mesmo step traz o `origin/main` de AGORA — comparar os dois mede a FILA DO CI,
      # nao a base. Por isso `--merge-ref` aqui: pula SO a perna de ancestralidade e diz que
      # pulou. Em push/schedule o HEAD e o commit real e a perna roda inteira.
      - name: Preflight de base (higiene de base)
        if: steps.detect.outputs.relevant == 'true'
        run: |
          node scripts/contrato-de-tela.mjs --preflight origin/main             ${{ github.event_name == 'pull_request' && '--merge-ref' || '' }}

      # Catraca 3 INVERTIDA — pega o que o handoff OMITIU, sem depender de alguém declarar
      # item a item. Ligada em 2026-09-22 (onda P do PARIDADE-area-jana). Estava órfã desde
      # que nasceu: existia no script, no package.json e no self-test, e nenhum workflow a
      # chamava — "máquina que existe e ninguém invoca é bug, não neutralidade" (proibicoes.md,
      # LIGUE A MÁQUINA item 2).
      #
      # FP MEDIDO ANTES de ligar (item 4 da mesma regra). ⚠️ A medição do #7691 descrevia OUTRO
      # universo e foi corrigida no mesmo dia — a errata, com as 3 causas, está no docblock de
      # `SYMBOL_RES`. Número válido, corpus VIVO (300 commits de squash, 2026-09-15..09-22):
      #   21 commits disparam este detect (a população que o gate REALMENTE vê)
      #    2 acusados = 9,5%, 2 acusações  (`SparkArea` num revert; `VariacoesTab`)
      #   ⚠️ errata 2026-09-23: `VariacoesTab` era falso-positivo (C3 no docblock de SYMBOL_RES).
      # A taxa é sobre o `detect`, não sobre "toca Pages|Modules": aquele é o escopo do --alvo,
      # o INSUMO do predicado, e é 2,2× maior (46 × 21) — contar ali mede o que o gate não vê.
      #
      # ESCOPO do --alvo: a árvore de telas/módulos, NÃO os `alvo[]` dos contratos. Sobre os 40
      # paths de contrato o modo é CEGO — mas a leitura "a superfície é parada" estava errada:
      # 23 dos 40 nasceram DEPOIS do corpus em que foram medidos. Ver errata no docblock.
      #
      # ⚠️ COBERTURA PARCIAL, declarada: este `detect` casa `resources/js/Pages/**`, não
      # `Modules/**` (fora o ChannelsController). PR que só toca `Modules/` não dispara este
      # step. Ampliar o `detect` mudaria o disparo de TODOS os steps do job — é outro intent.
      #
      # SEM `continue-on-error`/`|| true`, de propósito: advisory significa *não bloqueia o
      # merge*, nunca *não pode ficar vermelho* (§5 2026-07-09). Em 2026-09-22 este workflow
      # não constava de `governance/required-checks-baseline.json` (união classic_protection ∪
      # rulesets = 47 contexts, nenhum casando). Esse é um fato datado: quem precisar saber o
      # enforcement de HOJE lê o baseline, que é o dono — não esta linha (LC-10).
      - name: Omissão — símbolo/rota removido sem justificativa
        if: steps.detect.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          node scripts/contrato-de-tela.mjs --omission "${{ steps.detect.outputs.base }}" \
            --alvo "resources/js/Pages,Modules"
      - name: Diagnóstico em caso de falha
        if: failure()
        run: |
          echo ""
          echo "❌ Preflight de base ou Omissão (este job NÃO é o gate de contrato de tela)."
          echo "   - 'branch atrás' → git rebase origin/main."
          echo "   - Omissão: símbolo/rota removido sem justificativa → cite o nome na mensagem de um commit da branch, ou restaure."
          echo "     (o modo lê só as mensagens de commit da branch e o --notes; o corpo do PR NÃO é lido)"
          echo "   Doc: memory/requisitos/_DesignSystem/RUNBOOK-contrato-de-tela.md"
