name: Design-memory gate (advisory)

# 2026-06-30 (ADR 0314 F2 · poda onda 2): FUSÃO de 3 workflows advisory de
# design-memory num único `design-memory-gate.yml`, 1 job por sub-check (mesmos
# scripts, mesmos self-tests, mesmos exits). TODOS os sub-checks dos 3 antigos
# rodam aqui — counterfactual por sub-check provado antes da fusão (component-
# registry .test.mjs MORDE export ausente/import quebrado · dtcg .test.mjs MORDE
# token divergente · design-memory selftests good/bad). Nenhum dos 3 era required
# (branch protection confirmado) → fusão não toca branch protection. Originais
# DELETADOS + registros sincronizados (gates-registry.json + .memory-health-
# baseline.json checkM).
#
# Componentes fundidos:
#   - registry-check (ex-component-registry.yml · Onda O2): sentinela de drift do
#     registro bloco-de-protótipo → componente React (prototipo-ui/
#     component-registry.json). self-test sem `continue-on-error` (a suíte que valida
#     a sentinela não pode mentir) + drift com `continue-on-error`.
#   - gates (ex-design-memory-gates.yml): Cowork SSOT guard (hard) + ds-guard §8
#     nos arquivos tocados + relatório de dívida + integrity-check §15 + selftests
#     da espinha de import (detectar-telas/ancora/importar-bundle/gerar-contrato/
#     recortar-regiao/analise-regiao) + ancora-adversário (hard).
#   - prove (ex-dtcg-equivalence.yml): equivalência DTCG ↔ CSS canônico (tokens
#     editados no JSON portável, CSS é SAÍDA) + self-test que morde. Dois eixos desde
#     2026-08-14: FORMA (`--schema`, os *.tokens.json contra resources/css/tokens/
#     dtcg.schema.json) e VALOR (modo sem flag). A forma existe porque o valor
#     dependia dela em silêncio — token sem `com.oimpresso.source` não tinha endereço
#     canônico e saía do denominador sem aparecer.
#
# ENFORCEMENT — este bloco NÃO declara o próprio enforcement (§5 2026-07-16 · LC-10).
# O dono único de "o que é required" é `governance/required-checks-baseline.json`
# (baseline↔vivo vigiado por `scripts/governance/protection-drift.mjs`). Quem precisar
# saber se este workflow bloqueia merge consulta LÁ — não este comentário, que apodrece
# no primeiro flip.
#
# O QUE O ARQUIVO ABAIXO DE FATO FAZ (retrato datado 2026-08-14, contado do YAML por
# parser, não estimado): 48 steps, dos quais 8 são `uses:` de setup e 40 são steps de
# comando — 14 SEM `continue-on-error` e 26 COM. Os 14 sem se decompõem em 9 selftests
# + 2 guards (Cowork SSOT · ancora-adversário) + `detect-handoff` + o `Job summary`
# + o `npm install` do ajv (sem ele o modo `--schema` do DTCG sai 2, NÃO MEDIDO).
#
# A redação anterior deste bloco afirmava "os self-tests/guards rodam SEM continue-on-
# error" e isso era FALSO: dos 20 selftests do arquivo, 9 rodam sem e **11 rodam com**
# (detectar-telas ×2, ancora, anchor-content, cowork-freshness, importar-bundle, gerar-
# contrato, recortar-regiao, analise-regiao, gerar-map, consumir-map). A metade dos
# guards era verdadeira: 2 de 2 rodam sem. Nada foi promovido nem rebaixado ao corrigir
# a frase — mudou só o texto (promover/rebaixar é decisão [W] · ADR 0314/0336).
#
# Régua viva = o `continue-on-error:` ao lado de cada step. O número acima é retrato de
# uma data; se ele incomodar, RE-CONTE o YAML em vez de editar o número (§5 2026-07-17).
#
# Intenção de origem (ADR 0271/0275/0298 · 0336): sub-check de drift nasce advisory e só
# sobe por mordida provada. Node puro, sem DB/rede — segundos.
#
# Trigger: união dos paths dos 3 antigos (é exatamente onde cada drift nasce).

on:
  pull_request:
    branches: [main]
    paths:
      - 'resources/js/Components/ui/**'
      - 'resources/js/Components/layout/**'
      - 'resources/js/Pages/**/*.tsx'
      # 2ª raiz de Pages (PR #5686 — a tela mora no módulo dono). Sem estas duas linhas, um PR
      # que toca SÓ tela migrada não dispara esta lane: eram 73 telas + 37 charters fora do
      # gatilho, e a migração é 73 de 445 — a cegueira cresce a cada onda. As duas grafias
      # porque `page-path.mjs` (dono das raízes) aceita `Resources` e `resources`.
      - 'Modules/**/Resources/js/Pages/**'
      - 'Modules/**/resources/js/Pages/**'
      - 'prototipo-ui/**'
      - 'resources/css/tokens/**'   # inclui *.tokens.json, _generated-*.css e o style-dictionary.config
      - 'resources/css/inertia.css'
      - 'resources/css/foundations.css'
      - 'resources/css/cockpit.css'
      - 'scripts/governance/component-registry-check.mjs'
      - 'scripts/governance/component-registry-check.test.mjs'
      - 'scripts/governance/dtcg-equivalence.mjs'
      - 'scripts/governance/dtcg-equivalence.test.mjs'
      - 'scripts/governance/design-code-map-check.mjs'
      - 'scripts/governance/design-code-map-check.test.mjs'
      - 'prototipo-ui/gerar-map.mjs'
      - 'prototipo-ui/consumir-map.mjs'
      - 'memory/requisitos/**/*.map.json'
      - 'memory/requisitos/**/*.proto-baseline.json'
      - 'memory/requisitos/**/*-gap.md'
      - 'prototipo-ui/render-proto-baseline.mjs'
      - '.github/workflows/design-memory-gate.yml'
      - 'scripts/governance/design-gate-bites.mjs'
      - 'memory/governance/design-gate-bites.jsonl'
  workflow_dispatch:

concurrency:
  group: design-memory-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── ex-component-registry.yml (Onda O2) ──────────────────────────────────────
  registry-check:
    name: component-registry drift (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # self-test do próprio gate PRIMEIRO — prova que a sentinela morde/libera (sem máscara)
      - name: self-test da sentinela (.test.mjs · a suíte que valida o gate não pode mentir)
        run: node scripts/governance/component-registry-check.test.mjs
      # drift do registry real — continue-on-error (não derruba o job)
      - name: component-registry-check (advisory · report-only)
        continue-on-error: true
        run: node scripts/governance/component-registry-check.mjs --check --strict
      # papel-duplicado (ADR proposta tab-nav-canonico) — advisory · report-only.
      # Surface os hand-rolls independentes de papel canonizado (barra de abas de topo).
      - name: component-registry-check --roles (advisory · report-only)
        continue-on-error: true
        run: node scripts/governance/component-registry-check.mjs --roles

  # ── ex-design-memory-gates.yml ──────────────────────────────────────────────
  gates:
    name: design-memory gates (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # historico suficiente pro git diff vs origin/main funcionar
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Cowork SSOT guard: fonte ÚNICA do design — cowork/ build-only (zero .md) ·
      # sem bundles datados cowork-* · sem protótipo fora do allowlist. SEM
      # continue-on-error de propósito = ESTE step falha VERMELHO (Wagner: "deve dar
      # erro"). Se isso chega a bloquear merge quem responde é a branch protection, e o
      # dono dessa resposta é `governance/required-checks-baseline.json` (§5 2026-07-16).
      - name: Cowork SSOT guard (fonte única · build-only)
        run: node scripts/governance/cowork-ssot-guard.mjs

      # detect-handoff (2026-07-27): ligado aqui porque é AQUI que o sinal nasce — o
      # workflow já dispara em `prototipo-ui/**`. Estava órfão desde que nasceu (o sweep
      # `selftest-registry-check --scripts` o listava e ninguém julgava a lista).
      # REPORT-ONLY por construção: ele PARA no chip-spec (criar a tarefa é `spawn_task`,
      # tool do assistente) — nenhum estado muda por causa deste step.
      # MORDIDA PROVADA em sync REAL antes de ligar (não em fixture): `--base f9e116aab7~1`
      # (export "Preço especial", 17/07) reportou 2 arquivos de `produto-preco-especial`
      # mudados e SEM nenhum charter com `visual_source:` apontando pra eles — handoff
      # não-roteável que ninguém tinha visto justamente porque a máquina estava desligada.
      - name: detect-handoff (export cowork → chip por tela · report-only)
        run: node scripts/governance/detect-handoff.mjs --base origin/main

      # design-diff selftest: prova que o comparador design×prod PEGA o incidente 07/07
      # (center×left + button×div + overflow + roxo escuro×roxinho + texto dark invisível).
      # Se o comparador parar de morder, quebra VERMELHO (é a defesa do strike 2 · LICOES LC-06).
      - name: design-diff selftest (mede o que o olho perdeu · LC-06)
        run: node prototipo-ui/design-diff.mjs --selftest

      # style-fingerprint selftest: o VETOR de estilo completo (bbox, nº de linhas, overflow,
      # cor computada, radius, borda) por tema — regras 4/5/7 do inventário da Fase 1. Fixtures
      # com divergências plantadas (2-linhas, cor, radius, só-de-um-lado · L-31, provado dos dois
      # lados). Era o ÚNICO selftest do protocolo de aplicação de protótipo que não rodava em CI
      # (órfão); se o comparador de estilo parar de morder, quebra VERMELHO junto do design-diff
      # (os 2 comparadores da Fase 1). Puro node, sem browser/deps — o --snippet/--compare é que
      # dependem de página renderizada; o --selftest é hermético.
      - name: style-fingerprint selftest (vetor de estilo · regras 4/5/7 · Fase 1)
        run: node prototipo-ui/style-fingerprint.mjs --selftest

      # fingerprint-harness selftest: a ORQUESTRAÇÃO da matriz viewport×tema×estado (Onda 3a/3a.2).
      # Hermético (sem browser — a cola Playwright é a captura, não a orquestração): prova pareamento
      # por célula + agregação + regressão de recorte (mobile 375-only / tema-only) + o fluxo dos
      # ESTADOS hover/focus/active pro comparador. Se a orquestração parar de morder, quebra VERMELHO
      # junto dos 2 comparadores da Fase 1. A captura live proto×prod segue LOCAL/dispatch (ADR 0290).
      - name: fingerprint-harness selftest (orquestração matriz + estados + mobile · Onda 3a)
        run: node prototipo-ui/fingerprint-harness.mjs --selftest

      # protocolo.config selftest: a FONTE ÚNICA executável do protocolo (IDs dos 2 projetos
      # Cowork, staging fixo, mapa fase→comando). Trava drift — 2 IDs válidos+distintos (a confusão
      # dos projetos mordeu 3× em 2026-07-06), MIRROR_DIR presente, e TODO script do mapa FASES
      # existe. Se alguém renomear/mover um script do protocolo ou colidir os IDs, quebra VERMELHO.
      # "O protocolo sabe" deixa de depender do agente ter lido o INDEX §0.2 (Wagner 2026-07-09).
      - name: protocolo.config selftest (fonte única · IDs + paths + mapa de fases)
        run: node prototipo-ui/protocolo.config.mjs --selftest

      # DS-GUARD nos arquivos TOCADOS (css/html de design-memory). O ds-guard so
      # checa .css/.html; .tsx e ignorado por ele (log '. ... ignorado'), entao
      # alimentamos so o que ele entende. Sem arquivos tocados -> ds-guard imprime
      # uso e sai 0 (nao derruba o job). continue-on-error abaixo.
      - name: DS-GUARD (arquivos tocados · §8)
        if: always()  # advisory roda mesmo se o ssot-guard (hard-fail) falhar antes — senao skipa
        continue-on-error: true
        run: |
          BASE="origin/${{ github.base_ref }}"
          if [ -z "${{ github.base_ref }}" ]; then BASE="origin/main"; fi
          CHANGED=$(git diff --name-only "$BASE"...HEAD -- 'prototipo-ui/**' 'resources/js/Pages/**' | grep -E '\.(css|html)$' || true)
          if [ -z "$CHANGED" ]; then
            echo "Nenhum .css/.html de design-memory tocado neste PR — nada a checar (ds-guard so checa css/html)."
            exit 0
          fi
          echo "Arquivos tocados (css/html) que o ds-guard vai checar:"
          echo "$CHANGED"
          echo "---"
          node prototipo-ui/ds-guard.mjs $CHANGED

      # DS-GUARD --all: relatorio de divida da arvore (NAO derruba o job por design · §8).
      # Sempre roda, da visibilidade da divida acumulada (paleta inventada / tela na raiz).
      - name: DS-GUARD relatorio de divida (--all · §8)
        if: always()
        continue-on-error: true
        run: node prototipo-ui/ds-guard.mjs --all

      # integrity-check: a propria memoria nao corrompeu (espinha · charter tem tela viva .tsx ·
      # LICOES contiguas · benchmark). Sai 1 se algum IT duro falhar; advisory aqui.
      - name: Integrity check (espinha da memoria · §15)
        if: always()
        continue-on-error: true
        run: node prototipo-ui/integrity-check.mjs

      # detectar-telas --selftest: trava de regressao do gate de import (Fase 0/0.5 do
      # protocolo aplicar-prototipo). O fixture hermetico (prototipo-ui/fixtures/detectar-telas/)
      # prova: mockup sem charter resolvido por ALIAS (P0 lock) · orfao detectado · diff
      # diffavel correto. O modo --staging (bundle->repo) so roda local (bundle vive fora do
      # repo). Advisory de nascenca (ADR 0271/0275). Já integrado ao gate-selftest.mjs (id
      # 'detectar-telas', good/bad em tests/governance-fixtures/) — este step aqui é a redundância
      # de defesa dentro do gate de design; a outra ponta é a catraca do gate-selftest
      # (se ELA é required, quem responde é `governance/required-checks-baseline.json`).
      - name: detectar-telas selftest (gate de import · Fase 0/0.5)
        # if: always() — roda mesmo quando um step hard-fail antes (ex: cowork-ssot-guard com
        # drift pre-existente prototipos/perfil) skiparia os steps seguintes. O selftest e'
        # independente do ssot-guard; o continue-on-error abaixo mantem ESTE step nao-fatal.
        if: always()
        continue-on-error: true
        run: node prototipo-ui/detectar-telas.mjs --selftest
      # detectar-telas.test.mjs: a sentinela ALIAS↔charter (fonte única) JÁ existia e provava
      # que morde (anti-drift A/B + meta-tests c1/c2), mas NUNCA rodava em CI (defesa construída
      # e DESARMADA). Armada aqui. Check C endurece B: charter que COBRE um mockup do ALIAS
      # (component/bundle_source) = redundante (2 fontes do mesmo fato). Node puro, segundos.
      - name: detectar-telas anti-drift ALIAS↔charter (fonte única · A+B+C)
        if: always()
        continue-on-error: true
        run: node prototipo-ui/detectar-telas.test.mjs
      # ancora.mjs (#7 2026-06-30): a âncora de uma tela é computada do charter, nunca um png
      # de auditoria no olho. importar-bundle: só troca o staging quando extraídos==entries
      # (delete-before-verify fechado). Ambos selftest puro (rodam em Linux/CI).
      - name: ancora selftest (âncora = charter, não print de auditoria)
        if: always()
        continue-on-error: true
        run: node prototipo-ui/ancora.mjs --selftest
      # Conteúdo da âncora (Wagner 2026-07-06): o ancora.mjs prova PROVENIÊNCIA (declarada no
      # charter), não CORREÇÃO (o arquivo bate com a tela). 2/9 âncoras estavam podres
      # (shell/fantasma) e nenhum gate viu — Wagner pegou no instinto. Este abre a âncora.
      - name: anchor-content selftest (o gate morde e libera certo)
        if: always()
        continue-on-error: true
        run: node scripts/governance/anchor-content-check.test.mjs
      - name: anchor-content-check (âncora aponta pro FONTE da tela, não shell/fantasma · advisory)
        if: always()
        continue-on-error: true
        run: node scripts/governance/anchor-content-check.mjs --check
      # Frescor do espelho (INDEX §0.2 "diffar antes de concluir" · session 2026-07-06-arte):
      # o CI headless NÃO lê o Cowork vivo (auth interativa, sem webhook/service-token na
      # plataforma) — então AQUI não se mede frescor. Mede-se (a) que o comparador classifica
      # certo (selftest: identidade = hash normalizado por path completo) e (b) que a ROTINA
      # de dispatch logado rodou dentro do SLA e a última rodada não deixou STALE (ledger
      # datado e commitado — prova, não promessa). Frescor real = o dispatch logado.
      - name: cowork-freshness selftest (identidade normalizada por path · morde e libera certo)
        if: always()
        continue-on-error: true
        run: node scripts/governance/cowork-mirror-freshness.test.mjs
      # O --sla SEMPRE mediu certo; o que faltava era o veredito CHEGAR em alguém. Ele saía
      # rc=1 dentro de um step `continue-on-error`, então o motivo ficava enterrado no log e
      # só era lido por quem já suspeitava. Medido em 2026-08-14: rc=1 com "20 sync · 0 stale ·
      # 98 unchecked · mediu 23/121" ACESO desde 2026-08-13 — e a defasagem do `chat-jana.jsx`
      # (7 semanas) foi descoberta por tropeço numa sessão, não por este alarme.
      # NÃO muda enforcement: segue advisory, segue continue-on-error, e o rc real é preservado
      # (`exit $rc`) — advisory pode ficar vermelho, §5 2026-07-09. O que muda é que o número
      # vai pro resumo do PR, onde se lê sem abrir log.
      # "0 stale" NUNCA é o veredito sozinho: ele só cobre o que foi medido, e o denominador
      # é que diz o resto (§5 2026-07-29 — não afirmar sobre o que não se percorreu).
      - name: cowork-freshness SLA (rotina de dispatch em dia? · ledger · advisory)
        if: always()
        continue-on-error: true
        run: |
          OUT="${RUNNER_TEMP:-.}/cowork-sla.txt"
          node scripts/governance/cowork-mirror-freshness.mjs --sla > "$OUT" 2>&1
          rc=$?
          cat "$OUT"
          {
            echo "### Espelho Cowork — SLA de frescor (advisory)"
            echo ""
            if [ "$rc" -eq 0 ]; then
              echo "✅ rotina de dispatch em dia."
            else
              echo "⚠️ **rotina PARCIAL ou vencida** — \`rc=$rc\`"
            fi
            echo ""
            echo '```'
            sed -n '1,12p' "$OUT"
            echo '```'
            echo ""
            echo "_Advisory: não bloqueia merge (dono de \`required\` é \`governance/required-checks-baseline.json\`)._"
            echo "_Cobertura parcial significa que \`0 stale\` cobre **só o que foi medido** — o resto segue sem veredito._"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      # Poda do espelho (PR #5763, 96 arquivos): ao contrário do --compare acima, ESTE é 100%
      # local — não precisa da auth interativa do DesignSync, então roda headless no CI. Só
      # olha o que o PR APAGA sob prototipo-ui/cowork/ e pergunta se sobrou alguém apontando
      # pra lá. PR que não deleta nada do espelho passa sem ter o que medir (diff-aware).
      # FP medido nos 4 commits que já podaram o espelho: 0. Mordida provada em gate-selftest
      # (fixture cowork-refs boa/ruim) — sem o par, "nunca disparou" seria indistinguível de cego.
      - name: cowork-refs (a poda quebrou o render do protótipo? · advisory)
        if: always()
        continue-on-error: true
        run: node scripts/governance/cowork-mirror-freshness.mjs --check-refs
      # ABSENT-LOCAL — "o espelho pegou todos os componentes, subpáginas, CSS e JS?" ([W]
      # 2026-08-14). É o 4º flanco do cabeçalho do script e, até este PR, era MEDIDO e
      # INCAPAZ DE REPROVAR: `reportAbsentLocal` só imprimia e o exit do --manifest vem do
      # `shouldFail()`, que morde SÓ em STALE — gate mudo com cara de cobertura.
      # Complementa o cowork-refs acima sem duplicá-lo: aquele deriva o universo do DIFF
      # (só vê o que o PR APAGA), este deriva do SHELL (vê o que o render PRECISA) — apagar
      # o espelho inteiro passa vazio no primeiro e é pego por este.
      # 100% local: lê o shell do próprio espelho, zero DesignSync — por isso é gateável, ao
      # contrário do --compare/--live-only, que precisam da auth interativa (ADR 0315).
      # NÃO responde "está atualizado?" (isso é --compare/--live-only, e segue sem invocador
      # por causa da auth) — responde "está COMPLETO?". Universos distintos, §5 2026-08-11.
      # Estado medido ao ligar: 120 deps do shell, 117 vivas fora de `_ds/`, 0 ausentes.
      # Bite provado local: esconder `styles.css` → exit 1; restaurar → exit 0. Fail-closed
      # sem shell (exit 2) — "não consegui medir" nunca vira verde (§5 2026-07-29).
      # Advisory de nascença (ADR 0275); promoção só por mordida provada (ADR 0336).
      - name: cowork absent-local (o espelho tem toda dep que o shell carrega? · advisory)
        if: always()
        continue-on-error: true
        run: node scripts/governance/cowork-mirror-freshness.mjs --absent-local
      - name: importar-bundle selftest (import atômico · verifica antes de trocar)
        if: always()
        continue-on-error: true
        run: node prototipo-ui/importar-bundle.mjs --selftest
      # adversário permanente: ATAQUE 1 (hook auto-contido, não falha-aberto) é GATE DURO —
      # se o hook voltar a importar ancora.mjs (regride pra fail-open), este step FALHA. Gaps
      # conhecidos (rename/tool-bypass) ficam documentados com fix; mudar de comportamento avisa.
      - name: ancora-adversário (ATAQUE 1 não pode regredir pra fail-open)
        if: always()
        run: node scripts/evals/ancora-adversario.eval.mjs
      # W1 do processo região-a-região: deriva o esqueleto do <tela>.contract.json do gap.md
      # (não "no olho"). Selftest hermético (fixture gap.md 2 regiões + par bom/ruim do --check).
      - name: gerar-contrato selftest (W1 região-a-região)
        if: always()
        continue-on-error: true
        run: node prototipo-ui/gerar-contrato.mjs --selftest
      # W2: recorte do screenshot pela âncora da região (aprova a PARTE, não a tela). O PLANO
      # de recorte é puro (testável no CI); o crop (PowerShell) e a coleta de bbox (browser) só
      # rodam local. Selftest = região sem bbox → AUSENTE explícito, nunca tela-inteira em silêncio.
      - name: recortar-regiao selftest (W2 região-a-região)
        if: always()
        continue-on-error: true
        run: node prototipo-ui/recortar-regiao.mjs --selftest
      # W3: roteia cada região ao crítico especializado (design-critique/ux-copy/a11y/screen-grade)
      # ESCOPADO ao recorte do W2, não à tela. Selftest = roteamento determinístico (a crítica é o agente).
      - name: analise-regiao selftest (W3 região-a-região)
        if: always()
        continue-on-error: true
        run: node prototipo-ui/analise-regiao.mjs --selftest
      # Fase 1 do RUNBOOK: <tela>.map.json — ponte design↔código persistente (Code-Connect-like).
      # gerar-map deriva o esqueleto do gap.md (nunca fabrica linha); design-code-map-check valida
      # âncoras no disco + detecta STALE via sha (protótipo re-exportou) + calcula a % de telas
      # com mapping versionado (métrica gradeável do roadmap #1, estado-da-arte 2026-06-22).
      - name: gerar-map selftest (Fase 1 — esqueleto do map.json)
        if: always()
        continue-on-error: true
        run: node prototipo-ui/gerar-map.mjs --selftest
      # Fase 4: consumir-map é o CONSUMO do map.json (PR-C 2026-07-09) — portão de frescor por
      # CONTEÚDO (ADR 0324, sha256:contentHash — pega re-export sem commit, imune a commit que
      # toca path sem mudar conteúdo) + plano de leitura (a sessão abre SÓ os ranges).
      - name: consumir-map selftest (Fase 4 — portão de frescor morde exit 3 / solta plano)
        if: always()
        continue-on-error: true
        run: node prototipo-ui/consumir-map.mjs --selftest
      - name: design-code-map-check selftest (morde âncora quebrada + sha stale · libera íntegro/TODO)
        if: always()
        run: node scripts/governance/design-code-map-check.test.mjs
      - name: design-code-map-check (advisory · report-only · cobertura + drift real)
        if: always()
        continue-on-error: true
        run: node scripts/governance/design-code-map-check.mjs --check --strict
      # PROTO-BASELINE (roubo #7, régua Applitools Eyes): o design renderizado vira baseline
      # versionado (<tela>.proto-baseline.json) e a prod é comparada contra a INTENÇÃO, não só
      # contra o próprio passado. FRONTEIRA ADR 0290: o RENDER roda LOCAL (--gerar recusa sob CI,
      # exit 4 — render pareado em CI passa verde quando os 2 lados quebram); AQUI só roda o
      # --check HERMÉTICO sobre o JSON commitado: schema + âncora re-resolvida do charter
      # (ancora.mjs, ADR 0326) + freshness por prototipo_sha (padrão do map.json — proto
      # re-exportou = STALE). Selftest hard (a suite que valida o gate não pode mentir);
      # check advisory de nascença (ADR 0271/0275/0314 — nunca required sem reabrir a 0314).
      - name: render-proto-baseline selftest (morde stale/âncora/vazio · libera íntegro · fronteira 0290)
        if: always()
        run: node prototipo-ui/render-proto-baseline.mjs --selftest
      - name: proto-baseline check (advisory · hermético — âncora + freshness dos baselines commitados)
        if: always()
        continue-on-error: true
        run: node prototipo-ui/render-proto-baseline.mjs --check
      # O COMPARE possível em CI (fronteira ADR 0290 — o compare REAL proto×prod exige render
      # dos DOIS lados = LOCAL por lei): mapear os arquivos da PR pros baselines commitados do
      # mesmo módulo e apontar o comando local exato (--nudge, exit 0 sempre). Zero render,
      # zero rede — git diff × JSONs commitados. Lado-proto coberto pelo --check acima (sha
      # STALE quando o protótipo re-exporta); lado-Page coberto por este nudge + passo local
      # do RUNBOOK-fidelidade-fingerprint §Baseline.
      - name: proto-compare nudge (advisory · aponta o compare LOCAL pro módulo afetado)
        if: always()
        continue-on-error: true
        run: |
          BASE="origin/${{ github.base_ref }}"
          if [ -z "${{ github.base_ref }}" ]; then BASE="origin/main"; fi
          git diff --name-only "$BASE"...HEAD -- 'resources/js/Pages/**' \
            | node prototipo-ui/render-proto-baseline.mjs --nudge | tee -a "$GITHUB_STEP_SUMMARY"

  # ── ex-dtcg-equivalence.yml (Onda DTCG ATIVADA) ──────────────────────────────
  # JOB PRÓPRIO — de propósito. O required context do GitHub é o **job**, não o step: deixar
  # este check dentro de `gates` (27 steps `continue-on-error`) tornaria impossível promovê-lo
  # sem arrastar os 27 junto. Aqui ele é sozinho, determinístico e sem `continue-on-error`,
  # então o vermelho dele significa exatamente uma coisa.
  #
  # ⚠️ DÍVIDA DECLARADA (LC-10): o context nasce como `Design-memory gate (advisory) / …` —
  # o "(advisory)" vem do NOME DO WORKFLOW e vira afirmação falsa no dia que [W] promover.
  # Renomear o workflow é seguro (medido 2026-08-17: ZERO contexts dele no
  # `required-checks-baseline.json`), mas é decisão dele, não carona deste PR.
  espelho-verificado:
    name: espelho — mexeu depois de verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # o detector compara data-de-commit × data-de-verificação: história rasa mede o PISO
          # da história, não a história (§5 2026-07-24). fetch-depth 0 é requisito, não zelo.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Sem `continue-on-error`: este job existe pra poder ficar vermelho.
      # Hoje `--check` morde só em MEXIDO-DEPOIS; NUNCA-VERIFICADO não bloqueia (forward-only,
      # ADR 0275) e ledger sem o campo `verified` imprime SEM DADO, não verde (LC-13).
      - name: espelho editado sem prova de fidelidade
        run: node scripts/governance/cowork-mirror-freshness.mjs --unverified --check

  prove:
    name: equivalencia DTCG <-> CSS canonico (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ajv é a MESMA engine que scripts/memory-schemas/validate.mjs ja usa pros schemas
      # de memory/** — reuso da dependencia que o repo ja tem, nao motor novo. Sem ela o
      # modo --schema sai 2 (NAO MEDIDO) em vez de verde calado, e o self-test cobra isso.
      - name: Install deps do validador de schema (ajv)
        run: npm install --no-save ajv@^8.17.1 ajv-formats@^3.0.1

      - name: Self-test (fixture boa passa + fixture ruim falha)
        run: node scripts/governance/dtcg-equivalence.test.mjs

      # FORMA (cinturao DTCG). O passo seguinte prova VALOR e depende de forma: token sem
      # `$extensions.com.oimpresso.source` nao tem endereco canonico pra comparar. Este
      # passo pega isso na origem, com a mensagem do campo que falta.
      # `set -o pipefail`: sem ele o rc do step vem do `tee` e o node falha calado
      # (scripts/governance/workflow-pipe-rc.test.mjs cobra este padrao).
      - name: Forma — *.tokens.json contra dtcg.schema.json (advisory)
        id: forma
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/governance/dtcg-equivalence.mjs --schema | tee /tmp/dtcg-schema.txt

      - name: Provar equivalencia (advisory)
        id: prove
        continue-on-error: true  # divergencia nao derruba ESTE job (ADR 0271/0275)
        run: |
          node scripts/governance/dtcg-equivalence.mjs --json > /tmp/dtcg.json
          node scripts/governance/dtcg-equivalence.mjs --detail | tee /tmp/dtcg.txt

      - name: Job summary (provados iguais / divergencias)
        if: always()
        run: |
          {
            echo '## DTCG <-> CSS canonico — equivalencia (Onda DTCG)'
            echo ''
            echo 'Onda DTCG ATIVADA. Prova que cada token DTCG tem'
            echo 'o MESMO valor que o CSS emitido (_generated-*.css) que o build consome.'
            echo 'Divergencia aqui = edicao manual no gerado OU regressao do gerador.'
            echo 'Este texto nao declara se o check bloqueia merge — o dono dessa resposta'
            echo 'e governance/required-checks-baseline.json.'
            echo ''
            echo '### Forma (JSON Schema)'
            echo ''
            echo '```'
            cat /tmp/dtcg-schema.txt 2>/dev/null || echo '(sem saida — ver o passo Forma)'
            echo '```'
            echo ''
            echo '### Valor (DTCG <-> CSS)'
            echo ''
            echo '```'
            cat /tmp/dtcg.txt 2>/dev/null || echo '(sem saida — ver passo anterior)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── bite-log dos gates de design (DR-2a da ADR 0336) ─────────────────────────
  # O artefato que a 0336 mandou construir e nunca foi: memory/governance/
  # design-gate-bites.jsonl registra, append-only, cada MORDIDA (gate de design cujo
  # --check daria fail num sha que MERGEOU). A DR-2 promove a required quem tiver >=2
  # PRs distintos mordidos; sem este ledger, o advisory emite ::warning:: + exit 0 e
  # a mordida some -> promocao vira chute. COLETA: o ZELADOR roda '--scan' e inclui as
  # mordidas novas no PR diario (reuso do dono existente, nao workflow novo com secret).
  # Aqui: self-test HARD (a maquina que conta nao pode mentir) + tally advisory (placar).
  bite-log:
    name: design bite-log DR-2a (self-test + tally · advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # HARD: prova que o recorder morde/libera/dedupa/conta certo (sem mascara).
      - name: design-gate-bites self-test (morde · libera · dedup · tally)
        run: node scripts/governance/design-gate-bites.mjs --selftest
      # advisory: placar de mordidas por gate (criterio DR-2 >=2 PRs distintos).
      - name: design-gate-bites tally (advisory · placar DR-2 no summary)
        continue-on-error: true
        run: node scripts/governance/design-gate-bites.mjs --tally | tee -a "$GITHUB_STEP_SUMMARY"
