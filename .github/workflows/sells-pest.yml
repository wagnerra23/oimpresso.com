name: Sells · Pest (MySQL)

# Lane dedicada pra rodar teste Pest MySQL-only de Sells contra MySQL REAL.
#
# POR QUE EXISTE
# Nenhuma lane rodava `tests/Feature/Sells/**` em MySQL (varrido em 2026-07-27: as 9 lanes
# `DB_CONNECTION: mysql` são arquivos/compras/essentials/estoque/financeiro/jana/kb/nfebrasil/
# ponto — nenhuma inclui Sells). O `ci.yml` roda SQLite :memory:, onde todo teste que depende
# do schema UltimatePOS + seed biz=1/biz=2 dá `markTestSkipped` — falsa cobertura. Resultado:
# os 72 arquivos de `tests/Feature/Sells/` eram quase todos ESTRUTURAIS (`file_get_contents` +
# match de string), e `Sells/Show.tsx` chegou ao topo do débito Tier-0 (`exposicao-tier0.mjs`:
# score 11, dinheiro+estoque+fiscal) sem um único teste de comportamento.
#
# Nasce com `SellsShowContratoTest` (UC-VSHOW-01..07 de `Sells/Show.casos.md`) e é o HOME do
# ratchet pra TODO teste MySQL-only de Sells — cada novo entra na allowlist abaixo (mesma
# disciplina de essentials-pest.yml / estoque-pest.yml).
#
# Reusa .github/actions/pest-mysql-setup: PHP 8.4 + deps + .env MySQL + migrate (schema
# baseline) + seed biz=1 (fixture) E biz=2 (Tier 0 cross-tenant — a origem do "outro business"
# que UC-VSHOW-01 usa).
# Refs: ADR 0093 (multi-tenant Tier 0) · ADR 0101 (biz=1, nunca biz=4) · ADR 0264 (G-2).

on:
  workflow_dispatch: {}
  # pull_request SEM paths (always-run) + skip-as-pass interno (dorny/paths-filter):
  # se nada de Sells mudou, pula o pesado e conclui verde (mesmo padrão do essentials-pest.yml,
  # ADR 0271 onda 2 — required-ready sem deadlock).
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'tests/Feature/Sells/**'
      - 'Modules/PaymentGateway/Services/Tef/**'  # TEF no caixa (US-SELL-075)
