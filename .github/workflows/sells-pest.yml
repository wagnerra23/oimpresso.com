concurrency:
  group: sells-pest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    name: PHP / Pest (Sells · MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oimpresso_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Detectar mudanças de Sells (skip-as-pass)
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            sells:
              - 'tests/Feature/Sells/**'
              - 'Modules/PaymentGateway/Services/Tef/**'  # TEF no caixa (US-SELL-075)
              - 'Modules/PaymentGateway/Http/Controllers/TefController.php'
              - 'tests/Feature/CutoverMenu/VendasListasSemXInertiaTest.php'
              - 'Modules/ProductCatalogue/Http/Controllers/ProductCatalogueController.php'
              - 'Modules/ProductCatalogue/Services/CatalogueQrService.php'
              - 'app/Transaction.php'
              - 'Modules/Compras/Observers/TransactionSellLineCustoObserver.php'
              - 'Modules/Compras/Providers/ComprasServiceProvider.php'
              - 'app/Contracts/Compras/**'  # UC-FLX-34 custo no detalhe do orcamento
