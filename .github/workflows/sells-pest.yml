name: Sells · Pest (MySQL)

# Lane dedicada pra rodar teste Pest MySQL-only de Sells contra MySQL REAL.
#
# POR QUE EXISTE
# Nenhuma lane rodava `tests/Feature/Sells/**` em MySQL (varrido em 2026-07-27: as 9 lanes
# `DB_CONNECTION: mysql` são arquivos/compras/essentials/estoque/financeiro/jana/kb/nfebrasil/
# ponto — nenhuma inclui Sells). O `ci.yml` roda SQLite :memory:, onde todo teste que depende
# do schema UltimatePOS + seed biz=1/biz=2 dá `markTestSkipped` — falsa cobertura. Resultado:
# os 72 arquivos de `tests/Feature/Sells/` eram quase todos ESTRUTURAIS (`file_get_contents` +
# match de string), e `Sells/Show.tsx` chegou ao topo do débito Tier-0 (`exposicao-tier0.mjs`:
# score 11, dinheiro+estoque+fiscal) sem um único teste de comportamento.
#
# Nasce com `SellsShowContratoTest` (UC-VSHOW-01..07 de `Sells/Show.casos.md`) e é o HOME do
# ratchet pra TODO teste MySQL-only de Sells — cada novo entra na allowlist abaixo (mesma
# disciplina de essentials-pest.yml / estoque-pest.yml).
#
# Reusa .github/actions/pest-mysql-setup: PHP 8.4 + deps + .env MySQL + migrate (schema
# baseline) + seed biz=1 (fixture) E biz=2 (Tier 0 cross-tenant — a origem do "outro business"
# que UC-VSHOW-01 usa).
# Refs: ADR 0093 (multi-tenant Tier 0) · ADR 0101 (biz=1, nunca biz=4) · ADR 0264 (G-2).

on:
  workflow_dispatch: {}
  # pull_request SEM paths (always-run) + skip-as-pass interno (dorny/paths-filter):
  # se nada de Sells mudou, pula o pesado e conclui verde (mesmo padrão do essentials-pest.yml,
  # ADR 0271 onda 2 — required-ready sem deadlock).
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'tests/Feature/Sells/**'
      - 'app/Http/Controllers/SellController.php'
      - 'app/Http/Controllers/SellPosController.php'
      # Sob teste em SellsCreateV3ContratoTest (UC-V302/V303). Sem este gatilho, mexer no
      # controller do preview não dispararia o teste dele — gate mudo com cara de cobertura.
      - 'app/Http/Controllers/SellsV3Controller.php'
      - 'app/Utils/TransactionUtil.php'
      - 'resources/js/Pages/Sells/**'
      - 'database/schema/mysql-schema.sql'
      - '.github/workflows/sells-pest.yml'
      - '.github/actions/pest-mysql-setup/**'

concurrency:
  group: sells-pest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    name: PHP / Pest (Sells · MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oimpresso_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Detectar mudanças de Sells (skip-as-pass)
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            sells:
              - 'tests/Feature/Sells/**'
              - 'app/Http/Controllers/SellPosController.php'
              - 'app/Http/Controllers/SellsV3Controller.php'
              - 'app/Utils/TransactionUtil.php'
              - 'app/Http/Controllers/SellController.php'
              - 'resources/js/Pages/Sells/**'
              - 'database/schema/mysql-schema.sql'
              - '.github/workflows/sells-pest.yml'
              - '.github/actions/pest-mysql-setup/**'

      - name: Skip-as-pass (nada de Sells mudou)
        if: steps.changes.outputs.sells == 'false'
        run: echo "✅ Sem mudanças em Sells — skip-as-pass (required-ready)."

      - name: Setup Pest MySQL (PHP + deps + .env + migrate + seed biz=1/biz=2)
        if: steps.changes.outputs.sells == 'true'
        uses: ./.github/actions/pest-mysql-setup

      - name: Stub Vite manifest (Inertia root view sem build do front)
        if: steps.changes.outputs.sells == 'true'
        run: |
          mkdir -p public/build-inertia
          cat > public/build-inertia/manifest.json <<'EOF'
          {
            "resources/css/inertia.css": { "file": "assets/inertia.css", "src": "resources/css/inertia.css", "isEntry": true },
            "resources/js/app.tsx": { "file": "assets/app.tsx", "src": "resources/js/app.tsx", "isEntry": true }
          }
          EOF

      - name: Run Pest (Sells · MySQL) — ALLOWLIST VERDE (catraca)
        if: steps.changes.outputs.sells == 'true'
        # phpunit.xml força DB_CONNECTION=sqlite :memory: — sobrescreve aqui pra rodar no
        # MySQL real semeado (biz=1 + biz=2). Allowlist: só arquivos comprovadamente verdes
        # MySQL-only. NÃO incluir RefreshDatabase/migrate:fresh (dropam schema + limpam o
        # seed). Este usa DatabaseTransactions.
        #
        # 2026-07-28 — allowlist 1 → 4. Os 3 novos JÁ EXISTIAM no repo e não rodavam em
        # lugar nenhum (a falsa cobertura que esta lane nasceu pra curar):
        #   · SellsIndexTenantContratoTest (#4868) — ficou órfão quando o merge das duas
        #     sessões paralelas resolveu o conflito da lane pela versão que não o citava;
        #   · Wave1ShowBaselineTest / Wave1ShowInertiaTest — estruturais, no repo desde
        #     05-15. O Inertia estava VERMELHO há 2 meses (assert exigia `vendas-cockpit`,
        #     diretório inexistente) e ninguém via, porque nada os executava.
        # Os 2 Wave1 não precisam de MySQL (leem arquivo), mas entram aqui em vez da lane
        # sqlite porque é onde o gatilho por-path de Sells já existe — 1 chokepoint, não 2.
        #
        # 2026-08-07 — allowlist 4 → 5. SellsCreateV3ContratoTest (US-SELL-058, UC-V301/302/303):
        # contrato da tela de preview /sells/create-v3 — rota registrada, ausência de rota de
        # escrita, e a FRONTEIRA que justifica a tela existir (o V3 não encosta em Create.tsx
        # nem em SellPosController). Não toca DB: lê o roteador em runtime + os arquivos.
        # Entra aqui pelo mesmo motivo dos 2 Wave1 — é onde o gatilho por-path de Sells já mora.
        # NASCE SEM RUN: nunca foi executado (lane roda no CI, nunca local · ADR 0062). Se este
        # PR ficar vermelho aqui, é este arquivo — não regressão dos 4 anteriores.
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_DATABASE: oimpresso_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          mkdir -p test-results
          vendor/bin/pest --no-coverage --colors=always \
            --log-junit test-results/pest-sells-junit.xml \
            tests/Feature/Sells/SellsShowContratoTest.php \
            tests/Feature/Sells/SellsIndexTenantContratoTest.php \
            tests/Feature/Sells/SellsCreateV3ContratoTest.php \
            tests/Feature/Sells/Wave1ShowBaselineTest.php \
            tests/Feature/Sells/Wave1ShowInertiaTest.php


      # Passo 1 do plano da LC-13 (Gate:): a lane JA emitia JUnit e NINGUEM lia.
      # O sumario conta `assertions` por arquivo — e o corpus que falta pra medir
      # o FP do --check-assertions ANTES de arma-lo. Aqui so REPORTA (if: always()).
      - name: Sumario JUnit por arquivo (junit-summary.mjs — corpus p/ LC-13)
        if: always()
        run: node scripts/tests/junit-summary.mjs test-results/pest-sells-junit.xml --out test-results/pest-sells-junit-summary.json || true
      # ── PASSO 3 do plano do LC-13 — ARMADO (flip [W] 2026-08-16) ─────────────────
      # Guardado pela MESMA condicao do run de Pest, NUNCA pelo `if: always()` do step
      # de corpus acima: la o step roda ate quando o skip-as-pass (ADR 0271 onda 2)
      # impediu o Pest e o XML nem existe — armar ali ficaria vermelho em todo PR que
      # nao toca o modulo. Medido 2026-08-16; e a razao de isto ser um step PROPRIO e
      # nao um flag no de cima.
      #
      # MORDE quando a lane RODOU e nao provou nada: `0 failed` com 0 assertions e
      # ausencia de EXECUCAO, nao sucesso (LC-13 — "VERDE por NAO-EXECUCAO").
      # Sem `always()`/`!cancelled()`, o `success()` implicito vale: se o Pest falhou,
      # este step e pulado e a lane ja esta vermelha por conta propria (nao duplica).
      - name: Suite provou algo? (--check-assertions · LC-13)
        if: steps.changes.outputs.sells == 'true'
        run: node scripts/tests/junit-summary.mjs test-results/pest-sells-junit.xml --check-assertions

      - name: Upload sumario JUnit (pest-sells-junit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pest-sells-junit-summary
          path: test-results/pest-sells-junit-summary.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload JUnit (Sells · MySQL)
        if: ${{ !cancelled() && steps.changes.outputs.sells == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pest-sells-junit
          path: test-results/pest-sells-junit.xml
          retention-days: 14
