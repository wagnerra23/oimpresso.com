      - 'app/Exceptions/MargemAbaixoDoMinimo.php'
      - 'database/migrations/2026_10_19_220000_add_margem_minima_to_fsm_modelos_empresa.php'
      - 'database/migrations/2026_10_29_120000_add_duplicated_from_id_to_transactions.php'  # P-031/P-035 duplicar com origem
