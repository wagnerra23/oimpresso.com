name: Governance script tests (advisory)

# Roda os testes de regressao dos scripts de governanca (scripts/governance/*.test.mjs).
# Fecha o gap "test local-only" (auditoria IA OS Onda 1, gap #2) para os scripts de
# governanca: ate aqui esses .test.mjs so rodavam na maquina do dev.
#   - adr-index-generate.test.mjs       decoder de titulo !!binary (Onda 1, gap #1, PR #3056)
#   - shipped-log-generate.test.mjs     fonte honesta do shipped-log (porta de saida, ADR 0294 ext)
# (R10 block-pr-without-approval removido a pedido do Wagner 2026-06-24 — ver commit.)
# Node puro, sem deps/DB/rede -- segundos. Advisory de nascenca (gates novos nunca
# nascem required -- ADR 0271/0275); nao entra em branch protection.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: governance-script-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: governance script tests (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Decoder de titulo !!binary (adr-index-generate)
        run: node scripts/governance/adr-index-generate.test.mjs
      - name: Fact-anchor Check T (versoes derivaveis · fixtures boa/ruim · proposal fatos-derivaveis)
        run: node scripts/governance/fact-anchor.test.mjs
      - name: System-map camada de IA (censo derivado · morde no caching.embeddings que a mao contou errado)
        run: node scripts/governance/system-map-ia.test.mjs
      - name: Grupo de memoria por modulo (case-trap Pages/kb x requisitos/KB + token no nome do arquivo)
        run: node scripts/governance/module-group-resolve.test.mjs
      - name: Shipped-log gerador honesto (fixtures-armadilha)
        run: node scripts/governance/shipped-log-generate.test.mjs
      - name: Dup-detector L3 (overlap/ack/exclude)
        run: node scripts/governance/dup-detector.test.mjs
      - name: Protection-drift frescor da orfa (computed_at do conteudo, nao o tip · V5 GT-G4)
        run: node scripts/governance/protection-drift-freshness.test.mjs
      - name: Outcome metrics (medidor de aceitacao · fixtures-armadilha · Onda O1)
        run: node scripts/governance/outcome-metrics.test.mjs
      - name: Agent PR outcomes (DORA do agente · CFR morde/libera · card #0 grade-das-reguas)
        run: node scripts/governance/agent-pr-outcomes.test.mjs
      - name: Agent cost per PR (custo USD por PR · join 2-sinais morde/libera · item #7 grade-das-reguas)
        run: node scripts/governance/agent-cost-per-pr.test.mjs
      # Blinda a MATEMÁTICA (pearson/spearman) do outcome-probe do funcao-scorecard — o "número
      # real" (r=0.26) da proposta 2026-07-21-funcao-scorecard-validacao-por-outcome sustenta-se
      # nessas funções; um pearson bugado seria LC-08 (medir errado). Prova contra valores conhecidos
      # + point-biserial conferido à mão. Advisory por desenho (ADR 0314/0275: required = só Tier-0).
      - name: funcao-scorecard outcome-probe (estatística da correlação nota↔outcome · barra CodeScene)
        run: node scripts/governance/funcao-scorecard-outcome-probe.test.mjs
      # Aritmetica de viabilidade do contrafactual de corpus (chip C1 da grade 2026-07-17 ·
      # fraqueza F1 "corpus nunca medido" 3/10). O harness de 3 arms foi PODADO em
      # 2026-07-17 (autorizado [W]: zero invocador + experimento nao autorizado, ADR
      # 0105/0334) -- sobrou a aritmetica que responde "quantas rodadas pra ver delta?",
      # que foi o que matou a versao cara do chip.
      # O selftest SIMULA (Monte Carlo deterministico, semente fixa, ~170ms) em vez de
      # conferir a formula contra si mesma: prova que nNeededFor CUMPRE os 80% de poder
      # que promete, e que o decisor nao grita vencedor sob H0 nem em n=5. Formula que
      # mentisse SUBESTIMARIA o custo do experimento -- o numero que [W] usa pra decidir.
      # Deterministico de proposito: nao flaka. Advisory por desenho.
      - name: Agent corpus counterfactual (aritmética de viabilidade · poder por Monte Carlo determinístico · chip C1 grade 2026-07-17)
        run: node scripts/governance/agent-corpus-counterfactual.test.mjs
      # Braço CROSS-MODEL da grade de réguas (fraqueza "verificação same-model" 5,0 · orquestracao-adversarial).
      # Testa SÓ a lógica pura (classificarDivergencia/resumoControleNegativo/seleção/prompt-blind) — a
      # direção da divergência é o que o arm existe pra pegar; fixtures boa/ruim mordem (DERRUBA) e liberam
      # (CONCORDA). NUNCA chama modelo/rede aqui — a chamada cross-vendor é técnica de PROCESSO, fora do CI.
      - name: Reguas cross-model (direção do controle-negativo · blind sem vazar peer · same-vendor barrado)
        run: node scripts/governance/reguas-cross-model.test.mjs
      # Grafo tipado DERIVADO dos Modules/*/SCOPE.md (chip #2 grade catálogo/IDP 2026-07-21).
      # Testa a lógica PURA (parse frontmatter + extratores + buildGraph + serialização
      # determinística + detecção de aresta pendurada) com SCOPE sintéticos — não a árvore viva.
      # Advisory por desenho (ADR 0314/0275: required = só Tier-0).
      - name: Catalog graph (arestas tipadas do SCOPE · aresta pendurada morde · determinismo)
        run: node scripts/governance/catalog-graph.test.mjs
      # Scorecard de sinais-vivos por serviço (grade Catálogo/IDP 7,5 · "scorecard de sinais-vivos"
      # + UI consultável, 2026-07-21). AGREGADOR advisory que junta grade+telas+grafo+briefing por
      # serviço — testa a LÓGICA PURA (buildDoc/graphSignals) com fixtures sintéticas: join grade
      # exato, join tela PAGES_NS + normalização EXATA (sem casar por similaridade), backend-only ≠
      # falha, aresta pendurada, maturidade só sobre checks aplicáveis, determinismo.
      - name: Service scorecard (join grade/tela/grafo · normalização exata · determinismo)
        run: node --test scripts/governance/service-scorecard.test.mjs
      - name: Função-scorecard blind pack (IDs opacos + docblocks sem tells + scorer compatível)
        run: node --test scripts/governance/funcao-scorecard-calibracao.test.mjs
      - name: Função-scorecard gold humano (9/9 obrigatório + K/9 + Cohen kappa)
        run: node --test scripts/governance/funcao-scorecard-humano.test.mjs
      # Descasamento de vocabulário de `status` entre schema canônico e filtro de retrieval
      # (2026-07-28). Medido no DB de prod: 285 de 2.012 docs indexados (14%) são invisíveis
      # à busca — 85% dos SPECs, 39% dos BRIEFINGs — porque o filtro só aceita o vocabulário
      # de ADR e os outros schemas definem enums que não intersectam. O selftest é a MORDIDA:
      # prova que casa por interseção de CONJUNTOS (não por nome), que ignora tipo não-indexado
      # (o FP medido antes de instalar) e que o extrator acha os tipos vistos no índice real —
      # âncora contra o falso-negativo que a 1ª versão tinha (perdia `runbook`).
      - name: RAG status-vocab (schema × retrieval · interseção de conjuntos)
        run: node scripts/governance/rag-status-vocab-check.mjs --selftest
      - name: RAG status-vocab — relatório (advisory, não piorar vs baseline)
        run: node scripts/governance/rag-status-vocab-check.mjs --check
      # Fonte ÚNICA de UC-id (ADR 0264) — a lib existia pra matar "4 regex que drifaram" e
      # não tinha teste nenhum. O USO dela (split por bloco `## ` antes do ucHeadRe) seguiu
      # copiado em 6 consumidores e drifou pela mesma porta: exposicao-tier0 aplicava o regex
      # na LINHA CRUA e media 4 telas cobertas onde havia 29 (perna casos_coverage morta).
      # Inclui o CONTROLE-NEGATIVO da raiz: linha crua NÃO casa, bloco casa.
      - name: UC-id fonte única (parser de casos.md · controle-negativo da linha crua)
        run: node --test scripts/lib/uc-regex.test.mjs
      # Detector ADVISORY de DONO-DE-TEMA (pedido [W] 2026-07-21 "como sei que a Maiara não
      # está duplicando estrutura?"). Consome o catalog.json + tópicos; mede sobreposição de
      # ENTIDADE declarada (não nome de arquivo). O selftest é a MORDIDA: prova que casa por
      # entidade e NÃO por nome, self-exclui, passa limpo em tema novo (§5 ancora-guard 2026-06-30).
      - name: Tema-owner núcleo (mordida · mede entidade não nome · self-exclude · passa-limpo · prova real)
        run: node scripts/governance/tema-owner.test.mjs
      - name: Tema-owner hook advisory (controle-negativo de acoplamento · dispara no path · fail-open)
        run: node .claude/hooks/tema-owner-advisory.test.mjs
      # ex-órfãos de CI (adversário 2026-07-13): existiam no repo mas nenhum workflow os
      # rodava — reencarnação da proibição "Tests sem phpunit.xml = falsa cobertura".
      - name: SDD distiller_freshness read-side (anti-stale + shallow honesto · ADR 0291 D-D)
        run: node scripts/governance/sdd-distiller-freshness.test.mjs
      - name: CT100 sdd-scorecard-snapshot wrapper (sintaxe + fatal-sem-artefato + docker mock + staleness WARNING)
        run: bash scripts/tests/ct100-sdd-scorecard-snapshot.test.sh
      - name: CT100 jana-evals invocador (US-COPI-140 · docker mock + nao-mascara-falha + drift-sentinel fora)
        run: bash scripts/tests/ct100-jana-evals.test.sh
      - name: Block-test-fora-ct100 PORTE .mjs (logica + E2E · roda em Linux · card #2 cross-platform)
        run: node .claude/hooks/block-test-fora-ct100.test.mjs
      - name: Block-test-fora-ct100 REGISTRADO como node (correcao != invocacao)
        run: node scripts/governance/settings-test-fora-ct100-registration.test.mjs
      - name: Block-automem PORTE .mjs (ADR 0061/0131 · logica + E2E · roda em Linux)
        run: node .claude/hooks/block-automem.test.mjs
      - name: Block-edit-authority-generated (ADR 0256 · bloqueia editar gerado a mao · logica + E2E)
        run: node .claude/hooks/block-edit-authority-generated.test.mjs
      - name: Block-mwart-violation PORTE .mjs (ADR 0104 F1 · logica + E2E · roda em Linux)
        run: node .claude/hooks/block-mwart-violation.test.mjs
      - name: Block-automem + block-mwart REGISTRADOS como node (correcao != invocacao)
        run: node scripts/governance/settings-automem-mwart-registration.test.mjs
      - name: Block-edit-authority-generated REGISTRADO no settings (correcao != invocacao)
        run: node scripts/governance/settings-block-generated-registration.test.mjs
      - name: Block-bom-encoding PORTE .mjs (proibicoes Ambiente BOM · #984 · logica + E2E · roda em Linux)
        run: node .claude/hooks/block-bom-encoding.test.mjs
      - name: Block-test-without-red PORTE .mjs (SDD FV-T0 · logica + E2E · roda em Linux)
        run: node .claude/hooks/block-test-without-red.test.mjs
      - name: Warn-red-first PORTE .mjs (SDD FV-T0 advisory · logica + E2E · roda em Linux)
        run: node .claude/hooks/warn-red-first.test.mjs
      - name: Commit-discipline-check PORTE .mjs (skill Tier A · ADR 0094 §5 · logica + E2E · roda em Linux)
        run: node .claude/hooks/commit-discipline-check.test.mjs
      - name: Lote porte .ps1->.mjs REGISTRADO como node (correcao != invocacao · US-GOV-052)
        run: node scripts/governance/settings-portlote-ps1-mjs-registration.test.mjs
      - name: Memory-pending PORTE .mjs (Stop · skill memory-sync · ADR 0070 · roda em Linux)
        run: node .claude/hooks/memory-pending.test.mjs
      - name: Nudge-recommend-not-menu PORTE .mjs (R13 · advisory · roda em Linux)
        run: node .claude/hooks/nudge-recommend-not-menu.test.mjs
      - name: Nudge-diagnosis-without-evidence PORTE .mjs (R1 · advisory · roda em Linux)
        run: node .claude/hooks/nudge-diagnosis-without-evidence.test.mjs
      - name: Nudge-test-contract-anchor PORTE .mjs (proibicoes §descartadas Check 9 · roda em Linux)
        run: node .claude/hooks/nudge-test-contract-anchor.test.mjs
      - name: Vista publicada segue o padrao (PreToolUse:Artifact · advisory · morde em fixture)
        run: node .claude/hooks/vista-publicada-padrao.test.mjs
      # Doc que nasce em memory/requisitos/<Mod>/ fora da allowlist de 9 nomes existe no git
      # e NAO existe pra busca da IA (Regra 2 de como-escrever-doc-para-o-rag.md). O hook e
      # ADVISORY e forward-only (so arquivo NOVO; os 591 legados ficam grandfatherados).
      # FP medido ANTES de instalar contra o ORACULO de runtime (mcp_memory_documents no
      # CT 100): 486/486, 0 FP, 0 FN — reproduzivel por `--measure --indice <dump>`.
      # O selftest tambem le o PHP do indexador e compara allowlist+globs: se o indexador
      # ganhar um 10o nome, ESTE step fica vermelho (o hook nao pode mentir em silencio).
      - name: Doc fora do indice do RAG (PreToolUse:Write · advisory · morde + anti-deriva vs indexador)
        run: node .claude/hooks/doc-fora-do-rag.test.mjs
      - name: Doc fora do RAG REGISTRADO como node (correcao != invocacao)
        run: node scripts/governance/settings-doc-fora-do-rag-registration.test.mjs
      - name: Lote 2 nudges REGISTRADO como node (correcao != invocacao · US-GOV-052)
        run: node scripts/governance/settings-portlote2-nudges-registration.test.mjs
      - name: Licoes-code-two-strikes PORTE .mjs (loop aprendizado · logica + E2E · roda em Linux)
        run: node .claude/hooks/licoes-code-two-strikes.test.mjs
      - name: Loop-fechar-check PORTE .mjs (rotina IA-OS idempotente · logica + E2E · roda em Linux)
        run: node .claude/hooks/loop-fechar-check.test.mjs
      - name: Check-skills-fresh PORTE .mjs (skill nova entre sessoes · logica + E2E · roda em Linux)
        run: node .claude/hooks/check-skills-fresh.test.mjs
      - name: Modulo-preflight-warning PORTE .mjs (FASE 1 pre-flight Tier 0 · logica + E2E · roda em Linux)
        run: node .claude/hooks/modulo-preflight-warning.test.mjs
      - name: Lote 3 SessionStart+preflight REGISTRADO como node (correcao != invocacao · US-GOV-052)
        run: node scripts/governance/settings-portlote3-sessionstart-registration.test.mjs
      - name: Charter-validate PORTE .mjs (Charter > Spec · logica + E2E · roda em Linux)
        run: node .claude/hooks/charter-validate.test.mjs
      - name: Preflight-new-capability PORTE .mjs (anti-reinvencao framework · logica + E2E · roda em Linux)
        run: node .claude/hooks/preflight-new-capability.test.mjs
      - name: Lote 4 charter+preflight REGISTRADO como node (correcao != invocacao · US-GOV-052)
        run: node scripts/governance/settings-portlote4-charter-preflight-registration.test.mjs
      - name: Brief-fetch-curl PORTE .mjs (HTTP autenticado MCP · fetch nativo + timeout + redacao token · roda em Linux)
        run: node .claude/hooks/brief-fetch-curl.test.mjs
      - name: Tier-a-banner PORTE .mjs (banner Skills Tier A de-numerado · roda em Linux)
        run: node .claude/hooks/tier-a-banner.test.mjs
      - name: Handoff-inline PORTE .mjs (indice handoff SessionStart · roda em Linux)
        run: node .claude/hooks/handoff-inline.test.mjs
      - name: Lote 5 SessionStart REGISTRADO como node (correcao != invocacao · US-GOV-052)
        run: node scripts/governance/settings-portlote5-sessionstart-registration.test.mjs
      - name: Block-merge-markers PORTE .mjs (post-mortem v4 anti-pattern A · #1000/#1001 · roda em Linux)
        run: node .claude/hooks/block-merge-markers.test.mjs
      - name: Block-routes-string-legacy PORTE .mjs (rules/routes.md FQCN · incidente #843 · roda em Linux)
        run: node .claude/hooks/block-routes-string-legacy.test.mjs
      - name: Lote B REGISTRADO como node (correcao != invocacao)
        run: node scripts/governance/settings-merge-routes-registration.test.mjs
      - name: Registro Figma-não-é-fonte em settings.json (camada L4)
        run: node scripts/governance/settings-figma-registration.test.mjs
      - name: Registro âncora-no-olho em settings.json (incidente #7)
        run: node scripts/governance/settings-ancora-registration.test.mjs
      - name: Porta-viva morde (LC-08 · fixtures boa/ruim + INVOCAÇÃO real por stdin)
        run: node .claude/hooks/block-instrumento-sem-porta-viva.mjs --selftest
      - name: Registro porta-viva em settings.json (LC-08 · matcher Glob E Grep)
        run: node scripts/governance/settings-porta-viva-registration.test.mjs
      # Incidente 2026-07-26 (#4798): session log + handoff com frontmatter fora do schema
      # mergearam no main — a skill não disparou, o validador não existia como comando, e os
      # jobs dessas 2 famílias são advisory (auto-merge não espera advisory). Este hook é o
      # backstop determinístico. Os 2 steps são o par que o projeto exige: o selftest prova
      # que a LÓGICA morde/libera; o de registro prova que ela está INVOCADA (hook fora do
      # settings.json enforça nada — "correção-do-mecanismo ≠ invocação").
      - name: Guard de schema de memory/ morde (fixtures boa/ruim + E2E por stdin)
        run: node .claude/hooks/memory-schema-guard.mjs --selftest
      # Permissão renomeada (família `copiloto.mcp.*` → `jana.mcp.*`, #4853). [W] cobrou
      # 2026-07-28: "chato já retornou 3 vezes isso". A recorrência tinha causa mecânica —
      # `MEMORY_TEAM_ONBOARDING.md` e `TaskRegistry/SPEC.md` mandavam rodar
      # `givePermissionTo('copiloto.mcp.use')`, permissão que NÃO existe → todo onboarding
      # reencontrava o bug. Canon DERIVADO do seeder (ADR 0256), não denylist à mão.
      # ADVISORY de nascença (ADR 0275/0336) — promoção só com mordida provada.
      # O --diff é forward-only: legado fica grandfatherado (lápide §5 2026-07-12).
      - name: Permissão renomeada — o lint morde nome velho em linha NOVA
        run: node scripts/governance/permissao-renomeada-lint.mjs --selftest
      - name: Permissão renomeada — diff-aware no PR (advisory)
        continue-on-error: true
        run: node scripts/governance/permissao-renomeada-lint.mjs --diff origin/${{ github.base_ref || 'main' }}
      # Achado adversarial 2026-07-26 (sobre a ADR 0353): o ledger de réguas contém
      # vereditos falsos — claims.json × placar do retrato discordam, e há claims com
      # refutador ACIMA_CONFIRMADO carimbadas com veredito de Integração, que o
      # workflow FILTRA antes da fase. Causa: `persistir()` é `agent(...)` porque o
      # runtime de Workflow não expõe filesystem — a fidelidade não pode ser garantida
      # na escrita, só CONFERIDA. O teste existente (reguas-workflow.test.mjs) só olha
      # o prompt (presence-gate sobre texto) e por construção não vê o arquivo.
      - name: Ledger de réguas — o selftest morde os 2 defeitos reais
        run: node scripts/governance/reguas-ledger-check.mjs --selftest
      - name: Ledger de réguas — coerência do arquivo (advisory · exit 0)
        run: node scripts/governance/reguas-ledger-check.mjs
      - name: Registro do guard de schema em settings.json (matcher Write E Edit)
        run: node scripts/governance/settings-memory-schema-registration.test.mjs
      - name: Baseline armado Figma-não-é-fonte (camada L5 · vetores de ataque)
        run: node scripts/evals/design-source-of-truth.eval.mjs
      - name: Lógica + E2E block-design-sync (ADR 0315 · fecha Gap 1 da 0299)
        run: node .claude/hooks/block-design-sync-without-optin.test.mjs
      - name: Lógica + E2E block-skill-design-sync (ADR 0315 · Eixo B via matcher Skill)
        run: node .claude/hooks/block-skill-design-sync-without-optin.test.mjs
      - name: Registro design-sync-não-é-fonte em settings.json (camada L4 · DesignSync + Skill)
        run: node scripts/governance/settings-design-sync-registration.test.mjs
      - name: ds-push orquestrador morde (dry-run VALOR:0 + determinismo · loop diff-first)
        run: node scripts/design-sync/ds-push.test.mjs
      - name: ds-token-version morde (seed + bumps MINOR/MAJOR + gate --check · loop diff-first)
        run: node scripts/design-sync/ds-token-version.test.mjs
      - name: ds-token-diff MOTOR morde (diverge/designOnly/gitOnly/alias-skip/companion · loop diff-first)
        run: node scripts/design-sync/ds-token-diff.test.mjs
      - name: ds-mirror-drift SENTINELA morde (bite/release/catraca · loop diff-first)
        run: node scripts/governance/ds-mirror-drift.test.mjs
      - name: design-coverage CATRACA morde (bite/release · cobertura de design UI-0013)
        run: node scripts/qa/design-coverage.test.mjs
      - name: pt-conformance morde (declaração de PT falsificável · PT-02..05)
        run: node scripts/governance/pt-conformance.mjs --selftest
      - name: criar-tela GERADOR carimba conforme ao PT (máquina de nascimento de tela · UI-0013)
        run: node scripts/governance/criar-tela.mjs --selftest
      - name: Design-memory gate wired no CI (Onda O3 · fundido ADR 0314 F2)
        run: node scripts/governance/design-memory-gate.test.mjs
      - name: UI-impact classificador (paths visuais + negativos + escopo affected)
        run: node scripts/governance/ui-impact.mjs --selftest
      - name: Catraca de path-fantasma morde/solta (P16 · knowledge-drift --selftest)
        run: node scripts/governance/knowledge-drift.mjs --selftest
      # O selftest do watchdog existia e NINGUÉM invocava — os asserts do eixo 2 nunca
      # rodaram em CI, e por isso o eixo 1 pôde afirmar "✓ todos os crons com heartbeat
      # < limite" tendo medido zero (cego lido como bootstrap). Ver proibicoes §"LIGUE A
      # MÁQUINA" item 2: máquina que ninguém invoca é bug, não neutralidade.
      - name: cron-watchdog — cego ≠ bootstrap, e entrega parada morde (eixo 1 + eixo 2)
        run: node scripts/governance/cron-watchdog.mjs --selftest
      - name: Ciclo documental — recibo antes→depois morde/solta (ADR 0270 · ZELADOR)
        run: node scripts/governance/documentation-loop.test.mjs
      - name: Adversario de realocacao documental (plano seguro solta; historia/relink/path ruim mordem)
        run: node scripts/governance/document-relocation-adversary.mjs --selftest
      - name: Classificador documental (camadas ADR 0334 + receita stale vira revisao)
        run: node scripts/governance/document-relocation-classifier.mjs --selftest
      - name: Executor documental (dry-run + git mv + relink + recibo Git)
        run: node scripts/governance/document-relocation-executor.mjs --selftest
      # P10 — integridade referencial rota↔código (T-AP-3/14/15 · M-AP-1 do F3 rejeitado).
      # A catraca é hermética (fixtures bite/release, ancorada no contrato LICOES_F3); se ela
      # parar de morder, ESTE passo falha. O relatório é ADVISORY (ADR 0314 — não-Tier-0): roda
      # em seguida, exit 0 sempre, só imprime os achados no log (o valor é o relatório).
