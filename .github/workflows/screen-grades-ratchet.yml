name: Screen grades ratchet (nota de tela não desce)

# Achado V4 do adversário de arquitetura (2026-07-06): o script screen-grades-ratchet.mjs
# existia mas NENHUM workflow o rodava — a nota 16-dim podia descer (ou ser inflada) em
# silêncio, enquanto vital-signs.mjs e os próprios YAMLs afirmavam que a catraca defendia.
# Este workflow fecha a mentira estrutural: roda a catraca em todo PR.
#
# Promovido a required em 2026-08-10 pela ADR 0373 (emenda à 0314), como exceção
# soberana [W] com a DR-2 da 0336 DISPENSADA — 0 mordidas em 241 modificações e 0
# fugas em 258 deleções estavam medidas e na mesa quando a decisão foi tomada.
# Quem quiser saber o que é required HOJE não lê este comentário: lê o dono,
# governance/required-checks-baseline.json (LC-10 — artefato não afirma o próprio
# enforcement em presente; o acima é fato datado em passado, que não apodrece).
#
# SEM `paths:` DE PROPÓSITO: required + filtro = check que não nasce no PR que não
# toca o path → "Expected — waiting for status" permanente → deadlock (incidente
# 2026-08-08, travou main por 2 dias). Invariante vigiado por required-always-run.mjs.
#
# O script cobre 2 vetores de burla — baixar o valor e apagar o item (ver o cabeçalho
# do .mjs, que os enumera). Override consciente Wagner: SCREEN_RATCHET_ALLOW_REGRESSION=1.

on:
  pull_request:

concurrency:
  group: screen-grades-ratchet-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ratchet:
    name: Nota de tela não desce vs origin/main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o script compara vs origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Catraca — nota(PR) >= nota(origin/main) por scorecard
        run: node scripts/qa/screen-grades-ratchet.mjs
