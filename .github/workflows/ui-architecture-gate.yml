name: UI architecture gate

# Gate de arquitetura UI (handoff Cowork 2026-06-02 · REFORCO-APPSHELL-TESTES).
# Roda os testes estruturais de tests/Feature/Architecture/ que de outra forma NÃO
# entram no CI (ci.yml roda só tests/Feature/Form). Sem este workflow os gates A1/A2
# seriam código morto. Testes puros de filesystem (sem DB) — rápidos.
#
# Cobre:
#   - AppShellUsageGateTest      (A1) toda tela Inertia usa AppShellV2
#   - CockpitAccentCanonTest     (A2) accent = roxo canon 295 (não azul 220)
#   - CoreScreensIntegrityTest   (B)  telas-núcleo: page + AppShellV2 + charter
#   - CharterVisualSourceGateTest (C) visual_source de charter aponta pra arquivo vivo (frescor de design · Catraca Viva Fase 0)
#   - OrphanRenderGateTest        (D) Inertia::render aponta pra page viva (anti tela órfã/morta · Catraca Viva Fase 1)
#   - InertiaDeferredFrontendGuardTest (E) Page alvo de Inertia::defer importa <Deferred> ou está na allowlist guard-only (anti tela-branca · defer BACKEND↔FRONTEND)
#   - DependencyDirectionTest      (F) app/ ↛ Modules/ — catraca forward-only sobre a
#     dívida de 31 arquivos do núcleo que importam módulo (medição 2026-08-12).
#     ⚠️ NÃO é gate de UI — está aqui porque esta lane é o dono dos testes de
#     arquitetura filesystem-puros que de outra forma não rodariam, e porque NÃO é
#     required: assim o gate nasce advisory (ADR 0275/0336), e a promoção é flip [W]
#     com mordida provada. Pôr no `multi-tenant-gate` (required) o faria bloquear no
#     dia 1 — foi a única divergência em relação ao parecer de 2026-08-12.
#   - TimezoneGuardTest         (H) fuso: o default nao volta a ser Europe/London, o env de
#     exemplo declara fuso brasileiro, e date_default_timezone_set nao se espalha por app/
#     sem restaurar. Tambem NAO e gate de UI - mesma razao do (F): esta lane e o dono dos
#     testes de arquitetura filesystem-puros. A baseline do G2b ENCOLHE a cada correcao;
#     somar nome nela para calar o teste e o vetor de proibicoes.md sec.5 2026-08-04.
#   - PermissionCatalogSyncTest (I) o catalogo fechado de permissoes nao pode divergir das
#     views de papel. PermissionCatalog::CORE e uma lista DERIVADA; lista derivada mantida a
#     mao apodrece — checkbox novo na view + constante esquecida = permissao DESCARTADA em
#     silencio ao salvar, que e PIOR que o buraco original porque nao faz barulho. Traz
#     controle positivo (a extracao nao pode voltar vazia) para nao passar por nao medir.
#
# NOTA: NoHardcodeBusinessIdInModulesTest (guard Tier 0 business_id) NÃO está aqui
# de propósito — hoje ele false-positiva no padrão legítimo `=== 0` (no-tenant guard).
# Recalibrar o escopo dele é decisão Tier 0 de [W] (ver PR/discussão).

on:
  push:
    branches: [main]
    paths:
      - 'resources/js/Pages/**'
      - 'resources/js/Layouts/AppShellV2.tsx'
      - 'resources/js/Components/cockpit/**'
      - 'resources/css/cockpit.css'
      - 'tests/Feature/Architecture/**'
      - '.github/workflows/ui-architecture-gate.yml'
      # (F) o alvo do DependencyDirectionTest é o NÚCLEO — sem estes, mexer em app/
      # não dispararia a lane no push e o gate nasceria mudo no eixo que ele vigia.
      - 'app/**'
      - 'governance/dependency-direction-baseline.json'
      # (G) alvos do ModuleBuildLayerAbsentTest. Mesmo motivo do (F): sem o arquivo
      # SOB TESTE no trigger, mexer nele não dispara a lane e o gate nasce mudo no
      # eixo que ele vigia (§5 2026-08-02). `app/**` já cobre o ModuleSpecGenerator;
      # estes dois cobrem o scaffold e a reintrodução de build por módulo.
      - 'config/modules.php'
      # (H) alvos do TimezoneGuardTest. Mesmo motivo do (F)/(G): sem o arquivo SOB TESTE
      # no trigger, mexer no fuso nao dispararia a lane e o gate nasceria mudo no eixo que
      # ele vigia (proibicoes.md sec.5 2026-08-02). 'app/**' ja cobre os 4 sites de
      # date_default_timezone_set; estes dois cobrem o default e o env de exemplo.
      - 'config/app.php'
      - '.env - Copia.example'
      # (I) alvo do PermissionCatalogSyncTest: PermissionCatalog::CORE e DERIVADO destas
      # views, entao mexer nelas TEM de disparar a catraca que compara as duas fontes.
      # (app/** ja cobre o proprio PermissionCatalog.php)
      - 'resources/views/role/**'
      - 'Modules/*/webpack.mix.js'
      - 'Modules/*/vite.config.js'
  # ⚠️ pull_request SEM paths: de propósito (2026-06-11, ADR 0271) — este check é
  # required (ADR 0263); required + path-scoped = deadlock "Expected" em PR que não
  # toca UI (mesmo incidente 2026-06-08 que destravou adr-lint/ui-lint/conformance).
  # Os 3 testes são filesystem-puros e baratos — rodar sempre é seguro.
  pull_request:

concurrency:
  group: ui-architecture-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: UI architecture (AppShell + accent + core screens)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, json, opentelemetry
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-uiarch-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-uiarch-${{ runner.os }}-

      - name: Install PHP deps
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Prepare storage dirs + .env mínimo
        run: |
          mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          cat > .env <<'EOF'
          APP_NAME=oimpresso-ui-arch
          APP_ENV=testing
          APP_DEBUG=false
          APP_URL=http://localhost
          LOG_CHANNEL=stderr
          DB_CONNECTION=sqlite
          DB_DATABASE=:memory:
          CACHE_DRIVER=array
          QUEUE_CONNECTION=sync
          SESSION_DRIVER=array
          MAIL_MAILER=array
          EOF
          php artisan key:generate

      - name: Pest — UI architecture gates
        run: |
          vendor/bin/pest \
            tests/Feature/Architecture/AppShellUsageGateTest.php \
            tests/Feature/Architecture/CockpitAccentCanonTest.php \
            tests/Feature/Architecture/CoreScreensIntegrityTest.php \
            tests/Feature/Architecture/CharterVisualSourceGateTest.php \
            tests/Feature/Architecture/OrphanRenderGateTest.php \
            tests/Feature/Architecture/InertiaDeferredFrontendGuardTest.php \
            tests/Feature/Architecture/DependencyDirectionTest.php \
            tests/Feature/Architecture/ModuleBuildLayerAbsentTest.php \
            tests/Feature/Architecture/TimezoneGuardTest.php \
            tests/Feature/Architecture/PermissionCatalogSyncTest.php \
            --no-coverage
