name: Shipped log cron (auto-PR)

# Mantém memory/governance/shipped/<CYCLE>.md FRESCO sem ninguém rodar à mão —
# fecha a porta de saída do loop (estende ADR 0294). Descobre cycle+since lendo
# o shipped-log mais recente (sem depender do MCP), regenera com until=hoje via
# gerador honesto (REST sub-janela + cross-check), e abre PR com auto-merge.
#
# Padrão copiado de composer-lock-sync.yml (peter-evans).
# Usa COWORK_BOT_PAT (não GITHUB_TOKEN): PR aberto pelo GITHUB_TOKEN NÃO dispara CI
# (regra anti-loop do Actions) → ficaria preso no branch protection. PAT dispara.
# workflow_dispatch p/ cycle novo.
#
# CADÊNCIA — por que seg/qua/sex (mudado em 2026-08-25; antes era seg+qui):
# O `--check` do gerador reprova o registro com mais de FRESH_DAYS=4 desde `generated`.
# Com seg+qui o gap máximo (qui→seg) era de 4 dias — folga ZERO contra esse limite:
# bastava o auto-PR de segunda atrasar pra terça amanhecer com 5d e o --check reprovar.
# Foi o que houve em 2026-08-25 (PR #6164, aberto 24/08 09:51Z, mergeado 25/08 13:17Z).
#
# Medição dos 10 auto-PRs de 20/07..24/08: 7 mergearam em 7-12min; 3 travaram (#5058
# 97,4h · #6164 27,4h · #6005 7,6h) e os 3 só mergearam DEPOIS que o head SHA mudou,
# concluindo em 9-44min. Por que o auto-merge não dispara no SHA original segue
# INDETERMINADO — no #6164 os 46 required nasceram e ficaram verdes, `strict` é false
# tanto na proteção clássica quanto no ruleset, e não houve `auto_merge_disabled` no
# timeline. Seg/qua/sex ataca o efeito sem afrouxar o gate: o gap máximo cai pra 3 dias
# (1 dia de folga) e o push do cron seguinte dá ao PR travado um SHA novo dentro dela.

on:
  schedule:
    - cron: '0 9 * * 1,3,5'   # 09:00 UTC — segunda, quarta e sexta
  workflow_dispatch:
    inputs:
      cycle:
        description: 'Cycle (ex CYCLE-09). Vazio = lê do shipped-log mais recente.'
        required: false
        default: ''
      since:
        description: 'Início da janela YYYY-MM-DD. Vazio = lê do shipped-log mais recente.'
        required: false
        default: ''

# 1 run por vez: dispatch manual + schedule não rodam concorrentes (anti-PR-duplicado).
concurrency:
  group: shipped-log-cron
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Regenera shipped-log + auto-PR
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.COWORK_BOT_PAT }}
      MCP_DRIFT_TOKEN: ${{ secrets.MCP_DRIFT_TOKEN }}   # G8: SHA/data do deploy de produção (/api/mcp/version)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Descobre cycle + since (input ou shipped-log mais recente)
        id: win
        run: |
          set -e
          CYCLE="${{ inputs.cycle }}"
          SINCE="${{ inputs.since }}"
          # G6: cycle ATIVO via /api/mcp/cycle-active — não depende do shipped-log anterior
          # (que falha na transição de cycle). Degrada pro fallback abaixo se indisponível.
          if [ -z "$CYCLE" ] && [ -n "${MCP_DRIFT_TOKEN:-}" ]; then
            RESP=$(curl -s -m 12 -H "Authorization: Bearer $MCP_DRIFT_TOKEN" "https://mcp.oimpresso.com/api/mcp/cycle-active" || true)
            CYCLE=$(echo "$RESP" | jq -r '.cycle.key // empty' 2>/dev/null || true)
            SINCE=$(echo "$RESP" | jq -r '.cycle.start_date // empty' 2>/dev/null || true)
            [ -n "$CYCLE" ] && echo "→ via endpoint MCP cycle-active: cycle=$CYCLE since=$SINCE"
          fi
          LATEST=$(ls -t memory/governance/shipped/*.md 2>/dev/null | head -1 || true)
          if [ -z "$CYCLE" ] && [ -n "$LATEST" ]; then
            CYCLE=$(sed -n 's/^cycle:[[:space:]]*//p' "$LATEST" | head -1)
          fi
          if [ -z "$SINCE" ] && [ -n "$LATEST" ]; then
            SINCE=$(sed -n 's/^window:[[:space:]]*"\{0,1\}\([0-9-]\{10\}\)\.\..*/\1/p' "$LATEST" | head -1)
          fi
          if [ -z "$CYCLE" ] || [ -z "$SINCE" ]; then
            echo "✗ não consegui descobrir cycle/since (sem shipped-log seed e sem inputs)"; exit 1
          fi
          echo "cycle=$CYCLE" >> "$GITHUB_OUTPUT"
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"
          echo "→ cycle=$CYCLE since=$SINCE until=$(date -u +%F)"

      - name: Regenera (gerador honesto --write)
        run: node scripts/governance/shipped-log-generate.mjs --since=${{ steps.win.outputs.since }} --until=$(date -u +%F) --cycle=${{ steps.win.outputs.cycle }} --write

      - name: Diff
        id: diff
        run: |
          if git diff --quiet memory/governance/shipped/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nada mudou — registro já estava fresco."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat memory/governance/shipped/
          fi

      - name: Auto-PR
        if: steps.diff.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.COWORK_BOT_PAT }}
          base: main
          branch: chore/shipped-log-${{ steps.win.outputs.cycle }}
          commit-message: |
            docs(governance): atualiza shipped-log ${{ steps.win.outputs.cycle }} (cron)

            Regenerado pelo gerador honesto (fonte completa). Porta de saída do loop.

            Refs: ${{ steps.win.outputs.cycle }}
            Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>
          title: 'docs(governance): shipped-log ${{ steps.win.outputs.cycle }} fresco (cron)'
          body: |
            **Shipped-log automático** — regenera o registro de entrega do cycle.

            Gerado por `shipped-log-generate.mjs` (REST sub-janela + cross-check de contagem).
            Mantém o gate `shipped-log-gate` verde (FRESH_DAYS=4). Auto-merge habilitado.

            🤖 Generated by Shipped log cron
          labels: |
            governance
            automated
          delete-branch: true

      - name: Auto-merge no PR gerado
        if: steps.cpr.outputs.pull-request-number
        run: gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --squash --auto --delete-branch
