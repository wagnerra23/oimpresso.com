name: Modules Pest

# CI Pest pra 5 modulos tocados na sessao 2026-05-10 - Sprint 2 ADR 0123.
# Roda jobs paralelos (matrix) em cada PR que toca Modules/<X>/.
#
# NOTA: Sem migrate manual - UltimatePOS tem migrations MySQL-only (MODIFY COLUMN,
# ENUM syntax) incompativeis com SQLite. Tests que precisam de DB real usam
# markTestSkipped defensivo (skip gracioso quando tabela ausente).
# Tests pure-logic (service classes, value objects, command logic) rodam normalmente.
# Para validacao fiel (DB real): roda NO CT 100, NUNCA local —
# docker exec -e DB_CONNECTION=mysql oimpresso-staging php artisan test (proibicoes.md §Ambiente).
# sqlite (CI/local) mascara bugs que so o MySQL real pega (businesses->business, CSRF, FK).
#
# 2026-09-03 — Manufacturing entrou na matrix. Ate aqui os 19 arquivos de
# Modules/Manufacturing/Tests estavam registrados no phpunit.xml (linha 45) e
# so 1 deles rodava em CI (Wave29RecipeInertiaTest, curado em
# .github/ci-sqlite-pest.list) — os outros 18 eram falsa cobertura, incl. o
# MultiTenantIsolationTest que defende o JOIN products.business_id (ADR 0093,
# unica barreira de tenant do modulo: mfg_recipes NAO tem business_id direto).
# Wave29 fica TAMBEM na lista sqlite de proposito: la roda em todo PR; aqui so
# quando o modulo muda.
#
# 2026-09-04 — AssetManagement (Patrimonio) entrou na matrix, MESMA patologia
# medida um dia depois da de Manufacturing. Ate aqui os 9 arquivos de
# Modules/AssetManagement/Tests estavam registrados no phpunit.xml (linha 51) e
# NENHUM rodava em CI: .github/ci-sqlite-pest.list (542 linhas) nao tem uma
# entrada 'asset', a matrix daqui nao tinha o modulo, e nenhum workflow do repo
# nomeava AssetManagement (controle positivo na mesma varredura: OficinaAuto
# aparece em 3). Falsa cobertura de 9 arquivos, incl. CrossTenantAssetTest e
# MultiTenantIsolationTest — as duas defesas Tier 0 do modulo (ADR 0093).
# Foi essa cegueira que deixou passar: 3 dos 5 FormRequests sem NENHUM
# invocador (os controllers recebem Request cru), e 4 arquivos vivos
# — Config/retention.php, AssetManagementHealthCommand, UpdateAssetMaintenanceRequest
# e LgpdComplianceTest — escritos contra as tabelas am_assets/am_maintenance_logs,
# que migration nenhuma do repo cria (as reais sao assets/asset_maintenances).
# O endereco de UI do modulo e Pages/Patrimonio/** por decisao [W] de 2026-09-04
# (modulo proprio; ADR 0180/0182 divergiam e o SCOPE.md aguardava a decisao).

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'Modules/Arquivos/**'
      - 'resources/js/Pages/Arquivos/**'
      - 'Modules/AssetManagement/**'
      - 'resources/js/Pages/Patrimonio/**'
      - 'Modules/ComunicacaoVisual/**'
      - 'resources/js/Pages/ComunicacaoVisual/**'
      - 'Modules/Connector/**'
      - 'Modules/Fiscal/**'
      - 'resources/js/Pages/Fiscal/**'
      - 'Modules/Manufacturing/**'
      - 'resources/js/Pages/Manufacturing/**'
      - 'Modules/NfeBrasil/**'
      - 'resources/js/Pages/NfeBrasil/**'
      - 'Modules/Repair/**'
      - 'resources/js/Pages/Repair/**'
      - 'Modules/Vestuario/**'
      - 'resources/js/Pages/Vestuario/**'
      - 'composer.lock'
      - 'phpunit.xml'
      - '.github/workflows/modules-pest.yml'
  push:
    branches: [main]
    paths:
      - 'Modules/Arquivos/**'
      - 'resources/js/Pages/Arquivos/**'
      - 'Modules/AssetManagement/**'
      - 'resources/js/Pages/Patrimonio/**'
      - 'Modules/ComunicacaoVisual/**'
      - 'resources/js/Pages/ComunicacaoVisual/**'
      - 'Modules/Connector/**'
      - 'Modules/Fiscal/**'
      - 'resources/js/Pages/Fiscal/**'
      - 'Modules/Manufacturing/**'
      - 'resources/js/Pages/Manufacturing/**'
      - 'Modules/NfeBrasil/**'
      - 'resources/js/Pages/NfeBrasil/**'
      - 'Modules/Repair/**'
      - 'resources/js/Pages/Repair/**'
      - 'Modules/Vestuario/**'
      - 'resources/js/Pages/Vestuario/**'

concurrency:
  group: modules-pest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    name: Pest ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - Arquivos
          - AssetManagement
          - ComunicacaoVisual
          - Connector
          - Fiscal
          - Manufacturing
          - NfeBrasil
          - Repair
          - Vestuario

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, dom, fileinfo, intl, json, mbstring, openssl, pdo, pdo_sqlite, pdo_mysql, tokenizer, xml, zip, gd, opentelemetry
          tools: composer:v2
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Prepare dirs
        run: mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache

      - name: Install PHP deps
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Create .env
        run: |
          printf '%s\n' \
            'APP_NAME=oimpresso-ci' \
            'APP_ENV=testing' \
            'APP_DEBUG=true' \
            'APP_URL=http://localhost' \
            'LOG_CHANNEL=stderr' \
            'DB_CONNECTION=sqlite' \
            'DB_DATABASE=:memory:' \
            'CACHE_DRIVER=array' \
            'QUEUE_CONNECTION=sync' \
            'SESSION_DRIVER=array' \
            'MAIL_MAILER=array' \
            'BCRYPT_ROUNDS=4' \
            'TELESCOPE_ENABLED=false' \
            'SCOUT_DRIVER=null' \
            'MCP_TOOLS_EXPOSED=false' > .env
          php artisan key:generate
          php artisan package:discover --ansi

      - name: Run Pest
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        # Wagner 2026-05-25: remove --stop-on-failure. Comportamento anterior
        # escondia failures subsequentes quando 1 test falhava primeiro (ex:
        # PR #1544 13 tests novos não rodaram pq Wave26SaturationTest forceDelete
        # pre-existing falhou). Sem flag, CI mostra relatório completo de TODOS
        # failures pra atacar de uma vez. Trade-off: +1-2min CI quando muitos
        # tests quebram (raro). Vale pelo ganho de transparência.
        run: |
          vendor/bin/pest Modules/${{ matrix.module }}/Tests \
            --no-coverage \
            --colors=always
