name: OficinaAuto · Pest (MySQL)

# Lane dedicada pra rodar a suíte Pest do Modules/OficinaAuto contra MySQL REAL
# + seed mínimo (biz=1 + biz=2 — via .github/actions/pest-mysql-setup, FV-F2).
#
# POR QUE EXISTE (medido em origin/main, 2026-07-27 — chip Onda 2 do passo 5, ADR 0351):
# os 44 arquivos de teste de Modules/OficinaAuto/Tests/Feature estavam REGISTRADOS em
# phpunit.xml (<directory>./Modules/OficinaAuto/Tests/Feature</directory>, linha ~37) —
# logo rodavam na suíte COMPLETA noturna do CT 100 — mas NENHUMA lane de PR os executava.
#
#   ⚠️ A afirmação honesta é essa, e não "os testes não rodam em lugar nenhum": são
#   perguntas diferentes com portas diferentes (a classe LC-08 do projeto).
#     · roda em algum lugar? → phpunit.xml        ✅ sim (suíte completa)
#     · roda no PR?          → workflows          ❌ não rodava — é o que ESTA lane conserta
#     · bloqueia merge?      → governance/required-checks-baseline.json  ❌ não (advisory)
#
# ESTA LANE NASCE **ADVISORY** (ADR 0275): NÃO foi adicionada ao
# governance/required-checks-baseline.json. Reprova fica VISÍVEL e NÃO bloqueia merge.
# Promoção a required é flip do [W] com mordida provada (ADR 0336) — não deste PR.
#
# ⚠️ MÓDULO EM PRODUÇÃO (piloto Martinho). Esta lane é observação, não mudança de
# comportamento: o PR que a criou só escreveu documento, contrato e NOME de teste.
#
# CATRACA (padrão das lanes Financeiro/Compras): roda só a ALLOWLIST abaixo — os arquivos
# que carregam os UC contratados nos *.casos.md do módulo. Cada lote estabilizado
# adiciona arquivos AQUI (ratchet up). Arquivo FORA da allowlist NÃO RODA — é o
# "verde impossível" que o anchor-lint denuncia, pior que o vermelho honesto.
#
# ⚠️ O PRIMEIRO RUN NÃO TEM BASELINE VERDE. A allowlist abaixo foi montada por LEITURA
# (os testes existem e cobrem os UC), não por execução — o chip que a criou não roda
# teste (ADR 0062: Pest só no CT 100 / CI). Se vier vermelho, ELE É O ACHADO: a correção
# é decisão do [W] (proibicoes.md §Precedência), não conserto silencioso — e o arquivo
# instável sai da allowlist com o motivo registrado, em vez de virar advisory-eterno-vermelho.
#
# Usa o SCHEMA BASELINE (database/schema/mysql-schema.sql) — mesmo motivo da lane Compras:
# migrate carrega o schema final num passo só e evita o FK ordering das migrations legacy.

on:
  workflow_dispatch: {}
  # ADR 0271 onda 2 (required-readiness): pull_request SEM paths (always-run) pra ser
  # promovível a required sem deadlock "Expected — waiting". O custo é evitado por
  # skip-as-pass interno (dorny/paths-filter). push segue path-filtered.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'Modules/OficinaAuto/**'
      - 'resources/js/Pages/OficinaAuto/**'
      - 'database/schema/mysql-schema.sql'
      - '.github/workflows/oficinaauto-pest.yml'
      - '.github/actions/pest-mysql-setup/**'

concurrency:
  group: oficinaauto-pest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    name: PHP / Pest (OficinaAuto · MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oimpresso_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Detectar mudanças da OficinaAuto (skip-as-pass — ADR 0271 onda 2)
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            oficinaauto:
              - 'Modules/OficinaAuto/**'
              - 'resources/js/Pages/OficinaAuto/**'
              - 'database/schema/mysql-schema.sql'
              - '.github/workflows/oficinaauto-pest.yml'
              - '.github/actions/pest-mysql-setup/**'

      - name: Skip-as-pass (nada da OficinaAuto mudou)
        if: steps.changes.outputs.oficinaauto == 'false'
        run: echo "✅ Sem mudanças no Modules/OficinaAuto — skip-as-pass (required-ready, ADR 0271 onda 2)."

      # Setup compartilhado (FV-F2): PHP + Composer + .env + migrate (schema baseline)
      # + seed mínimo (biz=1 fixture completa + biz=2 cross-tenant Tier 0). O service
      # container MySQL fica DECLARADO no job (composite action não declara services).
      - name: Setup Pest MySQL (PHP + deps + .env + migrate + seed biz=1/biz=2)
        if: steps.changes.outputs.oficinaauto == 'true'
        uses: ./.github/actions/pest-mysql-setup

      - name: Stub Vite manifest (Inertia root view sem build do front)
        if: steps.changes.outputs.oficinaauto == 'true'
        run: |
          mkdir -p public/build-inertia
          cat > public/build-inertia/manifest.json <<'EOF'
          {
            "resources/css/inertia.css": { "file": "assets/inertia.css", "src": "resources/css/inertia.css", "isEntry": true },
            "resources/js/app.tsx": { "file": "assets/app.js", "src": "resources/js/app.tsx", "isEntry": true }
          }
          EOF

      # A FSM da OS é tabular (ADR 0143): sem o processo semeado, as transições não existem
      # e os testes de pipeline/gate não têm o que exercitar. Mesmo seeder que o e2e-gate usa.
      - name: Seed FSM da OficinaAuto (processo tabular · ADR 0143)
        if: steps.changes.outputs.oficinaauto == 'true'
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_DATABASE: oimpresso_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan db:seed --class=Modules\\OficinaAuto\\Database\\Seeders\\OficinaAutoFsmSeeder --force

      - name: Run Pest (OficinaAuto · MySQL) — ALLOWLIST (catraca)
        if: steps.changes.outputs.oficinaauto == 'true'
        # phpunit.xml força DB_CONNECTION=sqlite :memory: (sem force=) — sem sobrescrever,
        # o Pest roda em sqlite VAZIO e os testes que dependem do schema UltimatePOS
        # (Business/transactions/Spatie) dão markTestSkipped: a falsa cobertura.
        #
        # A allowlist são os arquivos que carregam UC contratados nos *.casos.md do módulo
        # (rastreabilidade G-2 · ADR 0264), agrupados por tela:
        #   Vehicles/*        → VehicleCrudTest · VehicleMultiTenantTest
        #   ServiceOrders/*   → ServiceOrderCrudTest · ServiceOrderItemTest ·
        #                       ServiceOrderItemStockBaixaTest · ServiceOrderCheckinTest ·
        #                       DviInspectionItemTest · ServiceOrderDviToOrcamentoTest ·
        #                       ServiceOrderApprovalGateTest · ServiceOrderStageGateTest ·
        #                       ServiceOrderObserverItemsAndHttpTest ·
        #                       ServiceOrderSheetVendaDerivadaTest · FsmTransitionTest ·
        #                       OficinaFioUsavelAdr0265Test (invariante de domínio ADR 0265)
        #   AprovacaoPublica  → AprovacaoOsTokenTest · WhatsAppAprovacaoPinTest
        #   fluxo sem tela    → ImportFirebirdMartinhoCommandTest
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_DATABASE: oimpresso_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          mkdir -p test-results
          vendor/bin/pest --no-coverage --colors=always \
            --log-junit test-results/pest-oficinaauto-junit.xml \
            Modules/OficinaAuto/Tests/Feature/VehicleCrudTest.php \
            Modules/OficinaAuto/Tests/Feature/VehicleMultiTenantTest.php \
            Modules/OficinaAuto/Tests/Feature/ServiceOrderCrudTest.php \
            Modules/OficinaAuto/Tests/Feature/ServiceOrderItemTest.php \
            Modules/OficinaAuto/Tests/Feature/ServiceOrderItemStockBaixaTest.php \
            Modules/OficinaAuto/Tests/Feature/ServiceOrderCheckinTest.php \
            Modules/OficinaAuto/Tests/Feature/DviInspectionItemTest.php \
            Modules/OficinaAuto/Tests/Feature/ServiceOrderDviToOrcamentoTest.php \
            Modules/OficinaAuto/Tests/Feature/ServiceOrderApprovalGateTest.php \
            Modules/OficinaAuto/Tests/Feature/ServiceOrderStageGateTest.php \
            Modules/OficinaAuto/Tests/Feature/ServiceOrderObserverItemsAndHttpTest.php \
            Modules/OficinaAuto/Tests/Feature/ServiceOrderSheetVendaDerivadaTest.php \
            Modules/OficinaAuto/Tests/Feature/FsmTransitionTest.php \
            Modules/OficinaAuto/Tests/Feature/OficinaFioUsavelAdr0265Test.php \
            Modules/OficinaAuto/Tests/Feature/AprovacaoOsTokenTest.php \
            Modules/OficinaAuto/Tests/Feature/WhatsAppAprovacaoPinTest.php \
            Modules/OficinaAuto/Tests/Feature/ImportFirebirdMartinhoCommandTest.php

      - name: Upload JUnit (veredito por-teste — casos:results)
        if: ${{ !cancelled() && steps.changes.outputs.oficinaauto == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pest-oficinaauto-junit
          path: test-results/pest-oficinaauto-junit.xml
          retention-days: 14
