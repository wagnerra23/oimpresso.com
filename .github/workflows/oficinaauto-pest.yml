name: OficinaAuto · Pest (MySQL)

# Lane do OficinaAuto (Modules/OficinaAuto): OS, veículos, DVI, aprovação, FSM da oficina.
# Piloto em produção (Martinho, biz=164).
#
# POR QUE existe (medido 2026-10-28, `node scripts/governance/test-lane-coverage.mjs
# --modulo OficinaAuto` no main 9b9e3ea44b): 44 de 49 arquivos de teste fora de qualquer
# lane de PR. Os 5 cobertos rodam na sells-pest.yml (contratos da entrega/FSM). O resto
# só rodava na nightly do CT 100. A modules-pest.yml não serve: roda em sqlite sem
# migrate, onde teste de schema MySQL sai skip, exit 0, verde sem provar nada (LC-13).
#
# SELEÇÃO: run-set = árvore Modules/OficinaAuto/Tests MENOS (1) quem tem dono em outra
# lane (sells-pest.yml, ci-sqlite-pest.list), (2) construto destrutivo em código
# (dropa o schema do banco compartilhado) e (3) a quarentena declarada em
# .github/oficinaauto-pest-quarantine.list, com motivo por linha. Arquivo NOVO entra
# rodando. Mesmo desenho da jana-pest.yml e da paymentgateway-pest.yml.

on:
  workflow_dispatch: {}
  # pull_request SEM paths (always-run) + skip-as-pass interno via dorny/paths-filter.
  #
  # ⚠️ `types` SEM `synchronize` é o padrão vigente dos advisory desde o #6622: a lane não
  # re-roda a cada push do mesmo PR — para reexecutar, use o workflow_dispatch acima. QUEM
  # FOR PROMOVER ESTA LANE A REQUIRED tem de reinserir `synchronize` ANTES do flip
  # (lápide 2026-08-08 · RUNBOOK-branch-protection §Promoção).
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [main]
    # paths-ignore FAIL-CLOSED: PR que toca SÓ memory/, prototipo-ui/ ou o estado do
    # design-sync não sobe esta lane. Promover a required = APAGAR este bloco.
    # Prova: scripts/governance/advisory-paths-ignore.test.mjs
    paths-ignore:
      - 'memory/**'
      - 'prototipo-ui/**'
      - 'scripts/design-sync/state/**'
  push:
    branches: [main]
    paths:
      - 'Modules/OficinaAuto/**'
      - 'tests/Support/WithSeededTenant.php'
      - 'database/schema/mysql-schema.sql'
      - '.github/workflows/oficinaauto-pest.yml'
      - '.github/oficinaauto-pest-quarantine.list'
      - '.github/actions/pest-mysql-setup/**'

concurrency:
  group: oficinaauto-pest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    name: PHP / Pest (OficinaAuto · MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oimpresso_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Detectar mudanças do OficinaAuto (skip-as-pass)
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            oficina:
              - 'Modules/OficinaAuto/**'
              - 'tests/Support/WithSeededTenant.php'
              - 'database/schema/mysql-schema.sql'
              - '.github/workflows/oficinaauto-pest.yml'
              - '.github/oficinaauto-pest-quarantine.list'
              - '.github/actions/pest-mysql-setup/**'

      - name: Skip-as-pass (nada do domínio mudou)
        if: steps.changes.outputs.oficina == 'false'
        run: echo "✅ Sem mudanças no OficinaAuto — skip-as-pass."

      - name: Setup Pest MySQL (PHP + deps + .env + migrate + seed mínimo multi-tenant)
        if: steps.changes.outputs.oficina == 'true'
        uses: ./.github/actions/pest-mysql-setup

      - name: Stub Vite manifest (root view sem build do front)
        if: steps.changes.outputs.oficina == 'true'
        run: |
          mkdir -p public/build-inertia
          cat > public/build-inertia/manifest.json <<'EOF'
          {
            "resources/css/inertia.css": { "file": "assets/inertia.css", "src": "resources/css/inertia.css", "isEntry": true },
            "resources/js/app.tsx": { "file": "assets/app.js", "src": "resources/js/app.tsx", "isEntry": true }
          }
          EOF

      - name: Run Pest (OficinaAuto · MySQL)
        if: steps.changes.outputs.oficina == 'true'
        # phpunit.xml aponta DB_CONNECTION=sqlite sem force="true": a env daqui vence e a
        # suíte roda no MySQL semeado pela action (tenants 1/2/98).
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_DATABASE: oimpresso_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          set -uo pipefail
          mkdir -p test-results
          QUAR_FILE=.github/oficinaauto-pest-quarantine.list

          sed 's/#.*//; s/[[:space:]]*$//' "$QUAR_FILE" | { grep -vE '^$' || true; } | sort -u > /tmp/quar.txt
          RC=0
          while read -r q; do
            [ -f "$q" ] || { echo "::error::quarentena aponta arquivo inexistente: $q"; RC=1; }
          done < /tmp/quar.txt
          [ "$RC" -eq 0 ] || { echo "Limpe $QUAR_FILE — arquivo removido continua listado."; exit 1; }

          find Modules/OficinaAuto/Tests -name '*Test.php' | sort > /tmp/all.txt

          # (1) dono em outra lane: rodam lá, não duplicar
          sed 's/#.*//; s/[[:space:]]*$//' .github/ci-sqlite-pest.list \
            | grep -E '^Modules/OficinaAuto/Tests/' > /tmp/outralane.txt || true
          grep -oE 'Modules/OficinaAuto/Tests/\S+Test\.php' .github/workflows/sells-pest.yml >> /tmp/outralane.txt || true
          sort -u /tmp/outralane.txt -o /tmp/outralane.txt
          comm -23 /tmp/all.txt /tmp/outralane.txt > /tmp/elegiveis.txt

          # (2) construto destrutivo em CÓDIGO (comentário não conta)
          : > /tmp/destrutivos.txt
          while read -r f; do
            if perl -0777 -ne 's{/\*.*?\*/}{}gs; s{//[^\n]*}{}g; s{^\s*\*[^\n]*}{}gm;
                               exit(/RefreshDatabase|migrate:fresh|dropIfExists/ ? 0 : 1)' "$f"; then
              echo "$f" >> /tmp/destrutivos.txt
            fi
          done < /tmp/elegiveis.txt
          sort -u /tmp/destrutivos.txt -o /tmp/destrutivos.txt
          comm -23 /tmp/elegiveis.txt /tmp/destrutivos.txt > /tmp/semdestr.txt

          # (3) quarentena declarada
          comm -23 /tmp/semdestr.txt /tmp/quar.txt > /tmp/run.txt

          echo "Árvore: $(wc -l < /tmp/all.txt) · outra lane: $(wc -l < /tmp/outralane.txt) · destrutivos: $(wc -l < /tmp/destrutivos.txt) · quarentena: $(wc -l < /tmp/quar.txt) · RODANDO: $(wc -l < /tmp/run.txt)"
          echo "--- dono em outra lane ---"; cat /tmp/outralane.txt
          echo "--- construto destrutivo ---"; cat /tmp/destrutivos.txt
          echo "--- quarentena (motivo no .list) ---"; cat /tmp/quar.txt

          mapfile -t TARGETS < /tmp/run.txt
          [ "${#TARGETS[@]}" -gt 0 ] || { echo "::error::run-set vazio"; exit 1; }
          vendor/bin/pest --no-coverage --colors=always \
            --log-junit test-results/pest-oficinaauto-junit.xml \
            "${TARGETS[@]}"

      # A régua honesta é `assertions`, NÃO "0 failed": skip sai exit 0 (LC-13).
      - name: Sumário JUnit por arquivo (assertions — a régua contra skip-as-pass)
        if: always()
        run: node scripts/tests/junit-summary.mjs test-results/pest-oficinaauto-junit.xml --out test-results/pest-oficinaauto-junit-summary.json || true

      - name: Suite provou algo? (--check-assertions · LC-13)
        if: steps.changes.outputs.oficina == 'true'
        run: node scripts/tests/junit-summary.mjs test-results/pest-oficinaauto-junit.xml --check-assertions

      - name: Upload sumário JUnit (pest-oficinaauto-junit-summary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pest-oficinaauto-junit-summary
          path: test-results/pest-oficinaauto-junit-summary.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload JUnit (OficinaAuto · MySQL)
        if: ${{ !cancelled() && steps.changes.outputs.oficina == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pest-oficinaauto-junit
          path: test-results/pest-oficinaauto-junit.xml
          retention-days: 14
