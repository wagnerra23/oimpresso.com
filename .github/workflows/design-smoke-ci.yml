name: Design Smoke CI (ADR 0390)

# ─────────────────────────────────────────────────────────────────────────────
# Smoke do Design Sync em AMBIENTE CONTROLADO — emenda ao D-6 da ADR 0384 (ADR 0390,
# decisão [W] 2026-09-06). O estado `validated` exigia smoke de PRODUÇÃO com login humano
# que o agente não digita → 0/93 telas validadas por construção. Este workflow sobe o
# MESMO app efêmero do `visual-regression.yml` (PHP 8.4 + MySQL 8 + schema baseline +
# seeds Visreg biz=1/2/98/99 + Inertia buildado + Playwright), renderiza as telas que o
# `application-report.json` marca como `tested|validated`, logado como o admin do biz=1
# via auth-bridge `/_visreg-login`, e PUBLICA os PNGs + `manifest.json` na branch órfã
# `governance/design-smokes` (mesmo transporte do `governance/nightly-floor`: repo
# efêmero + push -f, sem PR, sem tocar main).
#
# O recibo NÃO nasce aqui. Nasce do outro lado, com o alvo ATUAL na mão:
#   node scripts/design-sync/smoke-consumir.mjs        # fetch órfã → casa por blob → --record-smoke --host ci
# Casamento por CONTEÚDO (blob git do .tsx no instante do render, `targetBlob` no manifesto):
# se o .tsx mudou depois, o smoke é PULADO com motivo — nunca vira recibo de tela que não existe.
#
# ADVISORY POR DESENHO: `push: main` + `workflow_dispatch`, nunca `pull_request`; não é required
# e nunca falha o merge (ADR 0314: required = Tier-0). Vermelho aqui = "não consegui
# fotografar", visível no step summary; a tela fica onde estava (`tested`), sem regredir.
# Deconflito com `screen-smoke-after-merge.yml`: aquele fotografa PRODUÇÃO, mas o DESTINO dele
# é `<Tela>.review.md` via PR (job PERSIST) — ele NÃO escreve no ledger do Design Sync. Medido
# 2026-09-18: `grep -cE "design-sync|record-smoke|applications[.]json"` NAQUELE arquivo = 0; o
# controle positivo do grep é ESTE arquivo, que casa (conta não fixada de propósito — ela muda
# quando este comentário muda, e quem quiser o número roda o comando). Corolário: o
# `host=producao` do enum de `--record-smoke` (producao · staging-ct100 · ci) NÃO é emitido por
# ele; preencher esse host depende de outro produtor. Não é régua paralela porque os ARTEFATOS
# são distintos (recibo de ledger × review.md), não porque seriam "hosts do mesmo recibo". O
# estado de ativação daquele workflow (switch/secrets) é dele — o dono é o header dele +
# `gh variable`/`gh secret`, e não se restateia aqui: era esse o defeito LC-10 que esta linha
# corrige (§5 2026-07-16 + emenda 2026-08-11).
#
# Reuso deliberado, não cópia divergente: os steps de setup são os do visual-regression.yml
# (env incl. ADMINISTRATOR_USERNAMES/MWART_*/VISREG_FREEZE_CLOCK, sem ext opentelemetry —
# os motivos estão comentados LÁ e valem aqui). Se aquele mudar de receita, este muda junto.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:
  # CADENCIA DO LOTE DE PARIDADE (2026-09-18, decisao [W] "ligue" -> ADR 0408, que emenda a
  # 0290). Semanal, nao nightly: o universo do lote sao as `anchored` do application-report,
  # e elas mudam por TRABALHO humano (aplicar tela, mover pra compared), nao por relogio.
  # Medido no dia: 23 telas executaveis de 68 `anchored` — o job nao cresce sozinho.
  # Segunda 04:40 UTC (01:40 BRT) pra nao colidir com os crons de segunda ja existentes
  # (anchor-drift 06:00 · charter-us-gate 06:00 · baseline-folga 06:17 · devcontainer 07:45).
  schedule:
    - cron: "40 4 * * 1"

concurrency:
  # ISOLADO POR EVENTO+REF desde 2026-09-21. Era `design-smoke-ci` global com
  # cancel-in-progress, e isso matou a run de prova do lote: o dispatch 35589355425 foi
  # cancelado 17s depois de um `push: main` entrar no MESMO group (e aquele push, por sua
  # vez, tinha matado a run anterior). Com o lote levando ~20min, um group global significa
  # que qualquer merge em main durante a janela mata a medição — e o sintoma e `cancelled`,
  # que se le como "deu erro" quando na verdade e "nem rodou".
  # O comportamento do SMOKE fica identico: push em main segue cancelando push em main,
  # porque event+ref sao os mesmos. O que muda e que schedule/dispatch deixam de competir.
  group: design-smoke-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # push -f na órfã governance/design-smokes (sem PR; branch fora de main)

jobs:
  design-smoke:
    name: Fotografa telas tested|validated no app efêmero do CI
    runs-on: ubuntu-24.04
    # 30 pro caminho de sempre (push/dispatch do smoke). Em `schedule` o job carrega
    # tambem o lote de paridade (~20min sobre o boot + smoke), e 30 nao cabe: medido em
    # 2026-09-18, sao 23 telas executaveis x 2 renders cada. Teto, nao custo — o job segue
    # terminando quando termina. Mesmo padrao condicional do visual-regression.yml:83.
    timeout-minutes: ${{ github.event_name == 'schedule' && 50 || 30 }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oimpresso_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0

      # Seleção ANTES do setup pesado: sem tela elegível o job termina em ~1 min, honesto
      # (0 telas ≠ verde de smoke; o summary diz "nada a fotografar").
      - name: Selecionar telas (tested|validated com rota derivável — report ou charter)
        id: select
        run: |
          set -euo pipefail
          node scripts/design-sync/smoke-consumir.mjs --select | tee /tmp/design-smoke-select.txt
          node scripts/design-sync/smoke-consumir.mjs --select --json > design-smoke-selection.json
          COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('design-smoke-selection.json','utf8')).length)")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          { echo '## Design Smoke CI — seleção'; echo '```'; cat /tmp/design-smoke-select.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup PHP
        if: steps.select.outputs.count != '0'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # SEM `opentelemetry` — mesma razão do visual-regression.yml (fatal no fiber do
          # servidor do Pest Browser em toda query das telas autenticadas).
          extensions: mbstring, dom, fileinfo, pdo_mysql, gd
          coverage: none

      - name: Wait for MySQL ready
        if: steps.select.outputs.count != '0'
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h127.0.0.1 -uroot -proot --silent; then echo "MySQL ready"; break; fi
            echo "Waiting MySQL... $i"; sleep 2
          done

      - name: Cache Composer
        if: steps.select.outputs.count != '0'
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}

      - name: Cache Playwright browsers
        if: steps.select.outputs.count != '0'
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ubuntu-24.04-${{ runner.arch }}-playwright-chromium-design-smoke-v1-${{ hashFiles('**/package-lock.json') }}

      - name: Install Composer dependencies
        if: steps.select.outputs.count != '0'
        run: composer install --no-progress --no-interaction --prefer-dist --no-scripts --ignore-platform-req=ext-opentelemetry

      - name: Install NPM dependencies
        if: steps.select.outputs.count != '0'
        run: npm ci

      - name: Install Playwright (chromium)
        if: steps.select.outputs.count != '0'
        timeout-minutes: 6
        run: |
          npx playwright install-deps chromium
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then npx playwright install chromium; fi

      - name: Setup Laravel (.env do gate visual + migrate schema baseline)
        if: steps.select.outputs.count != '0'
        run: |
          mkdir -p storage/framework/{cache,views,sessions,testing} bootstrap/cache storage/design-smokes
          cat > .env <<'EOF'
          APP_NAME=oimpresso-design-smoke
          APP_KEY=
          APP_ENV=testing
          APP_DEBUG=true
          APP_URL=http://localhost
          LOG_CHANNEL=stderr
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=oimpresso_test
          DB_USERNAME=root
          DB_PASSWORD=root
          CACHE_DRIVER=array
          QUEUE_CONNECTION=sync
          SESSION_DRIVER=file
          MAIL_MAILER=array
          BCRYPT_ROUNDS=4
          ADMINISTRATOR_USERNAMES=visreg_admin
          TELESCOPE_ENABLED=false
          VIEW_COMPILED_PATH=storage/framework/views
          MWART_CLIENTE_INDEX=true
          MWART_BACKUP_INDEX=true
          MWART_CLIENTE_IMPORT=true
          MWART_CLIENTE_MAP=true
          VISREG_FREEZE_CLOCK="2026-06-11 12:00:00"
          EOF
          php artisan key:generate --force
          php artisan package:discover --ansi
          php artisan migrate --force
          php artisan tinker --execute="echo count(DB::select('show tables')).' tabelas';"

      - name: Seed (mesmo conjunto do visual-regression — biz=1 fixture + 98 vazio + 99 sentinela + FSM/Jana/Ponto)
        if: steps.select.outputs.count != '0'
        run: |
          php artisan db:seed --force
          php artisan db:seed --class=Database\\Seeders\\VisregTenantSeeder --force
          php artisan db:seed --class=Database\\Seeders\\VisregFinanceiroFlowSeeder --force
          php artisan db:seed --class=Database\\Seeders\\VisregTenantBLeakSeeder --force
          php artisan db:seed --class=Database\\Seeders\\VisregEmptyTenantSeeder --force
          php artisan db:seed --class=Database\\Seeders\\VisregOficinaFsmSeeder --force
          php artisan db:seed --class=Database\\Seeders\\VisregOficinaBoardSeeder --force
          php artisan db:seed --class=Database\\Seeders\\VisregJanaChatSeeder --force
          php artisan db:seed --class=Database\\Seeders\\VisregPontoSeeder --force
          php artisan tinker --execute="echo 'business='.\App\Business::count().' users='.\App\User::count();"

      - name: Build Inertia bundles
        if: steps.select.outputs.count != '0'
        run: npm run build:inertia

      - name: Pest Browser — fotografa cada tela logado no biz=1 (ADVISORY)
        if: steps.select.outputs.count != '0'
        id: pest
        continue-on-error: true
        env:
          DESIGN_SMOKE_SCREENS_FILE: design-smoke-selection.json
        run: |
          set -o pipefail
          export DESIGN_SMOKE_SCREENS="$(cat "$DESIGN_SMOKE_SCREENS_FILE")"
          ./vendor/bin/pest tests/Browser/DesignSmoke/DesignSmokeTest.php 2>&1 | tee /tmp/design-smoke-pest.txt

      - name: Manifesto (PNG presente = tela fotografada; targetBlob = blob do .tsx neste SHA)
        if: steps.select.outputs.count != '0'
        id: manifest
        run: |
          set -euo pipefail
          node scripts/design-sync/smoke-consumir.mjs --manifest \
            --selection design-smoke-selection.json \
            --dir storage/design-smokes \
            --sha "$GITHUB_SHA" \
            --out storage/design-smokes/manifest.json
          N=$(node -e "console.log(JSON.parse(require('fs').readFileSync('storage/design-smokes/manifest.json','utf8')).smokes.length)")
          echo "smokes=$N" >> "$GITHUB_OUTPUT"
          {
            echo "## Design Smoke CI — resultado (Pest outcome: ${{ steps.pest.outcome }})"
            echo "smokes fotografados: **$N** de ${{ steps.select.outputs.count }} · deploySha \`$GITHUB_SHA\` · host \`ci\`"
            echo '```'; node -e "const m=require('./storage/design-smokes/manifest.json');for(const s of m.smokes)console.log('OK   '+s.tela+' · '+s.route);for(const t of m.semPng)console.log('SEM-PNG '+t)"; echo '```'
            echo 'Consumir localmente: `node scripts/design-sync/smoke-consumir.mjs --dry` → sem `--dry` grava `--record-smoke … --host ci` (ADR 0390).'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PNGs + manifesto + log do Pest
        if: ${{ !cancelled() && steps.select.outputs.count != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: design-smokes-${{ github.run_id }}
          path: |
            storage/design-smokes/**
            /tmp/design-smoke-pest.txt
          if-no-files-found: ignore
          retention-days: 30

      # Publica SÓ a partir de main: dispatch em branch de feature fica no artifact (o
      # consumidor casa por blob, então publicar de uma branch só sobrescreveria as fotos de
      # main com as de outra árvore). Repo efêmero + push -f = mesmo padrão do
      # scripts/tests/ct100-fullsuite.sh → governance/nightly-floor. `[skip ci]` por
      # higiene; push por GITHUB_TOKEN não dispara workflow de qualquer forma.
      - name: Publicar na branch órfã governance/design-smokes (só main)
        if: steps.select.outputs.count != '0' && steps.manifest.outputs.smokes != '0' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PUB="$(mktemp -d)"
          cp storage/design-smokes/manifest.json "$PUB/"
          cp storage/design-smokes/*.png "$PUB/"   # garantido: o step só roda com smokes != 0
          cp storage/design-smokes/*.json "$PUB/"  # manifest + sidecars <slug>.json
          cd "$PUB"
          git init -q -b main
          git add -A
          git -c user.email=design-smoke-ci@oimpresso.local -c user.name="design-smoke-ci" \
            commit -q -m "chore(design-sync): smokes de CI $GITHUB_SHA (${{ steps.manifest.outputs.smokes }} tela(s) · host ci) [skip ci]"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/governance/design-smokes 2>&1 | tail -2
          echo "publicado em governance/design-smokes" >> "$GITHUB_STEP_SUMMARY"

      - name: Veredito advisory (visível no log · nunca falha o merge)
        if: always() && steps.select.outputs.count != '0'
        run: |
          if [ "${{ steps.pest.outcome }}" != "success" ]; then
            echo "::warning title=Design Smoke CI::Pest Browser saiu ${{ steps.pest.outcome }} — ${{ steps.manifest.outputs.smokes || 0 }} tela(s) fotografadas de ${{ steps.select.outputs.count }}. Ver artifact design-smokes-${{ github.run_id }} e /tmp/design-smoke-pest.txt. Advisory (ADR 0390): a tela fica em tested, nada regride."
          else
            echo "Design Smoke CI: ${{ steps.manifest.outputs.smokes }} tela(s) fotografadas."
          fi

      # ── LOTE DE PARIDADE prototipo x vivo (ADR 0408) ───────────────────────────────────
      # Hospedado no SERVIDOR DO PEST, por decisao [W] em 2026-09-21, depois de 4 runs falhando.
      #
      # A 1a versao subia `php artisan serve` aqui no step e deu, QUATRO vezes, 23 ERRO de
      # net::ERR_CONNECTION_REFUSED em 23 telas — com o servidor VIVO e registrando respostas
      # (runs 35590027120 · 35590936821 · 35592105902). A causa esta no composer.lock e e de
      # ARQUITETURA, nao de configuracao: o `pestphp/pest-plugin-browser` traz
      # **amphp/http-server** (assincrono, multiplexado), enquanto o `artisan serve` usa o
      # servidor EMBUTIDO do PHP. Nem `--no-reload` + PHP_CLI_SERVER_WORKERS=8 sustentaram a
      # carga real de cada tela (documento + redirect do auth-bridge + assets do bundle Inertia,
      # em paralelo): ele aceitava a 1a conexao e recusava as seguintes. Por isso o log mostrava
      # `/_visreg-login/1` RESPONDIDO e o Playwright, na MESMA URL, dizia refused.
      #
      # A prova de que o servidor do Pest aguenta ja estava na MESMA run que falhava: o step do
      # `DesignSmokeTest` acima fotografa telas logado, sem erro. Eu estava subindo um SEGUNDO
      # servidor ao lado de um que ja servia.
      #
      # `PARIDADE_LOTE=1` e obrigatorio: sem ele o teste se SKIPA com motivo visivel, pra nao
      # entrar de carona (~20min) nas lanes Pest comuns.
      #
      # ADVISORY (`continue-on-error`), e o teste so falha quando NAO MEDIU (telas em ERRO de
      # navegacao). Divergencia de design e DADO e nunca falha — render pareado nao bloqueia
      # merge: a ADR 0290 segue recusada e a 0408 libera MEDIR, nao BLOQUEAR.
      - name: Lote de paridade — mede prototipo x vivo no servidor do Pest (ADVISORY)
        if: >-
          steps.select.outputs.count != '0' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        id: lote
        continue-on-error: true
        timeout-minutes: 80
        env:
          PARIDADE_LOTE: "1"
        run: |
          set -o pipefail
          ./vendor/bin/pest tests/Browser/DesignSmoke/ParidadeLoteTest.php 2>&1 | tee /tmp/lote.log

      - name: Resumo do lote (denominador + causa) no step summary
        if: >-
          always() && steps.lote.conclusion != 'skipped' &&
          steps.select.outputs.count != '0' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          # Sem isto o script leria o RESUMO.md VERSIONADO e publicaria a rodada anterior
          # como se fosse esta. Com isto, ele declara "NAO MEDI" e nao imprime numero nenhum.
          LOTE_OUTCOME: ${{ steps.lote.outcome }}
        run: node scripts/design/lote-resumo-ci.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload das medidas do lote (dado bruto · NAO commitado)
        if: >-
          always() && steps.lote.conclusion != 'skipped' &&
          steps.select.outputs.count != '0' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        # Artifact e NAO commit: baseline congelada esta vetada por [W] ("a baseline tem que
        # sumir, isso ja deu muito erro") e o §5 tem 3 lapides de rebake que nao fecha
        # (2026-08-24 · 2026-08-26 · 2026-09-02). Comparar duas rodadas = rodar o MESMO
        # comando em dois SHAs, nunca diffar contra artefato guardado.
        uses: actions/upload-artifact@v4
        with:
          name: paridade-lote-${{ github.run_id }}
          path: |
            governance/design/targets/medidas/**
            /tmp/lote.log
          if-no-files-found: ignore
          retention-days: 30
