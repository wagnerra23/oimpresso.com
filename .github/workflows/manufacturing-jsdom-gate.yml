name: "Manufacturing jsdom Gate — specs jsdom do módulo (UC-OP-06 · UC-INGRED-08..13)"

# POR QUE ESTA LANE EXISTE
#
# O UC-OP-06 (Manufacturing/Index.casos.md) é comportamento de CLIENTE: o intervalo De/Até
# aplica ao escolher, sem botão, e não dispara request enquanto o ano é digitado à mão. Os
# UC-OP-01..05 são de Service e rodam no Pest do módulo; este não tem nada a fazer no PHP.
# Spec vitest commitado que nenhum workflow invoca é verde-por-não-execução (LC-13) — por isso
# ele nasce com lane própria, no molde da `forja-jsdom-gate` / `cobranca-filtros-gate`.
#
# BITE-TEST antes do merge (mutação + restore byte-idêntico, hash conferido):
#   guard de ano ≥ 2000 removido      → 1 failed (o caso da digitação à mão)
#   applyDateRange fora do onChange   → 3 failed
#
# O arquivo SOB TESTE entra no gatilho junto com o spec (§5 2026-08-02): sem isso, mexer no
# Index.tsx não acordaria o teste que o defende. `synchronize` no gatilho pelo mesmo motivo.
#
# Enforcement (classe/terminal) mora no `scripts/governance/gates-registry.json`; o que
# bloqueia merge mora no `governance/required-checks-baseline.json` (LC-10).
#
# A lane é a CASA dos specs jsdom do módulo (molde da forja-jsdom-gate). Entrou em 2026-10-09
# `tests/js/manufacturing-ingredientes-editor.test.tsx` — as 6 regras de TELA do editor de
# ingredientes (handoff §5, UC-INGRED-08..13), que estavam no backlog do casos.md por falta de
# teste de navegador. Bite-test antes do merge (mutação + restore conferido por hash), controle
# sem mutação 17/17 verde:
#   regra 1 · motivo "sem ingrediente" desligado       → 2 failed
#   regra 2 · trava de quantidade ignorada             → 1 failed
#   regra 3 · campo editável sem permissão             → 1 failed
#   regra 4 · multiplicador da sub-unidade = 1         → 2 failed
#   regra 5 · gravar ao editar a quantidade            → 1 failed
#   regra 5 · alterar a ficha recebida (não a cópia)   → 3 failed
#   regra 6 · confirmação conta a cópia, não o gravado → 1 failed
#
# Comando local (vitest não é Pest; roda fora do CT 100 sem violar a ADR 0062):
#   npx vitest run tests/js/manufacturing-index-datas.test.tsx tests/js/manufacturing-ingredientes-editor.test.tsx

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    paths:
      - 'resources/js/Pages/Manufacturing/Index.tsx'
      - 'tests/js/manufacturing-index-datas.test.tsx'
      - 'resources/js/Pages/Manufacturing/IngredientesEditor.tsx'
      - 'resources/js/Pages/Manufacturing/_lib/custo.ts'
      - 'resources/js/Pages/Manufacturing/_components/ExcluirReceitaDialog.tsx'
      - 'tests/js/manufacturing-ingredientes-editor.test.tsx'
      - '.github/workflows/manufacturing-jsdom-gate.yml'
  push:
    branches: [main]
    paths:
      - 'resources/js/Pages/Manufacturing/Index.tsx'
      - 'tests/js/manufacturing-index-datas.test.tsx'
      - 'resources/js/Pages/Manufacturing/IngredientesEditor.tsx'
      - 'resources/js/Pages/Manufacturing/_lib/custo.ts'
      - 'resources/js/Pages/Manufacturing/_components/ExcluirReceitaDialog.tsx'
      - 'tests/js/manufacturing-ingredientes-editor.test.tsx'

concurrency:
  group: manufacturing-jsdom-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  manufacturing-jsdom:
    name: Manufacturing · specs jsdom (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install deps
        run: npm ci

      - name: UC-OP-06 · UC-OP-10 · UC-INGRED-08..13 (vitest/jsdom)
        run: |
          npx vitest run \
            tests/js/manufacturing-index-datas.test.tsx \
            tests/js/manufacturing-ingredientes-editor.test.tsx \
            --reporter=default \
            --reporter=junit \
            --outputFile=test-results/vitest-manufacturing-jsdom-junit.xml

      - name: Upload JUnit (veredito por-UC — casos:results)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-manufacturing-jsdom-junit
          path: test-results/vitest-manufacturing-jsdom-junit.xml
          retention-days: 14
          if-no-files-found: error
