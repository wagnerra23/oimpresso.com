            Modules/Jana/Tests/Feature/Chat/ChatTokensTurnoTest.php \
            Modules/Jana/Tests/Feature/Console/JanaRagasCiCommandTest.php \
            Modules/Jana/Tests/Feature/Console/MeilisearchIndexSetupTest.php \
            Modules/Jana/Tests/Feature/FsmCanonicalTest.php \
            Modules/Jana/Tests/Feature/Kb/KbAnswerServiceTest.php \
            Modules/Jana/Tests/Feature/Kb/KbRetrievalStatusTest.php \
            Modules/Jana/Tests/Feature/LgpdComplianceTest.php \
            Modules/Jana/Tests/Feature/Mcp/CharterFetchToolTest.php \
            Modules/Jana/Tests/Feature/Mcp/DecisionsSearchResumoTest.php \
            Modules/Jana/Tests/Feature/Mcp/JanaRecallEvalGateTest.php \
            Modules/Jana/Tests/Feature/Mcp/McpDocsHybridSearchTest.php \
            Modules/Jana/Tests/Feature/Mcp/McpIndexSyncGapSentinelaTest.php \
            Modules/Jana/Tests/Feature/Mcp/MemoriaSearchBusinessPipelineTest.php \
            Modules/Jana/Tests/Feature/Mcp/RetrievalDegradacaoToolsTest.php \
            Modules/Jana/Tests/Feature/McpTaskOpenBlockersTest.php \
            Modules/Jana/Tests/Feature/Memoria/ContextualizerServiceTest.php \
            Modules/Jana/Tests/Feature/Memoria/DesignIngestZipCommandTest.php \
            Modules/Jana/Tests/Feature/Memoria/DistillModuleTruthCommandTest.php \
            Modules/Jana/Tests/Feature/Memoria/DistillerModuloVerdadeTest.php \
            Modules/Jana/Tests/Feature/Memoria/PesoRealRetrievalTest.php \
            Modules/Jana/Tests/Feature/Memoria/RawChatMinerTest.php \
            Modules/Jana/Tests/Feature/Memoria/RecallDegradationTest.php \
            Modules/Jana/Tests/Feature/Memoria/SeedAdrsMetadataTest.php \
            Modules/Jana/Tests/Feature/Memoria/TemporalScoringTest.php \
            Modules/Jana/Tests/Feature/Memoria/TimeDecayTest.php \
            Modules/Jana/Tests/Feature/Peso/PesoRealServiceTest.php \
            Modules/Jana/Tests/Feature/Peso/RelevanciaMetaInfererTest.php \
            Modules/Jana/Tests/Feature/Reconcile/ContentReconcilerTest.php \
            Modules/Jana/Tests/Feature/Reconcile/DeployReconcilerTest.php \
            Modules/Jana/Tests/Feature/Reconcile/EvalReconcilerTest.php \
            Modules/Jana/Tests/Feature/Reconcile/IndexReconcilerTest.php \
            Modules/Jana/Tests/Feature/Reconcile/ReconcileCommandTest.php \
            Modules/Jana/Tests/Feature/Reconcile/SettingsReconcilerTest.php \
            Modules/Jana/Tests/Feature/Retrieval/BgeRerankerTest.php \
            Modules/Jana/Tests/Feature/Retrieval/RerankerTest.php \
            Modules/Jana/Tests/Feature/SinteseSemanalCommandTest.php \
            Modules/Jana/Tests/Feature/Smoke/JanaHealthCheckTest.php \
            Modules/Jana/Tests/Feature/Smoke/SentinelBiteTest.php \
            Modules/Jana/Tests/Feature/Smoke/WhatsappInboundFlowCheckTest.php \
            Modules/Jana/Tests/Feature/TaskRegistry/GitTaskLinkerRegexTest.php \
            Modules/Jana/Tests/Feature/TaskRegistry/HitlEscalationServiceTest.php \
            Modules/Jana/Tests/Feature/TaskRegistry/McpTasksUnassignedCommandTest.php \
            Modules/Jana/Tests/Feature/TaskRegistry/SyncMemoryWebhookTasksTest.php \
            Modules/Jana/Tests/Feature/TaskRegistry/TaskParserServiceTest.php \
            Modules/Jana/Tests/Feature/Telemetry/LangfuseClientTest.php \
            Modules/Jana/Tests/Feature/ProPreviewPermissaoTest.php \
            Modules/Jana/Tests/Feature/Http/MemoriaPermissaoTest.php \
            Modules/Jana/Tests/Feature/Telemetry/LlmHttpCallSitesLangfuseTest.php
          #
          # ══ 2026-09-03 — a tela Plataforma entra, e traz o órfão que a cobria ══
          #
          # DOIS arquivos, e o segundo é o ponto:
          #  · SuperadminPlataformaContratoTest — novo, nasce com a tela
          #    (`/ia/superadmin/metas` virou Inertia `Jana/Plataforma`). Registrar o
          #    teste no repo NÃO é a lane executá-lo — a lição do PainelContratoTest,
          #    repetida aqui de propósito.
          #  · SuperadminMetasCrossTenantTest — criado pelo #6421 (P0 Tier 0: a rota
          #    entregava metas de TODOS os tenants pro dono de qualquer negócio) e
          #    ÓRFÃO desde então: não estava aqui nem em .github/ci-sqlite-pest.list,
          #    e ele SKIPA em sqlite por desenho (`markTestSkipped` no driver). Ou
          #    seja, o teste do vazamento nunca teve veredito de CI. Ele cobre a MESMA
          #    rota cujo gate o PR da Plataforma altera — deixá-lo mudo enquanto se
          #    mexe no controller seria mexer sem rede.
          #
          # Elegíveis pela regra desta allowlist, medido nos dois: DatabaseTransactions,
          # zero RefreshDatabase / migrate:fresh / dropIfExists. Usam o tenant canônico
          # biz=98 (ADR 0358) + adversário 99 — e o `pest-mysql-setup` provisiona o 98
          # (linhas 156-167 da action), então não skipam por tenant ausente.
          #
          # ⚠️ ENTRAM SEM VEREDITO DESTA LANE, e isso é declarado, não omitido: o CT 100
          # estava fora (502 no Tailscale) quando o PR foi montado, e esta lane só roda
          # no CI. O veredito é o do próprio PR. Se algum reprovar por AMBIENTE — o caso
          # do ProContractTest, que passava no CT 100 e dava 403 aqui porque a DB de lá é
          # persistente e esta semeia o mínimo — ele sai com a razão registrada, como
          # aquele saiu. O critério de aceite é o da leva anterior: `assertions > 0` com
          # zero failure/error, porque `0 failed` não prova execução (LC-13).
          #
          # ══ LEVA 2026-08-26 — 59 órfãos da Jana entram de uma vez ═══════════
          #
          # Medido com o dono do inventário (`node scripts/governance/test-lane-
          # coverage.mjs --json`): a Jana tinha 168 testes e 100 ÓRFÃOS — arquivo
          # que não está em lane NENHUMA: nem aqui, nem em .github/ci-sqlite-
          # pest.list, e `Jana` não está na matrix do modules-pest.yml. 60% do
          # módulo fora do CI (no repo inteiro, 860 de 1486 em 27 lanes).
          #
          # Os 59 abaixo são a fatia que a REGRA desta allowlist já admitia, e
          # ela foi medida arquivo a arquivo, não presumida: zero RefreshDatabase,
          # zero migrate:fresh, zero dropIfExists. ⚠️ Essa varredura tem um FP que
          # custou caro e vale registrar: em 5 arquivos o construto aparecia só em
          # COMENTÁRIO — prosa explicando por que NÃO se usa — e barrá-los teria
          # deixado 3 testes verdes de fora. Hit em comentário não é evidência.
          #
          # Cada um foi EXECUTADO antes de entrar (CT 100, MySQL real) e o critério
          # de aceite foi `assertions > 0` com zero failure/error: `0 failed` não
          # prova execução (LC-13), e arquivo que não boota sai com 0 assertions —
          # que é "nunca mediu", não "passou".
          #
          # A prova de que passaram a rodar é o CONTADOR desta lane subir, e o
          # número que vale é o DESTA LANE no CI — não o do CT 100.
          #
          # ⚠️ A diferença entre os dois ambientes NÃO é teórica, e custou um round:
          # o `ProContractTest` passava no CT 100 com 65 assertions e reprovou aqui
          # com 6 falhas, todas `GET /ia/pro` devolvendo 403 em vez de 200. Não é
          # código: a DB do CT 100 é PERSISTENTE e tem o módulo/permissões da Jana
          # provisionados de runs antigos, enquanto esta lane semeia o mínimo
          # (biz=1/biz=2) num banco FRESCO. Ele saiu desta lista — voltar exige
          # provisionar a permissão no seed, e o `pest-mysql-setup` é compartilhado
          # por 16 lanes, então isso é PR próprio, não emenda desta leva.
          #
          # A lição que fica pra quem for repetir a receita: rodar no CT 100 prova
          # que o teste EXECUTA e que não envenena os vizinhos; não prova que ele
          # passa com o seed do CI. Teste que depende de permissão, módulo ligado ou
          # assinatura precisa do veredito desta lane antes de entrar.
          #
          # NÃO ENTRARAM 41, e cada motivo tem recibo no relatório da leva:
          #  · 11 NASCEM VERMELHOS — rodam e acusam defeito REAL (10 medidos no
          #    CT 100 + o ProContractTest, que só o CI reprovou). Entre eles o
          #    Chat/ChatAntiHooksAcaoTest, que fecha os 2 vermelhos datados de
          #    2026-08-17 já anotados no comentário acima (tool sem declaração de
          #    permissão; CPF em plain text no startTrace do ChatController).
          #    Ligá-los deixaria o main vermelho — decisão [W], não efeito
          #    colateral desta leva.
          #  · 29 montam schema sintético (dropIfExists / RefreshDatabase), o que
          #    esta allowlist proíbe. O lar deles é a lane sqlite
          #    (.github/ci-sqlite-pest.list, marcada merge=union), pelo precedente
          #    do BriefDiarioAgentTest movido pra lá em 2026-08-10.
          #  · 1 não bootava no main desta medição: Chat/ChatAntiHooksTier0Test deu
          #    4 errors e 0 assertions porque declarava só o DatabaseTransactions,
          #    sem o `TestCase::class` do namespace `Tests` — e o
          #    `uses(TestCase::class)->in('Feature')` do tests/Pest.php:5 é a pasta
          #    RAIZ tests/Feature, que não alcança Modules/*/Tests/Feature (o KB tem
          #    bind explícito em Pest.php:19-20; a Jana não tem nenhum). Esse
          #    conserto é o PR #6310, aberto em paralelo por outra sessão: ele
          #    também mediu que, com o bind, o arquivo segue fora da lista por OUTRO
          #    motivo (o UC-JCHAT-08 reprova porque preventStrayRequests barra o SSR
          #    do Inertia, não o Brain B). Quem quiser o estado corrente deste
          #    arquivo lê o #6310 e o Chat.casos.md, não esta nota.
          #
          # ChatConversasPreviewTest ENTROU junto com o payload que ele mede, no MESMO
          # PR e de proposito: registrar o teste no repo NAO e a lane executa-lo — a
          # licao do PainelContratoTest logo abaixo tem UM dia. Elegivel pela regra
          # acima: usa DatabaseTransactions, zero RefreshDatabase/migrate:fresh/
          # dropIfExists. A prova de que passou a rodar e o CONTADOR desta lane subir.
          #
          # ChatAntiHooksAcaoTest ENTROU em 2026-08-26, fechando metade do achado que
          # a redacao anterior deste bloco (2026-08-17) deixou em aberto. Ele estava
          # de fora porque nascia VERMELHO nos dois UCs; os dois foram medidos no
          # CT 100 e deram desfechos DIFERENTES:
          #
          #   UC-09 (tool declara permissao) — achado REAL. As 5 tools do chat nao
          #   declaravam nada. Fechado implementando `Modules/Jana/Contracts/
          #   DeclaraPermissao` + `permission()` nas 5, cada uma citando a TABELA que
          #   le. DECLARA, nao enforca: as mesmas tools sao instanciadas pelo
          #   BriefDiarioAgent, que roda no cron `brief:generate` SEM auth()->user(),
          #   entao um can() no handle() estouraria headless (medido).
          #
          #   UC-10 (PII no sink de log) — FALSO POSITIVO do MEDIDOR, nao vazamento.
          #   O espiao antigo sobrescrevia `startTrace()` e lia `$attrs` na ENTRADA,
