name: Jana · Pest (MySQL)

# Lane dedicada pra rodar a suíte Pest MySQL-only do Modules/Jana contra MySQL REAL.
# Existe porque ci.yml e modules-pest.yml rodam SQLite :memory: — e os testes do
# Jana que dependem de DDL MySQL-only (triggers BEFORE UPDATE/DELETE com SIGNAL
# SQLSTATE '45000') dão markTestSkipped lá (falsa cobertura). Aqui executam de
# verdade contra o schema baseline migrado.
#
# FURO #1 do handoff SDD Leva 1 (memory/handoffs/2026-06-15-2000-sdd-leva1-
# coordenacao-duravel.md): ImmutabilityTriggersTest (PR #2790 — append-only de
# mcp_task_events + mcp_audit_log) era MySQL-only e NÃO rodava em lane nenhuma
# (só ci.yml=sqlite tocava Jana, e lá ela skipava). A própria migration de
# triggers (2026_06_15_160000) nunca tinha rodado em CI. Esta lane fecha o gap e
# vira o HOME do ratchet pra TODO teste/trigger/migration MySQL-only do Jana.
# Refs: ADR 0278 (arquitetura durável) · ADR 0084 (triggers append-only).
#
# Reusa .github/actions/pest-mysql-setup (mesma do financeiro-pest, FV-F2):
# PHP 8.4 + deps + .env MySQL + migrate (schema baseline 2026-06-04 + migrations
# novas, INCLUI a migration de triggers) + seed mínimo biz=1 (o user semeado
# satisfaz a FK NOT NULL mcp_audit_log.user_id que o teste exige).

on:
  workflow_dispatch: {}
  # ADR 0271 onda 2 (required-readiness): pull_request SEM paths (always-run) pra
  # ser promovível a required sem deadlock "Expected — waiting". O custo (MySQL +
  # migrate + Pest) é evitado por skip-as-pass interno: dorny/paths-filter detecta
  # se algo do Jana mudou; se não, pula o pesado e conclui verde. push segue
  # path-filtered (contém custo no main).
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'Modules/Jana/**'
      # A tela /ia/memoria é da Jana mas o Controller dela mora no KB (a US nasceu
      # aqui, o código foi pra lá). Sem esta linha, mexer no Controller NÃO roda o
      # MemoriaEdicaoMotivoTest — gate mudo com cara de cobertura (lápide §5 2026-08-02).
      - 'Modules/KB/Http/Controllers/MemoriaController.php'
      # Os dois global scopes multi-tenant saíram de Modules/Jana/Scopes pra app/Scopes
      # em 2026-08-12 (a seta apontava núcleo→módulo). Os testes de isolamento seguem
      # aqui e asseguram a CHAVE do scope — sem esta linha, mexer no scope não roda o
      # guard dele: mesmo gate mudo da lápide §5 2026-08-02 citada logo acima.
      - 'app/Scopes/**'
      - 'app/Concerns/HasBusinessScope.php'
      - 'app/Concerns/BelongsToBusinessViaParent.php'
      # O PainelContratoTest asserta sobre o CÓDIGO DA TELA (`Index.tsx`,
      # `_components/JanaCockpit.tsx`) — asserção de arquivo, porque Pest não monta
      # React. Sem esta linha, mexer no `.tsx` NÃO roda o teste que o defende: o
      # terceiro caso do mesmo gate mudo que as duas notas acima já corrigiram
      # (lápide §5 2026-08-02 — "inclua o arquivo SOB TESTE no trigger").
      - 'resources/js/Pages/Jana/**'
      - 'database/schema/mysql-schema.sql'
      - '.github/workflows/jana-pest.yml'
      - '.github/actions/pest-mysql-setup/**'

concurrency:
  group: jana-pest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    name: PHP / Pest (Jana · MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oimpresso_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Detectar mudanças do Jana (skip-as-pass — ADR 0271 onda 2)
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            jana:
              - 'Modules/Jana/**'
              - 'Modules/KB/Http/Controllers/MemoriaController.php'
              # Espelha o `paths:` do push (ver nota lá): é ESTE filtro que decide o
              # skip-as-pass, então sem a linha aqui um PR que mexe só no `.tsx` da
              # tela concluiria verde sem ter rodado o PainelContratoTest.
              - 'resources/js/Pages/Jana/**'
              - 'database/schema/mysql-schema.sql'
              - '.github/workflows/jana-pest.yml'
              - '.github/actions/pest-mysql-setup/**'

      - name: Skip-as-pass (nada do Jana mudou)
        if: steps.changes.outputs.jana == 'false'
        run: echo "✅ Sem mudanças no Modules/Jana — skip-as-pass (required-ready, ADR 0271 onda 2)."

      # Setup canônico reusável (composite action). O service container MySQL fica
      # DECLARADO ACIMA no job (composite action não pode declarar services).
      - name: Setup Pest MySQL (PHP + deps + .env + migrate + seed biz=1/biz=2)
        if: steps.changes.outputs.jana == 'true'
        uses: ./.github/actions/pest-mysql-setup

      - name: Stub Vite manifest (Inertia root view sem build do front)
        if: steps.changes.outputs.jana == 'true'
        run: |
          mkdir -p public/build-inertia
          cat > public/build-inertia/manifest.json <<'EOF'
          {
            "resources/css/inertia.css": { "file": "assets/inertia.css", "src": "resources/css/inertia.css", "isEntry": true },
            "resources/js/app.tsx": { "file": "assets/app.js", "src": "resources/js/app.tsx", "isEntry": true }
          }
          EOF

      - name: Run Pest (Jana · MySQL) — ALLOWLIST VERDE (catraca)
        if: steps.changes.outputs.jana == 'true'
        # phpunit.xml força DB_CONNECTION=sqlite :memory: — se não sobrescrever, os
        # testes MySQL-only (triggers SIGNAL) SKIPam (a falsa cobertura). Exportar
        # aqui faz rodar no MySQL real semeado.
        #
        # CATRACA: a lane roda só os arquivos comprovadamente verdes (MySQL-only do
        # Jana). Cada novo teste MySQL-only do Jana é adicionado AQUI (ratchet up).
        # NÃO incluir arquivos com RefreshDatabase/migrate:fresh — eles dropam o
        # schema (FK) e LIMPAM o biz=1 seedado, envenenando os demais.
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_DATABASE: oimpresso_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          mkdir -p test-results
          vendor/bin/pest --no-coverage --colors=always \
            --log-junit test-results/pest-jana-junit.xml \
            Modules/Jana/Tests/Feature/Mcp/ImmutabilityTriggersTest.php \
            Modules/Jana/Tests/Feature/Memoria/BuscarHistoricoTest.php \
            Modules/Jana/Tests/Feature/Memoria/SupersedeConsolidacaoTest.php \
            Modules/Jana/Tests/Feature/Memoria/MemoriaEdicaoMotivoTest.php \
            Modules/Jana/Tests/Feature/RetentionPurgeCommandTest.php \
            Modules/Jana/Tests/Feature/EntitiesFilhasMultiTenantViaParentTest.php \
            Modules/Jana/Tests/Feature/MultiTenantIsolationTest.php \
            Modules/Jana/Tests/Feature/MultiTenantIsolationComprehensiveTest.php \
            Modules/Jana/Tests/Feature/PeriodosControllerCrossTenantTest.php \
            Modules/Jana/Tests/Feature/FontesControllerCrossTenantTest.php \
            Modules/Jana/Tests/Feature/JanaAccessGateTest.php \
            Modules/Jana/Tests/Feature/Console/JanaRagasFailuresNoSilentCapTest.php \
            Modules/Jana/Tests/Feature/Wave14GovernanceV3Test.php \
            Modules/Jana/Tests/Feature/CockpitMockRemovidoTest.php \
            Modules/Jana/Tests/Feature/FarolServerSideTest.php \
            Modules/Jana/Tests/Feature/PainelContratoTest.php \
            Modules/Jana/Tests/Feature/Mcp/IndexarMemoryGitShaPreservaTest.php \
            Modules/Jana/Tests/Feature/Mcp/McpTokenUsoThrottleTest.php \
            Modules/Jana/Tests/Feature/Mcp/QuotaEnforcerFastPathTest.php \
            Modules/Jana/Tests/Feature/Mcp/McpTokenMemoTest.php
          # PainelContratoTest ENTROU em 2026-08-17. Ele nasceu no PR #5862 (UC-08) e
          # ficou 1 dia FORA desta lista — logo os nove UCs do Painel nunca rodaram no
          # CI, e o `🧪 aguarda run verde` do casos.md nunca poderia virar ✅: a lane
          # lista ARQUIVO, e registrar o teste no repo não é o mesmo que a lane
          # executá-lo (§5 2026-08-02 + emenda 08-12). Descoberto lendo o log desta
          # lane atrás do UC-10 e não achando: `Tests: 6 skipped, 245 passed` era
          # verde SEM ele. Elegível pela regra acima — medido: zero RefreshDatabase,
          # zero migrate:fresh, zero dropIfExists (só `uses(Tests\TestCase::class)`).
          # A prova de que passou a rodar é o CONTADOR desta lane subir de 245.
          #
          # BriefDiarioAgentTest saiu daqui em 2026-08-10: guard sqlite-only fazia
          # ele pular 100% das vezes nesta lane MySQL (skip = exit 0 = verde que não
          # provava nada), e ele monta schema sintético com dropIfExists — o que a
          # regra desta allowlist proíbe explicitamente. Lar novo: a lane sqlite
          # (.github/ci-sqlite-pest.list), onde ele de fato RODA.


      # Passo 1 do plano da LC-13 (Gate:): a lane JA emitia JUnit e NINGUEM lia.
      # O sumario conta `assertions` por arquivo — e o corpus que falta pra medir
      # o FP do --check-assertions ANTES de arma-lo. Aqui so REPORTA (if: always()).
      - name: Sumario JUnit por arquivo (junit-summary.mjs — corpus p/ LC-13)
        if: always()
        run: node scripts/tests/junit-summary.mjs test-results/pest-jana-junit.xml --out test-results/pest-jana-junit-summary.json || true
      # ── PASSO 3 do plano do LC-13 — ARMADO (flip [W] 2026-08-16) ─────────────────
      # Guardado pela MESMA condicao do run de Pest, NUNCA pelo `if: always()` do step
      # de corpus acima: la o step roda ate quando o skip-as-pass (ADR 0271 onda 2)
      # impediu o Pest e o XML nem existe — armar ali ficaria vermelho em todo PR que
      # nao toca o modulo. Medido 2026-08-16; e a razao de isto ser um step PROPRIO e
      # nao um flag no de cima.
      #
      # MORDE quando a lane RODOU e nao provou nada: `0 failed` com 0 assertions e
      # ausencia de EXECUCAO, nao sucesso (LC-13 — "VERDE por NAO-EXECUCAO").
      # Sem `always()`/`!cancelled()`, o `success()` implicito vale: se o Pest falhou,
      # este step e pulado e a lane ja esta vermelha por conta propria (nao duplica).
      - name: Suite provou algo? (--check-assertions · LC-13)
        if: steps.changes.outputs.jana == 'true'
        run: node scripts/tests/junit-summary.mjs test-results/pest-jana-junit.xml --check-assertions

      - name: Upload sumario JUnit (pest-jana-junit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pest-jana-junit-summary
          path: test-results/pest-jana-junit-summary.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload JUnit (Jana · MySQL)
        if: ${{ !cancelled() && steps.changes.outputs.jana == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pest-jana-junit
          path: test-results/pest-jana-junit.xml
          retention-days: 14
