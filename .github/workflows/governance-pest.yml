name: Governance · Pest (MySQL)

# Lane do GOVERNANCE: contratos HTTP das telas /governance/* que precisam de banco.
#
# POR QUE existe: em 2026-11-19 (lote L0 da auditoria do Governance) a rota
# /governance/dashboard passou a exigir `can:governance.dashboard.view`. O teste que prova
# a recusa (403 sem a permissão, 200 com ela, no tenant fictício 98) autentica usuário,
# monta papel Spatie e bate na rota com a stack inteira de middlewares UltimatePOS — em
# sqlite sem schema ele pula, e skip sai exit 0 (LC-13). Nenhuma lane MySQL rodava testes
# do Governance: a `modules-pest.yml` não tem o módulo na matriz e roda em sqlite, e a
# `.github/ci-sqlite-pest.list` sobe sem migrate.
#
# O CÓDIGO SOB TESTE está no gatilho (routes.php e controllers do Governance), senão mexer
# na rota não dispararia a lane.
#
# ⚠️ O Pest ABORTA (exit 2) se um caminho da lista não existe: arquivo novo só entra no
# comando NO MESMO PR que o cria.
#
# Estrutura copiada de dashboard-pest.yml (mesmo setup MySQL, skip-as-pass e sumário JUnit
# por assertions).

on:
  workflow_dispatch: {}
  # pull_request SEM paths (always-run) + skip-as-pass interno via dorny/paths-filter:
  # se nada do domínio mudou, pula o pesado e conclui verde (mesmo padrão das lanes
  # irmãs — required-ready sem deadlock).
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [main]
    # paths-ignore FAIL-CLOSED: PR que toca SÓ memory/, prototipo-ui/ ou o estado do
    # design-sync não sobe esta lane. O paths-filter interno já pularia tudo (veredito
    # igual), só que ocupando runner. Qualquer outro arquivo no diff → roda como antes.
    # Promover a required = APAGAR este bloco (o required-always-run reprova se ficar).
    # Prova: scripts/governance/advisory-paths-ignore.test.mjs
    paths-ignore:
      - 'memory/**'
      - 'prototipo-ui/**'
      - 'scripts/design-sync/state/**'
  push:
    branches: [main]
    paths:
      - 'Modules/Governance/**'
      - 'resources/js/Pages/governance/**'
      - 'app/Providers/AuthServiceProvider.php'
      - 'tests/Feature/Governance/**'
      - 'database/schema/mysql-schema.sql'
      - '.github/workflows/governance-pest.yml'
      - '.github/actions/pest-mysql-setup/**'

concurrency:
  group: governance-pest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    name: PHP / Pest (Governance · MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oimpresso_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Detectar mudanças do governance (skip-as-pass)
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            governance:
              - 'Modules/Governance/**'
              - 'resources/js/Pages/governance/**'
              - 'app/Providers/AuthServiceProvider.php'
              - 'tests/Feature/Governance/**'
              - 'database/schema/mysql-schema.sql'
              - '.github/workflows/governance-pest.yml'
              - '.github/actions/pest-mysql-setup/**'

      - name: Skip-as-pass (nada do governance mudou)
        if: steps.changes.outputs.governance == 'false'
        run: echo "✅ Sem mudanças no governance — skip-as-pass."

      - name: Setup Pest MySQL (PHP + deps + .env + migrate + seed mínimo multi-tenant)
        if: steps.changes.outputs.governance == 'true'
        uses: ./.github/actions/pest-mysql-setup

      - name: Stub Vite manifest (root view sem build do front)
        if: steps.changes.outputs.governance == 'true'
        run: |
          mkdir -p public/build-inertia
          cat > public/build-inertia/manifest.json <<'EOF'
          {
            "resources/css/inertia.css": { "file": "assets/inertia.css", "src": "resources/css/inertia.css", "isEntry": true },
            "resources/js/app.tsx": { "file": "assets/app.js", "src": "resources/js/app.tsx", "isEntry": true }
          }
          EOF

      - name: Run Pest (Governance · MySQL)
        if: steps.changes.outputs.governance == 'true'
        # phpunit.xml aponta DB_CONNECTION=sqlite :memory: (sem force="true"), então a env
        # daqui vence e a suíte roda no MySQL real semeado pela action (ela é a dona dos
        # tenants). Nenhum dos testes daqui usa RefreshDatabase/migrate:fresh — o seed sobrevive.
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_DATABASE: oimpresso_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          mkdir -p test-results
          vendor/bin/pest --no-coverage \
            --log-junit test-results/pest-governance-junit.xml \
            tests/Feature/Governance/DashboardAcessoGateTest.php \
            --colors=always

      # A régua honesta desta lane é `assertions`, NÃO "0 failed": skip sai exit 0.
      # Se o sumário mostrar casos com 0 assertions, a lane NÃO mediu — leia isso antes
      # de comemorar verde (LC-13).
      - name: Sumário JUnit por arquivo (assertions — a régua contra skip-as-pass)
        if: always()
        run: node scripts/tests/junit-summary.mjs test-results/pest-governance-junit.xml --out test-results/pest-governance-junit-summary.json || true

      # MORDE quando a lane rodou e não provou nada (0 assertions = não-execução, LC-13).
      - name: Suite provou algo? (--check-assertions · LC-13)
        if: steps.changes.outputs.governance == 'true'
        run: node scripts/tests/junit-summary.mjs test-results/pest-governance-junit.xml --check-assertions

      - name: Upload sumário JUnit (pest-governance-junit-summary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pest-governance-junit-summary
          path: test-results/pest-governance-junit-summary.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload JUnit (Governance · MySQL)
        if: ${{ !cancelled() && steps.changes.outputs.governance == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pest-governance-junit
          path: test-results/pest-governance-junit.xml
          retention-days: 14
