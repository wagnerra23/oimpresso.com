name: Verticais · Pest (MySQL)

# Lane MySQL pros 3 módulos verticais que NÃO tinham nenhuma:
# ComunicacaoVisual, Repair e Vestuario.
#
# ── O BURACO QUE ISTO FECHA ──────────────────────────────────────────────────
# Eixo 2 do test-lane-coverage (`--mudos`): 13 testes desses módulos têm guard
# `if sqlite → markTestSkipped` (exigem schema MySQL UltimatePOS por causa dos
# models com BusinessScope) e a ÚNICA lane que os alcançava era o
# modules-pest.yml, cuja matriz roda `DB_CONNECTION=sqlite :memory:`. Pulavam
# 100% das vezes — e skip sai exit 0, então o eixo 1 os dava por COBERTOS.
#
# Há Tier 0 nesse lote que nunca correu (ADR 0093):
#   ComunicacaoVisual/MultiTenantTest · ComunicacaoVisual/Tier0GuardTest ·
#   Vestuario/GradeAvancadaMultiTenantTest
#
# ── POR QUE ARQUIVO NOVO, e não um job no modules-pest.yml ───────────────────
# A primeira tentativa FOI estender o modules-pest (que já é o dono da matriz
# desses 3 módulos). Não funciona: `driverDaLane()` do test-lane-coverage faz UM
# regex no arquivo inteiro e devolve o PRIMEIRO `DB_CONNECTION:` — o modelo dele
# é UM DRIVER POR WORKFLOW. Como o modules-pest abre com sqlite, um job MySQL ali
# seria ignorado pelo medidor: os testes rodariam e o `--mudos` continuaria
# chamando-os de mudos. Ponto cego no instrumento é pior que o status quo, e
# ajustar o regex pra contornar faria a medição mentir. Arquivo separado é o que
# o medidor modela corretamente. (Medido com controle: 27 mudos com o job
# embutido, 27 sem — o extrator não via diferença.)
#
# ── TETO DE GOVERNANÇA (ADR 0298) ────────────────────────────────────────────
# Workflow novo só nasce com classe terminal + âncora de custo + promote_by, e
# nunca "advisory em PR pra sempre". Os três estão declarados no
# scripts/governance/gates-registry.json. A ÂNCORA é concreta e datada: ligar
# esta MESMA classe de teste mudo no Modules/Arquivos (PR #5526 → #5546 → #5553)
# expôs (a) um `Undefined variable` que derrubava o comando de retenção com dado
# real, sem rollback, e (b) o valor `exported` ausente do enum de
# arquivos_audit_log ⇒ `arquivos:export-zip` gravava ZERO trilha de auditoria,
# violando ADR 0123 §8 / LGPD Art. 18. Os dois estavam escondidos atrás de skip.
#
# Reusa .github/actions/pest-mysql-setup (mesma de arquivos-pest / jana-pest /
# nfebrasil-pest): PHP 8.4 + deps + .env MySQL + migrate + seed mínimo multi-tenant.

on:
  workflow_dispatch: {}
  # ADR 0271 onda 2 (required-readiness): pull_request SEM paths (always-run) pra
  # ser promovível a required sem deadlock "Expected — waiting". O custo pesado é
  # evitado por skip-as-pass interno (dorny/paths-filter). push segue
  # path-filtered (contém custo no main).
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [main]
    # paths-ignore FAIL-CLOSED: PR que toca SÓ memory/, prototipo-ui/ ou o estado do
    # design-sync não sobe esta lane. O paths-filter interno já pularia tudo (veredito
    # igual), só que ocupando runner. Qualquer outro arquivo no diff → roda como antes.
    # Promover a required = APAGAR este bloco (o required-always-run reprova se ficar).
    # Prova: scripts/governance/advisory-paths-ignore.test.mjs
    paths-ignore:
      - 'memory/**'
      - 'prototipo-ui/**'
      - 'scripts/design-sync/state/**'
  push:
    branches: [main]
    paths:
      - 'Modules/ComunicacaoVisual/**'
      - 'resources/js/Pages/ComunicacaoVisual/**'
      - 'Modules/Repair/**'
      # UC-COS-31/32 — o aviso de OS do Repair mora no módulo Whatsapp; sem o listener no
      # trigger, mexer nele não rodaria o contrato que o cobre.
      - 'Modules/Whatsapp/Listeners/NotifyRepairCustomer.php'
      - 'resources/js/Pages/Repair/**'
      - 'Modules/Vestuario/**'
      - 'resources/js/Pages/Vestuario/**'
      # 2026-08-19 — SA-O1: o contrato de /superadmin precisa de MySQL real (em sqlite
      # os 5 casos pulam e o arquivo sai exit 0 sem provar nada). Entra o modulo INTEIRO
      # e nao so a pasta de teste: sem o arquivo SOB TESTE no trigger, mexer no controller
      # nao dispara o teste dele — gate mudo com cara de cobertura.
      - 'Modules/Superadmin/**'
      - 'Modules/Cms/**'
      # E1 site público — /login e /register (core): o arquivo SOB TESTE entra no trigger.
      - 'app/Http/Controllers/Auth/LoginController.php'
      - 'app/Http/Controllers/Auth/RegisterController.php'
      - 'resources/js/Pages/Site/Login.tsx'
      - 'resources/js/Pages/Site/Register.tsx'
      - 'tests/Feature/Site/SiteAuthContratoTest.php'
      # Thread Crm/03 — a lista de acompanhamentos virou Inertia; o contrato dela roda aqui.
      - 'Modules/Crm/Http/Controllers/ScheduleController.php'
      - 'Modules/Crm/Services/ScheduleService.php'
      - 'Modules/Crm/Http/Controllers/ScheduleLogController.php'
      - 'Modules/Crm/Http/Requests/*ScheduleRequest.php'
      - 'Modules/Crm/Resources/js/Pages/**'
      - 'Modules/Crm/Tests/Feature/CrmAcompanhamentosContratoTest.php'
      # Thread Crm/13 F2 — baseline dos dados dos Relatórios antes da tela React.
      - 'Modules/Crm/Tests/Feature/CrmRelatoriosBaselineTest.php'
      - 'Modules/Crm/Tests/Feature/CrmRegistroEscopoTest.php'
      # Thread Crm/12 F2 — baseline da Blade do Registro de chamadas antes da tela React.
      - 'Modules/Crm/Tests/Feature/CrmChamadasBaselineTest.php'
      # Thread Crm/02 — a lista de leads virou Inertia; o contrato dela roda aqui.
      - 'Modules/Crm/Http/Controllers/LeadController.php'
      - 'Modules/Crm/Tests/Feature/CrmLeadsContratoTest.php'
      # US-CRM-092 — funil de vendas em kanban.
      - 'Modules/Crm/Http/Controllers/FunilController.php'
      - 'Modules/Crm/Services/DealPipelineService.php'
      - 'Modules/Crm/Tests/Feature/CrmFunilContratoTest.php'
      # US-CRM-096 — captura pública de lead com origem e UTM.
      - 'Modules/Crm/Http/Controllers/CapturaLeadController.php'
      - 'Modules/Crm/Services/CapturaDeLead.php'
      - 'Modules/Crm/Routes/api.php'
      - 'Modules/Crm/Tests/Feature/CrmCapturaLeadContratoTest.php'
      # US-CRM-098 — segmentação RFM (contrato App\Contracts\Crm\SegmentacaoRfm).
      - 'Modules/Crm/Services/Fidelidade/**'
      - 'Modules/Crm/Console/Commands/RfmCalcularCommand.php'
      - 'app/Contracts/Crm/SegmentacaoRfm.php'
      - 'Modules/Crm/Tests/Feature/CrmRfm*'
      # Thread Crm/11 F2 — baseline da Blade de Campanhas antes da tela React.
      - 'Modules/Crm/Tests/Feature/CrmCampanhasBaselineTest.php'
      # Thread Crm/06 — o form de lead é o Cliente/Create parametrizado.
      - 'resources/js/Pages/Cliente/Create.tsx'
      # Thread Crm/09 — a edição de lead é o Cliente/Edit parametrizado.
      - 'resources/js/Pages/Cliente/Edit.tsx'
      - 'resources/js/Pages/Cliente/_form/DadosLeadSection.tsx'
      # Thread Crm/08 — a ficha Blade do lead (show) só abre `type = lead`.
      - 'Modules/Crm/Tests/Feature/CrmLeadShowEscopoTest.php'
      # Thread Crm/12 — Registro de chamadas: escopo da exclusão em massa (B2) e a migração da tela.
      - 'Modules/Crm/Http/Controllers/CallLogController.php'
      - 'Modules/Crm/Http/Requests/MassDestroyCallLogRequest.php'
      - 'Modules/Crm/Tests/Feature/CrmChamadas*'
      # Thread Crm/04 — o painel do CRM virou Inertia; o contrato dele roda aqui.
      - 'Modules/Crm/Http/Controllers/CrmDashboardController.php'
      - 'Modules/Crm/Tests/Feature/CrmPainelContratoTest.php'
      # Thread Crm/13 — Relatórios: portão is_admin nos endpoints de dados (C1) e a migração da tela.
      - 'Modules/Crm/Http/Controllers/ReportController.php'
      - 'Modules/Crm/Tests/Feature/CrmRelatorios*'
      # Thread Crm/17 — pedidos de clientes: a Blade travada antes da Page.
      - 'Modules/Crm/Http/Controllers/OrderRequestController.php'
      - 'Modules/Crm/Tests/Feature/CrmPedidos*'
      # Thread Crm/16 — login de contatos (portal, D3): a Blade travada antes da Page.
      - 'Modules/Crm/Http/Controllers/ContactLoginController.php'
      - 'Modules/Crm/Tests/Feature/CrmLogins*'
      # Thread Crm/18 — Início do portal do contato (D6): Page Inertia + a fonte única do menu.
      - 'Modules/Crm/Http/Controllers/DashboardController.php'
      - 'Modules/Crm/Http/Middleware/ContactSidebarMenu.php'
      - 'Modules/Crm/Services/PortalContatoMenu.php'
      - 'Modules/Crm/Http/Controllers/ManageProfileController.php'
      - 'Modules/Crm/Tests/Feature/CrmPortal*'
      # Raiz do 500 da lista de leads e da API do Connector: CrmUtil::getLeadsListQuery.
      - 'Modules/Crm/Utils/CrmUtil.php'
      - 'Modules/Connector/Http/Controllers/Api/Crm/FollowUpController.php'
      - 'Modules/Crm/Tests/Feature/CrmLeadsListQueryTest.php'
      # Ticket médio/saldo da pessoa (D8 do MAPA-DE-DADOS-v1 do app Mobile).
      - 'Modules/Crm/Http/Controllers/ClienteIaController.php'
      - 'app/Services/Pessoas/PessoaVendas.php'
      - 'Modules/Crm/Tests/Feature/ClienteStatsTicketMedioTest.php'
      # Thread Crm/11 — Campanhas: escopo dos contatos (A1) e a migração da lista.
      - 'Modules/Crm/Http/Controllers/CampaignController.php'
      - 'Modules/Crm/Http/Requests/StoreCampaignRequest.php'
      - 'Modules/Crm/Services/CampaignService.php'
      - 'Modules/Crm/Tests/Feature/CrmCampanhas*'
      # Thread Crm/15 — Configurações do CRM: baseline da Blade (F2) antes da tela React.
      - 'Modules/Crm/Http/Controllers/CrmSettingsController.php'
      - 'Modules/Crm/Tests/Feature/CrmConfiguracoes*'
      # Thread Crm/14 — Propostas: baseline da Blade (F2) antes da tela React.
      - 'Modules/Crm/Http/Controllers/ProposalController.php'
      - 'Modules/Crm/Tests/Feature/CrmPropostas*'
      # Thread Producao/02 — fundo do PCP (trigger append-only exige MySQL).
      - 'Modules/Producao/**'
      # US-PCP-031 — a reserva do insumo lê a receita pelo contrato (implementado no Manufacturing).
      - 'app/Contracts/Fabricacao/**'
      - 'Modules/Manufacturing/Services/InsumosDaReceitaService.php'
      # US-PCP-025 — o sinal mínimo da empresa mora nas regras do FSM.
      - 'app/Domain/Fsm/Modelos/RegrasDaEmpresa.php'
      # US-FISIO-003 — fundo do Fisio (triggers append-only + escopo multi-tenant exigem MySQL).
      - 'Modules/Fisio/**'
      # US-MKT-001 — fundo do Marketplaces (FK, escopo 98×99 e trigger append-only exigem MySQL).
      - 'Modules/Marketplaces/**'
      # Etapa 02 T-13 — service worker do portal do paciente (FisioPortalAppTest lê o arquivo).
      - 'public/sw-fisio-portal.js'
      # Thread Producao/04 — o apontamento lê a saída do ponto (D-PONTO).
      - 'Modules/Ponto/Services/PresencaDoDiaService.php'
      - 'database/schema/mysql-schema.sql'
      - '.github/workflows/verticais-pest.yml'
      - '.github/actions/pest-mysql-setup/**'

concurrency:
  group: verticais-pest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    name: PHP / Pest (Verticais · MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oimpresso_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Detectar mudanças dos verticais (skip-as-pass — ADR 0271 onda 2)
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            vert:
              - 'Modules/ComunicacaoVisual/**'
              - 'resources/js/Pages/ComunicacaoVisual/**'
              - 'Modules/Repair/**'
              - 'Modules/Whatsapp/Listeners/NotifyRepairCustomer.php'
              - 'resources/js/Pages/Repair/**'
              - 'Modules/Vestuario/**'
              - 'resources/js/Pages/Vestuario/**'
              # 2026-08-21 — SA-O4c: `Modules/Superadmin/**` estava no trigger `push` (desde a
              # SA-O1) mas NÃO aqui. O efeito é um gate MUDO: em PR que só toca o módulo, este
              # filtro dá `vert=false`, o job cai em skip-as-pass e os 3 arquivos de contrato do
              # Superadmin NÃO RODAM — verde por não-execução.
              #
              # Não é hipótese, é o que aconteceu: o #6086 (SA-O4b) mergeou com 116 checks verdes
              # carregando um `UC-SAASS-15` VERMELHO dentro. Ele só apareceu neste PR porque este
              # PR toca o próprio `.yml`, e aí o filtro casou pela linha de baixo.
              - 'Modules/Superadmin/**'
              # Thread Cms/01 — a lista do painel do CMS virou Inertia; o contrato dela roda aqui.
              - 'Modules/Cms/**'
              # E1 site público — contrato de /login e /register (core, fora dos módulos).
              - 'app/Http/Controllers/Auth/LoginController.php'
              - 'app/Http/Controllers/Auth/RegisterController.php'
              - 'resources/js/Pages/Site/Login.tsx'
              - 'resources/js/Pages/Site/Register.tsx'
              - 'tests/Feature/Site/SiteAuthContratoTest.php'
              # Thread Crm/03 — a lista de acompanhamentos virou Inertia; o contrato dela roda aqui.
              - 'Modules/Crm/Http/Controllers/ScheduleController.php'
              # Thread Crm/07 — a escrita do modal passa pelo Service e pelos FormRequests.
              - 'Modules/Crm/Services/ScheduleService.php'
              - 'Modules/Crm/Http/Controllers/ScheduleLogController.php'
              - 'Modules/Crm/Http/Requests/*ScheduleRequest.php'
              - 'Modules/Crm/Resources/js/Pages/**'
              - 'Modules/Crm/Tests/Feature/CrmAcompanhamentosContratoTest.php'
              # Thread Crm/13 F2 — baseline dos dados dos Relatórios antes da tela React.
              - 'Modules/Crm/Tests/Feature/CrmRelatoriosBaselineTest.php'
              - 'Modules/Crm/Tests/Feature/CrmRegistroEscopoTest.php'
              # Thread Crm/12 F2 — baseline da Blade do Registro de chamadas antes da tela React.
              - 'Modules/Crm/Tests/Feature/CrmChamadasBaselineTest.php'
              # Thread Crm/02 — a lista de leads virou Inertia; o contrato dela roda aqui.
              - 'Modules/Crm/Http/Controllers/LeadController.php'
              - 'Modules/Crm/Tests/Feature/CrmLeadsContratoTest.php'
              # US-CRM-092 — funil de vendas em kanban.
              - 'Modules/Crm/Http/Controllers/FunilController.php'
              - 'Modules/Crm/Services/DealPipelineService.php'
              - 'Modules/Crm/Tests/Feature/CrmFunilContratoTest.php'
              # US-CRM-096 — captura pública de lead com origem e UTM.
              - 'Modules/Crm/Http/Controllers/CapturaLeadController.php'
              - 'Modules/Crm/Services/CapturaDeLead.php'
              - 'Modules/Crm/Routes/api.php'
              - 'Modules/Crm/Tests/Feature/CrmCapturaLeadContratoTest.php'
              # US-CRM-098 — segmentação RFM (contrato App\Contracts\Crm\SegmentacaoRfm).
              - 'Modules/Crm/Services/Fidelidade/**'
              - 'Modules/Crm/Console/Commands/RfmCalcularCommand.php'
              - 'app/Contracts/Crm/SegmentacaoRfm.php'
              - 'Modules/Crm/Tests/Feature/CrmRfm*'
              # Thread Crm/11 F2 — baseline da Blade de Campanhas antes da tela React.
              - 'Modules/Crm/Tests/Feature/CrmCampanhasBaselineTest.php'
              # Thread Crm/06 — o form de lead é o Cliente/Create parametrizado.
              - 'resources/js/Pages/Cliente/Create.tsx'
              # Thread Crm/09 — a edição de lead é o Cliente/Edit parametrizado.
              - 'resources/js/Pages/Cliente/Edit.tsx'
              - 'resources/js/Pages/Cliente/_form/DadosLeadSection.tsx'
              # Thread Crm/08 — a ficha Blade do lead (show) só abre `type = lead`.
              - 'Modules/Crm/Tests/Feature/CrmLeadShowEscopoTest.php'
              # Thread Crm/12 — Registro de chamadas: escopo da exclusão em massa (B2) e a migração da tela.
              - 'Modules/Crm/Http/Controllers/CallLogController.php'
              - 'Modules/Crm/Http/Requests/MassDestroyCallLogRequest.php'
              - 'Modules/Crm/Tests/Feature/CrmChamadas*'
              # Thread Crm/04 — o painel do CRM virou Inertia; o contrato dele roda aqui.
              - 'Modules/Crm/Http/Controllers/CrmDashboardController.php'
              - 'Modules/Crm/Tests/Feature/CrmPainelContratoTest.php'
              # Thread Crm/13 — Relatórios: portão is_admin nos endpoints de dados (C1) e a migração da tela.
              - 'Modules/Crm/Http/Controllers/ReportController.php'
              - 'Modules/Crm/Tests/Feature/CrmRelatorios*'
              # Thread Crm/17 — pedidos de clientes: a Blade travada antes da Page.
              - 'Modules/Crm/Http/Controllers/OrderRequestController.php'
              - 'Modules/Crm/Tests/Feature/CrmPedidos*'
              # Thread Crm/16 — login de contatos (portal, D3): a Blade travada antes da Page.
              - 'Modules/Crm/Http/Controllers/ContactLoginController.php'
              - 'Modules/Crm/Tests/Feature/CrmLogins*'
              # Thread Crm/18 — Início do portal do contato (D6): Page Inertia + a fonte única do menu.
              - 'Modules/Crm/Http/Controllers/DashboardController.php'
              - 'Modules/Crm/Http/Middleware/ContactSidebarMenu.php'
              - 'Modules/Crm/Services/PortalContatoMenu.php'
              - 'Modules/Crm/Http/Controllers/ManageProfileController.php'
              - 'Modules/Crm/Tests/Feature/CrmPortal*'
              # Raiz do 500 da lista de leads e da API do Connector: CrmUtil::getLeadsListQuery.
              - 'Modules/Crm/Utils/CrmUtil.php'
              - 'Modules/Connector/Http/Controllers/Api/Crm/FollowUpController.php'
              - 'Modules/Crm/Tests/Feature/CrmLeadsListQueryTest.php'
              - 'Modules/Crm/Http/Controllers/ClienteIaController.php'
              - 'app/Services/Pessoas/PessoaVendas.php'
              - 'Modules/Crm/Tests/Feature/ClienteStatsTicketMedioTest.php'
              # Thread Crm/11 — Campanhas: escopo dos contatos (A1) e a migração da lista.
              - 'Modules/Crm/Http/Controllers/CampaignController.php'
              - 'Modules/Crm/Http/Requests/StoreCampaignRequest.php'
              - 'Modules/Crm/Services/CampaignService.php'
              - 'Modules/Crm/Tests/Feature/CrmCampanhas*'
              # Thread Crm/15 — Configurações do CRM: baseline da Blade (F2) antes da tela React.
              - 'Modules/Crm/Http/Controllers/CrmSettingsController.php'
              - 'Modules/Crm/Tests/Feature/CrmConfiguracoes*'
              # Thread Crm/14 — Propostas: baseline da Blade (F2) antes da tela React.
              - 'Modules/Crm/Http/Controllers/ProposalController.php'
              - 'Modules/Crm/Tests/Feature/CrmPropostas*'
              # Thread Producao/02 — fundo do PCP (trigger append-only exige MySQL).
              - 'Modules/Producao/**'
              # US-PCP-031 — a reserva do insumo lê a receita pelo contrato (implementado no Manufacturing).
              - 'app/Contracts/Fabricacao/**'
              - 'Modules/Manufacturing/Services/InsumosDaReceitaService.php'
              # US-PCP-025 — o sinal mínimo da empresa mora nas regras do FSM.
              - 'app/Domain/Fsm/Modelos/RegrasDaEmpresa.php'
              # US-FISIO-003 — fundo do Fisio (triggers append-only + escopo multi-tenant exigem MySQL).
              - 'Modules/Fisio/**'
              # US-MKT-001 — fundo do Marketplaces.
              - 'Modules/Marketplaces/**'
              # Etapa 02 T-13 — service worker do portal do paciente (FisioPortalAppTest lê o arquivo).
              - 'public/sw-fisio-portal.js'
              # Thread Producao/04 — o apontamento lê a saída do ponto (D-PONTO).
              - 'Modules/Ponto/Services/PresencaDoDiaService.php'
              - 'database/schema/mysql-schema.sql'
              - '.github/workflows/verticais-pest.yml'
              - '.github/actions/pest-mysql-setup/**'

      - name: Skip-as-pass (nada dos verticais mudou)
        if: steps.changes.outputs.vert == 'false'
        run: echo "✅ Sem mudanças em ComunicacaoVisual/Repair/Vestuario — skip-as-pass (required-ready, ADR 0271 onda 2)."

      # Setup canônico reusável (composite action). O service container MySQL fica
      # DECLARADO ACIMA no job — composite action não pode declarar services.
      - name: Setup Pest MySQL (PHP + deps + .env + migrate + seed mínimo multi-tenant)
        if: steps.changes.outputs.vert == 'true'
        uses: ./.github/actions/pest-mysql-setup

      - name: Stub Vite manifest (Inertia root view sem build do front)
        if: steps.changes.outputs.vert == 'true'
        run: |
          mkdir -p public/build-inertia
          cat > public/build-inertia/manifest.json <<'EOF'
          {
            "resources/css/inertia.css": { "file": "assets/inertia.css", "src": "resources/css/inertia.css", "isEntry": true },
            "resources/js/app.tsx": { "file": "assets/app.js", "src": "resources/js/app.tsx", "isEntry": true }
          }
          EOF

      - name: Run Pest (Verticais · MySQL) — ALLOWLIST VERDE (catraca)
        if: steps.changes.outputs.vert == 'true'
        # phpunit.xml força DB_CONNECTION=sqlite :memory: — sem sobrescrever aqui, os
        # 13 arquivos SKIPam de novo e a lane vira teatro. Exportar faz rodar no
        # MySQL real semeado.
        #
        # CATRACA: allowlist VERDE, igual às lanes irmãs. Arquivo que avermelhar SAI
        # e vira dívida declarada neste comentário — ligar vermelho permanente numa
        # lane advisory só ensina o time a ignorá-la.
        #
        # ERAM 13 CANDIDATOS. Rodados de verdade pela 1ª vez (run 31427231686 ·
        # 11 failed, 15 skipped, 67 passed), 6 vieram verdes e entram (44 passed):
        #   ComunicacaoVisual/Tier0GuardTest(13) · MigrationsTest(10) · MultiTenantTest(7)
        #   Vestuario/SmokeRoutesVestuarioTest(6) · Repair/ProducaoOficinaRefactorTest(5)
        #   Repair/DeviceModelsInertiaSmokeTest(3)
        #
        # ✅ 2 dos 3 guards Tier 0 (ADR 0093) do lote passaram e agora defendem de
        #    verdade: ComunicacaoVisual/MultiTenantTest e Tier0GuardTest.
        #
        # FICAM DE FORA — 6 com dívida real, agora VISÍVEL e datada:
        #   ComunicacaoVisual: ContratoTelaOrcamento(1 fail+1 erro) · CustomerJourney(2 erros)
        #     · MaterialSeeder(1 erro) · OrcamentoController(1 fail)
        #   Vestuario: GradeAvancadaMultiTenant(4 erros — ⚠️ Tier 0, segue mudo) ·
        #     VestuarioSettingsCommand(1 fail de 14)
        #
        # FICA DE FORA por OUTRO motivo — Repair/JobSheetObserverTest: passed=0,
