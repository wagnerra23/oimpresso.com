      # O sumário conta `assertions` POR ARQUIVO — é o discriminador que separa
      # "passou" de "pulou" (LC-13). Aqui só REPORTA.
      - name: Sumario JUnit por arquivo (junit-summary.mjs)
        if: always()
        run: node scripts/tests/junit-summary.mjs test-results/pest-verticais-junit.xml --out test-results/pest-verticais-junit-summary.json || true

      - name: Upload JUnit (Verticais · MySQL)
        if: ${{ !cancelled() && steps.changes.outputs.vert == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pest-verticais-junit
          path: test-results/pest-verticais-junit*.*
          retention-days: 14
          if-no-files-found: ignore
