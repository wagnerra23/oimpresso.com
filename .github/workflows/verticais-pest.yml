name: Verticais · Pest (MySQL)

# Lane MySQL pros 3 módulos verticais que NÃO tinham nenhuma:
# ComunicacaoVisual, Repair e Vestuario.
#
# ── O BURACO QUE ISTO FECHA ──────────────────────────────────────────────────
# Eixo 2 do test-lane-coverage (`--mudos`): 13 testes desses módulos têm guard
# `if sqlite → markTestSkipped` (exigem schema MySQL UltimatePOS por causa dos
# models com BusinessScope) e a ÚNICA lane que os alcançava era o
# modules-pest.yml, cuja matriz roda `DB_CONNECTION=sqlite :memory:`. Pulavam
# 100% das vezes — e skip sai exit 0, então o eixo 1 os dava por COBERTOS.
#
# Há Tier 0 nesse lote que nunca correu (ADR 0093):
#   ComunicacaoVisual/MultiTenantTest · ComunicacaoVisual/Tier0GuardTest ·
#   Vestuario/GradeAvancadaMultiTenantTest
#
# ── POR QUE ARQUIVO NOVO, e não um job no modules-pest.yml ───────────────────
# A primeira tentativa FOI estender o modules-pest (que já é o dono da matriz
# desses 3 módulos). Não funciona: `driverDaLane()` do test-lane-coverage faz UM
# regex no arquivo inteiro e devolve o PRIMEIRO `DB_CONNECTION:` — o modelo dele
# é UM DRIVER POR WORKFLOW. Como o modules-pest abre com sqlite, um job MySQL ali
# seria ignorado pelo medidor: os testes rodariam e o `--mudos` continuaria
# chamando-os de mudos. Ponto cego no instrumento é pior que o status quo, e
# ajustar o regex pra contornar faria a medição mentir. Arquivo separado é o que
# o medidor modela corretamente. (Medido com controle: 27 mudos com o job
# embutido, 27 sem — o extrator não via diferença.)
#
# ── TETO DE GOVERNANÇA (ADR 0298) ────────────────────────────────────────────
# Workflow novo só nasce com classe terminal + âncora de custo + promote_by, e
# nunca "advisory em PR pra sempre". Os três estão declarados no
# scripts/governance/gates-registry.json. A ÂNCORA é concreta e datada: ligar
# esta MESMA classe de teste mudo no Modules/Arquivos (PR #5526 → #5546 → #5553)
# expôs (a) um `Undefined variable` que derrubava o comando de retenção com dado
# real, sem rollback, e (b) o valor `exported` ausente do enum de
# arquivos_audit_log ⇒ `arquivos:export-zip` gravava ZERO trilha de auditoria,
# violando ADR 0123 §8 / LGPD Art. 18. Os dois estavam escondidos atrás de skip.
#
# Reusa .github/actions/pest-mysql-setup (mesma de arquivos-pest / jana-pest /
# nfebrasil-pest): PHP 8.4 + deps + .env MySQL + migrate + seed mínimo multi-tenant.

on:
  workflow_dispatch: {}
  # ADR 0271 onda 2 (required-readiness): pull_request SEM paths (always-run) pra
  # ser promovível a required sem deadlock "Expected — waiting". O custo pesado é
  # evitado por skip-as-pass interno (dorny/paths-filter). push segue
  # path-filtered (contém custo no main).
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'Modules/ComunicacaoVisual/**'
      - 'resources/js/Pages/ComunicacaoVisual/**'
      - 'Modules/Repair/**'
      - 'resources/js/Pages/Repair/**'
      - 'Modules/Vestuario/**'
      - 'resources/js/Pages/Vestuario/**'
      # 2026-08-19 — SA-O1: o contrato de /superadmin precisa de MySQL real (em sqlite
      # os 5 casos pulam e o arquivo sai exit 0 sem provar nada). Entra o modulo INTEIRO
      # e nao so a pasta de teste: sem o arquivo SOB TESTE no trigger, mexer no controller
      # nao dispara o teste dele — gate mudo com cara de cobertura.
      - 'Modules/Superadmin/**'
      - 'database/schema/mysql-schema.sql'
      - '.github/workflows/verticais-pest.yml'
      - '.github/actions/pest-mysql-setup/**'

concurrency:
  group: verticais-pest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    name: PHP / Pest (Verticais · MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oimpresso_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Detectar mudanças dos verticais (skip-as-pass — ADR 0271 onda 2)
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            vert:
              - 'Modules/ComunicacaoVisual/**'
              - 'resources/js/Pages/ComunicacaoVisual/**'
              - 'Modules/Repair/**'
              - 'resources/js/Pages/Repair/**'
              - 'Modules/Vestuario/**'
              - 'resources/js/Pages/Vestuario/**'
              # 2026-08-21 — SA-O4c: `Modules/Superadmin/**` estava no trigger `push` (desde a
              # SA-O1) mas NÃO aqui. O efeito é um gate MUDO: em PR que só toca o módulo, este
              # filtro dá `vert=false`, o job cai em skip-as-pass e os 3 arquivos de contrato do
              # Superadmin NÃO RODAM — verde por não-execução.
              #
              # Não é hipótese, é o que aconteceu: o #6086 (SA-O4b) mergeou com 116 checks verdes
              # carregando um `UC-SAASS-15` VERMELHO dentro. Ele só apareceu neste PR porque este
              # PR toca o próprio `.yml`, e aí o filtro casou pela linha de baixo.
              - 'Modules/Superadmin/**'
              - 'database/schema/mysql-schema.sql'
              - '.github/workflows/verticais-pest.yml'
              - '.github/actions/pest-mysql-setup/**'

      - name: Skip-as-pass (nada dos verticais mudou)
        if: steps.changes.outputs.vert == 'false'
        run: echo "✅ Sem mudanças em ComunicacaoVisual/Repair/Vestuario — skip-as-pass (required-ready, ADR 0271 onda 2)."

      # Setup canônico reusável (composite action). O service container MySQL fica
      # DECLARADO ACIMA no job — composite action não pode declarar services.
      - name: Setup Pest MySQL (PHP + deps + .env + migrate + seed mínimo multi-tenant)
        if: steps.changes.outputs.vert == 'true'
        uses: ./.github/actions/pest-mysql-setup

      - name: Stub Vite manifest (Inertia root view sem build do front)
        if: steps.changes.outputs.vert == 'true'
        run: |
          mkdir -p public/build-inertia
          cat > public/build-inertia/manifest.json <<'EOF'
          {
            "resources/css/inertia.css": { "file": "assets/inertia.css", "src": "resources/css/inertia.css", "isEntry": true },
            "resources/js/app.tsx": { "file": "assets/app.js", "src": "resources/js/app.tsx", "isEntry": true }
          }
          EOF

      - name: Run Pest (Verticais · MySQL) — ALLOWLIST VERDE (catraca)
        if: steps.changes.outputs.vert == 'true'
        # phpunit.xml força DB_CONNECTION=sqlite :memory: — sem sobrescrever aqui, os
        # 13 arquivos SKIPam de novo e a lane vira teatro. Exportar faz rodar no
        # MySQL real semeado.
        #
        # CATRACA: allowlist VERDE, igual às lanes irmãs. Arquivo que avermelhar SAI
        # e vira dívida declarada neste comentário — ligar vermelho permanente numa
        # lane advisory só ensina o time a ignorá-la.
        #
        # ERAM 13 CANDIDATOS. Rodados de verdade pela 1ª vez (run 31427231686 ·
        # 11 failed, 15 skipped, 67 passed), 6 vieram verdes e entram (44 passed):
        #   ComunicacaoVisual/Tier0GuardTest(13) · MigrationsTest(10) · MultiTenantTest(7)
        #   Vestuario/SmokeRoutesVestuarioTest(6) · Repair/ProducaoOficinaRefactorTest(5)
        #   Repair/DeviceModelsInertiaSmokeTest(3)
        #
        # ✅ 2 dos 3 guards Tier 0 (ADR 0093) do lote passaram e agora defendem de
        #    verdade: ComunicacaoVisual/MultiTenantTest e Tier0GuardTest.
        #
        # FICAM DE FORA — 6 com dívida real, agora VISÍVEL e datada:
        #   ComunicacaoVisual: ContratoTelaOrcamento(1 fail+1 erro) · CustomerJourney(2 erros)
        #     · MaterialSeeder(1 erro) · OrcamentoController(1 fail)
        #   Vestuario: GradeAvancadaMultiTenant(4 erros — ⚠️ Tier 0, segue mudo) ·
        #     VestuarioSettingsCommand(1 fail de 14)
        #
        # FICA DE FORA por OUTRO motivo — Repair/JobSheetObserverTest: passed=0,
        #   skipped=9. Guard secundário o faz pular mesmo em MySQL ⇒ incluí-lo não o
        #   tiraria do mudo (fantasma de 2ª ordem, igual ao
        #   Fiscal/NfseCockpitControllerTest na lane do NfeBrasil).
        #
        # ⚠️ O veredito por arquivo saiu do SUMÁRIO JUnit, não do console — e a
        # diferença importou: o console marcou os 3 do Repair como WARN, mas 2 deles
        # estão VERDES (têm casos pulados junto dos que passam). Confiar no console
        # teria excluído 2 arquivos bons. Arquivo com passed=0 também sai verde lá.
        #
        # ENTRA 2026-09-05 — Repair/RepairJobSheetIndexContratoTest (US-REPA-004):
        # a listagem de OS estava live desde 2026-05-06 com ZERO teste, e o charter
        # prometia 7 GUARDs que nunca existiram (revogados no #6874). O contrato aqui
        # fixa o TRIPLE-MODE do `index()` ANTES de qualquer troca do motor da tabela:
        # o ramo `ajax()` serve o Blade legado E a Page, entao migrar a tela nao pode
        # altera-lo. Exige MySQL (o `beforeEach` pula em sqlite), como o irmao abaixo.
        # NAO rodado localmente: Pest e proibido fora do CT 100 (proibicoes.md) — o
        # veredito desta lane e a primeira execucao real, e por isso os UCs pulam por
        # ambiente em vez de assertar cego.
        #
        # ENTRA 2026-09-05 — Repair/RepairSettingsContratoTest (F4 QA da Onda 1):
        # o contrato de gravação das configurações do Repair não era exercido por lane
        # NENHUMA. Ele exige MySQL (o `beforeEach` pula em sqlite por causa do schema de
        # `business`), então na `modules-pest` os 8 UCs saíam SKIPPED e o job dava
        # success — falso-verde de manual (LC-13). Aqui roda de verdade.
        # Medido no CT 100 (MySQL real, 2026-09-05) com o ambiente igual ao desta lane
        # — isto é, `system.repair_version` ausente, que é como o seed a deixa:
        #   6 passed (17 assertions) + 2 skipped  ⇒ VERDE pelo critério da catraca.
        # Os 2 skipped são UC-RSET-07/08, os únicos que passam por `index()`; eles
        # pulam VISÍVEL porque `ModuleUtil::getTaxonomyData` faz `exit` quando o módulo
        # não consta instalado. Com `system.repair_version` presente os 8 passam
        # (30 assertions) — a dívida é do seed, e está declarada no charter da tela.
        #
        # ENTRAM 2026-09-05 — Repair/DeviceModelsContratoTest + Repair/RepairStatusContratoTest:
        # o contrato executável das 4 telas de cadastro do Repair (DeviceModels Index/Create/Edit
        # e Status/Index), fechando o trio das quatro. Sem estar NESTA lista o arquivo nasce mudo:
        # a lane roda allowlist, não diretório (§ lado subtrativo do run-set, LC-13).
        # Medidos no CT 100 (MySQL real, 2026-09-05) com o ambiente igual ao desta lane — isto é,
        # `system.repair_version` ausente:
        #   DeviceModelsContratoTest  → 14 passed (58 assertions), 0 skipped
        #   RepairStatusContratoTest  →  6 passed (17 assertions), 0 skipped
        # Nenhum dos dois passa por `ModuleUtil::getTaxonomyData`, então não sofrem o `exit` que
        # obriga o RepairSettingsContratoTest a pular 2 UCs: `Category::forDropdown` consulta a
        # tabela `categories` direto, sem taxonomia de módulo.
        #
        # ⚠️ Estes dois NÃO duplicam o DeviceModelsInertiaSmokeTest acima. Medido no mesmo dia,
        # aquele arquivo roda `5 skipped, 3 passed (3 assertions)`: os 3 testes de render Inertia
        # dele pulam sempre — mandam `X-Inertia-Version: 'test'`, levam 409, e o
        # `if (status !== 200) markTestSkipped()` engole; e os 2 cross-tenant exigem SQLite, que
        # esta lane (MySQL) nunca satisfaz. Os 3 verdes de lá são só os `flag OFF`.
        #
        # ⚠️ O bloco abaixo (#6884, mesma data) chegou de forma INDEPENDENTE às duas
        # mesmas causas: o `X-Inertia-Version: 'test'` literal levando 409, e o
        # `assertInertia` junto do header `X-Inertia` sendo combinação impossível.
        # Duas sessões, dois arquivos, o mesmo diagnóstico — é sinal de que a armadilha
        # está no PADRÃO copiado do `DeviceModelsInertiaSmokeTest`, não em quem copiou.
        #
        # ENTRA 2026-09-05 — Repair/RepairIndexMwartTest: o branch Inertia de
        # `RepairController@index` (flag MWART, whitelist de business_ids, escopo
        # cross-tenant, whitelist de sort) não era exercido por lane NENHUMA. Na
        # `modules-pest` (sqlite `:memory:`, sem migrations) o `Business::first()`
        # estourava, o guard virava markTestSkipped e o job dava success — falso-verde
        # de manual (LC-13), o mesmo do vizinho acima.
        #
        # Rodado de verdade pela 1ª vez no CT 100 (MySQL), o arquivo vinha
        # `6 failed (7 assertions)`, com TRÊS causas distintas — não uma:
        #   3× 409  `X-Inertia-Version: 'test'` literal divergindo do manifesto de build
        #   1×      `assertInertia` junto do header `X-Inertia` (combinação impossível)
        #   2× 500  superglobais ausentes em request de teste
        # As duas primeiras eram defeito do arquivo e foram consertadas nele. A terceira
        # NÃO era: o container do CT 100 está em `c1abe9548` (2026-08-26) e lhe faltam
        # três guardas que o `main` já tem — `helpers.php` (HTTP_USER_AGENT),
        # `layouts/app.blade.php` (session('currency') e REMOTE_ADDR) e `Util.php:1267`
        # (REMOTE_ADDR). Medido por bisseção, instalando os arquivos do main um a um:
        # com o UA, o erro só ANDAVA para a guarda seguinte. Com os três, o arquivo vai a
        #   6 passed (17 assertions)  ⇒ VERDE pelo critério da catraca.
        # Esta lane faz checkout do HEAD do PR, então tem as três guardas por construção.
        #
        # O gate de assinatura NÃO transforma isto em skip mudo aqui: o seed insere só
        # `system.repair_version`, logo `isSuperadminInstalled()` é false e
        # `hasThePermissionInSubscription` devolve `true` no `return` final
        # (ModuleUtil.php:179) sem consultar subscription alguma.
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_DATABASE: oimpresso_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          mkdir -p test-results
          vendor/bin/pest --no-coverage --colors=always \
            --log-junit test-results/pest-verticais-junit.xml \
            Modules/ComunicacaoVisual/Tests/Feature/MigrationsTest.php \
            Modules/ComunicacaoVisual/Tests/Feature/MultiTenantTest.php \
            Modules/ComunicacaoVisual/Tests/Feature/Tier0GuardTest.php \
            Modules/Repair/Tests/Feature/DeviceModelsInertiaSmokeTest.php \
            Modules/Repair/Tests/Feature/ProducaoOficinaRefactorTest.php \
            Modules/Repair/Tests/Feature/RepairIndexMwartTest.php \
            Modules/Repair/Tests/Feature/RepairSettingsContratoTest.php \
            Modules/Repair/Tests/Feature/RepairIndexContratoTest.php \
            Modules/Repair/Tests/Feature/RepairShowContratoTest.php \
            Modules/Repair/Tests/Feature/RepairDashboardContratoTest.php \
            Modules/Repair/Tests/Feature/RepairJobSheetIndexContratoTest.php \
            Modules/Repair/Tests/Feature/DeviceModelsContratoTest.php \
            Modules/Repair/Tests/Feature/RepairStatusContratoTest.php \
            Modules/Vestuario/Tests/Feature/SmokeRoutesVestuarioTest.php \
            Modules/Superadmin/Tests/Feature/SuperadminDashboardContratoTest.php \
            Modules/Superadmin/Tests/Feature/SubscriptionLifecycleServiceTest.php \
            Modules/Superadmin/Tests/Feature/SuperadminNegociosContratoTest.php \
            Modules/Superadmin/Tests/Feature/SuperadminAssinaturasContratoTest.php \
            Modules/Superadmin/Tests/Feature/SuperadminPacotesContratoTest.php

      # O sumário conta `assertions` POR ARQUIVO — é o discriminador que separa
      # "passou" de "pulou" (LC-13). Aqui só REPORTA.
      - name: Sumario JUnit por arquivo (junit-summary.mjs)
        if: always()
        run: node scripts/tests/junit-summary.mjs test-results/pest-verticais-junit.xml --out test-results/pest-verticais-junit-summary.json || true

      - name: Upload JUnit (Verticais · MySQL)
        if: ${{ !cancelled() && steps.changes.outputs.vert == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pest-verticais-junit
          path: test-results/pest-verticais-junit*.*
          retention-days: 14
          if-no-files-found: ignore
