name: Cliente · Pest (MySQL)

# Lane dedicada pra rodar os testes de contrato do módulo Cliente (cadastro de
# clientes/contatos) contra MySQL REAL + seed mínimo biz=1 + biz=2 (composite
# action .github/actions/pest-mysql-setup, FV-F2). Espelha compras-pest.yml.
#
# ─────────────────────────────────────────────────────────────────────────────
# POR QUE ESTA LANE EXISTE — o número, medido em origin/main 2026-07-27
# ─────────────────────────────────────────────────────────────────────────────
# `node scripts/governance/anchor-lint.mjs memory/requisitos/Cliente/SPEC.md`:
#
#     Cobertura fora de lane (advisory · item b): 15 US com teste-que-cobre fora
#     das lanes de JUnit (verde impossível até entrar numa lane)
#
# 15 das 22 US do Cliente tinham teste escrito que NENHUMA lane executava. Os 21
# UC dos 7 `casos.md` estavam todos ancorados (21/21 com teste que os cita — o
# módulo é o mais bem contratado da leva), mas 5 dos 7 arquivos afirmavam em
# prosa "lane ativa" / "passa no CI" sobre testes que **rodavam só no nightly
# full-suite do CT 100**, nunca no PR.
#
# As três portas de "roda / é cobrado", e onde o Cliente estava em cada uma:
#
#   | Pergunta            | Porta                                     | Antes | Depois |
#   |---------------------|-------------------------------------------|-------|--------|
#   | roda em algum lugar?| phpunit.xml (`./tests/Feature` recursivo) | ✅ sim (nightly CT 100) | ✅ |
#   | roda no PR?         | `.github/ci-sqlite-pest.list` (allowlist) | ❌ 0 entradas de Cliente | ✅ esta lane |
#   | bloqueia merge?     | governance/required-checks-baseline.json  | ❌ não | ❌ **segue não** |
#
# ⚖️ ESTA LANE É ADVISORY. Ela NÃO está em governance/required-checks-baseline.json
# e este PR **não** a coloca lá (promoção é flip do [W], ADR 0275/0336). Reprova
# visível, não bloqueia merge. Nenhum arquivo desta lane afirma o próprio
# enforcement em tempo presente além deste bloco datado (proibicoes §5 2026-07-16):
# o dono único de "é required" é o baseline, não este YAML.
#
# ─────────────────────────────────────────────────────────────────────────────
# ONDE VIVE O CÓDIGO (varredura, porque o nome engana)
# ─────────────────────────────────────────────────────────────────────────────
# O módulo tem TRÊS nomes diferentes e nenhum casa com os outros:
#   - Pages Inertia:  resources/js/Pages/Cliente/*.tsx
#   - Backend:        app/Http/Controllers/ContactController.php (núcleo UPOS, 3558 LOC)
#                     + Modules/Crm/Http/Controllers/Cliente*Controller.php (drawer 760)
#   - Canon:          memory/requisitos/Cliente/ (SPEC) + memory/requisitos/Crm/ (RUNBOOKs)
#
# Os testes NÃO ficam em Modules/Crm/Tests: ficam em `tests/Feature/Cliente/`
# (+ `tests/Feature/Calculo/CalculoValorClienteTest.php` pro saldo). Medido:
# `Modules/Crm/Tests/Feature` **não está em phpunit.xml** (os 14 arquivos que há
# lá não rodam nem no nightly) — por isso o teste novo deste chip nasceu em
# `tests/Feature/Cliente/`, onde as duas portas o alcançam. O buraco do
# `Modules/Crm/Tests` fica REPORTADO, não consertado (arquivo global).
#
# ─────────────────────────────────────────────────────────────────────────────
# ALLOWLIST — arquivo a arquivo, e por quê cada um
# ─────────────────────────────────────────────────────────────────────────────
# São 17 arquivos, em 3 grupos:
#   1-12  teste-âncora dos 21 UC pré-existentes dos 7 `casos.md` (já escritos, já
#         passando no nightly do CT 100, mas em NENHUMA lane de PR).
#   13    `ClientePagamentosPiiTest` — NASCE neste PR (UC-CSHW-03 · SDD CU-CLI-10).
#   14-17 testes de domínio Cliente que também não rodavam em lane: o guard
#         comportamental de PII do activity log, os campos BR restaurados, o
#         cross-tenant do `ContactAddress` e o unit do mod-11. Entrar aqui derruba
#         o `Cobertura fora de lane` do anchor-lint de 15 US para 1 (o resto é
#         `tests/br-inputs.test.tsx`, que é Vitest — outra régua, outro runner).
#
# ⚠️ ClientePagamentosPiiTest entra na allowlist SEM histórico verde — é o teste
# NOVO do chip, derivado do SDD §6 CU-CLI-10 e do `[BACKLOG]` "Aba Pagamentos" do
# Show.casos.md, não do payload atual. Listá-lo mesmo assim é deliberado: teste
# fora da allowlist NÃO RODA — é o "verde impossível" que o anchor-lint denuncia,
# pior que o vermelho honesto. Se vier vermelho, ELE É O ACHADO e a correção é
# decisão do [W] (proibicoes §Precedência), não conserto silencioso.
#
# Os testes usam DatabaseTransactions + schema UltimatePOS (business/users/
# contacts/transactions/Spatie) → markTestSkipped em sqlite :memory:. Precisam de
# MySQL real semeado; aqui rodam de verdade.
#
# Usa o SCHEMA BASELINE (database/schema/mysql-schema.sql) — `migrate` carrega o
# schema final num passo só + roda só as migrations novas.
#
# Testes SEMPRE biz=1 (ADR 0101), adversário biz=2/biz=99 — NUNCA biz=4 (ROTA
# LIVRE, cliente real). Nenhum CPF/CNPJ/conta real nos fixtures (LGPD · ADR 0093).

on:
  workflow_dispatch: {}
  # ADR 0271 onda 2 (required-readiness): pull_request SEM paths (always-run) pra
  # ser promovível sem deadlock "Expected — waiting". O custo é evitado por
  # skip-as-pass interno (dorny/paths-filter). push segue path-filtered.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'resources/js/Pages/Cliente/**'
      - 'app/Http/Controllers/ContactController.php'
      - 'app/Contact.php'
      - 'app/ContactAddress.php'
      - 'Modules/Crm/**'
      - 'tests/Feature/Cliente/**'
      - 'tests/Feature/Contact/**'
      - 'tests/Feature/Calculo/CalculoValorClienteTest.php'
      - 'tests/Feature/Auditoria/ContactPiiLogsActivityTest.php'
      - 'tests/Unit/Rules/BR/**'
      - 'database/schema/mysql-schema.sql'
      - '.github/workflows/cliente-pest.yml'
      - '.github/actions/pest-mysql-setup/**'

concurrency:
  group: cliente-pest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    name: PHP / Pest (Cliente · MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oimpresso_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Detectar mudanças do Cliente (skip-as-pass — ADR 0271 onda 2)
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            cliente:
              - 'resources/js/Pages/Cliente/**'
              - 'app/Http/Controllers/ContactController.php'
              - 'app/Contact.php'
              - 'app/ContactAddress.php'
              - 'Modules/Crm/**'
              - 'tests/Feature/Cliente/**'
              - 'tests/Feature/Contact/**'
              - 'tests/Feature/Calculo/CalculoValorClienteTest.php'
              - 'tests/Feature/Auditoria/ContactPiiLogsActivityTest.php'
              - 'tests/Unit/Rules/BR/**'
              - 'database/schema/mysql-schema.sql'
              - '.github/workflows/cliente-pest.yml'
              - '.github/actions/pest-mysql-setup/**'

      - name: Skip-as-pass (nada do Cliente mudou)
        if: steps.changes.outputs.cliente == 'false'
        run: echo "✅ Sem mudanças no módulo Cliente — skip-as-pass (required-ready, ADR 0271 onda 2)."

      # PHP + deps + .env + migrate (schema baseline) + seed mínimo (biz=1 fixture
      # completa + biz=2 Tier 0 cross-tenant). O service container MySQL fica
      # DECLARADO ACIMA no job (composite action não pode declarar services).
      - name: Setup Pest MySQL (PHP + deps + .env + migrate + seed biz=1/biz=2)
        if: steps.changes.outputs.cliente == 'true'
        uses: ./.github/actions/pest-mysql-setup

      - name: Stub Vite manifest (Inertia root view sem build do front)
        if: steps.changes.outputs.cliente == 'true'
        run: |
          mkdir -p public/build-inertia
          cat > public/build-inertia/manifest.json <<'EOF'
          {
            "resources/css/inertia.css": { "file": "assets/inertia.css", "src": "resources/css/inertia.css", "isEntry": true },
            "resources/js/app.tsx": { "file": "assets/app.js", "src": "resources/js/app.tsx", "isEntry": true }
          }
          EOF

      - name: Run Pest (Cliente · MySQL) — ALLOWLIST explícita
        if: steps.changes.outputs.cliente == 'true'
        # phpunit.xml força DB_CONNECTION=sqlite :memory: (sem force=) — se não
        # sobrescrever, o Pest roda em sqlite VAZIO e os testes que dependem do
        # schema UltimatePOS dão markTestSkipped (a falsa cobertura). Exportar
        # aqui faz rodar no MySQL real semeado.
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_DATABASE: oimpresso_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          mkdir -p test-results
          vendor/bin/pest --no-coverage --colors=always \
            --log-junit test-results/pest-cliente-junit.xml \
            tests/Feature/Cliente/StoreContactRequestTest.php \
            tests/Feature/Cliente/ClienteEditInertiaTest.php \
            tests/Feature/Cliente/ClienteDrawerCadastroAutosaveTest.php \
            tests/Feature/Cliente/ClienteTypeOtherRouteTest.php \
            tests/Feature/Cliente/ClientePaginacaoServerSideTest.php \
            tests/Feature/Cliente/ClienteSortServerSideTest.php \
            tests/Feature/Cliente/ClienteKpisServerSideTest.php \
            tests/Feature/Cliente/ClienteImportInertiaTest.php \
            tests/Feature/Cliente/ClienteMapInertiaTest.php \
            tests/Feature/Cliente/Show/LedgerTabTest.php \
            tests/Feature/Cliente/Show/SalesTabTest.php \
            tests/Feature/Calculo/CalculoValorClienteTest.php \
            tests/Feature/Cliente/ClientePagamentosPiiTest.php \
            tests/Feature/Auditoria/ContactPiiLogsActivityTest.php \
            tests/Feature/Contact/ContactBrFieldsRestoredTest.php \
            tests/Feature/Contact/ContactAddressMultiTenantTest.php \
            tests/Unit/Rules/BR/CpfCnpjTest.php

      - name: Upload JUnit (veredito por-teste — casos:results)
        if: ${{ !cancelled() && steps.changes.outputs.cliente == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pest-cliente-junit
          path: test-results/pest-cliente-junit.xml
          retention-days: 14
