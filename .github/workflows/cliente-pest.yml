name: Cliente · Pest (MySQL)

# Lane de CLIENTE: tests/Feature/Cliente/ — cadastro, edição, drawer 760 (Modules/Crm
# ClienteAutosaveController), listagem, Show, importação e mapa de contatos.
#
# POR QUE existe: medido em 2026-10-02 — tests/Feature/Cliente/ tem 64 arquivos de teste e
# NENHUMA lane de PR os executava (`git grep "Feature/Cliente" -- .github/` sem alvo em
# workflow). Registro no phpunit.xml não é execução (proibicoes.md §5 2026-08-02), e um
# teste que nunca roda é indistinguível de um teste verde. Não é lane paralela a nada:
# é área que não tinha dono, como a acessos-pest.yml era para tests/Feature/Roles/.
#
# COMO SELECIONA: árvore MENOS quarentena (.github/cliente-pest-quarantine.list), o mesmo
# mecanismo do estoque-pest.yml e do financeiro-pest.yml. Arquivo novo entra RODANDO;
# o que não roda está listado com motivo. Não existe terceiro estado escuro.
#
# MySQL e não sqlite: os casos autenticam usuário, montam papel Spatie e batem em rota HTTP
# com sessão de negócio. A action pest-mysql-setup é a dona de QUAIS tenants existem.

on:
  workflow_dispatch: {}
  # pull_request SEM paths (always-run) + skip-as-pass interno via dorny/paths-filter.
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [main]
    # paths-ignore FAIL-CLOSED: PR que toca SÓ memory/, prototipo-ui/ ou o estado do
    # design-sync não sobe esta lane. O paths-filter interno já pularia tudo (veredito
    # igual), só que ocupando runner. Qualquer outro arquivo no diff → roda como antes.
    # Promover a required = APAGAR este bloco (o required-always-run reprova se ficar).
    # Prova: scripts/governance/advisory-paths-ignore.test.mjs
    paths-ignore:
      - 'memory/**'
      - 'prototipo-ui/**'
      - 'scripts/design-sync/state/**'
  push:
    branches: [main]
    # Este bloco tem que ser IDÊNTICO ao paths-filter interno do job. O código sob teste
    # está aqui: sem ele, mexer no controller não dispararia a lane (gate mudo).
    paths:
      - 'app/Http/Controllers/ContactController.php'
      - 'app/Http/Requests/Cliente/**'
      - 'app/Utils/ContactUtil.php'
      - 'app/Contact.php'
      - 'Modules/Crm/Http/Controllers/Cliente*.php'
      - 'Modules/Crm/Routes/web.php'
      - 'Modules/Crm/Services/**'
      - 'resources/js/Pages/Cliente/**'
      - 'tests/Feature/Cliente/**'
      - 'database/schema/mysql-schema.sql'
      - '.github/workflows/cliente-pest.yml'
      - '.github/cliente-pest-quarantine.list'
      - '.github/actions/pest-mysql-setup/**'

concurrency:
  group: cliente-pest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    name: PHP / Pest (Cliente · MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oimpresso_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Detectar mudanças de cliente (skip-as-pass)
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            cli:
              - 'app/Http/Controllers/ContactController.php'
              - 'app/Http/Requests/Cliente/**'
              - 'app/Utils/ContactUtil.php'
              - 'app/Contact.php'
              - 'Modules/Crm/Http/Controllers/Cliente*.php'
              - 'Modules/Crm/Routes/web.php'
              - 'Modules/Crm/Services/**'
              - 'resources/js/Pages/Cliente/**'
              - 'tests/Feature/Cliente/**'
              - 'database/schema/mysql-schema.sql'
              - '.github/workflows/cliente-pest.yml'
              - '.github/cliente-pest-quarantine.list'
              - '.github/actions/pest-mysql-setup/**'

      - name: Skip-as-pass (nada do domínio mudou)
        if: steps.changes.outputs.cli == 'false'
        run: echo "✅ Sem mudanças de Cliente — skip-as-pass."

      - name: Setup Pest MySQL (PHP + deps + .env + migrate + seed mínimo multi-tenant)
        if: steps.changes.outputs.cli == 'true'
        uses: ./.github/actions/pest-mysql-setup

      - name: Stub Vite manifest (root view sem build do front)
        if: steps.changes.outputs.cli == 'true'
        run: |
          mkdir -p public/build-inertia
          cat > public/build-inertia/manifest.json <<'EOF'
          {
            "resources/css/inertia.css": { "file": "assets/inertia.css", "src": "resources/css/inertia.css", "isEntry": true },
            "resources/js/app.tsx": { "file": "assets/app.js", "src": "resources/js/app.tsx", "isEntry": true }
          }
          EOF

      - name: Run Pest (Cliente · MySQL) — ÁRVORE MENOS QUARENTENA (partição total)
        if: steps.changes.outputs.cli == 'true'
        # phpunit.xml aponta DB_CONNECTION=sqlite :memory: (sem force="true"), então a env
        # daqui vence e a suíte roda no MySQL real semeado pela action.
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_DATABASE: oimpresso_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          set -uo pipefail
          mkdir -p test-results
          QUAR_FILE=.github/cliente-pest-quarantine.list

          # remove comentário de linha INTEIRA e comentário INLINE (path  # motivo)
          sed 's/#.*//; s/[[:space:]]*$//' "$QUAR_FILE" | grep -vE '^$' | sort -u > /tmp/quar.txt

          # A quarentena NÃO pode apodrecer: path que não existe mais vira erro.
          RC=0
          while read -r q; do
            [ -f "$q" ] || { echo "::error::quarentena aponta arquivo inexistente: $q"; RC=1; }
          done < /tmp/quar.txt
          [ "$RC" -eq 0 ] || { echo "Limpe $QUAR_FILE — arquivo removido continua listado."; exit 1; }

          find tests/Feature/Cliente -name '*Test.php' | sort > /tmp/all.txt
          comm -23 /tmp/all.txt /tmp/quar.txt > /tmp/run.txt

          # Visibilidade obrigatória: quarentena silenciosa vira cobertura fingida.
          echo "Árvore: $(wc -l < /tmp/all.txt) · quarentena: $(wc -l < /tmp/quar.txt) · RODANDO: $(wc -l < /tmp/run.txt)"
          echo "--- em quarentena (NÃO rodam) ---"; cat /tmp/quar.txt

          mapfile -t TARGETS < /tmp/run.txt
          [ "${#TARGETS[@]}" -gt 0 ] || { echo "::error::run-set vazio"; exit 1; }

          vendor/bin/pest --no-coverage --colors=always \
            --log-junit test-results/pest-cliente-junit.xml \
            "${TARGETS[@]}"

      # A régua honesta desta lane é `assertions`, NÃO "0 failed": skip sai exit 0 (LC-13).
      - name: Sumário JUnit por arquivo (assertions — a régua contra skip-as-pass)
        if: always()
        run: node scripts/tests/junit-summary.mjs test-results/pest-cliente-junit.xml --out test-results/pest-cliente-junit-summary.json || true

      # Guardado pela MESMA condição do run de Pest (no skip-as-pass o XML nem existe).
      # MORDE quando a lane RODOU e não provou nada: 0 assertions é ausência de execução.
      - name: Suíte provou algo? (--check-assertions · LC-13)
        if: steps.changes.outputs.cli == 'true'
        run: node scripts/tests/junit-summary.mjs test-results/pest-cliente-junit.xml --check-assertions

      - name: Upload sumário JUnit (pest-cliente-junit-summary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pest-cliente-junit-summary
          path: test-results/pest-cliente-junit-summary.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload JUnit (Cliente · MySQL)
        if: ${{ !cancelled() && steps.changes.outputs.cli == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pest-cliente-junit
          path: test-results/pest-cliente-junit.xml
          retention-days: 14
