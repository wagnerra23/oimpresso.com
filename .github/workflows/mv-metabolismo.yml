name: MV metabolismo (batimento nightly do Módulo Vivo · stream MV)

# MV2 do stream MV — Módulo Vivo (roadmap SDD · aprovado Wagner 2026-07-05).
# Contrato: memory/sessions/2026-07-05-arte-maquina-governanca-telas.md §3.3-§3.6.
#
# O batimento: toda noite refresca a espinha dorsal (vital-signs --json --history)
# e roda o seletor determinístico (mv-metabolismo.mjs) que propõe UM batch de telas
# em memory/governance/mv-batches/YYYY-MM-DD.md respeitando batimento por classe,
# budget e regras de parada (verde+fresca pula; gate pendente não empilha).
#
# GATE HUMANO (deliberado — publication-policy) — vale pro BATCH:
#   - o PR de batch NÃO tem auto-merge (diferente do sdd-scorecard-publish): o merge do
#     Wagner É a aprovação do batch; fechar o PR = rejeitar.
#   - o cron NUNCA cria task MCP, NUNCA mergeia BATCH. A sessão de execução (pós-merge)
#     cria as tasks via audit-to-backlog e roda screen-qa por tela.
#
# DUAS SAÍDAS, naturezas diferentes (split 2026-08-11 — ver comentário do passo de PR):
#   - batch    → `chore/mv-batch`,    label `mv-batch`, gate humano, sem auto-merge.
#   - snapshot → `chore/mv-snapshot`, índice DERIVADO (vital-signs/readiness/service-
#     scorecard), auto-merge como qualquer índice derivado (padrão system-map.yml).
#   Antes do split o snapshot só aterrissava de carona no batch: 18 dias de runs verdes
#   sem entregar (vital-signs congelado em 2026-07-24 com o cron rodando todo dia).
#
# Se já existe PR mv-batch aberto OU batch proposto/aprovado em main → o próprio
# mv-metabolismo.mjs sai sem gerar (não empilha); nesta noite nem o snapshot sobe —
# RESÍDUO CONHECIDO: a trava `pendente` ainda acopla o snapshot ao batch pendente.
#
# NÃO é gate CI (lei ADR 0314) — advisory/operacional; nunca entra em required.
# PAT (não GITHUB_TOKEN): PR aberto por GITHUB_TOKEN não dispara CI → ficaria preso
# no branch protection (lição sdd-scorecard-publish).

on:
  schedule:
    - cron: '30 9 * * *' # 06:30 BRT diário — antes do brief (07:xx), depois da nightly CT100 (02:00)
  workflow_dispatch:

concurrency:
  group: mv-metabolismo
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  batimento:
    name: Batimento — sinais vitais + proposta de batch (gate = merge do Wagner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # OBRIGATÓRIO: o batimento deriva frescor de `git log -1 --format=%cs -- <path>`
          # (service-scorecard `briefingInfo`, briefing-code-staleness). O default do
          # checkout é RASO (1 commit) — e num clone raso o `git log` de qualquer path
          # só enxerga o commit da vez, então TODO arquivo volta datado do dia em que o
          # cron rodou. O artefato commitado provava isso: `last_commit: 2026-08-12` em
          # bloco, quando a verdade (history completo) é 2026-08-07 / 08-05 / 07-23…
          # Não era frescor, era a data da run. Lápide §5 2026-07-24.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Selftests de contrato (hard — batimento não roda com contrato quebrado)
        run: |
          node scripts/qa/vital-signs.test.mjs
          node scripts/qa/mv-metabolismo.test.mjs

      - name: Não empilhar — PR mv-batch já aberto?
        id: pendente
        env:
          GH_TOKEN: ${{ secrets.COWORK_BOT_PAT }}
        run: |
          ABERTO=$(gh pr list --label mv-batch --state open --json number --jq 'length')
          echo "aberto=$ABERTO" >> "$GITHUB_OUTPUT"
          if [ "$ABERTO" != "0" ]; then
            echo "::notice::PR mv-batch aberto aguardando Wagner — batimento pula esta noite (arte §3.6 regra 3)."
          fi

      # Só os medidores de ADOÇÃO DO DS precisam de node_modules (`ds-ledger`/`ds-report`
      # chamam `npx --no-install eslint`); os demais passos são node puro e sempre rodaram
      # sem deps. Fica aqui, sob o mesmo guard, pra não gastar ~1min nas noites travadas.
      - name: Dependências (eslint — exigido só pelos medidores de adoção do DS)
        if: steps.pendente.outputs.aberto == '0'
        run: npm ci

      - name: Espinha dorsal — vital-signs (snapshot + trend append-only)
        if: steps.pendente.outputs.aberto == '0'
        run: |
          node scripts/qa/vital-signs.mjs --json --history | tee /tmp/vital.txt
          { echo '## Sinais vitais desta noite'; echo '```'; tail -30 /tmp/vital.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Service scorecard — agrega sinais-vivos por serviço (depois do vital-signs fresco)
        if: steps.pendente.outputs.aberto == '0'
        run: |
          # Advisory (ADR 0314): agrega grade+telas+grafo+briefing por serviço a partir das fontes
          # JÁ derivadas (catalog.json + module-grades-baseline.json + vital-signs.json recém-gerado).
          # Regenera após o vital-signs pra refletir os sinais de tela desta noite. Segue a mesma
          # cadência de commit (só entra no auto-PR do batch = merge do Wagner).
          node scripts/governance/service-scorecard.mjs --write
          { echo '## Service scorecard (sinais-vivos por serviço)'; echo '```'; node scripts/governance/service-scorecard.mjs | tail -42; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Prontidão do protótipo — readiness (alimenta o boost do metabolismo)
        if: steps.pendente.outputs.aberto == '0'
        run: |
          node scripts/qa/prototipo-readiness.mjs --json | tee /tmp/proto.txt
          { echo '## Prontidão do protótipo'; echo '```'; tail -20 /tmp/proto.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Metabolismo — proposta de batch (determinístico, zero LLM)
        if: steps.pendente.outputs.aberto == '0'
        id: batch
        run: |
          node scripts/qa/mv-metabolismo.mjs | tee /tmp/batch.txt
          if grep -q "batch proposto" /tmp/batch.txt; then
            echo "gerado=true" >> "$GITHUB_OUTPUT"
            ARQ=$(ls memory/governance/mv-batches/*.md | tail -1)
            echo "arquivo=$ARQ" >> "$GITHUB_OUTPUT"
            { echo '## Batch proposto (aguarda merge do Wagner)'; echo; cat "$ARQ"; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "gerado=false" >> "$GITHUB_OUTPUT"
            cat /tmp/batch.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── Corpo do PR: composto ANTES de abrir, porque as duas naturezas são DIFERENTES ──
      # Medido 2026-08-11: o auto-PR só abria com `gerado == 'true'`, então nas noites SEM
      # batch o vital-signs/service-scorecard/readiness recém-gerados eram DESCARTADOS com o
      # runner — o artefato só chegava em main de carona no PR de batch. Consequência medida:
      # runs 07/08→11/08 todas `completed success` (step "Auto-PR" = `skipped`) enquanto
      # memory/governance/vital-signs.json seguia carimbado 2026-07-24 (18d). O cron-watchdog
      # não pega: mede liveness+conclusion (verdes) — é o vão "roda ≠ entrega" que a §5 de
      # 2026-07-29 deixou declarado como resíduo.
      #
      # O gate humano do BATCH continua intacto (a omissão de auto-merge nele É a feature):
      #   batch    = PROPOSTA    → label `mv-batch` arma o gate + a trava "não empilhar"; SEM auto-merge.
      #   snapshot = DERIVADO    → determinístico, zero LLM, sem decisão humana no conteúdo;
      #                            segue o padrão da casa pra índice derivado (system-map.yml).
      # Corpo por `body-path` (não `body`) pra o PR descrever o que ELE é — mecanismo não
      # anuncia saída que não implementa (LC-15).
      - name: Corpo do PR — batch proposto (gate humano)
        if: steps.pendente.outputs.aberto == '0' && steps.batch.outputs.gerado == 'true'
        run: |
          cat > /tmp/mv-pr-body.md <<'EOF'
          **Batimento nightly do Módulo Vivo (MV2) — batch proposto.**

          O metabolismo leu os sinais vitais da frota e propõe o batch em
          `memory/governance/mv-batches/` (ver Files changed). O snapshot derivado
          dos sinais vitais viaja junto.

          **Gate humano — decisão sua:**
          - ✅ **Merge** = batch APROVADO → próxima sessão executa (cria tasks via
            audit-to-backlog + screen-qa por tela, sessão limpa/tela) e marca
            `status: executado`.
          - ❌ **Fechar** = batch rejeitado (o metabolismo re-propõe com dados frescos
            na próxima noite).

          Determinístico, zero LLM. Nunca cria task nem mergeia sozinho.
          Contrato: arte 2026-07-05 §3.3-§3.6 · roadmap SDD stream MV.

          🤖 Generated by MV metabolismo
          EOF

      - name: Corpo do PR — só snapshot (índice derivado, sem batch esta noite)
        if: steps.pendente.outputs.aberto == '0' && steps.batch.outputs.gerado != 'true'
        run: |
          cat > /tmp/mv-pr-body.md <<'EOF'
          **Batimento nightly do Módulo Vivo (MV2) — sem batch esta noite.**

          O metabolismo não propôs batch (verde+fresca pula / budget / regra de parada),
          mas os índices DERIVADOS foram regenerados e precisam aterrissar — senão o
          `vital-signs.json` congela e o painel do MV passa a mentir sobre a frota.

          Conteúdo: `vital-signs.json` + `vital-signs-history.jsonl` (append-only) +
          `prototipo-readiness.json` + `service-scorecard.json` + adoção do DS
          (`governance/ds-ledger.json` censo por tela, que alimenta
          `/governance/ds-rollout`; e `prototipo-ui/DS_ADOCAO_INDICE.md` placar `ds/*`
          por módulo). **Nenhuma proposta de trabalho, nenhuma decisão sua embutida** —
          é retrato, não pedido.

          Determinístico, zero LLM. Auto-merge habilitado (mesmo padrão do índice
          derivado em `system-map.yml`); nenhum batch é mergeado por esta via.

          🤖 Generated by MV metabolismo
          EOF

      # ── COLETA do bite-log dos gates de design (DR-2a da ADR 0336) ──────────────
      # O ledger `memory/governance/design-gate-bites.jsonl` nasceu em 2026-07-18 (#4522)
      # e NUNCA foi tocado desde: 1 commit em 4 semanas. Causa medida: o único coletor é um
      # PASSO DO ZELADOR.md — rotina lembrada, e "escrito+lembrado apodrece" (ADR 0256).
      # No workflow o `--scan` só aparecia em COMENTÁRIO; os `run:` são `--selftest` e `--tally`.
      #
      # Consequência: a DR-2 promove a required quem tiver ≥2 mordidas, e sem coletor o
      # placar fica 0 PARA SEMPRE — o mesmo catch-22 que a 0336 foi escrita pra quebrar,
      # reaparecendo uma camada acima.
      #
      # Por que AQUI e não em workflow novo (LC-19 — estender o dono, não abrir paralelo):
      # este job já roda diário e já persiste `memory/governance/*` via auto-PR com token.
      # A mordida pega carona no PR que já existe — zero workflow novo, zero secret novo.
      # É literalmente o que o comentário do design-memory-gate previa ("reuso do dono
      # existente, não workflow novo com secret"); só faltava alguém ligar.
      #
      # ⚠️ RESIDUAL HONESTO: o `--scan` mede o estado PRESENTE do main, então violação que
      # merge e é corrigida dentro do mesmo dia continua invisível. Diário pega o que
      # PERSISTE ≥1 dia — melhor que nunca, não é cobertura total. Não afirmar que fecha
      # a DR-2a; ela passa a ter DADO, que é o que faltava.
      - name: Bite-log dos gates de design — coleta (DR-2a · ADR 0336)
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/governance/design-gate-bites.mjs --scan --sha "$GITHUB_SHA" | tee /tmp/bites.txt
          { echo '## Bite-log dos gates de design (DR-2a)'; echo '```'; cat /tmp/bites.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          node scripts/governance/design-gate-bites.mjs --tally >> "$GITHUB_STEP_SUMMARY" || true

      # ── ADOÇÃO DO DS: os dois medidores que existiam sem NENHUM invocador ────────
      # `scripts/ds-ledger.mjs --write`  → governance/ds-ledger.json        (censo POR TELA)
      # `scripts/ds-report.mjs  --write` → prototipo-ui/DS_ADOCAO_INDICE.md (placar ds/* POR MÓDULO)
      #
      # Medido em 2026-08-14 (`git grep -n -E "ds-report|ds-ledger" -- .github/`): as duas
      # únicas ocorrências em .github/ eram TEXTO (um comentário e um `echo` de mensagem de
      # conserto no design-return-gate) — nunca invocação. `memory/governance/AUTOMATIONS.md`:
      # 0 ocorrências. Consequência medida: `governance/ds-ledger.json` carimbado
      # `2026-06-12` e `DS_ADOCAO_INDICE.md` em `2026-06-29` — a tela `/governance/ds-rollout`
      # servia 9% de ~2 meses atrás. Rodando hoje: ledger 9% → 29%; placar `ds/*` 148 → 1604
      # (Financeiro voltou de `0 ✅ concluído` a 465). O congelamento não errava pra um lado
      # só: subestimava o ledger e superestimava o índice, ao mesmo tempo.
      #
      # Por que AQUI (LC-19 — estender o dono, não abrir paralelo): este job já roda diário,
      # já persiste artefato derivado via auto-PR com token, e é o mesmo padrão do bite-log
      # acima. Zero workflow novo, zero secret novo.
      #
      # Estes passos MEDEM e PUBLICAM — nenhum deles decide merge de ninguém, e este PR não
      # propõe promover nada a required (em particular NÃO o `component-registry-check`:
      # §5 2026-07-17, decisão [W] de mantê-lo como está). Quem é required se lê no dono —
      # `governance/required-checks-baseline.json` — não aqui (§5 2026-08-11, LC-10).
      #
      # `continue-on-error` pra não derrubar o batimento (vital-signs é o carro-chefe), mas
      # a falha NÃO fica muda: o `rc` é capturado e escrito no summary. "Não consegui medir"
      # não pode virar "nada a reportar" (§5 2026-07-29).
      # `set -o pipefail` obrigatório antes do `| tee` — senão o rc vira o do tee
      # (selftest `scripts/governance/workflow-pipe-rc.test.mjs`).
      - name: Adoção do DS — ledger por tela + placar ds/* por módulo (advisory)
        if: steps.pendente.outputs.aberto == '0'
        continue-on-error: true
        run: |
          set -o pipefail
          rc=0
          node scripts/ds-ledger.mjs --write | tee /tmp/ds-ledger.txt || rc=$?
          node scripts/ds-report.mjs --write | tee /tmp/ds-report.txt || rc=$?
          if [ "$rc" != "0" ]; then
            {
              echo '## ⚠️ Adoção do DS — MEDIÇÃO NÃO ACONTECEU'
              echo ''
              echo "Os medidores saíram com rc=$rc. Os artefatos NÃO foram atualizados —"
              echo 'o `generatedAt` de `governance/ds-ledger.json` segue o da última noite boa.'
              echo 'Isto é ausência de medição, não adoção estável.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi
          {
            echo '## Adoção do DS (censo por tela + placar por módulo)'
            echo '```'
            tail -6 /tmp/ds-ledger.txt
            echo '```'
            echo '<details><summary>Placar `ds/*` por módulo</summary>'
            echo ''
            echo '```'
            tail -25 /tmp/ds-report.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      # Auto-PR — UMA invocação (o `add-paths` stasheia e restaura o que não casa, então
      # `mv-batches/*.md` simplesmente não tem diff nas noites sem batch). Sem diff em
      # NENHUM add-path, a action sai silenciosa e não cria PR (verificado no README v7).
      - name: Auto-PR (batch quando proposto · snapshot sempre)
        id: cpr
        if: steps.pendente.outputs.aberto == '0'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.COWORK_BOT_PAT }}
          base: main
          branch: "${{ steps.batch.outputs.gerado == 'true' && 'chore/mv-batch' || 'chore/mv-snapshot' }}"
          add-paths: |
            memory/governance/vital-signs.json
            memory/governance/vital-signs-history.jsonl
            memory/governance/prototipo-readiness.json
            memory/governance/service-scorecard.json
            memory/governance/design-gate-bites.jsonl
            memory/governance/mv-batches/*.md
            governance/ds-ledger.json
            prototipo-ui/DS_ADOCAO_INDICE.md
          commit-message: |
            ${{ steps.batch.outputs.gerado == 'true' && 'chore(governance): batch MV do metabolismo nightly + snapshot dos sinais vitais [CC]' || 'chore(governance): snapshot dos sinais vitais do metabolismo nightly [CC]' }}

            Batimento determinístico do stream MV (Módulo Vivo) — batimento por classe,
            budget e regras de parada (arte 2026-07-05 §3.3-§3.6). Quando há batch, o
            merge do Wagner é a aprovação; a sessão de execução cria as tasks e roda
            screen-qa. Quando não há, só os índices derivados aterrissam.

            Refs: stream MV fase 2 · ADRs 0256/0264/0314
            Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>
          # Aspas duplas obrigatórias: a expressão contém `: ` e sem elas o YAML lê como
          # mapping ("bad indentation of a mapping entry"). Pego pelo validador js-yaml.
          title: "${{ steps.batch.outputs.gerado == 'true' && 'chore(governance): batch MV do metabolismo — aguarda aprovação Wagner' || 'chore(governance): snapshot dos sinais vitais do MV (derivado · sem batch)' }}"
          body-path: /tmp/mv-pr-body.md
          # `mv-batch` NÃO entra aqui: é o label que arma a trava "não empilhar" do passo
          # `pendente`, e um PR de snapshot com ele mataria o batimento da noite seguinte.
          # Ele é aplicado logo abaixo, SÓ quando há batch de verdade.
          labels: |
            governance
            automated
          delete-branch: true

      # Arma o gate humano do batch. Falha aqui é ruidosa de propósito: sem o label, a trava
      # "não empilhar" da próxima noite não enxerga este PR.
      - name: Arma o gate do batch (label mv-batch)
        if: steps.cpr.outputs.pull-request-number && steps.batch.outputs.gerado == 'true'
        env:
          GH_TOKEN: ${{ secrets.COWORK_BOT_PAT }}
        run: gh pr edit ${{ steps.cpr.outputs.pull-request-number }} --add-label mv-batch

      # Auto-merge SÓ do snapshot derivado — nunca de batch (o merge do batch é o gate
      # humano, e a omissão de auto-merge NELE continua sendo a feature). Mesmo padrão do
      # índice derivado em system-map.yml, que já aterrissa PAINEL/ARCHITECTURE/ONBOARDING.
      - name: Auto-merge do snapshot derivado (batch NUNCA passa por aqui)
        if: steps.cpr.outputs.pull-request-number && steps.batch.outputs.gerado != 'true'
        env:
          GH_TOKEN: ${{ secrets.COWORK_BOT_PAT }}
        run: gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --squash --auto --delete-branch
