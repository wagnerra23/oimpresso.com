name: Module surface (drift do índice de arquivos)

# Guarda o SUPERFICIE.md gerado (memory/requisitos/<Mod>/SUPERFICIE.md) contra a árvore.
# Fecha a raiz do apodrecimento da "Superfície de código" (dor estado-da-arte 2026-07-21,
# Gap 2): a lista de arquivos por contexto é DERIVADA, não escrita — se o módulo ganha um
# Controller e ninguém regenera, o --check morde.
#
# REGRA ANTI-TEATRO (igual charter-refs-gate.yml): SEM continue-on-error, SEM skip-as-pass.
# "Advisory" = NÃO está nos required checks (branch protection — decisão [W]), NÃO é vermelho
# escondido. `--all --check` exige SUPERFICIE de todo módulo VIVO (`module.json active=1`),
# das Classes B e de `_Geral`; apenas módulo inativo nunca adotado fica grandfathered.
# PROMOVIDO A REQUIRED em 2026-08-05 (ADR 0370, emenda à 0314). A condição que este
# cabeçalho declarava — "N módulos adotarem + FP medido = 0" — foi VERIFICADA, não
# presumida: `--all --check` sai 0 no main (nenhum FP crônico) e as 10 falhas medidas em
# 3 dias, 6 branches, são todas o step `--all --check` acusando drift REAL introduzido
# pelo PR (índice derivado ficou atrás da árvore). Gate certo, autor errado.
#
# REQUIRED-READINESS (ADR 0271 onda 2): o `paths:` do `pull_request` foi REMOVIDO —
# context required que só dispara por path fica PENDING pra sempre nos PRs que não tocam
# aquele path e trava o merge do repo (deadlock de 2026-07-02, proibicoes §Ambiente).
# Sempre-rodar custa ~19s por job MEDIDOS; os minutos do `gh run list` eram FILA, não
# execução (o script roda em <1s).

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Integridade do próprio gerador — HARD (se a lógica de classificação/montagem quebra, nada vale).
  selftest:
    name: Self-test — classificação por papel + montagem determinística
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test scripts/governance/module-surface.test.mjs scripts/qa/page-path.test.mjs

  # Drift: o SUPERFICIE.md commitado bate com a árvore do PR? Exit code real.
  drift:
    name: SUPERFICIE.md == árvore (módulos vivos + adotados)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: node scripts/governance/module-surface.mjs --all --check
        run: node scripts/governance/module-surface.mjs --all --check
      - name: Diagnóstico em caso de drift
        if: failure()
        run: |
          echo "::error::Um SUPERFICIE.md ficou atrás da árvore. Regenere o módulo afetado:"
          echo "  node scripts/governance/module-surface.mjs <Mod> --write"
          echo "e commite o SUPERFICIE.md atualizado."
