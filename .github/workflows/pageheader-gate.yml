name: PageHeader migration guard (F4 · congela header antigo)

# F4 do roadmap de convergência UI (MANUAL-CSS-JS.md §5).
# Bloqueia PR que faça uma tela NOVA adotar o PageHeader antigo
# (@/Components/shared/PageHeader). O contador só pode cair (migração pro canon
# @/Components/PageHeader v3.8 · ADR 0189/0190). Ratchet idêntico ao css-size-gate.
#
# Comando manual local: npm run pageheader:guard

# ── ALWAYS-RUN desde 2026-09-09 (PR do flip a required) ───────────────────────
# O `paths:` saiu dos DOIS gatilhos e o `synchronize` entrou no `types:` porque
# required que não NASCE trava o repo — `BLOCKED` com 0 falhas e 0 pendentes,
# a assinatura dos incidentes de 2026-07-02 e 2026-08-05→08. Sem `paths:` o check
# nasce em todo PR; com `synchronize` ele RE-nasce a cada push, senão um PR que
# abre vermelho fica vermelho para sempre. Invariante vigiada por
# `scripts/governance/required-always-run.mjs`. Ver RUNBOOK-branch-protection.md
# §Promoção de check a required.
on:
  push:
    branches: [main, 6.7-react]
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: pageheader-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pageheader:
    name: PageHeader · ratchet (header antigo só decresce)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # ADR 0409 — o guard cruza a divida com os arquivos TOCADOS no diff, e
          # resolve a base por `merge-base origin/<base> HEAD`. Com checkout raso
          # (default 1) nao ha `origin/main` nem historia: o merge-base falha, o
          # guard sai 2 (NAO MEDI) e o job reprova sem nada estar errado no codigo.
          # Medido em 2026-09-22 no #7722: exit 2 com a mensagem de nao-medicao.
          # Mesmo valor que o multi-tenant-gate usa pelo mesmo motivo.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: PageHeader migration guard (falha se tela nova adota o header antigo)
        run: node scripts/pageheader-migration-guard.mjs

      - name: Diagnóstico em caso de falha
        if: failure()
        run: |
          echo ""
          echo "❌ O PageHeader ratchet reprovou. Tres causas possiveis — a mensagem"
          echo "   do guard acima diz qual foi:"
          echo ""
          echo "  (1) tela NOVA adotando o header antigo (@/Components/shared/PageHeader);"
          echo "  (2) tela com divida registrada foi TOCADA neste PR — ADR 0409: a lista"
          echo "      ADIA a cura, nao perdoa, entao tocar exige migrar no mesmo PR;"
          echo "  (3) exit 2 = NAO MEDI (sem git/base/diff) — nao e defeito do codigo,"
          echo "      e o gate se recusando a declarar conformidade sem ter medido."
          echo ""
          echo "O header antigo está em migração (F4) — não ganha adotantes novos."
          echo "Tela nova usa o canon: import PageHeader from '@/Components/PageHeader' (v3.8 · ADR 0189/0190)."
          echo ""
          echo "Se você MIGROU telas (antigo→canon), atualize o baseline no mesmo PR:"
          echo "  npm run pageheader:guard:write   (o contador desce no diff do JSON)"
          echo ""
          echo "Refs: MANUAL-CSS-JS.md §5 (F4) · INDEX-DESIGN-MEMORIAS.md"
