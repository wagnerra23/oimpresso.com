name: Mobile · Pest (MySQL)

# Lane do shell do app das lojas (/m) — decisão [W] 2026-10-01: o app abre o protótipo Mobile
# servido pelo ERP. Roda tests/Feature/Mobile/ por DESCOBERTA (a pasta inteira), para que
# cada sessão de tela /m ganhe execução só por criar o teste ali (RUNBOOK-shell-mobile §5.8).
# MySQL e não sqlite: os casos autenticam usuário, passam pela pilha de middleware do ERP e
# precisam de dois tenants semeados (98 e 99) para o caso cross-tenant. Molde: dashboard-pest.yml.

on:
  workflow_dispatch: {}
  # pull_request SEM paths (always-run) + skip-as-pass interno via dorny/paths-filter:
  # se nada do domínio mudou, pula o pesado e conclui verde (mesmo padrão das lanes
  # irmãs — required-ready sem deadlock).
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'app/Http/Controllers/Mobile/**'
      - 'resources/js/Pages/Mobile/**'
      - 'resources/js/Layouts/MobileShell.tsx'
      - 'resources/views/layouts/inertia.blade.php'
      - 'routes/web.php'
      - 'tests/Feature/Mobile/**'
      - 'database/schema/mysql-schema.sql'
      - '.github/workflows/mobile-pest.yml'
      - '.github/actions/pest-mysql-setup/**'

concurrency:
  group: mobile-pest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    name: PHP / Pest (Mobile · MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oimpresso_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Detectar mudanças do shell /m (skip-as-pass)
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mobile:
              - 'app/Http/Controllers/Mobile/**'
              - 'resources/js/Pages/Mobile/**'
              - 'resources/js/Layouts/MobileShell.tsx'
              - 'resources/views/layouts/inertia.blade.php'
              - 'routes/web.php'
              - 'tests/Feature/Mobile/**'
              - 'database/schema/mysql-schema.sql'
              - '.github/workflows/mobile-pest.yml'
              - '.github/actions/pest-mysql-setup/**'

      - name: Skip-as-pass (nada do shell /m mudou)
        if: steps.changes.outputs.mobile == 'false'
        run: echo "✅ Sem mudanças no shell /m — skip-as-pass."

      - name: Setup Pest MySQL (PHP + deps + .env + migrate + seed mínimo multi-tenant)
        if: steps.changes.outputs.mobile == 'true'
        uses: ./.github/actions/pest-mysql-setup

      - name: Stub Vite manifest (root view sem build do front)
        if: steps.changes.outputs.mobile == 'true'
        run: |
          mkdir -p public/build-inertia
          cat > public/build-inertia/manifest.json <<'EOF'
          {
            "resources/css/inertia.css": { "file": "assets/inertia.css", "src": "resources/css/inertia.css", "isEntry": true },
            "resources/js/app.tsx": { "file": "assets/app.js", "src": "resources/js/app.tsx", "isEntry": true }
          }
          EOF

      - name: Run Pest (Mobile · MySQL) — DESCOBERTA, não allowlist
        if: steps.changes.outputs.mobile == 'true'
        # phpunit.xml aponta DB_CONNECTION=sqlite :memory: (sem force="true"), então a env
        # daqui vence e a suíte roda no MySQL real semeado pela action (ela é a dona dos
        # tenants). Nenhum dos testes daqui usa RefreshDatabase/migrate:fresh — o seed sobrevive.
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_DATABASE: oimpresso_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          mkdir -p test-results
          vendor/bin/pest --no-coverage --colors=always \
            --log-junit test-results/pest-mobile-junit.xml \
            tests/Feature/Mobile/

      # A régua honesta desta lane é `assertions`, NÃO "0 failed": skip sai exit 0.
      # Se o sumário mostrar casos com 0 assertions, a lane NÃO mediu — leia isso antes
      # de comemorar verde (LC-13).
      - name: Sumário JUnit por arquivo (assertions — a régua contra skip-as-pass)
        if: always()
        run: node scripts/tests/junit-summary.mjs test-results/pest-mobile-junit.xml --out test-results/pest-mobile-junit-summary.json || true

      - name: Upload sumário JUnit (pest-mobile-junit-summary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pest-mobile-junit-summary
          path: test-results/pest-mobile-junit-summary.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload JUnit (Mobile · MySQL)
        if: ${{ !cancelled() && steps.changes.outputs.mobile == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pest-mobile-junit
          path: test-results/pest-mobile-junit.xml
          retention-days: 14
