name: Browser E2E (Pest 4 Browser)

# Testes de comportamento no browser (Pest 4 Browser): render das telas, contratos do shell,
# axe de acessibilidade, smoke cross-browser, sondas de dimensão e o perf budget do Lighthouse.
#
# A COMPARAÇÃO DE PIXEL SAIU em 2026-11-04 por decisão [W] ("visual regressão já foi desativado,
# remova do projeto"): os testes de baseline (PixelBaseline, estados isolados, fluxos visuais),
# as fotos `.snap`, o modo update que regravava baseline e o canário que contava telas comparadas.
# O arquivo e o id do job `visual-regression` ficaram por enquanto porque dezenas de scripts e
# docs citam esse nome; renomear é outro PR.
#
# `pull_request` SEM paths (always-run) com skip-as-pass interno: o classificador
# `ui-impact.mjs` detecta se algo de UI mudou; se não, pula o pesado e conclui verde.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Dispatch manual re-roda os testes de browser num ref (sem modo update de baseline).
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: visual-regression-${{ github.ref }}
  # cancel-in-progress SÓ em `synchronize` (novo commit → o run anterior está num SHA velho
  # e vira lixo: cancelar é a economia real). NUNCA em `opened`/`labeled`/`unlabeled`/`reopened`:
  # esses disparam no MESMO head SHA, e com `cancel-in-progress: true` um cancelava o outro,
  # deixando um check-run `visual-regression` = `cancelled` no head SHA. A branch protection
  # (enforce_admins) lê o `cancelled` como bloqueio — mesmo com o sibling `success` — e trava o
  # merge com "Required status check "visual-regression" is cancelled" (gh pr checks mostra "pass").
  # VETOR REAL (medido 2026-07-17): o fluxo de governança rotula PRs de ADR/docs ~1-4s após abrir
  # (#4456/#4467, label `adr-legacy-schema-migration`) → `opened`+`labeled` no mesmo SHA → deadlock.
  # Workaround manual era `gh run rerun` do run cancelado. `synchronize` traz SHA novo, então o run
  # cancelado fica no SHA velho (não-head) e não bloqueia — a economia de custo do push-sobre-push
  # segue idêntica. Este é o ÚNICO workflow com `labeled`/`unlabeled` + concurrency (e2e/ci/casos/
  # dominio usam os types default sem `labeled`, imunes ao race). Não desligar o cancel cegamente.
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

jobs:
  visual-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oimpresso_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          # `0` (história inteira) SÓ no dispatch: o step "Alinhar com origin/main" abaixo
          # precisa do ancestral comum pra mergear. Em `pull_request` segue 100, como sempre
          # — mexer nisso lá encareceria todo PR sem nenhum ganho.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 0 || 100 }}

      # Selftest do classificador de impacto (cheap, node pré-instalado no runner). Até 2026-11-04
      # este step também rodava os lints dos manifestos de estado e fluxo da comparação de pixel,
      # que saiu do projeto (ADR 0445). `continue-on-error`: quem reprova o job é o
      # `Veredito do selftest do classificador de impacto`, no fim, para o resto da cadeia rodar.
      - name: Selftest do classificador de impacto
        id: lint-l2
        continue-on-error: true
        run: node scripts/governance/ui-impact.mjs --selftest

      # Fonte única do skip-as-pass. Diferente da antiga allowlist duplicada, cobre
      # CSS global, assets/fontes, Blade, toolchain e Controllers/rotas Inertia.
      # Falha fechado se não conseguir ler o diff (anti-verde-vazio).
      - name: Classificar impacto visual do diff
        id: impact
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # O `actions/checkout` faz checkout do MERGE REF (refs/pull/N/merge), não do head do
          # PR — o log dele diz "Merge <head> into <tip de main NAQUELE momento>". Já o
          # `pull_request.base.sha` é o tip de main de quando o PR foi ABERTO. Diferenciar um
          # contra o outro traz junto tudo que entrou em main no meio, e o classificador acusa
          # como "tela afetada" arquivo de PR alheio: quanto mais tempo o PR fica aberto, mais
          # telas fantasma. (Medido 2026-08-19 no PR #5983: `changed_files: 7` no CI contra 1
          # arquivo real; o impactado era um BusinessController de OUTRO PR, e o gate cobrou
          # baseline de `superadmin/Negocios`, tela que o PR não tocava.)
          #
          # Num merge ref, o que o PR muda é exatamente HEAD^1..HEAD — o 1º pai É o tip de main
          # que o próprio merge usou. Imune a main andar. Se não for merge commit (checkout
          # configurado com `ref:` explícito), cai no BASE_SHA de antes.
          if [ "$(git rev-list --count --no-walk --merges HEAD)" = "1" ]; then
            DIFF_BASE="$(git rev-parse HEAD^1)"
            echo "merge ref detectado — base = HEAD^1 ($DIFF_BASE), o tip de main que o merge usou"
          else
            DIFF_BASE="$BASE_SHA"
            echo "HEAD não é merge commit — base = pull_request.base.sha ($DIFF_BASE)"
            git fetch --no-tags --depth=100 origin "$DIFF_BASE"
          fi
          node scripts/governance/ui-impact.mjs --base="$DIFF_BASE" --head=HEAD --github-output="$GITHUB_OUTPUT"

      # Fonte única do "roda o pesado?": dispatch = sempre true (modo update);
      # pull_request = decisão estruturada do ui-impact.mjs.
      - name: Modo de execução (ui efetivo)
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=${{ steps.impact.outputs.visual_required }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip-as-pass (nada de UI mudou)
        if: steps.mode.outputs.ui == 'false'
        run: echo "✅ Sem mudanças de UI/Browser tests — skip-as-pass (required-ready, padrão ADR 0271 onda 2)."

      - name: Setup PHP
        if: steps.mode.outputs.ui == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # SEM `opentelemetry`: a auto-instrumentação opentelemetry-auto-laravel
          # (QueryWatcher) acessa contexto OTel não-inicializado DENTRO do fiber do
          # servidor do Pest Browser → ErrorException fatal em toda query DB das telas
          # autenticadas (Fase B). O gate visual não precisa de telemetria.
          extensions: mbstring, dom, fileinfo, pdo_mysql, gd
          coverage: none

      - name: Wait for MySQL ready
        if: steps.mode.outputs.ui == 'true'
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h127.0.0.1 -uroot -proot --silent; then
              echo "MySQL ready"
              break
            fi
            echo "Waiting MySQL... $i"
            sleep 2
          done

      - name: Setup Node
        if: steps.mode.outputs.ui == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0

      - name: Cache Composer
        if: steps.mode.outputs.ui == 'true'
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}

      # SEM CACHE DOS BROWSERS (removido 2026-10-01). Medido em 250 runs (2026-09-30 14:27Z ->
      # 2026-10-01 10:51Z, todas as tentativas): de 101 execuções em que o setup passou das deps,
      # 1 restaurou o cache (as outras 6 "sem install" eram timeouts das deps, não acerto).
      # Motivo: cache de `pull_request` só é legível pelo próprio PR, a chave mudava a cada
      # package-lock.json, e este job não roda em main — não existe entrada que os PRs herdem.
      # Custo do cache: probe de ~4s + save de 13-44s nos jobs verdes + 474 MB POR PR, que
      # deixavam o cache do repo em 10,6 GB (26 entradas, 21 delas esta) e despejavam o cache
      # compartilhado dos outros workflows. Ganho perdido: nenhum — o install leva p50 17s,
      # máx 22s, e já rodava em 99 de 101 execuções.
      # Reabrir só com um produtor em main (entrada que os PRs consigam ler) E restore-only no PR.

      - name: Install Composer dependencies
        if: steps.mode.outputs.ui == 'true'
        # --ignore-platform-req=ext-opentelemetry: o pacote opentelemetry-auto-laravel
        # exige a ext no platform check, mas removemos a ext de propósito (ver Setup PHP).
        # O pacote degrada gracioso sem a ext (hooks não registram).
        run: composer install --no-progress --no-interaction --prefer-dist --no-scripts --ignore-platform-req=ext-opentelemetry

      - name: Install NPM dependencies
        if: steps.mode.outputs.ui == 'true'
        run: npm ci

      - name: Produção Oficina — sondas do Pest Browser mordem DOM bom e defeituoso
        if: steps.mode.outputs.ui == 'true'
        run: node scripts/tests/producao-oficina-probes.test.mjs

      - name: Verify Playwright npm client from lockfile
        if: steps.mode.outputs.ui == 'true'
        # @playwright/test é devDependency e o lock materializa `playwright` na raiz.
        # Proíbe `npm install --no-save`, que consultava o registry e podia trocar a
        # versão depois do npm ci sem alterar o diff revisado.
        run: |
          node -e "const fs=require('fs'); const lock=require('./package-lock.json'); const expected=lock.packages['node_modules/playwright']?.version; const actual=JSON.parse(fs.readFileSync('./node_modules/playwright/package.json','utf8')).version; if (!expected || actual !== expected) throw new Error('Playwright fora do lock: '+actual+' != '+expected); console.log('Playwright lockado:', actual)"

      - name: Install Playwright system dependencies
        if: steps.mode.outputs.ui == 'true'
        # TETO DE PASSO (2026-08-20). Sem teto, um espelho apt degradado consumia o
        # orçamento INTEIRO do job e o sintoma era `The operation was canceled` aqui,
        # seguido de ~8 passos falhando em ~1s com `Please provide a valid cache path`
        # (o `Setup Laravel` nunca rodou) — causa não-atribuível pra quem lê o vermelho.
        #
        # MEDIDO em 30 runs pesados (aqueles em que este passo executou), 2026-08-19/20:
        #   passo  23-67s no normal (n=26, mediana ~32s);
        #          135/348/426/683/835/837/838s numa janela (n=7) toda contida em
        #          2026-08-19 21:20Z-22:06Z — 4 desses morreram no teto do job (915-920s).
        #   job    total 496-762s quando verde, contra teto de 900s: a folga de rotina é
        #          de 2-5 min, então qualquer passo que degrade estoura o orçamento.
        # Reproduzir: gh run view <id> --json jobs --jq '.jobs[].steps[]
        #   | select(.name=="Install Playwright system dependencies")
        #   | (.completedAt|fromdate)-(.startedAt|fromdate)'
        #
        # 5 min = ~9x a mediana, acima de todo valor que já coube num job verde e abaixo
        # dos 426s+ que sempre mataram um. SEM retry de propósito: a folga do job não paga
        # uma segunda tentativa — ela apenas trocaria este teto pelo teto do job, voltando
        # a esconder a causa. O teto NÃO faz o job passar num espelho degradado; ele faz o
        # job falhar rápido, no passo certo, e devolve o runner ~9 min antes.
        #
        # 5 -> 8 min (2026-10-01). RE-MEDIDO em 250 runs (2026-09-30 14:27Z -> 2026-10-01 10:51Z),
        # TODAS as tentativas (`gh run view` só mostra a última — os timeouts estavam na 1ª):
        #   passo  111 execuções: 101 ok (p50 41s · p90 61s · p99 80s · máx 240s), 6 no teto de
        #          5 min, 4 canceladas. Os 6 cortes: espelho azure.archive.ubuntu.com entregando
        #          0,08-0,37 MB/s pros ~120 MB de .deb. Até o corte tinham baixado ~108, 104,
        #          61, 61, 40 e 23 MB — os 2 primeiros terminariam em ~6 min; os outros 4
        #          precisariam de 10-26 min, que o job não tem.
        #   job    os pesados que rodam até o fim levam p50 962s · p90 990s · máx 1008s, contra
        #          o teto de 1500s (25 min): folga ~490s acima dos ~41s normais deste passo.
        # 8 min cobre os quase-cortes e ainda cabe no job (1008 - 41 + 480 = 1447s < 1500). Acima
        # disso a troca volta a ser este teto pelo do job (o motivo original do teto, acima).
        #
        # CACHE DOS .deb FOI MEDIDO E NÃO ENTROU: o cache do repo está no limite (10,6 GB em 26
        # entradas, 2026-10-01, quase tudo `playwright-all-browsers` de 474 MB duplicado por PR)
        # e cache de PR só é legível pelo próprio PR — um .deb de 120 MB por PR seria despejado
        # antes do re-run que deveria servir. O cache de browsers saiu (ver abaixo); reabrir este
        # só com o mesmo desenho que reabriria aquele: produtor em main + restore-only no PR.
        #
        # Se este passo falhar, os passos de TESTE não rodam (gate `steps.setup-ok` abaixo) e o
        # comentário do PR diz "falha de preparação do ambiente", não "gate visual reprovou".
        # Re-run da tentativa resolveu 4 dos 5 casos medidos.
        id: playwright-deps
        timeout-minutes: 8
        run: npx playwright install-deps chromium firefox webkit

      - name: Install Playwright browsers
        if: steps.mode.outputs.ui == 'true'
        run: npx playwright install chromium firefox webkit

      - name: Setup Laravel
        if: steps.mode.outputs.ui == 'true'
        # SCHEMA-SQUASH MODE (US-GOV-013, supersede INFRA-ONLY): `migrate` carrega
        # `database/schema/mysql-schema.sql` (squash do staging saudável, anonimizado)
        # ANTES de replayar — bypassa a podridão histórica de fresh-migrate (view×table
        # copiloto_metas, FK INT×BIGINT nfse etc) que quebrava o setup. Só migrations
        # NOVAS (pós-staging) rodam por cima. `continue-on-error` REMOVIDO — agora o
        # migrate tem que passar de verdade (gate real). Regenerar schema: RUNBOOK US-GOV-013.
        run: bash scripts/tests/visreg-ci-setup.sh laravel

      - name: Seed demo tenant (business + admin + role Admin#1)
        if: steps.mode.outputs.ui == 'true'
        # O schema-squash é schema-only (sem dados) → as telas autenticadas (Fase B)
        # precisam de um business + admin seedados.
        #
        # 2026-06-06: o DummyBusinessSeeder (demo UltimatePOS de 2018) estava PODRE contra
        # o schema atual (inseria contacts.first_name, coluna removida → "Unknown column")
        # → sem business → AuthBridgeSmokeTest skipava. Trocado pelo VisregTenantSeeder
        # MINIMAL (business 1 + location + admin id=1 + role spatie Admin#1), idempotente e
        # alinhado ao schema. Sem `|| echo` que mascarava: agora o seed é GATE REAL — se
        # quebrar, o job falha. Vide database/seeders/VisregTenantSeeder.php.
        run: bash scripts/tests/visreg-ci-setup.sh seed

      - name: Build Inertia bundles
        if: steps.mode.outputs.ui == 'true'
        run: npm run build:inertia

      # MARCA DE FIM DO SETUP. Só conclui `success` se TODO passo anterior passou (o `success()`
      # implícito). Os passos de teste que usam `always()` (pra rodar mesmo se OUTRO teste falhar)
      # exigem esta marca: sem ela, um setup quebrado (ex. timeout das deps do Playwright em
      # 2026-09-30) fazia os fluxos rodarem sem Laravel montado, caírem com `Please provide a
      # valid cache path` e o comentário do PR culpar "Fluxos visuais Financeiro".
      - name: Ambiente pronto (fim do setup — testes podem rodar)
        if: steps.mode.outputs.ui == 'true'
        id: setup-ok
        run: echo "setup concluído — PHP, Node, deps, Playwright, Laravel, seed e build OK"

      - name: Run Pest Browser tests
        if: steps.mode.outputs.ui == 'true' && github.event_name != 'workflow_dispatch'
        id: pest-browser
        # GATE REAL — Fase A (públicas) + INÍCIO da Fase B (autenticadas).
        # 2026-06-06: destravado o auth cross-process via rota /_visreg-login/{id}?to=
        # (routes/web.php, env-guarded) + SESSION_DRIVER=file (persiste cross-request).
        # AuthBridgeSmokeTest cobre Financeiro/Unificado + Sells/Lista (autenticadas) —
        # prova de conceito do harness. Amplia pro CoreScreens-6 inteiro depois que estas
        # 2 passarem verde no CI (cada tela pode precisar ajuste de slug-permissão/seed).
        #
        # A11yAxeBrowserTest (Fase 3 a11y determinística): roda axe-core no CHROMIUM REAL
        # numa tela core (Financeiro/Unificado) pra pegar contraste/foco/ARIA-em-contexto
        # que o jsdom da Fase 2 não enxerga. Piso conservador: 0 violações CRITICAL (ratchet
        # level 0). Mesmo harness auth-bridge do AuthBridgeSmokeTest.
        #
        # ConformanceProbesTest (PACOTE-Q9 PR-3): espelho CI da semântica G2/G3/G4 do
        # qa-conformance.js v2 (Cowork) — computed-style no Chromium real, drawer Oficina
        # com o estado "adicionando" ABERTO (o que vazava), controle-negativo embutido (L-31).
        #
        # Tier0RenderIsolationTest (gate L3 — princípio #1 IRREVOGÁVEL, ADR 0093): prova no
        # RENDER que a tela do biz=1 NÃO vaza dado do biz=99 (token ZZLEAK99) — nem no DOM
        # visível (assertDontSee) nem no payload cru (data-page Inertia, via ->content()/
        # ->script()). Dois lados: CONTROLE (biz=99 VÊ o token) + ISOLAMENTO (biz=1 NÃO vê).
        # BLOCKING (sem continue-on-error): o princípio #1 não admite merge-vermelho.
        run: ./vendor/bin/pest tests/Browser/Public/ tests/Browser/CoreScreens/AuthBridgeSmokeTest.php tests/Browser/CoreScreens/A11yAxeBrowserTest.php tests/Browser/CoreScreens/ConformanceProbesTest.php tests/Browser/CoreScreens/PixelDimensionProbesTest.php tests/Browser/CoreScreens/Tier0RenderIsolationTest.php

      - name: Cross-browser smoke · Firefox
        if: steps.mode.outputs.ui == 'true' && github.event_name != 'workflow_dispatch'
        run: ./vendor/bin/pest tests/Browser/CoreScreens/AuthBridgeSmokeTest.php --browser firefox

      - name: Cross-browser smoke · WebKit
        if: steps.mode.outputs.ui == 'true' && github.event_name != 'workflow_dispatch'
        run: ./vendor/bin/pest tests/Browser/CoreScreens/AuthBridgeSmokeTest.php --browser safari

      # ── E2E DE RENDER POR TELA — Financeiro/Conciliacao (NASCE ADVISORY) ──────────────
      # O buraco medido em 2026-08-31 por `node scripts/qa/screen-coverage-map.mjs --screen
      # Financeiro/Conciliacao/Index`: trio ✓ · scorecard ✓ · RUNBOOK ✓ · visual-comparison ✓ ·
      # proto-baseline ✓ · 13/13 UC citados por teste — e `e2e (Browser) ✗`. O contrato dessa
      # tela está defendido no SERVIDOR (lane financeiro-pest, required) e nada exercita a tela
      # RENDERIZADA. Este step cobre só esse eixo: chip de origem, cor do valor negativo,
      # match% na UI, affordância por status, busca client-side e axe CRITICAL.
      #
      # POR ÚLTIMO, de propósito: a fixture cria 1 `fin_titulos`, e essa tabela alimenta a
      # baseline de pixel de `Financeiro/Unificado`. O teste apaga no `afterEach`; rodar depois
      # de TODAS as capturas garante que nem uma limpeza que falhe alcance baseline já assada.
      #
      # ADVISORY no nascimento (ADR 0261/0275 — "gate novo nasce advisory → 2 verdes →
      # enforcing"): o arquivo NÃO pôde ser executado antes do PR (Pest Browser é CI/CT-100
      # only, e `php`/`vendor` não existem na worktree do autor), e NA DATA em que este step
      # nasceu o job `visual-regression` era required — sem o `continue-on-error` um assert mal
      # calibrado bloquearia o merge de todo mundo. Promoção a ENFORCING = REMOVER o
      # `continue-on-error` deste step, exatamente como os steps de pixel/estados/flows (removidos em 2026-11-04)
      # registram ter feito. ⚠️ Hoje isso reprova o JOB, não o merge: o context saiu do required
      # em 2026-08-26 (`governance/required-checks-baseline.json` é o dono da lista).
      #
      # ⚠️ Pra contar como "verde" na promoção, o step tem que ter EXECUTADO: `skipped` lido
      # como verde é o presence-gate de sempre. Por isso o `always()` — idêntico aos 3 steps
      # de fluxos acima: sem ele, qualquer vermelho anterior pularia este e o run apareceria
      # sem veredito nenhum, indistinguível de um run bem-sucedido.
      # ── Contrato do SHELL: auto-rail responsivo (ADR UI-0030) ──────────────────
      # Por que um step novo e não pendurar no PixelBaselineTest: aquele fotografa
      # telas numa viewport só (1728 — medido no IHDR dos .snap); este afirma sobre o
      # COMPORTAMENTO do shell EM FUNÇÃO da largura (1280 vira rail, 1440 não, escolha
      # manual vence, e sem escolha o modo segue o resize ao vivo). Mede
      # `grid-template-columns` resolvido, não pixel: NÃO gera baseline nova.
      #
      # Wirado AQUI, e não numa lane nova, porque `uc-lane-coverage` (no-new-lie) pegou
      # os 4 UC do `AppShellV2.casos.md` citando um arquivo que lane nenhuma rodava —
      # "verde impossível". O gate avisa que mexer na ALLOWLIST é decisão [W]; um teste
      # novo, que nunca teve entrada nenhuma, não é esse caso — é o wiring que faltava.
      #
      # ADVISORY no nascimento (ADR 0261/0275), pelo motivo literal do step do
      # Conciliacao abaixo: Pest Browser é CI/CT-100 only e o autor não pôde executá-lo
      # antes do PR (`php`/`vendor` não existem na worktree). Promoção a enforcing =
      # REMOVER o `continue-on-error`, após 2 verdes que EXECUTARAM — `skipped` lido
      # como verde seria o presence-gate de sempre, e é pra isso que serve o `always()`.
      - name: Contrato do shell · auto-rail ≤1280 (ADVISORY · ADR UI-0030)
        if: always() && steps.mode.outputs.ui == 'true' && github.event_name != 'workflow_dispatch' && steps.setup-ok.outcome == 'success'
        id: e2e-shell-rail
        continue-on-error: true
        run: ./vendor/bin/pest tests/Browser/Shell/SidebarAutoRailTest.php

      - name: E2E de render · Financeiro/Conciliacao (ADVISORY)
        if: always() && steps.mode.outputs.ui == 'true' && github.event_name != 'workflow_dispatch' && steps.setup-ok.outcome == 'success'
        id: e2e-conciliacao
        continue-on-error: true
        run: ./vendor/bin/pest tests/Browser/Financeiro/ConciliacaoIndexTest.php

      # ── E2E DE RENDER POR TELA — Patrimonio/Bens (NASCE ADVISORY) ───────────────────
      # Buraco medido em 2026-09-10: `git grep -l "Patrimonio/" tests/Browser/` devolvia SÓ
      # o manifesto visreg — nenhum teste exercitava a tela. Todo o crédito de `e2e` que o
      # `screen-coverage-map` dava a ela vinha do contrato visreg lido como E2E (o próprio
      # mapa documenta: "14 dos 18 eram crédito de visreg lido como E2E"). Ao remover a
      # baseline de pixel — decisão [W] 2026-09-09, registrada no cabeçalho do
      # `screen-coverage-gate.yml` — o eixo caiu 61 → 60 e o gate required reprovou.
      #
      # O que este arquivo mede e o gate estático NÃO alcança: o `contrato-de-tela.mjs` casa
      # `data-contract` no TEXTO do `.tsx`; aqui prova-se que as âncoras chegaram ao DOM, na
      # ordem. É a fronteira que a própria `KpiGrid.tsx` do módulo registra — "presença na
      # fonte ≠ presença no DOM".
      #
