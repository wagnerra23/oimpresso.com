      # ── VEREDITO DOS ADVISORY DE BROWSER (visibilidade, NÃO enforcement) ─────────
      # NÃO lista o step de Purchase/Index · Etiquetas, e isso é deliberado: ele foi
      # promovido a ENFORCING em 2026-09-05 (flip [W]), logo NÃO tem `continue-on-error`
      # e o vermelho dele já aparece em `gh pr checks` e na UI — que é justamente o que
      # este veredito existe pra compensar nos que TÊM. Incluí-lo aqui sugeriria que ele
      # é advisory. Quem promover outro step: tire-o desta lista junto.
      # O PROBLEMA, medido em 2026-09-03: `continue-on-error: true` faz o GitHub publicar
      # `conclusion=success` NO STEP; o veredito real fica só no campo `outcome`, que nem a
      # UI de checks nem `gh pr checks` mostram. Nos runs 33747138995 e 33762382505 o step do
      # Conciliacao veio `conclusion=success` pela API enquanto o log do MESMO run trazia
      # `FAIL Tests\Browser\Financeiro\ConciliacaoIndexTest` / `6 failed` — e foi assim que
      # ele atravessou de #6476 (2026-08-31) até #6632 (2026-09-03) sem ninguém notar.
      #
      # O IDIOMA NÃO É NOVO — é o do step "Veredito advisory L5 perf budget", mais abaixo
      # NESTE arquivo (`id:` no step + leitura de `steps.<id>.outcome`), e o mesmo de
      # `deploy.yml:818` e `ds-gate.yml:122`. O que faltava era aplicá-lo aos advisory de
      # BROWSER: o L5 tinha veredito, estes cinco não tinham.
      #
      # DUAS DIFERENÇAS deliberadas em relação ao veredito do L5:
      #   1. `skipped` NÃO é dobrado em verde. O `else` do L5 chama de OK tudo que não é
      #      `failure`, e estes cinco steps são pulados DE VERDADE (medido no run
      #      33768527434: os 5 `skipped`, porque aquele PR não tocou UI). Verde que não
      #      mediu é o mesmo formato de `0 failed` numa suíte que não rodou.
      #   2. imprime o DENOMINADOR (quantos executaram de quantos), pelo mesmo motivo.
      #
      # NÃO MUDA ENFORCEMENT: nenhum `continue-on-error` saiu, e este step termina em
      # `exit 0` (última linha do `run`) — ele relata, não decide. Promover um destes advisory
      # é remover o `continue-on-error` DELE, e isso é flip [W] (ADR 0336, mordida provada);
      # quem é required vive em `governance/required-checks-baseline.json`.
      - name: Veredito dos advisory de Browser (visível no resumo do run)
        if: always() && steps.mode.outputs.ui == 'true' && github.event_name != 'workflow_dispatch'
        env:
          A_SHELL: ${{ steps.e2e-shell-rail.outcome }}
          A_CONCILIACAO: ${{ steps.e2e-conciliacao.outcome }}
          A_CAIXA: ${{ steps.e2e-caixa.outcome }}
          A_COBRANCA: ${{ steps.e2e-cobranca.outcome }}
          A_RECIPES: ${{ steps.e2e-recipes.outcome }}
          A_VISAO_GERAL: ${{ steps.e2e-visao-geral.outcome }}
          A_REPAIR_PRODUCAO: ${{ steps.e2e-repair-producao.outcome }}
          A_OFICINA_AUTO: ${{ steps.e2e-oficina-auto.outcome }}
          A_COMUNICACAO_VISUAL: ${{ steps.e2e-comunicacao-visual.outcome }}
          A_VESTUARIO: ${{ steps.e2e-vestuario.outcome }}
          A_CATALOGO_QR: ${{ steps.e2e-catalogo-qr.outcome }}
          A_PATR_ALOCACOES: ${{ steps.e2e-patrimonio-alocacoes.outcome }}
          A_PATR_CONFIGURACOES: ${{ steps.e2e-patrimonio-configuracoes.outcome }}
          A_PATR_MANUTENCOES: ${{ steps.e2e-patrimonio-manutencoes.outcome }}
          A_FISCAL_DAS: ${{ steps.e2e-fiscal-das.outcome }}
        run: |
          resumo="$(mktemp)"
          {
            echo "## Veredito dos advisory de Browser"
            echo ""
            echo "| | step | outcome |"
            echo "|---|---|---|"
          } > "$resumo"

          total=0; executaram=0; falharam=0; pulados=0; indefinidos=0; falhos=""
          bt='`'   # crase em variavel: o bloco fica sem barra invertida

          registrar() {
            nome="$1"; oc="${2:-}"
            total=$((total + 1))
            case "$oc" in
              success)
                executaram=$((executaram + 1)); icone="✅" ;;
              failure)
                executaram=$((executaram + 1)); falharam=$((falharam + 1))
                icone="🔴"; falhos="${falhos}${nome} / " ;;
              skipped)
                pulados=$((pulados + 1)); icone="⏭ pulado" ;;
              *)
                indefinidos=$((indefinidos + 1)); icone="❓ não avaliado"; oc="${oc:-vazio}" ;;
            esac
            echo "| ${icone} | ${nome} | ${bt}${oc}${bt} |" >> "$resumo"
          }

          registrar "Contrato do shell · auto-rail <=1280" "$A_SHELL"
          registrar "E2E de render · Financeiro/Conciliacao" "$A_CONCILIACAO"
          registrar "E2E de render · Financeiro/Caixa" "$A_CAIXA"
          registrar "E2E de render · Financeiro/Cobranca" "$A_COBRANCA"
          registrar "E2E de render · Manufacturing/Recipes" "$A_RECIPES"
          registrar "E2E de render · Home/Visao geral" "$A_VISAO_GERAL"
          registrar "E2E de render · Repair/ProducaoOficina" "$A_REPAIR_PRODUCAO"
          registrar "E2E de comportamento · OficinaAuto" "$A_OFICINA_AUTO"
          registrar "E2E de comportamento · ComunicacaoVisual" "$A_COMUNICACAO_VISUAL"
          registrar "E2E de comportamento · Vestuario" "$A_VESTUARIO"
          registrar "E2E de comportamento · Catálogo QR" "$A_CATALOGO_QR"
          registrar "E2E de render · Patrimonio/Alocacoes" "$A_PATR_ALOCACOES"
          registrar "E2E de render · Patrimonio/Configuracoes" "$A_PATR_CONFIGURACOES"
          registrar "E2E de render · Patrimonio/Manutencoes" "$A_PATR_MANUTENCOES"
          registrar "E2E de render · Fiscal/Das" "$A_FISCAL_DAS"

          {
            echo ""
            echo "**${total} advisory de Browser** — ${executaram} executaram · ${falharam} falharam · ${pulados} pulados · ${indefinidos} não avaliados."
          } >> "$resumo"

          if [ "$executaram" -eq 0 ]; then
            {
              echo ""
              echo "**NÃO HOUVE MEDIÇÃO neste run.** Nenhum dos ${total} executou — logo este resumo não afirma que as telas estão sãs, afirma que ninguém mediu."
            } >> "$resumo"
          fi

          if [ "$falharam" -gt 0 ]; then
            {
              echo ""
              echo "**${falharam} de ${executaram} executados FALHARAM:** ${falhos}"
              echo ""
              echo 'Estes steps têm `continue-on-error: true`, logo o step publica `conclusion=success` e o vermelho NÃO aparece em `gh pr checks` nem na UI de checks — o veredito real é a coluna `outcome` acima. Abra o log do step para o `FAIL` do Pest.'
            } >> "$resumo"
            echo "::warning title=Advisory de Browser vermelho::${falharam} de ${executaram} executados falharam: ${falhos}"
          fi

          cat "$resumo"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat "$resumo" >> "$GITHUB_STEP_SUMMARY"
          fi

          # `exit 0` SEMPRE, e é o ponto: fazer este step reprovar promoveria todos os
          # advisory a enforcing de uma vez — flip [W] (ADR 0336), nunca efeito colateral
          # de um step de relatório.
          exit 0

      # ── Camada L5 — PERF BUDGET QUE MORDE (Lighthouse CI · median-of-3) ───────────────
      # Hoje LCP/CLS só eram coletados pós-merge advisory e nada falhava. Esta camada mede
      # as telas núcleo AUTENTICADAS no MESMO boot+seed do gate, reusando o auth-bridge
      # /_visreg-login/{id}?to=<tela> (routes/web.php, env-guarded) — admin id=1 do
      # VisregTenantSeeder. Config: lighthouserc.json (raiz).
      #
      # ARMADURA EM 3 ESTÁGIOS (segue ADR 0275 §3 armamento + §5 calendário; e a LIÇÃO do
      # visual-regression que mergeou vermelho 2× por virar required cedo — PRs #2544/#2548):
      #   Estágio 0 (nascimento): step `continue-on-error: true` ⇒ ADVISORY. Na data do
      #     nascimento o job `visual-regression` era required, então o continue-on-error era o
      #     que mantinha L5 sem morder (mesmo padrão do pixel-diff acima). No lighthouserc: CLS = `error`
      #     (morde já, na severidade) @ 0.1; LCP/TBT = `warn`. `lhci assert` roda e imprime,
      #     mas nada reprova o PR. Coletar 3 medições válidas consecutivas (regra de armamento).
      #   Estágio 1 (ARMADO 2026-06-23): 3 medianas estáveis (var <1.5%) confirmaram o orçamento —
      #     LCP 3448/3461/3469ms (Financeiro) e 3528/3543/3569ms (Sells); CLS<0.1 e TBT<300 nas 3.
      #     Flipado `warn` → `error` no lighthouserc: LCP error@4000 + TBT error@600 (tetos "poor"
      #     do Web Vitals — anti-regressão acima do real ~3,5s; o alvo "good" 2,5s vira meta de
      #     otimização à parte). CLS segue error@0.1. Step ainda advisory (continue-on-error) →
      #     o assert reprova no LOG, não no PR; hoje passa VERDE (tudo dentro do teto).
      #   Estágio 2 (promover a required): pelo CALENDÁRIO ADR 0275 §5 (máx 1/semana, [W] flipa,
      #     evidência linkada = runs, PR atualiza required-checks-baseline.json citando 0275).
      #     Promover = REMOVER o `continue-on-error: true` deste step — idêntico à nota do
      #     pixel-diff. ⚠️ ISSO SOZINHO NÃO BLOQUEIA MERGE: desde 2026-08-26 o context
      #     `visual-regression` não é required, então remover o continue-on-error faz o step
      #     reprovar o JOB e nada mais. Para que morda no merge, o flip [W] na branch protection
      #     é passo SEPARADO e obrigatório (dono da lista: `governance/required-checks-baseline.json`).

      - name: Instalar Lighthouse CI (L5 — pin compatível com Node 22.17.0)
        if: steps.mode.outputs.ui == 'true' && github.event_name != 'workflow_dispatch'
        # continue-on-error PERMANENTE (≠ lever de promoção): instalar o LHCI é INFRA do gate
        # ADVISORY — uma falha transitória de npm NÃO pode reprovar o job `visual-regression`.
        # O lever de promoção é remover o continue-on-error do step `lhci`,
        # NÃO deste. Sem o LHCI, o step `lhci` falha e é engolido → nenhuma medição, sem dano.
        continue-on-error: true
        # @lhci/cli@0.15.1 empacota lighthouse@12.6.1 (engine node >=18.20) → compatível com
        # Node 22.17.0 fixado no job. Pin explícito (NÃO `@latest`) pra build determinístico.
        # Chrome: o runner ubuntu-latest já traz google-chrome-stable → chrome-launcher acha sozinho.
        run: npm install -g @lhci/cli@0.15.1

      - name: L5 — Perf budget Lighthouse (median-of-3 · ADVISORY · ARMADO ADR 0275)
        if: steps.mode.outputs.ui == 'true' && github.event_name != 'workflow_dispatch'
        id: lhci
        continue-on-error: true
        env:
          # Built-in PHP server é single-thread; sem workers, requests concorrentes de assets
          # do SPA serializam e inflam o LCP (flake). 4 workers = medição estável.
          PHP_CLI_SERVER_WORKERS: "4"
        # autorun = collect (sobe `php artisan serve`, mede 3×, derruba) + assert (median) + upload.
        run: lhci autorun --config=lighthouserc.json

      - name: Upload resultados Lighthouse (L5 — leitura das medianas p/ armar)
        if: ${{ !cancelled() && steps.mode.outputs.ui == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-perf-budget
          path: .lighthouseci/
          # include-hidden-files: o LHCI escreve em `.lighthouseci/` (dot-dir = "hidden");
          # upload-artifact@v4 IGNORA hidden por default → o artifact saía vazio. Sem isto
          # as medianas não eram inspecionáveis (só liam no log). Vide ADR 0275 (armar).
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

      - name: Veredito advisory L5 perf budget (visível no log)
        if: steps.mode.outputs.ui == 'true' && github.event_name != 'workflow_dispatch'
        run: |
          if [ "${{ steps.lhci.outcome }}" = "failure" ]; then
            echo "🟡 L5 PERF BUDGET ADVISORY FALHOU — alguma métrica acima do orçamento (ver artifact lighthouse-perf-budget)."
            echo "   ARMADO (ADR 0275 §3): CLS error@0.1 · LCP error@4000 · TBT error@600 (tetos anti-regressão)."
            echo "   Regressão? conserte. Orçamento irreal? ajuste lighthouserc.json com evidência das medianas."
          else
            echo "✅ L5 perf budget OK (advisory · ARMADO — verde dentro dos tetos; pronto p/ promoção [W] ADR 0275 §5)."
          fi

      # Onde o L2 reprova o job (ver o comentário do step `Lint L2`). Fica ANTES dos steps de
      # falha para que `failure()` já esteja verdadeiro neles e o comentário nomeie este step.
      - name: Veredito do selftest do classificador de impacto
        id: veredito-l2
        if: always() && steps.lint-l2.outcome != 'success'
        env:
          L2_OUTCOME: ${{ steps.lint-l2.outcome }}
        run: |
          echo "::error title=Selftest do classificador::o step 'Selftest do classificador de impacto' terminou em '$L2_OUTCOME' — o motivo está no log daquele step."
          bt='`'   # crase em variavel: o bloco fica sem barra invertida
          echo "- Selftest do ${bt}ui-impact.mjs${bt}: ❌ ${bt}${L2_OUTCOME}${bt}. Detalhe no log do step." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Upload screenshots on failure
        if: failure() || steps.pest-browser.outputs.fail == '1'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-diff
          path: tests/Browser/Screenshots/
          retention-days: 7

      # A NARRATIVA é escolhida pelo ui-impact.mjs (dono da semântica scope↔uncovered, a mesma
      # do canário) e NOMEIA o step que reprovou. Antes o corpo saía só de `uncovered_screens`
      # não-vazio, ignorando o scope — e em `global` isso quase nunca é vazio, então toda falha
      # virava "Tela sem contrato visual" (medido 2026-08-20, PR #5976 · job 96505067528).
      - name: Corpo do comentário de falha (narrativa medida, não escolhida)
        id: corpo-falha
        if: (failure() || steps.pest-browser.outputs.fail == '1') && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          SCOPE: ${{ steps.impact.outputs.scope }}
          UNCOVERED: ${{ steps.impact.outputs.uncovered_screens }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PASSOS: >-
            [{"nome":"Preparação do ambiente (setup antes dos testes)","tipo":"setup","outcome":"${{ steps.mode.outputs.ui == 'true' && steps.setup-ok.outcome != 'success' && 'failure' || 'success' }}","causa":"${{ steps.playwright-deps.outcome == 'failure' && 'Install Playwright system dependencies' || '' }}"},
             {"nome":"Veredito do selftest do classificador de impacto","outcome":"${{ steps.veredito-l2.outcome }}"},
             {"nome":"Classificar impacto visual do diff","outcome":"${{ steps.impact.outcome }}"},
             {"nome":"Run Pest Browser tests","outcome":"${{ steps.pest-browser.outcome }}"},
             {"nome":"E2E de render · Patrimonio/Bens (ENFORCING)","outcome":"${{ steps.e2e-patrimonio-bens.outcome }}"}]
        run: |
          node scripts/governance/ui-impact.mjs --explain-failure \
            --scope="$SCOPE" --uncovered-screens="${UNCOVERED:-[]}" \
            --gray-zone="[]" --steps="$PASSOS" --run-url="$RUN_URL" \
            | tee /tmp/visreg-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR if regression detected
        if: (failure() || steps.pest-browser.outputs.fail == '1') && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // Fail-open com a razão NA CARA: se o gerador do corpo não rodou, o comentário diz
            // isso — não inventa a causa nem some (a falha do job já está no run).
            const falhou = '${{ steps.corpo-falha.outcome }}';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = fs.existsSync('/tmp/visreg-comment.md')
              ? fs.readFileSync('/tmp/visreg-comment.md', 'utf8')
              : ['## ❓ Gate visual vermelho — não consegui gerar o diagnóstico', '',
                 `O step "Corpo do comentário de falha" não produziu saída (${falhou}), então **não sei** qual step reprovou.`,
                 '', `Abra o run e veja o primeiro step vermelho: ${run}`].join(String.fromCharCode(10));
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
  # ── TEMA ESCURO nas Pages de produção (playbook tema-escuro · threads 02 e 05) ──────────
  # Job PRÓPRIO, não step do `visual-regression`: medido 2026-10-13 nos 60 runs de PR mais
  # recentes, os jobs pesados verdes levaram 1048-1316s contra o teto de 1500s, e a sonda
  # custa ~225s (run 37608542269). Somada ao job, 3 dos 13 verdes passariam do teto. O
  # 05-baseline.md manda job próprio nesse caso, sem cortar universo.
  #
  # Mede as telas de visreg-screens.json logadas no biz=1 fictício com ui_theme=dark; o
  # veredito sai da sonda (`--producao`), dona do corte L/C/alfa e da allowlist. A catraca
  # (`--catraca`) compara com scripts/design/tema-escuro-producao-baseline.json: reprova Page
  # MEDIDA com superfície clara fora da baseline e contagem que sobe; contagem que desce só
  # avisa, e o PR baixa a baseline com `--write-baseline-producao`. Decisões D2 e D3 de 07/10.
  #
  # Roda em PR que toca Pages ou CSS (do núcleo e de Modules/*/Resources), a sonda, o teste ou a baseline. Fora disso, skip-as-pass
  # (pulado não é verde de medição: não mediu). A preparação do Laravel e a semente são as
  # do job principal, pelo mesmo script.
  tema-escuro-producao:
    name: tema-escuro · Pages de produção vs baseline
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oimpresso_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 100

      - name: O PR toca Pages, CSS ou a sonda?
        id: toca
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # merge ref: o que o PR muda é HEAD^1..HEAD (mesmo motivo do "Classificar impacto").
          if [ "$(git rev-list --count --no-walk --merges HEAD)" = "1" ]; then BASE="$(git rev-parse HEAD^1)"; else BASE="$BASE_SHA"; git fetch --no-tags --depth=100 origin "$BASE"; fi
          alvo='^((Modules/[^/]+/)?[Rr]esources/(js/Pages|css)/|scripts/design/tema-escuro-|tests/Browser/TemaEscuro/|scripts/tests/visreg-ci-setup[.]sh)'
          if git diff --name-only "$BASE" HEAD | grep -qE "$alvo"; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "toca — mede"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "não toca Pages/CSS/sonda — skip-as-pass (não mediu)"
          fi

      - name: Setup PHP
        if: steps.toca.outputs.run == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # SEM `opentelemetry`: a auto-instrumentação opentelemetry-auto-laravel
          # (QueryWatcher) acessa contexto OTel não-inicializado DENTRO do fiber do
          # servidor do Pest Browser → ErrorException fatal em toda query DB das telas
          # autenticadas (Fase B). O gate visual não precisa de telemetria.
          extensions: mbstring, dom, fileinfo, pdo_mysql, gd
          coverage: none

      - name: Wait for MySQL ready
        if: steps.toca.outputs.run == 'true'
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h127.0.0.1 -uroot -proot --silent; then
              echo "MySQL ready"
              break
            fi
            echo "Waiting MySQL... $i"
            sleep 2
          done

      - name: Setup Node
        if: steps.toca.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0

      - name: Cache Composer
        if: steps.toca.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}

      - name: Install Composer dependencies
        if: steps.toca.outputs.run == 'true'
        # --ignore-platform-req=ext-opentelemetry: o pacote opentelemetry-auto-laravel
        # exige a ext no platform check, mas removemos a ext de propósito (ver Setup PHP).
        # O pacote degrada gracioso sem a ext (hooks não registram).
        run: composer install --no-progress --no-interaction --prefer-dist --no-scripts --ignore-platform-req=ext-opentelemetry

      - name: Install NPM dependencies
        if: steps.toca.outputs.run == 'true'
        run: npm ci


      - name: Install Playwright (só chromium)
        if: steps.toca.outputs.run == 'true'
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium

      - name: Setup Laravel
        if: steps.toca.outputs.run == 'true'
        run: bash scripts/tests/visreg-ci-setup.sh laravel

      - name: Seed demo tenant
        if: steps.toca.outputs.run == 'true'
        run: bash scripts/tests/visreg-ci-setup.sh seed

      - name: Build Inertia bundles
        if: steps.toca.outputs.run == 'true'
        run: npm run build:inertia

      - name: Sonda + teste da sonda (partes puras e CLI de fora)
        if: steps.toca.outputs.run == 'true'
        run: |
          node scripts/design/tema-escuro-probe.mjs --selftest
          node scripts/design/tema-escuro-probe.test.mjs

      # Este step decide o job: pest_rc≠0 é tela que não renderizou ou não escureceu (ambiente);
      # sonda_rc=2 é NÃO MEDI; sonda_rc=1 é superfície clara acima da baseline. Nenhum é verde.
      - name: Tema escuro · Pages de produção vs baseline
        if: steps.toca.outputs.run == 'true'
        run: |
          set -uo pipefail
          ./vendor/bin/pest tests/Browser/TemaEscuro/TemaEscuroProducaoTest.php; pest_rc=$?
          node scripts/design/tema-escuro-probe.mjs --producao storage/tema-escuro --catraca --json storage/tema-escuro-veredito.json | tee /tmp/tema-escuro-producao.txt; sonda_rc=${PIPESTATUS[0]}
          {
            echo "## Tema escuro — Pages de produção vs baseline (pest_rc=$pest_rc · sonda_rc=$sonda_rc)"
            echo ""
            echo '```'
            cat /tmp/tema-escuro-producao.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$sonda_rc" -eq 0 ] && [ "$pest_rc" -eq 0 ]

      - name: Upload tema escuro · produção (registros + veredito)
        if: always() && steps.toca.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tema-escuro-producao-${{ github.run_id }}
          path: |
            storage/tema-escuro/
            storage/tema-escuro-veredito.json
          if-no-files-found: warn
          retention-days: 14
