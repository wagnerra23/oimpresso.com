# Sentinela de drift git ↔ espelho vivo do Design System (P3 · ADR 0328).
# ADVISORY no branch protection, mas o job publica vermelho real quando encontra drift.
# Compara os tokens do git (_generated-*.css) contra o snapshot do DS sem baseline de dívida.
name: ds-mirror-drift (advisory)

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    paths:
      - 'resources/css/tokens/**'
      - 'scripts/design-sync/**'
      - 'scripts/governance/ds-mirror-drift.mjs'
      - '.github/workflows/ds-mirror-drift.yml'
  workflow_dispatch:

concurrency:
  group: ds-mirror-drift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sentinela de drift (zero divergência; sem baseline)
        run: node scripts/governance/ds-mirror-drift.mjs --enforce
