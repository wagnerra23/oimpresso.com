name: Estoque · Pest (MySQL)

# Lane dedicado pra rodar a suíte Pest de MOVIMENTAÇÃO DE ESTOQUE contra MySQL REAL
# + seed mínimo (biz=1 + biz=2 — via .github/actions/pest-mysql-setup).
#
# POR QUE existe: as demais lanes (ci.yml / modules-pest.yml) rodam SQLite :memory: SEM
# migrate — e os testes de estoque precisam do schema UltimatePOS completo (products,
# variations, variation_location_details, business_locations) + business semeado. Lá eles
# dariam SKIP (falsa cobertura). Aqui a `EstoqueFixture` MONTA o grafo e os testes ASSERTAM
# o delta de `qty_available` de verdade (pedido Wagner 2026-07-02: "todo teste de estoque
# skipa e mente").
#
# Usa o SCHEMA BASELINE (database/schema/mysql-schema.sql). `migrate` carrega o schema final
# num passo + roda só as migrations novas → sem fresh-install (FK ordering) das migrations legacy.
#
# CATRACA (allowlist verde): a lane roda só os arquivos comprovadamente verdes. Cada PR de
# cobertura adiciona arquivos AQUI (ratchet up). Modelado em .github/workflows/financeiro-pest.yml.
#
# 2026-07-15 — ESCOPO ESTENDIDO a `tests/Feature/Produto/**` (mesma doença, mesmo remédio).
# O contrato da tabela de preço (TabelaPrecoContratoTest — CU-PROD-03) precisa de MySQL real +
# DOIS businesses semeados: o UC-PTAB-02 prova isolamento cross-tenant, o que exige biz=1 E biz=2
# (`EstoqueFixture::secondBusinessId()`). Em sqlite ele daria SKIP — "skipa e mente" de novo.
# Não é lane nova de propósito: Produto e Estoque são o mesmo grafo (a `EstoqueFixture` LITERALMENTE
# cria products+variations, e esta lane já disparava em `app/Utils/ProductUtil.php`). Somar arquivo
# aqui custa 0 contexto de CI novo, numa fase em que as ADRs 0271/0314 estão PODANDO gates.
# Se o Produto crescer a ponto de merecer lane própria, vira `produto-pest.yml` — é um rename.
#
# 2026-07-17 — +`CadastroProdutoContratoTest` (CU-PROD-01/07 — US-PROD-020, 2ª tela do trio).
# 2026-07-21 — +`StockHistoryContratoTest` (CU-PROD-11 — Kardex real, trio StockHistory). Usa
#   DatabaseTransactions (não RefreshDatabase — não dropa o schema/seed) + saleWithLine da fixture.
# Mesmo motivo do anterior: o UC-PCAD-05/06 provam isolamento cross-tenant (precisa de biz=1 E
# biz=2 via `EstoqueFixture::secondBusinessId()`) e o UC-PCAD-04 assere `default_purchase_price`
# na `variations` (precisa do schema real). Em sqlite dariam SKIP — "skipa e mente" de novo.
#
# 2026-07-24 — +`ProdutoEditContratoTest` e +`ProdutoEditPayloadContratoTest` (trio Produto/Edit).
#   O `ProdutoEditContratoTest` nasceu em 2026-07-24 e estava **fora de lane nenhuma** — o
#   `anchor-lint` reportava exatamente isso ("teste-que-cobre fora das lanes de JUnit → verde
#   impossível"). Teste que não roda é cobertura falsa; entra aqui.
#   O `ProdutoEditPayloadContratoTest` é failing-first (UC-PEDIT-05/06/07): prova o contrato do
#   PAYLOAD do `PUT /products/{id}` — a tela React manda 18 chaves, o `update()` lê 33+, e o writer
#   trata ausência como zero (`enable_stock`, `not_for_selling`, `enable_sr_no`). Precisa de MySQL
#   real: os asserts leem colunas do `products` depois do PUT; em sqlite dariam SKIP.
#   ⚠️ Eixo ESTOQUE → REGRA MESTRE: o teste PROVA, mas o fix é decisão [W] (2 caminhos + tabela
#   antes→depois). Vermelho aqui é o achado, não bug de teste.
#
# 2026-07-26 — +`ProdutoShowContratoTest` (trio Produto/Show, UC-PSHOW-01/02/03/06). Failing-first:
#   caracteriza a FICHA (`GET /products/{id}` → `Produto/Show`) contra as 3 fontes — o Blade
#   `view-modal` gateia custo por `@can('view_purchase_price')` e o Delphi faz o campo SUMIR
#   (AR-PROD-015), enquanto o branch Inertia do `show()` só consulta `product.view/update/delete`.
#   Precisa de MySQL real: lê props deferidas (partial reload) + insere `product_racks` + exige o
#   2º business pro cross-tenant; em sqlite daria SKIP ("skipa e mente").
#
# 2026-07-26 — +`ProdutoIndexContratoTest` (trio Produto/Index, UC-PIDX-01..06). Failing-first:
#   caracteriza a LISTA (`GET /products` → `Produto/Index`) contra as 3 fontes. Aqui a Blade legada
#   é o OUTRO BRANCH DO MESMO MÉTODO `index()` — o branch DataTables gateia preço/custo com
#   `@can` (index.blade.php:287,294) e pagina server-side; o branch Inertia não consulta permissão
#   de preço nenhuma e corta em `limit(200)` sem paginação.
#   Precisa de MySQL real: lê props deferidas (partial reload), insere lote de 206 produtos pro
#   caso de alcance e exige o 2º business pro cross-tenant; em sqlite daria SKIP ("skipa e mente").
#
# 2026-07-26 — +`ProdutoBulkEditContratoTest` (trio Produto/BulkEdit, UC-PBULK-01..06 — a ÚLTIMA
#   tela do módulo sem casos.md). Failing-first: caracteriza a EDIÇÃO EM MASSA
#   (`POST /products/bulk-edit` → matriz; `POST /products/bulk-update` → writer) contra as 3 fontes.
#   Aqui a Blade legada é o OUTRO BRANCH do mesmo `bulkEdit()` — e é ela que define o payload REAL
#   (5 campos numéricos por variação + `group_prices`), enquanto a tela React manda 2.
#   Precisa de MySQL real: escreve e RELÊ `variations`/`variation_group_prices` (decimal 22,4),
#   exige o 2º business pros dois eixos de cross-tenant (produto E tabela de preço) e usa payload
#   pt-BR pra provar o `num_uf`; em sqlite daria SKIP ("skipa e mente").
#   ⚠️ Eixo VALOR → REGRA MESTRE: o teste PROVA, o fix é decisão [W] (2 caminhos + antes→depois).
#
# 2026-07-27 — +4 contratos de FLUXO SEM TELA REACT do módulo Produto (as 4 lacunas que
#   sobraram no `_STATUS-GENERATED.md` depois que as 7 telas ganharam trio). Decisão [W]
#   2026-07-26: *"1 e 2 são requeridos sim. tem que ter tudo do blade"* — o contrato não é só
#   do React. Os casos moram em `memory/requisitos/Produto/_telas/*.casos.md` (2ª casa lida
#   pelo `requisitos-status.mjs`), porque o `casos-coverage-guard` varre só `Pages/**`.
#     · `EstoqueInicialContratoTest`        — CU-PROD-04 (UC-PINIC-01..04). `POST /opening-stock/save`,
#       fluxo 100% Blade (varredura contada: 0 telas React informam estoque inicial).
#     · `ProdutoBomContratoTest`            — CU-PROD-05 (UC-PBOM-01..04). API de BOM + `BomResolver`.
#       ⚠️ Entra AQUI porque os testes que pareciam cobrir isso NÃO RODAM: `tests/Feature/Domain/
#       Inventory/{BomResolverTest,ReservarEstoqueBomTest}.php` auto-pulam fora do sqlite e não
#       estão em `.github/ci-sqlite-pest.list` nem em lane nenhuma (varredura contada de
#       `Domain/Inventory` em `.github/`+`scripts/`: 0) → skip-as-pass em todo lugar.
#     · `QuickAddProdutoContratoTest`       — CU-PROD-08 (UC-PQCK-01..04). `POST /products/
#       save_quick_product`, chamado de 10 Blades de venda/compra e de 0 telas React.
#     · `AjusteEstoqueRelatorioContratoTest` — US-PROD-028 (UC-PFIX-02/03). Eixos TENANT e ALCANCE
#       do botão "Fix"; o eixo NUMÉRICO (UC-PFIX-01) segue no `EstoqueFixMismatchNumUfTest`.
#   Todos precisam de MySQL real (schema UltimatePOS + `product_bom` do baseline + 2º business
#   pro cross-tenant); em sqlite dariam SKIP.
#   ⚠️ Eixos ESTOQUE e VALOR → REGRA MESTRE: o teste PROVA, o fix é decisão [W].

on:
  workflow_dispatch: {}
  # always-run (SEM paths) pra ser promovível a required sem deadlock "Expected — waiting"
  # (ADR 0271 onda 2). O custo (MySQL + migrate + Pest) é contido por skip-as-pass interno.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'tests/Feature/Estoque/**'
      - 'tests/Support/EstoqueFixture.php'
      - 'tests/Support/EstoqueProduto.php'
      - 'app/Utils/ProductUtil.php'
      - 'app/Utils/TransactionUtil.php'
      - 'database/schema/mysql-schema.sql'
      - '.github/workflows/estoque-pest.yml'
      - '.github/actions/pest-mysql-setup/**'

concurrency:
  group: estoque-pest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    name: PHP / Pest (Estoque · MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oimpresso_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Detectar mudanças de Estoque (skip-as-pass — ADR 0271 onda 2)
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            est:
              - 'tests/Feature/Estoque/**'
              - 'tests/Feature/Produto/**'
              - 'tests/Support/EstoqueFixture.php'
              - 'tests/Support/EstoqueProduto.php'
              - 'app/Http/Controllers/ProductController.php'
              - 'app/Utils/ProductUtil.php'
              - 'app/Utils/TransactionUtil.php'
              - 'database/schema/mysql-schema.sql'
              - '.github/workflows/estoque-pest.yml'
              - '.github/actions/pest-mysql-setup/**'

      - name: Skip-as-pass (nada de Estoque mudou)
        if: steps.changes.outputs.est == 'false'
        run: echo "✅ Sem mudanças de Estoque — skip-as-pass (required-ready, ADR 0271 onda 2)."

      - name: Setup Pest MySQL (PHP + deps + .env + migrate + seed biz=1/biz=2)
        if: steps.changes.outputs.est == 'true'
        uses: ./.github/actions/pest-mysql-setup

      - name: Stub Vite manifest (Inertia root view sem build do front)
        if: steps.changes.outputs.est == 'true'
        run: |
          mkdir -p public/build-inertia
          cat > public/build-inertia/manifest.json <<'EOF'
          {
            "resources/css/inertia.css": { "file": "assets/inertia.css", "src": "resources/css/inertia.css", "isEntry": true },
            "resources/js/app.tsx": { "file": "assets/app.js", "src": "resources/js/app.tsx", "isEntry": true }
          }
          EOF

      - name: Run Pest (Estoque · MySQL) — ALLOWLIST VERDE (catraca)
        if: steps.changes.outputs.est == 'true'
        # phpunit.xml força sqlite :memory: — exportar DB_CONNECTION=mysql aqui faz rodar
        # no MySQL real semeado (senão os testes SKIPam via EstoqueFixture::schemaReady()).
        # NÃO incluir arquivos com RefreshDatabase/migrate:fresh — dropam o schema e limpam
        # o biz=1 seedado, envenenando os demais.
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_DATABASE: oimpresso_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          mkdir -p test-results
          vendor/bin/pest --no-coverage --colors=always \
            --log-junit test-results/pest-estoque-junit.xml \
            tests/Feature/Estoque/EstoqueMovimentacaoVendaTest.php \
            tests/Feature/Estoque/EstoqueMovimentacaoCompraTest.php \
            tests/Feature/Estoque/EstoqueDevolucaoVendaTest.php \
            tests/Feature/Estoque/EstoqueDevolucaoVestuarioTest.php \
            tests/Feature/Estoque/EstoqueAjusteTest.php \
            tests/Feature/Estoque/EstoqueTransferenciaTest.php \
            tests/Feature/Estoque/EstoqueOpeningStockTest.php \
            tests/Feature/Estoque/EstoqueFabricacaoTest.php \
            tests/Feature/Estoque/EstoqueInvarianteRascunhoTest.php \
            tests/Feature/Estoque/EstoqueInvarianteTransacaoTest.php \
            tests/Feature/Estoque/EstoqueInvarianteEnableStockTest.php \
            tests/Feature/Estoque/EstoqueInvarianteTenantTest.php \
            tests/Feature/Estoque/EstoqueFixMismatchNumUfTest.php \
            tests/Feature/Produto/TabelaPrecoContratoTest.php \
            tests/Feature/Produto/CadastroProdutoContratoTest.php \
            tests/Feature/Produto/StockHistoryContratoTest.php \
            tests/Feature/Produto/ProdutoEditContratoTest.php \
            tests/Feature/Produto/ProdutoEditPayloadContratoTest.php \
            tests/Feature/Produto/ProdutoShowContratoTest.php \
            tests/Feature/Produto/ProdutoIndexContratoTest.php \
            tests/Feature/Produto/ProdutoBulkEditContratoTest.php \
            tests/Feature/Produto/EstoqueInicialContratoTest.php \
            tests/Feature/Produto/ProdutoBomContratoTest.php \
            tests/Feature/Produto/QuickAddProdutoContratoTest.php \
            tests/Feature/Produto/AjusteEstoqueRelatorioContratoTest.php

      # Corpus de assertions (LC-13 · #5003). REPORT-ONLY de propósito: `continue-on-error`
      # porque a lane NÃO pode mudar de veredito por um passo observacional — o summary sai
      # 1/2 em XML ausente/incoerente, e isso é diagnóstico do artefato, não regressão do
      # módulo. Roda sob `!cancelled()` pra somar TAMBÉM run vermelho: é justamente onde
      # "0 assertions" separa "falhou" de "nem rodou". Sem este passo o corpus não existe,
      # e sem corpus não há FP a medir — que é o que mantém o --check-assertions desarmado.
      - name: Summary JUnit (estoque — assertions, corpus do 0-assertions)
        if: ${{ !cancelled() && steps.changes.outputs.est == 'true' }}
        continue-on-error: true
        run: node scripts/tests/junit-summary.mjs test-results/pest-estoque-junit.xml --out test-results/pest-estoque-junit.summary.json
      - name: Upload JUnit (veredito por-UC — casos:results)
        if: ${{ !cancelled() && steps.changes.outputs.est == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pest-estoque-junit
          path: |
            test-results/pest-estoque-junit.xml
            test-results/pest-estoque-junit.summary.json
          retention-days: 14
