name: Ciclo-completo por tela (advisory)

# Catraca do CICLO-DE-TELA (UI-0013): quantas telas roteadas têm o conjunto obrigatório do
# ciclo — charter + Padrão de Tela declarado + pt-conforme (assinatura) + casos.md + ref de
# teste + golden do PT `live` (GOLDEN-LIVE). `completo` só sobe; regressão bloqueia (perdeu
# peça do ciclo). Advisory (ADR 0314/0271 — required = só Tier-0; cobertura de ciclo é quality);
# nunca bloqueia merge. Fix = nascer a tela com `node scripts/governance/criar-tela.mjs` (conjunto
# completo por construção) + `--json` pra subir o piso. A "máquina de nascimento de tela" (Wagner
# 2026-07-11: "fazer na mão é sorteio").
#
# ITEM 7 — ALCANCE (adicionado em 2026-08-25): a tela existe E o humano CHEGA nela
# (rota nomeada → permission → entrada de menu → pacote). Nasceu do caso `/arquivos`:
# trio no main, rota registrada, 26 testes verdes, e o `modifyAdminMenu()` do módulo era
# NO-OP — ninguém chegava na tela pelo sidebar, e gate nenhum reclamou (pego a olho pelo
# [W] no smoke). Corrigido no PR #6245, hoje o golden das 3 camadas de habilitação.
# Escopo forward-only: só a tela cujo charter declara o bloco `alcance:` (carimbado pelo
# criar-tela.mjs desde a emenda A, PR #6254). Severidade por `status:` do charter —
# `draft` avisa, `live` derruba o passo. A prova de RUNTIME (Laravel bootado) mora no
# Pest irmão tests/Feature/Sidebar/Biz4RotaLivreSidebarTest.php, ligado na lane sqlite
# do ci.yml via .github/ci-sqlite-pest.list.

on:
  pull_request:
    branches: [main]
    paths:
      - 'resources/js/Pages/**/*.tsx'
      - 'resources/js/Pages/**/*.charter.md'
      - 'resources/js/Pages/**/*.casos.md'
      # DUAS RAÍZES: a tela pode morar no módulo dono (scripts/qa/page-path.mjs).
      # Sem estas, mexer numa tela de módulo não dispara o gate que a mede.
      - 'Modules/*/Resources/js/Pages/**'
      - 'Modules/*/resources/js/Pages/**'
      # ITEM 7 (alcance) — o CÓDIGO SOB TESTE do elo de rota/permission/menu. Sem ele no
      # gatilho, esvaziar um `modifyAdminMenu` (o defeito do /arquivos) não dispararia o
      # gate que existe pra pegar isso: gate mudo com cara de cobertura.
      - 'Modules/*/Routes/*.php'
      - 'routes/*.php'
      - 'Modules/*/Http/Controllers/DataController.php'
      - 'memory/requisitos/_DesignSystem/padroes-tela/**'
      - 'memory/governance/ciclo-completo-baseline.json'
      - 'scripts/governance/ciclo-completo.mjs'
      - 'scripts/governance/pt-conformance.mjs'
      - '.github/workflows/ciclo-completo.yml'
  workflow_dispatch:

concurrency:
  group: ciclo-completo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ciclo-completo:
    name: ciclo-completo (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Selftest do gate (bite/release — anti-fantasma ADR 0256)
        run: node scripts/governance/ciclo-completo.mjs --selftest
      # O `--check` MORDE: exit≠0 derruba o passo (job vermelho e visível). Job segue
      # NÃO-required — não bloqueia o merge. Advisory = "não bloqueia", NUNCA = "não pode
      # ficar vermelho" (proibicoes.md §5, lápide 2026-07-09). O `||` só ENFEITA o erro com
      # a receita de conserto e re-levanta o exit — engolir o status era o gate mudo.
      - name: Catraca do ciclo-de-tela (só sobe)
        run: |
          node scripts/governance/ciclo-completo.mjs --check || {
            echo "::error title=ciclo-completo::Uma tela perdeu peça do ciclo (charter/PT/conforme/casos/teste/golden-live). Nasça a tela com 'node scripts/governance/criar-tela.mjs' + rode '--update-baseline' pra subir o piso."
            exit 1
          }
          echo "✅ ciclo-completo não regrediu."
