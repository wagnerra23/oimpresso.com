name: Ponto · Pest (MySQL)

# Lane dedicada pra rodar a suíte Pest MySQL-only do Modules/Ponto contra MySQL
# REAL + seed mínimo multi-tenant (via .github/actions/pest-mysql-setup — dona dos tenants).
#
# Por que existe: ci.yml e modules-pest.yml rodam SQLite :memory' — e os cross-
# tenant do Ponto (Wave27CrossTenantEscalaTest) dão `w27NeedsMysql()` →
# markTestSkipped lá (falsa cobertura). O floor MySQL só existia na nightly
# diagnóstica CT100 (`ct100-fullsuite`, NUNCA required por design → invisível ao
# PR). Esta lane fecha o gap: o guard Tier 0 (ADR 0093) do Ponto passa a rodar
# de verdade em todo PR que toca Ponto.
#
# Espelha jana-pest.yml (mesma composite action pest-mysql-setup) — HOME do
# ratchet pra TODO teste/trigger MySQL-only do Ponto.
# Refs: ADR 0093 (multi-tenant Tier 0) · ADR 0101 (biz=1 nunca cliente) ·
#       ADR 0271 onda 2 (required-readiness via skip-as-pass) · ADR 0062.

on:
  workflow_dispatch: {}
  # ADR 0271 onda 2 (required-readiness): pull_request SEM paths (always-run) pra
  # ser promovível a required sem deadlock "Expected — waiting". O custo (MySQL +
  # migrate + Pest) é evitado por skip-as-pass interno: dorny/paths-filter detecta
  # se algo do Ponto mudou; se não, pula o pesado e conclui verde. push segue
  # path-filtered (contém custo no main).
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'Modules/Ponto/**'
      - 'resources/js/Pages/Ponto/**'
      - 'app/Concerns/HasBusinessScope.php'
      - 'app/Scopes/ScopeByBusiness.php'
      - 'database/schema/mysql-schema.sql'
      - '.github/workflows/ponto-pest.yml'
      - '.github/actions/pest-mysql-setup/**'

concurrency:
  group: ponto-pest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    name: PHP / Pest (Ponto · MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oimpresso_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Detectar mudanças do Ponto (skip-as-pass — ADR 0271 onda 2)
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ponto:
              - 'Modules/Ponto/**'
              - 'resources/js/Pages/Ponto/**'
              - 'app/Concerns/HasBusinessScope.php'
              - 'app/Scopes/ScopeByBusiness.php'
              - 'database/schema/mysql-schema.sql'
              - '.github/workflows/ponto-pest.yml'
              - '.github/actions/pest-mysql-setup/**'

      - name: Skip-as-pass (nada do Ponto mudou)
        if: steps.changes.outputs.ponto == 'false'
        run: echo "✅ Sem mudanças no Modules/Ponto — skip-as-pass (required-ready, ADR 0271 onda 2)."

      # Setup canônico reusável (composite action). O service container MySQL fica
      # DECLARADO ACIMA no job (composite action não pode declarar services).
      - name: Setup Pest MySQL (PHP + deps + .env + migrate + seed mínimo multi-tenant)
        if: steps.changes.outputs.ponto == 'true'
        uses: ./.github/actions/pest-mysql-setup

      - name: Stub Vite manifest (Inertia root view sem build do front)
        if: steps.changes.outputs.ponto == 'true'
        run: |
          mkdir -p public/build-inertia
          cat > public/build-inertia/manifest.json <<'EOF'
          {
            "resources/css/inertia.css": { "file": "assets/inertia.css", "src": "resources/css/inertia.css", "isEntry": true },
            "resources/js/app.tsx": { "file": "assets/app.js", "src": "resources/js/app.tsx", "isEntry": true }
          }
          EOF

      - name: Run Pest (Ponto · MySQL) — ALLOWLIST VERDE (catraca)
        if: steps.changes.outputs.ponto == 'true'
        # phpunit.xml força DB_CONNECTION=sqlite :memory: — se não sobrescrever, os
        # testes MySQL-only (w27NeedsMysql) SKIPam (a falsa cobertura). Exportar
        # aqui faz rodar no MySQL real semeado.
        #
        # ── RATCHET UP 2026-08-24 — os 9 que faltavam, CONSERTADOS ─────────────────
        # Os 9 arquivos que sobraram fora da lane em 2026-08-23 eram os que REPROVAVAM.
        # Rodados no CT100, as 16 falhas agrupavam em SEIS causas, nenhuma delas do
        # produto — todas de teste que envelheceu fora de lane, sem ninguem ver:
        #
        #   1. prop DEFERIDA assertada como eager (Dashboard/BancoHoras/Aprovacao):
        #      `Inertia::defer` NAO entrega no primeiro render; era o oposto do canon.
        #      O DashboardDeferredContractTest PROVAVA o defer e passava ao lado.
        #   2. modulo renomeado PontoWr2 -> Ponto (module.json), teste no nome antigo.
        #   3. README movido pro memory/requisitos pelo PR #5548, path nao seguiu.
        #   4. `toHaveKey(chave, msg)` — o 2o argumento e o VALOR esperado, nao mensagem.
        #   5. helper devolvia stdClass: o teste de append-only da Portaria 671/2021
        #      chamava ->update() num stdClass e NUNCA tocava o guard que diz exercer.
        #   6. `/modulos` dando 403 pra admin-de-negocio e a REGRA (decisao D2 2026-08-19),
        #      nao defeito — o teste codificava o furo que a D2 fechou. Foi invertido.
        #
        # Depois dos consertos: 2 skipped, 81 passed (291 assertions) — 16 vermelhos -> 0.
        # Os 2 skips eram fixture biz=99 ausente no CrossTenantMarcacaoTest; o helper
        # passou a CRIAR o tenant ficticio (padrao do Wave27) e agora sao 5 passed / 0 skip.

        # ── RATCHET UP 2026-08-23 — 16 arquivos, medidos antes de entrar ────────────
        # O test-lane-coverage mediu 25 arquivos do Ponto FORA de qualquer lane. Rodei
        # os 25 no CT100 (MySQL real): 173 passed · 16 failed · 2 skipped (518 assertions).
        # Entram aqui os que deram VERDE INTEIRO — 0 fail E 0 skip E assertions > 0.
        # Skip nao conta como verde (LC-13: zero-failed sem assercao nao prova execucao).
        #
        # DOIS deles so ficaram verdes porque foram CONSERTADOS neste mesmo PR:
        #   MultiTenantIsolationTest  — era 1 pass / 1 fail / 1 skip
        #   SpatiePermissionsTest     — era 0 pass / 2 fail / ZERO assertions
        # Causa unica: a annotation dataProvider em doc-comment, REMOVIDA no PHPUnit 12 (repo em
        # 12.5.23) — o metodo era chamado com 0 argumentos e morria em ArgumentCountError.
        # Depois de trocar pelo atributo: 22 passed (28 assertions). Vinte casos que nunca
        # tinham executado, incluindo a varredura das 10 rotas do Ponto contra 5xx.
        #
        # ⚠️ CT100 != CI (proibicoes.md §Ambiente): la o banco PERSISTE entre runs, aqui
        # cada run semeia do zero. Verde no CT100 e CANDIDATURA, nao veredito — quem decide
        # e esta lane. Se algum destes avermelhar, ele SAI daqui e o vermelho vira achado.
        #
        # NAO entraram (medidos, e o vermelho e o ACHADO — correcao e decisao [W]):
        #   AprovacaoTest 1F · BancoHorasTest 1F · DashboardTest 1F · ModuleManagerTest 4F
        #   MultiTenantAppendOnlyTest 2F · ObservabilityTest 1F · TelasNavegacaoTest 1F
        #   Wave26SaturationTest 2F · CrossTenantMarcacaoTest (2 SKIP — fixture biz=99)
        # DashboardTest merece nota: ele exige a prop kpis no payload inicial enquanto o irmao
        # DashboardDeferredContractTest prova que a prop e DEFERIDA. Os dois no mesmo
        # modulo, contradizendo-se. Isso e achado de PRODUTO, nao de lane.
        # CATRACA: a lane roda só os arquivos comprovadamente verdes (MySQL-only do
        # Ponto). Cada novo teste MySQL-only do Ponto é adicionado AQUI (ratchet up).
        # NÃO incluir arquivos com RefreshDatabase/migrate:fresh — eles dropam o
        # schema (FK) e LIMPAM o biz=1 seedado, envenenando os demais.
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_DATABASE: oimpresso_test
          DB_USERNAME: root
          DB_PASSWORD: root
        #
        # Trio SDD (chip S3 da Onda 1 do passo 5 — agent `sdd-from-source`, ADR 0351):
        # os 3 *ContratoTest citam os UC dos `*.casos.md` do módulo (G-2 do casos-gate).
        # Entram aqui porque teste fora da allowlist é "verde impossível" — existe e
        # nunca roda por PR (achado #7 do piloto Produto).
        #
        # ⚠️ QUATRO UC nascem FAILING-FIRST por desenho, denunciando regressão medida:
        #   UC-ESPSH-01  → SDD §9 D-1 (espelho lê `tem_divergencia`, campo inexistente)
        #   UC-IMPSH-04  → SDD §9 D-8 (importação lê `linhas_criadas`, campo inexistente)
        #   UC-ESCF-01  → 3ª instância do MESMO padrão, achada em 2026-08-02 pela
        #                    varredura que o SDD §10 Onda 1 pediu: EscalaController@edit lê
        #                    `entrada`/`saida`/`almoco_inicio`/`almoco_fim`; as colunas são
        #                    `hora_*` e não há accessor → a tela de edição de escala mostra
        #                    TODOS os horários vazios, sempre.
        #   UC-ESCF-02     → `EscalaController@update(Request $request)` chama
        #                    `$request->validated()`, que só existe em FormRequest → salvar
        #                    a edição de uma escala lança BadMethodCallException.
        #                    ✅ CONFIRMADO pela lane na run 30779959209: reprovou com a
        #                    mensagem do assert (o nome novo não foi gravado).
        #   UC-INTCRE-01   → `business_id` nunca é atribuído no caminho de criação de
        #                    intercorrência (FormRequest não declara a chave · Service seta
        #                    só codigo/solicitante_id/estado · `creating` só gera UUID ·
        #                    trait só adiciona scope de LEITURA · 0 `observe()` no módulo).
        #                    Coluna NOT NULL + FK, sem default → registrar NÃO grava.
        # Vermelho neles é o ACHADO, não defeito do teste. Correção é decisão [W].
        #
        # Enforcement: quem responde é governance/required-checks-baseline.json — não
        # este comentário (§5 2026-07-16: artefato não afirma o próprio enforcement em
        # tempo presente, porque apodrece no primeiro flip; foi o que aconteceu aqui).
        # Fato datado: esta lane NASCEU advisory em 2026-07-17 e foi promovida a required
        # em 2026-08-05 (ADR 0369, emenda 0314 — required 34→37). O texto anterior seguia
        # dizendo "a lane é ADVISORY … sem bloquear merge", falso desde a promoção.
        #
        # ModuleSpecBranchPresenceTest: guarda a presença-em-branch do `module:specs`
        # contra afirmar ❌ quando a branch sumiu (o que apagaria o único registro de 6
        # módulos). Não toca DB nem usa RefreshDatabase. Afirma a INVARIANTE `null` ⟺
        # branch ausente, então passa tanto aqui (checkout raso: nenhuma histórica) quanto
        # local (onde `origin/3.7-com-nfe` existe e é medida de verdade).
        # O irmão `ModuleManagerTest.php` segue FORA: ele testa `PontoWr2`, renomeado pra
        # `Ponto`, e entraria vermelho por dívida pré-existente — conserto é chip à parte.
        #
        # B7-cobertura (2026-08-02): `BancoHorasIndexContratoTest` entra escrito em Pest
        # `it()` com o UC no TÍTULO — os 3 *ContratoTest acima tinham o UC em DOCBLOCK e
        # por isso não chegavam ao manifesto G-7 (`casos-results-collect` lê o `name` do
        # `<testcase>`; método PHP não aceita hífen). Rodavam verdes valendo 0 no painel.
        # Conversão deles é oportunística, não varredura em lote.
        #
        # 2026-08-28: `EspelhoContratoTest` convertido pra Pest `it()` — os 8 UC dele
        # (UC-ESPSH-01..05 · UC-ESPIDX-01..03) saíram do `⛓` do `casos:report`, medido
        # 18→10 no bloco Ponto. Seguem em DOCBLOCK, de propósito, `JornadaWorkflowContratoTest`
        # e `BancoHorasImportacaoContratoTest`: varrer em lote acorda gate diff-aware sobre
        # dívida alheia (proibicoes §5 2026-07-12).
        #
        # ImportacaoShowContratoTest (2026-09-04): arquivo NOVO só pro `UC-IMPSH-05` — o
        # último item aberto da DoD da US-PONTO-012. Medido antes de escrever: das 4
        # instâncias de atributo fantasma da US, TRÊS já estão provadas verdes no manifesto
        # por-UC (UC-ESPSH-01 · UC-ESCF-01 · UC-IMPIDX-03 = `verdict: pass`), e o
        # `erro_mensagem` do `show` era a única sem teste nenhum — `git grep UC-IMPSH-05`
        # devolvia 3 arquivos, ZERO de teste. Nasce aqui e não dentro do
        # `BancoHorasImportacaoContratoTest` (dono dos UC-IMPSH-01..04) porque aquele é
        # classe PHPUnit com o UC em docblock: o `name` do `<testcase>` sai
        # `uc_impshow_04_…`, sem hífen, e nunca chega ao manifesto do G-7 — é exatamente
        # por isso que os 4 aparecem no `⛓` do `casos:report`. Escrever o 05 lá herdaria o
        # defeito; convertê-lo é a dívida alheia que o parágrafo acima adia de propósito.
        #
        # PontoDashboardContratoTest (2026-08-23): trio da tela `Ponto/Dashboard/Index`
        # (contrato `ponto-painel`, UC-PAINEL-01..06), landado pelo #6154. Aquele PR
        # escreveu o trio mas NÃO pôde ligá-lo aqui — editar este arquivo estava fora do
        # prefixo dele, e o próprio casos.md registra a pendência. Sem esta linha o teste
        # é "verde impossível": existe em main e nunca roda por PR. É só isso que este PR
        # acrescenta ao #6154.
        # Recibo de que ele passa (medição do #6154, não afirmação): 6 passed · 76
        # assertions · 0 skipped no CT 100, mais bite-test do guard Tier 0 — com o filtro
        # `business_id` removido de `buildAprovacoes`, SÓ o UC-PAINEL-02 reprovou.
        # ColaboradorContratoTest (2026-09-04): trio das telas `Ponto/Colaboradores/Index` e
        # `.../Edit` (UC-COLIDX-01..02 · UC-COLEDT-01..02). Entra junto com o casos.md porque
        # teste fora desta lista é "verde impossível" — existe em main e nunca roda por PR.
        # Recibo (medição no CT 100, container oimpresso-staging · MySQL real, NÃO afirmação):
        # 4 passed · 15 assertions · 0 skipped. Bite-test com a defesa removida (o
        # `use HasBusinessScope;` do model comentado): 2 failed — exatamente os dois UC `[T0]`,
        # UC-COLIDX-01 e UC-COLEDT-01; os outros 2 seguiram verdes, como esperado.
        # ⚠️ O bite-test pegou um defeito NO PRÓPRIO TESTE antes de pegar o do produto: a 1ª
        # versão usava `expect($html)->not->toContain($needle, $mensagem)`, e o `toContain` do
        # Pest recebe MÚLTIPLOS needles — a mensagem virava 2º needle e o `not` passava sempre.
        # É a classe do §5 de proibicoes.md (2026-07-28). Trocado por
        # `assertStringNotContainsString`, que recebe a mensagem como 3º parâmetro.
        # ConfiguracaoContratoTest (2026-09-04): trio das telas `Ponto/Configuracoes/Index` e
        # `.../Reps` (UC-CFGIDX-01 · UC-CFGREP-01..02). Recibo no CT 100: 3 passed · 14
        # assertions · 0 skipped.
        # O UC-CFGIDX-01 nasce de um ACHADO Tier 0 medido com sonda antes de existir teste: o
        # `@index` mandava `config('pontowr2')` INTEIRO como prop Inertia — 14 blocos, incluindo
        # `rep.certificado_icp_pass`, a senha do certificado ICP-Brasil. Prop Inertia viaja no HTML
        # servido ao browser, então a senha saía na resposta (200) pra qualquer `ponto.access`.
        # O conserto (allowlist de 4 blocos + `Arr::except` das 2 chaves de certificado) entra no
        # MESMO PR, pra o UC nascer verde em vez de avermelhar esta lane. Bite-test com o
        # controller revertido ao de main: 1 failed, exatamente o UC-CFGIDX-01.
        # EscalaIndexContratoTest + WelcomeContratoTest (2026-09-04): fecham as 2 últimas das 6
        # telas do Ponto que tinham charter e nenhum casos.md — o trio do módulo vai a 21/21.
        # UC-ESCIDX-01..02 e UC-PWEL-01. Recibo no CT 100: 3 passed · 9 assertions · 0 skipped.
        # Bite-tests (cada mutação rodada isolada, com restauração conferida por `git status`):
        #   · `withCount('turnos')` removido do @index      → UC-ESCIDX-02 failed
        #   · prop de domínio no `Inertia::render` do hub   → UC-PWEL-01  failed
        #   · SÓ o trait removido do model Escala           → UC-ESCIDX-01 PASSOU (defesa dupla)
        #   · trait + `where('business_id')` removidos      → UC-ESCIDX-01 failed
        # Os dois últimos são o achado honesto sobre o alcance do caso, e estão escritos no
        # casos.md: onde a defesa é dupla, o caso só morde quando AS DUAS caem.
        # ⚠️ Os 2 testes de Dashboard PRÉ-EXISTENTES (DashboardTest ·
        # DashboardDeferredContractTest) seguem FORA, e de propósito: `DashboardTest`
        # afirma 6 chaves de KPI com assertEqualsCanonicalizing e o Controller passou a
        # devolver 7 (`divergencias_mes` entrou no #6114), logo entraria vermelho por
        # dívida pré-existente — medido 2026-08-23, nunca executado por lane nenhuma
        # (`modules-pest.yml` não cobre Ponto). Conserto é chip à parte, mesma política
        # do `ModuleManagerTest`.
        run: |
          mkdir -p test-results
          vendor/bin/pest --no-coverage --colors=always \
            --log-junit test-results/pest-ponto-junit.xml \
            Modules/Ponto/Tests/Feature/Wave27CrossTenantEscalaTest.php \
            Modules/Ponto/Tests/Feature/EspelhoContratoTest.php \
            Modules/Ponto/Tests/Feature/JornadaWorkflowContratoTest.php \
            Modules/Ponto/Tests/Feature/BancoHorasImportacaoContratoTest.php \
            Modules/Ponto/Tests/Feature/BancoHorasIndexContratoTest.php \
            Modules/Ponto/Tests/Feature/EscalaFormContratoTest.php \
            Modules/Ponto/Tests/Feature/RelatorioCatalogoContratoTest.php \
            Modules/Ponto/Tests/Feature/ImportacaoIndexContratoTest.php \
            Modules/Ponto/Tests/Feature/ImportacaoCreateContratoTest.php \
            Modules/Ponto/Tests/Feature/ImportacaoShowContratoTest.php \
            Modules/Ponto/Tests/Feature/IntercorrenciaContratoTest.php \
            Modules/Ponto/Tests/Feature/IntercorrenciaEditContratoTest.php \
            Modules/Ponto/Tests/Feature/PontoDashboardContratoTest.php \
            Modules/Ponto/Tests/Feature/ColaboradorContratoTest.php \
            Modules/Ponto/Tests/Feature/ConfiguracaoContratoTest.php \
            Modules/Ponto/Tests/Feature/EscalaIndexContratoTest.php \
            Modules/Ponto/Tests/Feature/WelcomeContratoTest.php \
            Modules/Ponto/Tests/Feature/CustomerJourneyTest.php \
            Modules/Ponto/Tests/Feature/DashboardDeferredContractTest.php \
            Modules/Ponto/Tests/Feature/EspelhoTest.php \
            Modules/Ponto/Tests/Feature/ImportacaoTest.php \
            Modules/Ponto/Tests/Feature/IntercorrenciaAIClassifierTest.php \
            Modules/Ponto/Tests/Feature/MarcacaoServiceTest.php \
            Modules/Ponto/Tests/Feature/MultiTenantIsolationTest.php \
            Modules/Ponto/Tests/Feature/SpatiePermissionsTest.php \
            Modules/Ponto/Tests/Feature/Wave11LgpdComplianceTest.php \
            Modules/Ponto/Tests/Feature/Wave18BusinessScopeTest.php \
            Modules/Ponto/Tests/Feature/Wave18RetryEscalaTurnoTest.php \
            Modules/Ponto/Tests/Feature/Wave18RetryFormRequestTest.php \
            Modules/Ponto/Tests/Feature/Wave23MarcacaoServiceReuseContractTest.php \
            Modules/Ponto/Tests/Feature/Wave25SaturationTest.php \
            Modules/Ponto/Tests/Feature/Wave28MobileMarcacaoTest.php \
            Modules/Ponto/Tests/Feature/Wave28SaturationTest.php \
            Modules/Ponto/Tests/Feature/AprovacaoTest.php \
            Modules/Ponto/Tests/Feature/BancoHorasTest.php \
            Modules/Ponto/Tests/Feature/CrossTenantMarcacaoTest.php \
            Modules/Ponto/Tests/Feature/DashboardTest.php \
            Modules/Ponto/Tests/Feature/ModuleManagerTest.php \
            Modules/Ponto/Tests/Feature/MultiTenantAppendOnlyTest.php \
            Modules/Ponto/Tests/Feature/ObservabilityTest.php \
            Modules/Ponto/Tests/Feature/TelasNavegacaoTest.php \
            Modules/Ponto/Tests/Feature/Wave26SaturationTest.php \
            Modules/Ponto/Tests/Feature/ModuleSpecBranchPresenceTest.php


      # Passo 1 do plano da LC-13 (Gate:): a lane JA emitia JUnit e NINGUEM lia.
      # O sumario conta `assertions` por arquivo — e o corpus que falta pra medir
      # o FP do --check-assertions ANTES de arma-lo. Aqui so REPORTA (if: always()).
      - name: Sumario JUnit por arquivo (junit-summary.mjs — corpus p/ LC-13)
        if: always()
        run: node scripts/tests/junit-summary.mjs test-results/pest-ponto-junit.xml --out test-results/pest-ponto-junit-summary.json || true
      # ── PASSO 3 do plano do LC-13 — ARMADO (flip [W] 2026-08-16) ─────────────────
      # Guardado pela MESMA condicao do run de Pest, NUNCA pelo `if: always()` do step
      # de corpus acima: la o step roda ate quando o skip-as-pass (ADR 0271 onda 2)
      # impediu o Pest e o XML nem existe — armar ali ficaria vermelho em todo PR que
      # nao toca o modulo. Medido 2026-08-16; e a razao de isto ser um step PROPRIO e
      # nao um flag no de cima.
      #
      # MORDE quando a lane RODOU e nao provou nada: `0 failed` com 0 assertions e
      # ausencia de EXECUCAO, nao sucesso (LC-13 — "VERDE por NAO-EXECUCAO").
      # Sem `always()`/`!cancelled()`, o `success()` implicito vale: se o Pest falhou,
      # este step e pulado e a lane ja esta vermelha por conta propria (nao duplica).
      - name: Suite provou algo? (--check-assertions · LC-13)
        if: steps.changes.outputs.ponto == 'true'
        run: node scripts/tests/junit-summary.mjs test-results/pest-ponto-junit.xml --check-assertions

      - name: Upload sumario JUnit (pest-ponto-junit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pest-ponto-junit-summary
          path: test-results/pest-ponto-junit-summary.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload JUnit (Ponto · MySQL)
        if: ${{ !cancelled() && steps.changes.outputs.ponto == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pest-ponto-junit
          path: test-results/pest-ponto-junit.xml
          retention-days: 14
