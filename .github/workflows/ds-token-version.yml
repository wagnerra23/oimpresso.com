name: DS token version (advisory)

# Advisory (ADR 0314 — required = só Tier-0; versionar o pacote de tokens é HIGIENE, não
# dinheiro/PII/multi-tenant/fiscal). Roda quando um PR toca a superfície de tokens e AVISA se
# a superfície mudou sem bump de version.json + CHANGELOG.
# Fix = npm run tokens:version:write. O selftest (governance-script-tests.yml) prova que morde.
# (Esta linha dizia "Nunca bloqueia merge (continue-on-error)" — factualmente errado: não há
# `continue-on-error` neste arquivo, e afirmar o próprio enforcement em presente é a família
# LC-10, §5 2026-07-16. Quem é required no vivo: governance/required-checks-baseline.json.)

on:
  pull_request:
    branches: [main]
    paths:
      - 'resources/css/tokens/**'
      - 'scripts/design-sync/ds-token-version.mjs'
      - '.github/workflows/ds-token-version.yml'
  workflow_dispatch:

concurrency:
  group: ds-token-version-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version-check:
    name: ds-token-version (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Tokens são build inputs rastreados (ver .gitignore) — não precisa buildar; o script
      # lê os _generated-*.css do repo direto.
      # O `--check` MORDE: exit≠0 derruba o passo (job vermelho e visível). Job segue
      # NÃO-required — não bloqueia o merge. Advisory = "não bloqueia", NUNCA = "não pode
      # ficar vermelho" (proibicoes.md §5, lápide 2026-07-09). O `||` só ENFEITA o erro com
      # a receita de conserto e re-levanta o exit — engolir o status era o gate mudo.
      - name: Versão do pacote de tokens em dia?
        run: |
          node scripts/design-sync/ds-token-version.mjs --check || {
            echo "::error title=DS token version::Superfície de tokens mudou sem bump — rode 'npm run tokens:version:write' e commite version.json + CHANGELOG.md."
            exit 1
          }
          echo "✅ version.json + CHANGELOG em dia com a superfície de tokens."
