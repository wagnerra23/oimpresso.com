name: Forja · Pest (MySQL)

# ATUALIZADO 2026-07-31: o ForjaRoutesSmokeTest e as rotas /forja mudaram-se pro
# Modules/Forja (deprecação do TeamMcp). O paths-filter e o caminho do teste
# acompanharam — sem isso a lane pararia de disparar e o teste que a ADR 0354
# existe pra fazer EXECUTAR voltaria a nunca rodar. Nome do job mantido pra
# não trocar o context de CI no meio da leva; renomear é da etapa final.
#
# Lane dedicada pra rodar contra MySQL REAL os testes do Modules/TeamMcp que a
# lane sqlite (.github/ci-sqlite-pest.list) só consegue PULAR.
#
# POR QUE EXISTE (e por que a lane sqlite não basta): a stack de rotas do
# UltimatePOS — ['web','SetSessionData','auth','language','timezone',
# 'AdminSidebarMenu','CheckUserLogin'] — exige schema MySQL com business/users/
# permissions. Em sqlite :memory: os testes de rota dão markTestSkipped (falsa
# cobertura: o veredito que chega ao manifesto por-UC é `skip`, nunca `pass`).
# Aqui eles EXECUTAM contra o schema baseline migrado + seed biz=1/biz=2.
#
# GAP que motivou (medido em 2026-07-27, contado): `ForjaRoutesSmokeTest` existia
# desde a Onda Forja e NUNCA rodou uma vez — `TeamMcp` não está no matrix do
# modules-pest.yml (que nem emite JUnit) e só 7 dos 26 arquivos de teste do módulo
# estavam na lista sqlite. Rodado à mão no CT 100: 7 failed / 5 passed (rota
# `forja.saude` inexistente + dataset associativo com `it()` de 2 argumentos). O
# happy-path de UC-FORJA-01 (200 + componente Inertia) jamais executou.
#
# ELO COM O G-7 (ADR 0264): o `--log-junit` + artifact abaixo é o transporte que o
# casos-results-publish.yml colhe pra derivar o Status por UC do veredito REAL do
# teste. Sem o artifact aqui, UC-FORJA-01/07 seguiriam valendo 0 por falta de
# carimbo — que é medir cadência de bookkeeping, não qualidade de teste.
#
# Reusa .github/actions/pest-mysql-setup (mesma do financeiro-pest / jana-pest /
# arquivos-pest): PHP 8.4 + deps + .env MySQL + migrate (schema baseline) + seed
# mínimo biz=1 (Tier 0 ADR 0101 — NUNCA biz=4 cliente) + biz=2 cross-tenant.
#
# Refs: ADR 0264 (G-7) · ADR 0271 onda 2 (required-readiness) · ADR 0093/0101.

on:
  workflow_dispatch: {}
  # pull_request SEM paths (always-run) + skip-as-pass interno, igual arquivos-pest:
  # deixa a lane promovível a required no futuro sem deadlock "Expected — waiting".
  # O custo (MySQL + migrate + Pest) só é pago quando algo do TeamMcp muda.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'Modules/Forja/**'
      # O PipelineParidadeTest le a FONTE DE DESIGN. Sem este path, mudar o
      # prototipo em main nao dispara a lane e o gate fica mudo justamente
      # quando a fonte muda — que e o unico momento em que ele importa.
      - 'prototipo-ui/cowork/**'
      - 'database/schema/mysql-schema.sql'
      - '.github/workflows/forja-pest.yml'
      - '.github/actions/pest-mysql-setup/**'

concurrency:
  group: forja-pest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    name: PHP / Pest (Forja · MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oimpresso_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Detectar mudanças do TeamMcp (skip-as-pass — ADR 0271 onda 2)
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            tmcp:
              - 'Modules/Forja/**'
              # 2026-08-21 — a linha da fonte de design estava SÓ no `paths:` do push.
              # O comentário de lá diz "sem este path o gate fica mudo justamente quando
              # a fonte muda" — mas o bloco que decide o skip-as-pass no PR é ESTE.
              # Efeito medido: PR que tocasse só `prototipo-ui/cowork/**` concluía VERDE
              # sem rodar o PipelineParidadeTest, que está no run-set da lane e lê essa
              # fonte. Mesmo defeito das lanes Jana e Estoque na mesma leva.
              - 'prototipo-ui/cowork/**'
              - 'database/schema/mysql-schema.sql'
              - '.github/workflows/forja-pest.yml'
              - '.github/actions/pest-mysql-setup/**'

      - name: Skip-as-pass (nada da Forja mudou)
        if: steps.changes.outputs.tmcp == 'false'
        run: echo "✅ Sem mudanças no Modules/Forja — skip-as-pass (required-ready, ADR 0271 onda 2)."

      # Setup canônico reusável (composite action). O service container MySQL fica
      # DECLARADO ACIMA no job (composite action não pode declarar services).
      - name: Setup Pest MySQL (PHP + deps + .env + migrate + seed mínimo multi-tenant)
        if: steps.changes.outputs.tmcp == 'true'
        uses: ./.github/actions/pest-mysql-setup

      - name: Stub Vite manifest (Inertia root view sem build do front)
        # O happy-path assert `assertInertia(...)` renderiza a root view, que resolve
        # o manifest do Vite. Sem o stub, o teste quebraria por motivo ALHEIO ao
        # contrato (build do front), não por regressão de rota. Mesmo stub do
        # arquivos-pest.yml.
        if: steps.changes.outputs.tmcp == 'true'
        run: |
          mkdir -p public/build-inertia
          cat > public/build-inertia/manifest.json <<'EOF'
          {
            "resources/css/inertia.css": { "file": "assets/inertia.css", "src": "resources/css/inertia.css", "isEntry": true },
            "resources/js/app.tsx": { "file": "assets/app.js", "src": "resources/js/app.tsx", "isEntry": true }
          }
          EOF

      - name: Run Pest (Forja · MySQL) — ALLOWLIST VERDE (catraca)
        if: steps.changes.outputs.tmcp == 'true'
        # phpunit.xml força DB_CONNECTION=sqlite :memory: — sem sobrescrever aqui, os
        # testes de rota SKIPam de novo (a falsa cobertura que esta lane existe pra
        # matar). Exportar faz rodar no MySQL real semeado.
        #
        # CATRACA (mesma disciplina de arquivos-pest.yml): a lane começa com UM
        # arquivo — o único cujo verde foi provado. Cada teste MySQL-only do TeamMcp
        # entra AQUI depois de rodar verde (ratchet up), nunca em lote. Candidatos
        # conhecidos que hoje só SKIPam na lane sqlite: SmokeRoutesTest,
        # TokensListAndRevokeTest, CicloAtivoEndpointTest (este último está VERMELHO
        # em sqlite — 2 QueryException — e precisa de conserto antes de entrar).
        # NÃO incluir arquivos com RefreshDatabase/migrate:fresh — eles dropam o
        # schema (FK) e LIMPAM o biz=1 seedado, envenenando os demais.
        #
        # 2026-08-08 — AprovacoesMesaTest entra FAILING-FIRST, e o desvio é
        # declarado: a catraca acima pede "verde provado antes de entrar", mas
        # rodar Pest local é proibido (Tier 0 ADR 0062 — CT 100/CI só), então o
        # primeiro verde SÓ pode acontecer aqui. Mesmo desenho já assumido em
        # compras-pest.yml ("entra na allowlist SEM ser verde — é FAILING-FIRST
        # por desenho"). Se vermelho, conserta-se antes do merge — o que não se
        # faz é remover da lista pra ficar verde.
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_DATABASE: oimpresso_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          mkdir -p test-results
          vendor/bin/pest --no-coverage --colors=always \
            --log-junit test-results/pest-forja-junit.xml \
            Modules/Forja/Tests/Feature/ForjaRoutesSmokeTest.php \
            Modules/Forja/Tests/Feature/AprovacoesMesaTest.php \
            Modules/Forja/Tests/Feature/TrabalhoListaTest.php \
            Modules/Forja/Tests/Feature/PipelineParidadeTest.php


      # Passo 1 do plano da LC-13 (Gate:): a lane JA emitia JUnit e NINGUEM lia.
      # O sumario conta `assertions` por arquivo — e o corpus que falta pra medir
      # o FP do --check-assertions ANTES de arma-lo. Aqui so REPORTA (if: always()).
      - name: Sumario JUnit por arquivo (junit-summary.mjs — corpus p/ LC-13)
        if: always()
        run: node scripts/tests/junit-summary.mjs test-results/pest-forja-junit.xml --out test-results/pest-forja-junit-summary.json || true
      # ── PASSO 3 do plano do LC-13 — ARMADO (flip [W] 2026-08-16) ─────────────────
      # Guardado pela MESMA condicao do run de Pest, NUNCA pelo `if: always()` do step
      # de corpus acima: la o step roda ate quando o skip-as-pass (ADR 0271 onda 2)
      # impediu o Pest e o XML nem existe — armar ali ficaria vermelho em todo PR que
      # nao toca o modulo. Medido 2026-08-16; e a razao de isto ser um step PROPRIO e
      # nao um flag no de cima.
      #
      # MORDE quando a lane RODOU e nao provou nada: `0 failed` com 0 assertions e
      # ausencia de EXECUCAO, nao sucesso (LC-13 — "VERDE por NAO-EXECUCAO").
      # Sem `always()`/`!cancelled()`, o `success()` implicito vale: se o Pest falhou,
      # este step e pulado e a lane ja esta vermelha por conta propria (nao duplica).
      - name: Suite provou algo? (--check-assertions · LC-13)
        if: steps.changes.outputs.tmcp == 'true'
        run: node scripts/tests/junit-summary.mjs test-results/pest-forja-junit.xml --check-assertions

      - name: Upload sumario JUnit (pest-forja-junit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pest-forja-junit-summary
          path: test-results/pest-forja-junit-summary.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload JUnit (TeamMcp · MySQL)
        if: ${{ !cancelled() && steps.changes.outputs.tmcp == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pest-forja-junit
          path: test-results/pest-forja-junit.xml
          retention-days: 14
