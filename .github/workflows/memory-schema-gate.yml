name: Memory schema gate (ONDA 5 S1)

# ONDA 5 S1 — Schema rígido CI híbrido.
# Workflow A do híbrido (gate PR remark-lint + AJV via npx).
# Gate C complementar = `php artisan jana:validate-memory` — SOB DEMANDA, não agendado.
# (O "cron daily 06:30 BRT" que esta linha afirmava era FALSO: 0 schedules no Kernel e
# 0 lanes de CI; medido 2026-08-11, e já registrado no docblock do comando em 2026-06-20.)
#
# Schemas: scripts/memory-schemas/*.schema.json
# Roteamento (fonte única): scripts/memory-schemas/familias.json — a matriz abaixo é
# cópia CONFERIDA dela; o job `selftest` falha se as duas divergirem.
#
# 2026-05-25 (Wagner "endureça"): mudança de regra — gate valida APENAS
# arquivos modificados/criados no PR vs base (não toda a árvore memory/).
# Strict mode ON por default pra esses. Append-only canon (ADR 0095 +
# Constituição v2 Art. 3) impede edição retroativa de ADRs/handoffs
# aceitos — logo, legacy debt forever fica em estado "ignorado" pelo gate
# (não bloqueia mas também não some). Workflow novo + arquivos novos
# precisam estar válidos.
#
# 2026-06-30 (ADR 0314 F2 · poda onda 2): FUNDIDO com o antigo
# memory-schema-gate-extended.yml (D6 #4) — mesma fonte (validação de schema
# de memory/**). O job `validate` (matrix AJV/frontmatter) + os 3 jobs
# `validate-*-schema` (validate-memory-schema.sh · filename + seções do corpo +
# US-<MOD>-<NNN>) agora vivem num único workflow. TODOS os sub-checks dos 2
# antigos rodam aqui (counterfactual por sub-check provado antes da fusão).
# Nenhum dos check contexts era required (branch protection confirmado) — fusão
# não toca branch protection. memory-schema-gate-extended.yml DELETADO +
# registros sincronizados (gates-registry.json + .memory-health-baseline.json).
#
# Trigger: PR que toca memory/**/*.md OU charter ao lado de Page Inertia OU o
# script validador de schema do corpo.

# ALWAYS-RUN desde 2026-07-17 (ADR 0341 · flip [W]) — o filtro `paths:` FOI REMOVIDO.
# POR QUÊ: `Charter (...)` e `SPEC (...)` viraram REQUIRED. Required + path-scoped =
# DEADLOCK: em PR que não toca o path, o job nem começa, o check NUNCA reporta, e o
# merge fica pendente pra sempre (ADR 0261 Alavanca 2: "always-run > path-scoped
# required"; é a mesma razão do casos-gate.yml, que diz literalmente "tirar o filtro
# paths: é o flip"). O custo de rodar sempre é ~0: o step de validação já é
# skip-as-pass interno — intersecta o glob da matriz com os arquivos MUDADOS e sai
# `[OK] nenhum arquivo NOVO/MODIFICADO bate <pattern>` + exit 0 quando não há nada.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: memory-schema-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # O validador virou script (scripts/memory-schemas/validate.mjs) pra poder ser
  # rodado LOCAL — antes ele só existia dentro do heredoc deste workflow, e a skill
  # `memory-schema-preflight` mandava rodar uma ferramenta que não existia. Script que
  # o CI usa precisa de teste que o CI roda: sem este job, o selftest seria letra morta
  # (é o órfão que o próprio selftest-registry-check caça). Job próprio pra rodar 1×,
  # não 9× pela matriz.
  selftest:
    name: validate.mjs — o validador morde e libera
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps do validador
        run: npm install --no-save ajv@^8.17.1 ajv-formats@^3.0.1 gray-matter@^4.0.3 glob@^11.0.0
      - name: Selftest (fixture ruim = o frontmatter exato que passou no #4798)
        run: node scripts/memory-schemas/validate.mjs --selftest
      # Estes dois têm `--selftest` embutido e MORAM AQUI, não no governance-script-tests:
      # dependem de gray-matter/ajv, e aquele workflow não instala nada de propósito
      # (todos os scripts wirados lá são dependency-free). Era exatamente por isso que
      # eram órfãos — a casa certa é o job que já paga o install.
      - name: doc-id-stamp — o stamper morde e libera
        run: node scripts/governance/doc-id-stamp.mjs --selftest
      - name: resolver-reclamacao — o resolvedor morde e libera
        run: node scripts/governance/resolver-reclamacao.mjs --selftest

  validate:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # ⚠️ Esta matriz é CÓPIA de scripts/memory-schemas/familias.json — não a fonte.
      # Não é derivada porque `strategy.matrix.include` não lê arquivo sem reestruturar
      # o job em outputs+`fromJSON`, e aqui moram 4 contexts REQUIRED (ADR · SPEC ·
      # Charter · Tópico): risco alto, ganho baixo. Em troca ela é CONFERIDA — o job
      # `selftest` compara schema+glob+grace com o JSON e falha na divergência.
      # Mexeu aqui? Mexa no JSON também (e vice-versa), no MESMO PR.
      matrix:
        include:
          - label: ADR (memory/decisions/*.md)
            schema: scripts/memory-schemas/adr.schema.json
            glob: "memory/decisions/[0-9][0-9][0-9][0-9]-*.md"
          - label: SPEC (memory/requisitos/*/SPEC.md)
            schema: scripts/memory-schemas/spec.schema.json
            glob: "memory/requisitos/*/SPEC.md"
          - label: RUNBOOK (memory/requisitos/**/RUNBOOK*.md)
            schema: scripts/memory-schemas/runbook.schema.json
            glob: "memory/requisitos/**/RUNBOOK*.md"
          - label: Session log (memory/sessions/*.md)
            schema: scripts/memory-schemas/session.schema.json
            glob: "memory/sessions/[0-9][0-9][0-9][0-9]-*.md"
          - label: Handoff (memory/handoffs/*.md)
            schema: scripts/memory-schemas/handoff.schema.json
            glob: "memory/handoffs/[0-9][0-9][0-9][0-9]-*.md"
          # ⚠️ NÃO renomear este `label`: ele vira o NOME do check, e este é um required
          # context da branch protection. Renomear faz o required nunca nascer e trava TODO
          # merge do repo (§5 2026-08-08). Trocar o nome exige flip de protection = [W].
          # O glob abaixo cobre as 2 raízes desde o PR #5686 — o rótulo ficou historicamente
          # com o caminho antigo; o dono do escopo é o glob, não o texto do label.
          - label: Charter (resources/js/Pages/**/*.charter.md)
            schema: scripts/memory-schemas/charter.schema.json
            glob: "{resources/js/Pages,Modules/*/[Rr]esources/js/Pages}/**/*.charter.md"
          # 2026-07-12 (proposal estrutura-canon-memoria · Fase 0): as famílias
          # BRIEFING + reference ficam em GRACE (warn-only, diff-aware) — o
          # campo `grace: true` força STRICT=false SÓ pra elas (ver step
          # "Compute strict mode flag"), independente da var global. Motivo:
          # ~143 reference + ~55 BRIEFING legados divergentes. Required só
          # após backfill zerar o FP por família (ADR 0314 — gate novo nasce
          # grace, nunca required de nascença). Reference escopado a
          # memory/reference/*.md (os 5 @imports do CLAUDE.md em memory/*.md
          # ficam FORA — instrução Tier 0 do reference.schema.json).
          # tópico NASCEU grace (2026-07-21, ADR 0345), passou por advisory e
          # chegou a REQUIRED no mesmo dia ([W] "flip", emenda ADR 0346) — ver o
          # bloco da matriz `Tópico` abaixo; NÃO está em grace (sem `grace: true`).
          - label: BRIEFING (memory/requisitos/*/BRIEFING.md) [grace]
            schema: scripts/memory-schemas/briefing.schema.json
            glob: "memory/requisitos/*/BRIEFING.md"
            grace: true
          # 2026-07-21 ([W] "flip", override soberano pós-medição do piloto):
          # tópico PROMOVIDO a REQUIRED (branch protection) — emenda ADR 0346 à
          # 0314. Label renomeado (tirou "[advisory]" — lápide §5 2026-07-16: o
          # nome não declara o próprio enforcement). STRICT (sem grace:true) →
          # tópico malformado BLOQUEIA merge. HONESTIDADE: os critérios objetivos
          # NÃO foram batidos (0 dias soak + 0 mordidas + 3 tópicos só do seed =
          # o anti-padrão foundation-ratchet) — é override [W] consciente, não
          # cumprimento de critério (ADR 0346 registra o desvio). Risco limitado:
          # greenfield (sem legado tópico), schema determinístico zero-FP no seed,
          # diff-aware + forward-only (só morde tópico novo/tocado), reversível.
          # Medição: memory/sessions/2026-07-21-medicao-piloto-topico-flip-grace-required.md.
          - label: Tópico (memory/requisitos/*/topicos/*.md)
            schema: scripts/memory-schemas/topico.schema.json
            glob: "memory/requisitos/*/topicos/*.md"
          - label: Reference (memory/reference/*.md) [grace]
            schema: scripts/memory-schemas/reference.schema.json
            glob: "memory/reference/*.md"
            grace: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 2026-05-25 (Wagner "endureça"): precisa do main pra git diff

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install AJV CLI (validation only — sem deps custos do remark)
        run: |
          npm install --no-save \
            ajv@^8.17.1 \
            ajv-cli@^5.0.0 \
            ajv-formats@^3.0.1 \
            gray-matter@^4.0.3 \
            glob@^11.0.0

      - name: Compute strict mode flag
        id: strict
        run: |
          # 2026-05-25 (Wagner "endureça"): default STRICT=true pra arquivos
          # NOVOS/MODIFICADOS. Override via var JANA_VALIDATE_MEMORY_STRICT=false
          # caso precise emergência (downgrade pra warning).
          STRICT="${{ vars.JANA_VALIDATE_MEMORY_STRICT || 'true' }}"
          # 2026-07-12 (estrutura-canon-memoria · Fase 0): famílias marcadas
          # `grace: true` na matriz (BRIEFING + reference) ficam warn-only
          # SEMPRE, independente da var global — gate novo nasce grace (ADR
          # 0314), required só após backfill FP=0. STRICT=false já aciona o
          # continue-on-error do step de validação + a redação "grace" no
          # comentário do PR (nada de código extra).
          if [ "${{ matrix.grace }}" = "true" ]; then
            STRICT="false"
          fi
          echo "value=$STRICT" >> "$GITHUB_OUTPUT"
          echo "Strict mode: $STRICT (false=warning, true=fail merge)"

      - name: Compute changed files (diff vs base)
        id: changed
        run: |
          # PR: diff vs base (origin/main em geral)
          # Push main: diff vs HEAD~1
          #
          # 2026-08-11 — SEM `--depth` e COM checagem de rc. Os dois consertos são do
          # mesmo defeito: o diff podia FALHAR e virar "0 arquivos" em silêncio.
          #
          # (1) o `--depth=50` ANULAVA o `fetch-depth: 0` do checkout acima. Medido em
          #     clone independente: repo completo (6425 commits) + `git fetch --depth=50`
          #     => shallow=true, 50 alcançáveis. `git fetch --depth` TRUNCA repo completo.
          #     Com o checkout já trazendo tudo, aquele fetch não buscava nada que
          #     faltasse — só encurtava. E era MAIS LENTO: mediana 327ms vs 206ms
          #     (5 amostras, clone fresco + 1º fetch), porque paga o corte de história.
          #     Com o merge-base fora dos 50, `git diff BASE...HEAD` saía rc=128
          #     (`fatal: no merge base`) e o `|| true` engolia.
          # (2) o `|| true` transformava esse erro em string vazia; `echo` criava o
          #     arquivo SEMPRE, então "diff quebrado" e "nada a validar" ficavam
          #     indistinguíveis, e o gate saía verde tendo validado ZERO arquivos.
          #
          # Bite-test (repo sintético, base divergida antes dos últimos 50, handoff
          # com `tldr: "TODO"` COMMITADO no PR — a fixture do #4798):
          #   antes => rc=0, changed-files vazio, handoff INVÁLIDO passa
          #   depois => rc=1, `::error /tldr must NOT have fewer than 10 characters`
          # Controle negativo (merge-base dentro dos 50): idêntico antes e depois.
          #
          # Em produção o falso-verde não chegou a ocorrer — o `actions/checkout` usa o
          # merge ref, então o merge-base é o tip da base (3 runs medidos, distância
          # 0/0/0). Mas isso é propriedade do checkout, não deste step: some se alguém
          # trocar o modo de checkout, o evento, ou o ref. Não dependa dela em silêncio.
          #
          # NADA de `2>/dev/null || true` aqui: diff que falha tem de ficar VERMELHO.
          # `git diff` sai 0 mesmo sem diferença nenhuma — rc≠0 é falha de verdade.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch origin "${{ github.base_ref }}"
            CHANGED=$(git diff --name-only --diff-filter=AM "$BASE...HEAD")
          else
            CHANGED=$(git diff --name-only --diff-filter=AM HEAD~1...HEAD)
          fi
          echo "$CHANGED" > changed-files.txt
          echo "Total changed: $(grep -c . changed-files.txt || true)"

      # 2026-07-26 — o validador SAIU deste heredoc pra scripts/memory-schemas/validate.mjs.
      # POR QUÊ: enquanto ele vivia aqui dentro, era INVOCÁVEL SÓ PELO CI. A skill
      # `memory-schema-preflight` prometia "roda validator local antes de commit pra zerar
      # o loop CI fail" — e não havia comando pra rodar. Mesmo disparando, ela não tinha como
      # cumprir a promessa (chokepoint fantasma, §5 das proibições). Resultado real: o #4798
      # mergeou session log + handoff fora do schema.
      # Agora é UM script: o CI chama, o dev chama, um hook pode chamar. Fonte única —
      # segunda cópia da regra seria a régua paralela que o §5 mata.
      # Comportamento preservado 1:1 (mesmo diff-aware, mesmo warn pra legacy sem
      # frontmatter, mesmo ::error/::warning, mesmo violations.json). Coberto por
      # `--selftest` com fixture boa e ruim — a ruim é o frontmatter exato do #4798.
      - name: Validate frontmatter against schema
        id: validate
        continue-on-error: ${{ steps.strict.outputs.value != 'true' }}
        run: node scripts/memory-schemas/validate.mjs --schema "$SCHEMA" --glob "$GLOB"
        env:
          SCHEMA: ${{ matrix.schema }}
          GLOB: ${{ matrix.glob }}

      - name: Upload violations artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: violations-${{ strategy.job-index }}
          path: violations.json
          if-no-files-found: ignore

      - name: Comment PR with violations
        if: github.event_name == 'pull_request' && steps.validate.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('violations.json')) return;
            const violations = JSON.parse(fs.readFileSync('violations.json', 'utf8'));
            const errors = violations.filter((v) => v.level === 'error');
            if (errors.length === 0) return;
            const strict = '${{ steps.strict.outputs.value }}';
            const label = '${{ matrix.label }}';
            const lines = errors.slice(0, 20).map((v) => `- \`${v.file}\` → ${v.errors.join(' · ')}`);
            const body = [
              `### Memory schema gate — ${label}`,
              '',
              strict === 'true'
                ? `**STRICT mode ligado** (escopo: apenas arquivos novos/modificados deste PR) — ${errors.length} violação(ões) BLOQUEIA merge.`
                : `**Grace period (strict=false)** — ${errors.length} violação(ões) reportada(s) como warning.`,
              '',
              ...lines,
              errors.length > 20 ? `\n_...mais ${errors.length - 20} omitidas (ver job logs)._` : '',
              '',
              `Schema: \`${'${{ matrix.schema }}'}\``,
              '',
              '> 2026-05-25 (Wagner "endureça"): legacy debt em ADRs/handoffs antigos NÃO é re-avaliada pra fix retroativo (append-only canon — ADR 0095 + Constituição Art. 3). Gate valida apenas novos.',
              '',
              'Como corrigir → ver [scripts/memory-schemas/README.md](../tree/${{ github.head_ref }}/scripts/memory-schemas/README.md).',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  # ── Sub-checks do corpo markdown (ex-memory-schema-gate-extended.yml · D6 #4) ──
  # validate-memory-schema.sh valida schema RÍGIDO de conteúdo (não só frontmatter):
  #   - filename regex (YYYY-MM-DD-<slug>.md session, YYYY-MM-DD-HHMM-<slug>.md handoff)
  #   - seções obrigatórias do CORPO markdown
  #   - lista US no formato US-<MOD>-<NNN>
  #   - seção "Estado MCP no momento do fechamento" em handoffs (ADR 0130 §6)
  # Override: linha `<!-- schema-allowlist: <razão> -->` no arquivo pula validação.

  validate-spec-schema:
    name: Schema SPEC.md (frontmatter + seções)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python (PyYAML pra parse frontmatter)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Detectar SPEC.md modificados
        id: changed
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          FILES="$(git diff --name-only --diff-filter=AM "${BASE}" "${HEAD}" -- 'memory/requisitos/**/SPEC.md' || true)"
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if [[ -z "$FILES" ]]; then
            echo "Nenhum SPEC.md alterado."
          else
            echo "SPECs alterados:"
            echo "$FILES"
          fi

      - name: Validar SPEC schema
        id: validate
        if: steps.changed.outputs.files != ''
        run: |
          chmod +x .github/scripts/validate-memory-schema.sh
          echo "${{ steps.changed.outputs.files }}" | xargs -r .github/scripts/validate-memory-schema.sh spec
        env:
          VIOLATIONS_JSON: violations-spec.json

      - name: Upload violations
        if: always() && steps.changed.outputs.files != ''
        uses: actions/upload-artifact@v4
        with:
          name: violations-spec
          path: violations-spec.json
          if-no-files-found: ignore

      - name: Comentar PR com violations
        if: always() && github.event_name == 'pull_request' && steps.validate.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const file = 'violations-spec.json';
            if (!fs.existsSync(file)) return;
            const violations = JSON.parse(fs.readFileSync(file, 'utf8'));
            const errors = violations.filter(v => v.level === 'error');
            const warns = violations.filter(v => v.level === 'warn');
            if (errors.length === 0 && warns.length === 0) return;
            const errLines = errors.slice(0, 15).map(v => `- \`${v.file}\` → ${v.error}`);
            const warnLines = warns.slice(0, 5).map(v => `- \`${v.file}\` → ${v.error}`);
            const body = [
              '### Memory schema gate EXTENDED — SPEC.md',
              '',
              errors.length > 0
                ? `**${errors.length} erro(s) de schema** — corrigir antes do merge:`
                : '_Sem erros._',
              ...errLines,
              warns.length > 0 ? '\n**Avisos (não bloqueiam):**' : '',
              ...warnLines,
              '',
              'Como corrigir → ver [memory/requisitos/Infra/RUNBOOK-memory-schema-gate-extended.md](../tree/${{ github.head_ref }}/memory/requisitos/Infra/RUNBOOK-memory-schema-gate-extended.md).',
              '',
              'Override emergencial: adicionar `<!-- schema-allowlist: <razão> -->` no SPEC.md.',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  validate-session-schema:
    name: Schema session log (filename + TL;DR)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Detectar sessions modificadas
        id: changed
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          FILES="$(git diff --name-only --diff-filter=AM "${BASE}" "${HEAD}" -- 'memory/sessions/**/*.md' \
            | grep -v '_TEMPLATE' \
            | grep -v 'README.md' \
            | grep -v '_INDEX' || true)"
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Validar Session schema
        id: validate
        if: steps.changed.outputs.files != ''
        run: |
          chmod +x .github/scripts/validate-memory-schema.sh
          echo "${{ steps.changed.outputs.files }}" | xargs -r .github/scripts/validate-memory-schema.sh session
        env:
          VIOLATIONS_JSON: violations-session.json

      - name: Upload violations
        if: always() && steps.changed.outputs.files != ''
        uses: actions/upload-artifact@v4
        with:
          name: violations-session
          path: violations-session.json
          if-no-files-found: ignore

      - name: Comentar PR com violations
        if: always() && github.event_name == 'pull_request' && steps.validate.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const file = 'violations-session.json';
            if (!fs.existsSync(file)) return;
            const violations = JSON.parse(fs.readFileSync(file, 'utf8'));
            const errors = violations.filter(v => v.level === 'error');
            if (errors.length === 0) return;
            const errLines = errors.slice(0, 15).map(v => `- \`${v.file}\` → ${v.error}`);
            const body = [
              '### Memory schema gate EXTENDED — Session log',
              '',
              `**${errors.length} erro(s) de schema** — corrigir antes do merge:`,
              '',
              ...errLines,
              '',
              'Filename deve bater `^YYYY-MM-DD-<slug-kebab>.md$`.',
              'Pelo menos uma seção `## TL;DR` ou `## Resumo executivo` ou `## Contexto` obrigatória.',
              '',
              'Template em [memory/sessions/_TEMPLATE.md](../tree/${{ github.head_ref }}/memory/sessions/_TEMPLATE.md).',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  validate-handoff-schema:
    name: Schema handoff (filename HHMM + Estado MCP)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Detectar handoffs modificados
        id: changed
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          # Handoffs são append-only (ADR 0130) — só pegamos arquivos ADDED
          # (diff-filter=A). Modified seria violação de ADR.
          FILES="$(git diff --name-only --diff-filter=A "${BASE}" "${HEAD}" -- 'memory/handoffs/**/*.md' \
            | grep -v '_TEMPLATE' \
            | grep -v 'README.md' || true)"
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Validar Handoff schema
        id: validate
        if: steps.changed.outputs.files != ''
        run: |
          chmod +x .github/scripts/validate-memory-schema.sh
          echo "${{ steps.changed.outputs.files }}" | xargs -r .github/scripts/validate-memory-schema.sh handoff
        env:
          VIOLATIONS_JSON: violations-handoff.json

      - name: Upload violations
        if: always() && steps.changed.outputs.files != ''
        uses: actions/upload-artifact@v4
        with:
          name: violations-handoff
          path: violations-handoff.json
          if-no-files-found: ignore

      - name: Comentar PR com violations
        if: always() && github.event_name == 'pull_request' && steps.validate.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const file = 'violations-handoff.json';
            if (!fs.existsSync(file)) return;
            const violations = JSON.parse(fs.readFileSync(file, 'utf8'));
            const errors = violations.filter(v => v.level === 'error');
            if (errors.length === 0) return;
            const errLines = errors.slice(0, 15).map(v => `- \`${v.file}\` → ${v.error}`);
            const body = [
              '### Memory schema gate EXTENDED — Handoff',
              '',
              `**${errors.length} erro(s) de schema** — corrigir antes do merge:`,
              '',
              ...errLines,
              '',
              '**Regras ADR 0130:**',
              '- Filename: `^YYYY-MM-DD-HHMM-<slug-kebab>.md$`',
              '- Seção obrigatória: `## Estado MCP no momento do fechamento` (prova MCP-first)',
              '- Append-only: NUNCA modificar handoff antigo (sempre arquivo novo)',
              '',
              'Template em [memory/handoffs/_TEMPLATE.md](../tree/${{ github.head_ref }}/memory/handoffs/_TEMPLATE.md).',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
