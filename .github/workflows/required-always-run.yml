name: Required always-run

# Impede o DEADLOCK de required-readiness: um context REQUIRED cujo workflow tem
# `paths:`/`paths-ignore:` no `pull_request` não fica vermelho quando o PR não casa
# o filtro — ele NÃO NASCE. O PR trava em "Expected — waiting for status" pra sempre,
# e como a proteção é do branch, trava o repo INTEIRO, não só aquele PR.
#
# Precedente (proibicoes.md §Ambiente, 2026-07-02): main ficou BLOCKED com 54/54
# checks verdes. A causa foi outra (mojibake nos nomes), mas o SINTOMA é idêntico e
# o `protection-drift` — que cobre aquele caso — confere nome/baseline/mojibake e
# NÃO confere se o workflow dono de cada context é alcançável por todo PR.
#
# Bite-test do incidente real (medido 2026-08-05): a branch do PR #5069 promove
# `module-surface` a required mantendo `paths:` no gatilho → este lint acusa 2
# contexts filtrados, exit 1. Contra o main: 40 contexts, 40 always-run, 0 filtrados.
#
# ADVISORY (ADR 0275: gate nasce advisory) — o `promote_by` está no gates-registry.
# Sem `paths:` de propósito: um lint de always-run que só roda em alguns PRs não
# veria justamente o PR que introduz o filtro.

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: required-always-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Required always-run — todo context required nasce em todo PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # selftest primeiro: se a lógica do lint quebrou, o veredito dele não vale nada.
      # Cobre os 4 eixos (`paths:` · sem gatilho de PR · `if:` de job · `types:` sem
      # `synchronize`), cada um com BITE + controle negativo + o par CRLF (este repo é
      # Windows; sem ele o lint fica cego). A contagem de asserts sai do próprio run —
      # restateá-la aqui só a faria apodrecer (já apodreceu uma vez: dizia 12).
      - name: Selftest do lint (a régua antes da medida)
        run: node scripts/governance/required-always-run.mjs --selftest

      - name: Auditar contexts required
        run: node scripts/governance/required-always-run.mjs

  # 5º eixo, em job SEPARADO do `lint`. Nasceu advisory (ADR 0275) e foi promovido a
  # required em 2026-09-15 por flip [W] — a justificativa, com os desvios declarados,
  # está em `_meta.promocoes` do governance/required-checks-baseline.json (dono único
  # de "o que é required"; este comentário aponta, não restateia — LC-10).
  # Segue em job separado porque um eixo novo dentro do `lint` misturaria dois
  # vereditos num check só.
  #
  # `fetch-depth: 0` é obrigatório: o eixo compara a árvore do PR contra a BASE, e o
  # checkout raso padrão não tem `origin/main` pra ler. Sem isso o script sai 2
  # (NÃO MEDIDO) e diz que não mediu — nunca verde silencioso.
  rename:
    name: Required rename — PRs abertos sobrevivem à promoção
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # O `|| true` aqui NÃO é o `|| true` proibido pela §5 2026-08-11 (aquele engole o
      # erro do comando que DECIDE o gate). Este engole só o refresh do ref: quem decide
      # é o script na linha seguinte, e ele distingue os dois casos — se `origin/main`
      # não existir, sai **2 (NÃO MEDIDO)** dizendo que nada foi verificado, nunca 0.
      # Sem o `|| true`, uma falha de rede transitória viraria vermelho de gate.
      - name: Rename/promoção de context required
        run: |
          git fetch --no-tags --quiet origin main || true
          node scripts/governance/required-always-run.mjs --check-rename --base=origin/main
